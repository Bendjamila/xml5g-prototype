      - name: 7. Démarrer le cœur 5G, le RIC, le gNB et 2 UEs
        continue-on-error: true
        run: bash "$WORK/py/plateforme.sh"
      - name: 8. Collecte du trafic d'entraînement (2 sessions)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : on gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -n "$UES" ] || echo "::error::variable UES vide : aucun UE n'a d'adresse (voir l'étape 7)"
          cd "$WORK/py"
          # Chaque session contient les DEUX attaques (SYN puis UDP), lancées par des UEs
          # différents ; les rôles sont inversés entre A et B. L'évaluation croisée A->B
          # mesure donc le passage à une autre session et à un autre attaquant, et non
          # à une famille d'attaque jamais vue (cas où tout détecteur échoue).
          for S in A B; do
            if [ "$S" = A ]; then ATKS="ue1:syn:20:30,ue2:udp:70:30"; else ATKS="ue2:syn:20:30,ue1:udp:70:30"; fi
            docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
            for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done
            sudo setsid nohup nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode collect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 135 --out "$LOGS/50_train_$S.csv" > "$LOGS/50_collect_$S.log" 2>&1 < /dev/null &
            IDS_PID=$!
            sleep 3
            sudo python3 scenario.py --ues "$UES" --attacks "$ATKS" --total 125 --events "$LOGS/50_ev_$S.jsonl" 2>&1 | tee "$LOGS/50_scenario_$S.log"
            wait $IDS_PID 2>/dev/null
            sleep 8   # laisser le collecteur finir sa durée
            n_l=$(wc -l < "$LOGS/50_train_$S.csv")
            echo "session $S : $n_l lignes"
            [ "$n_l" -gt 1 ] || echo "::error::session $S : aucun relevé collecté (voir 50_collect_$S.log et 50_scenario_$S.log)"
          done
      - name: 9. Entraîner le détecteur (évaluation croisée)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail

          cd "$WORK/py"
          python3 train_xml5g.py --a "$LOGS/50_train_A.csv" "$LOGS/50_ev_A.jsonl" --b "$LOGS/50_train_B.csv" "$LOGS/50_ev_B.jsonl" --bin 0.2 --model "$WORK/model.joblib" --metrics "$LOGS/50_train_metrics.json" 2>&1 | tee "$LOGS/50_train.log"
          [ -f "$WORK/model.joblib" ] || echo "::error::détecteur non entraîné : voir 50_train.log"
      - name: 10. Figer le détecteur et les sources
        run: |
          test -f "$WORK/model.joblib" || { echo "::error::détecteur non entraîné (voir 50_train.log, 09_etapes.txt) : campagne arrêtée"; exit 1; }
          cp "$WORK/model.joblib" "$LOGS/model.joblib"
          ( cd "$LOGS" && sha256sum model.joblib ) | tee "$LOGS/model.sha256"
          python3 -c "import xgboost; print('xgboost', xgboost.__version__)" 2>/dev/null | tee -a "$LOGS/01_python.txt"
          cp "$WORK/xml5g-sources.tgz" "$LOGS/"
          sudo chmod -R a+r "$LOGS"
