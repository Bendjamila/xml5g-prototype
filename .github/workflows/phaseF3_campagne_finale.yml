          cat > "$WORK/py/coeur.sh" <<'COEUR_EOF'
          # xML5G phase 3 — santé du cœur 5G (fichier sourcé par les étapes 7, 10 et 11).
          #
          # Lancement du 23/10/2026 : le SMF s'est figé environ 3 min après le démarrage du cœur, juste après une
          # réponse de battement PFCP (plus aucune ligne de journal, plus de battement vers l'UPF ni vers le NRF).
          # Le NRF l'a alors retiré, l'AMF ne trouvait plus de SMF (« SMF Selection, no SMF candidate is
          # available »), aucun UE n'obtenait d'adresse, le détecteur n'a pas pu être entraîné et la boucle a
          # consommé son budget en tentatives vaines. Le même gel du SMF existe dans la campagne __9_ (287 s de
          # silence au même endroit), mais il était survenu après l'établissement des sessions.
          # Ces fonctions repèrent un NF arrêté ou figé AVANT de connecter des UE, le recréent, et enregistrent
          # l'état des conteneurs et du noyau pour le diagnostic (14_coeur_*.txt).
          CN_DIR="${CN_DIR:-$WORK/oai/doc/tutorial_resources/oai-cn5g}"
          NF_COEUR="mysql oai-nrf oai-udr oai-udm oai-ausf oai-amf oai-smf oai-upf oai-ext-dn"
          NF_BAVARDS="oai-amf oai-smf oai-upf"   # journalisent au moins toutes les 10 s (battements NRF et PFCP)
          NF_COMPLET="oai-nrf oai-udr oai-udm oai-ausf oai-amf oai-smf oai-upf"   # tout sauf la base et le DN

          etat_coeur() {   # $1 = étiquette : état de chaque conteneur, activité des journaux, noyau, mémoire
            local c
            {
              date -u +%FT%TZ
              for c in $NF_COEUR; do
                docker inspect -f "$c {{.State.Status}} sante={{if .State.Health}}{{.State.Health.Status}}{{else}}-{{end}} code={{.State.ExitCode}} oom={{.State.OOMKilled}} erreur={{.State.Error}} debut={{.State.StartedAt}} fin={{.State.FinishedAt}} redemarrages={{.RestartCount}}" "$c" 2>&1
              done
              for c in $NF_BAVARDS; do
                echo "$c : lignes de journal sur les 60 dernières s = $(docker logs --since 60s "$c" 2>&1 | wc -l)"
              done
              echo "--- noyau (oom, segfault)"
              sudo dmesg -T 2>/dev/null | grep -iE "oom|killed process|segfault|out of memory" | tail -20
              echo "--- mémoire"
              free -m
            } > "$LOGS/14_coeur_$1.txt" 2>&1
          }

          nf_en_panne() {  # écrit la liste des NF arrêtés, ou figés (aucune ligne de journal depuis 40 s)
            local c st out=""
            for c in $NF_COEUR; do
              st=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null)
              if [ "$st" != running ]; then out="$out $c"; continue; fi
              case " $NF_BAVARDS " in
                *" $c "*) [ "$(docker logs --since 40s "$c" 2>&1 | head -c 1 | wc -c)" -gt 0 ] || out="$out $c" ;;
              esac
            done
            echo $out
          }

          reparer_coeur() {   # $1 = étiquette ; $2 = « complet » pour tout recréer sauf la base et le DN.
            # Renvoie 0 si le cœur est sain (tel quel ou réparé), 1 sinon. REPARES = NF recréés (vide si rien).
            # À appeler seulement quand aucun UE n'est connecté (avant le gNB, ou avant le redémarrage du RAN) :
            # l'appelant relance ensuite ce qui en dépend (gNB et UE, goulot sur l'UPF, abonnés si la base change).
            if [ "$2" = complet ]; then REPARES="$NF_COMPLET $(nf_en_panne)"; else REPARES=$(nf_en_panne); fi
            [ -z "$REPARES" ] && return 0
            case " $REPARES " in        # SMF et UPF vont ensemble : un SMF neuf face à un UPF qui garde d'anciennes
              *" oai-smf "*|*" oai-upf "*) REPARES="$REPARES oai-smf oai-upf" ;;   # sessions PFCP, ou l'inverse,
            esac                                                                   # donnerait des sessions orphelines
            case " $REPARES " in *" oai-nrf "*) REPARES="$REPARES $NF_COMPLET" ;; esac   # tous se réenregistrent
            case " $REPARES " in *" mysql "*) REPARES="$REPARES oai-udr" ;; esac
            local c u=""
            for c in $NF_COEUR; do case " $REPARES " in *" $c "*) u="$u $c" ;; esac; done   # sans doublon, dans l'ordre
            REPARES=$(echo $u)
            echo "::warning::cœur 5G : recréation de $REPARES [$1]"
            etat_coeur "$1"
            for c in oai-amf oai-smf oai-upf oai-nrf; do   # la recréation efface le journal du conteneur : on le garde
              case " $REPARES " in *" $c "*) docker logs "$c" > "$LOGS/41_${c}_avant_$1.log" 2>&1 ;; esac
            done
            ( cd "$CN_DIR" && docker compose up -d --force-recreate --no-deps $REPARES ) >> "$LOGS/14_coeur_$1.txt" 2>&1
            local i sain
            for i in $(seq 1 24); do          # au plus 2 min pour que les NF recréés soient « healthy »
              sleep 5; sain=1
              for c in $REPARES; do
                case "$(docker inspect -f '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}' "$c" 2>/dev/null)" in
                  running/healthy) ;;
                  *) sain=0 ;;
                esac
              done
              [ "$sain" = 1 ] && break
            done
            case " $REPARES " in            # un UPF neuf n'a peut-être pas tc (goulot) : même installation qu'à l'étape 7
              *" oai-upf "*) docker exec oai-upf sh -c "command -v tc >/dev/null 2>&1" || docker exec oai-upf sh -c "(apt-get update && apt-get install -y iproute2) >/dev/null 2>&1 || (apk add --no-cache iproute2) >/dev/null 2>&1" ;;
            esac
            sleep 15                          # enregistrement auprès du NRF, association PFCP SMF-UPF
            if [ -z "$(nf_en_panne)" ]; then
              echo "coeur_repare=$(echo $REPARES | tr ' ' ',') ($1)" >> "$LOGS/09_etapes.txt"
              return 0
            fi
            echo "coeur_irreparable=$(nf_en_panne | tr ' ' ',') ($1)" >> "$LOGS/09_etapes.txt"
            echo "::error::cœur 5G toujours en panne après recréation ($(nf_en_panne)) [$1]"
            return 1
          }
          COEUR_EOF
          cat > "$WORK/py/limiter_ue.sh" <<'LIM_EOF'
          #!/bin/bash
          # xML5G phase 3 - action graduée (politique throttle) : limite le débit montant de l'UE d'adresse $1.
          # Dans ce banc rfsim, la limite est posée sur l'interface oaitun de l'UE, dans son espace de noms :
          # elle ÉMULE un plafond de débit montant imposé par le réseau (quota de PRB ou AMBR de l'UE).
          # Ce n'est pas une commande E2SM-RC ; le texte de l'article doit le dire.
          IP="$1"; RATE="${XML5G_LIMITE:-512kbit}"; MAP="${XML5G_UES_MAP:-/tmp/xml5g_ues_map.txt}"
          [[ "$IP" =~ ^[0-9.]+$ ]] || exit 2
          ns=$(awk -v ip="$IP" '$1 == ip {print $2; exit}' "$MAP" 2>/dev/null)
          dev=""
          if [ -n "$ns" ]; then
            dev=$(ip netns exec "$ns" ip -o -4 addr show 2>/dev/null | awk '/oaitun/ {print $2; exit}')
          fi
          [ -n "$dev" ] || exit 3
          ip netns exec "$ns" tc qdisc replace dev "$dev" root tbf rate "$RATE" burst 16kbit latency 100ms || exit 4
          echo "limite $RATE sur $ns/$dev ($IP)"
          LIM_EOF
          cat > "$WORK/py/bloquer_abonne.sh" <<'BLOQ_EOF'
          #!/bin/bash
          # xML5G phase 3 - blocage persistant (politique xml5g_persist) : après la libération de l'UE
          # d'adresse $1, retire son abonnement d'authentification de la base du cœur (UDR), pour qu'une
          # nouvelle inscription échoue, à la manière de la liste de blocage de l'UDM de Niboucha et al.
          # L'abonnement est sauvegardé dans la table xml5g_bloques et restauré après chaque essai
          # (restaurer_abonnes.sh). Un UE resté inscrit (CM-IDLE) peut revenir sans nouvelle
          # authentification : l'efficacité du blocage est donc MESURÉE, pas supposée.
          IP="$1"; MAP="${XML5G_UES_MAP:-/tmp/xml5g_ues_map.txt}"
          [[ "$IP" =~ ^[0-9.]+$ ]] || exit 2
          ns=$(awk -v ip="$IP" '$1 == ip {print $2; exit}' "$MAP" 2>/dev/null)
          k="${ns#ue}"
          [[ "$k" =~ ^[1-9]$ ]] || exit 3
          IMSI="00101000000000$k"
          docker exec mysql mysql -uroot -plinux oai_db -e \
            "CREATE TABLE IF NOT EXISTS xml5g_bloques LIKE AuthenticationSubscription;
             REPLACE INTO xml5g_bloques SELECT * FROM AuthenticationSubscription WHERE ueid='$IMSI';
             DELETE FROM AuthenticationSubscription WHERE ueid='$IMSI';" 2>/dev/null || exit 4
