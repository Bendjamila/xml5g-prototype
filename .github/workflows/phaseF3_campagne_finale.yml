                  for g, d in mk.items():
                      for l in range(1, max([7] + list(d["rafales"])) + 1):
                          w.writerow([g, l, d["rafales"].get(l, 0), d["rafales_attendues_geom"].get(min(l, 7)) if l <= 7 else ""])
              figures(a.out, mk, deb)
              rapport(R, a.out)
              print(open(os.path.join(a.out, "B_rapport.md"), encoding="utf-8").read())


          if __name__ == "__main__":
              main()
          ANAB_EOF
          cat > "$WORK/py/allocateur_ratio.py" <<'ALLOC_EOF'
          #!/usr/bin/env python3
          """
          xML5G - campagne finale (E4) : schéma d'action complet de Tsourdinis et al., reproduit sur notre plateforme.

          Chez Tsourdinis et al., la xApp réduit les ressources radio d'un UE en proportion de son taux d'anomalie, calculé
          sur ses 30 dernières classifications, et le libère par RRC Release quand ce taux atteint 100 %.
          Ici :
            - le taux d'anomalie d'un UE porte sur ses 30 derniers verdicts, lus au fil de l'eau dans le journal du
              détecteur (61_ids_<essai>.log) ;
            - la réduction est ÉMULÉE par un plafond de débit montant (tc tbf) sur l'interface oaitun de l'UE, dans son espace
              de noms, comme pour la politique graduée (limiter_ue.sh) : plafond = max(plancher, (1 - taux) x débit de base) ;
              le plafond est reposé quand le taux change d'au moins --pas, et retiré quand le taux revient à 0 ;
            - la libération à 100 % est faite par la xApp (politique xml5g, W = 30, θ = 1), par E2SM-RC.
          Chaque changement est journalisé : « RATIO t_us=… ip=… taux=… plafond_kbit=… rc=… » (72_ratio_<essai>.log).
          """
          import argparse, collections, os, subprocess, time


          def interface(ns):
              r = subprocess.run(["ip", "netns", "exec", ns, "ip", "-o", "-4", "addr", "show"], capture_output=True, text=True)
              for l in r.stdout.splitlines():
                  p = l.split()
                  if len(p) > 1 and p[1].startswith("oaitun"):
                      return p[1]
              return None


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--ids", required=True, help="journal du détecteur, lu au fil de l'eau")
              ap.add_argument("--map", required=True, help="fichier « adresse espace_de_noms » (une ligne par UE)")
              ap.add_argument("--fenetre", type=int, default=30)
              ap.add_argument("--base-kbit", type=int, default=20000, help="débit de base (goulot de 20 Mbit/s)")
              ap.add_argument("--plancher-kbit", type=int, default=64)
              ap.add_argument("--pas", type=float, default=0.1)
              ap.add_argument("--duree", type=float, default=120)
              ap.add_argument("--log", required=True)
              a = ap.parse_args()
              ns_de = {}
              for l in open(a.map):
                  p = l.split()
                  if len(p) >= 2:
                      ns_de[p[0]] = p[1]
              dev_de = {}
              fen = collections.defaultdict(lambda: collections.deque(maxlen=a.fenetre))
              applique = {}
              fin = time.time() + a.duree
              while not os.path.exists(a.ids) and time.time() < fin:
                  time.sleep(0.2)
              log = open(a.log, "w")
              log.write(f"# fenetre={a.fenetre} base_kbit={a.base_kbit} plancher_kbit={a.plancher_kbit} pas={a.pas}\n")
              log.flush()
              with open(a.ids) as f:
                  while time.time() < fin:
                      l = f.readline()
                      if not l:
                          time.sleep(0.05)
                          continue
                      p = l.split()
                      if len(p) < 5 or p[0] != "V":
                          continue
                      ip, v = p[3], int(p[4])
                      w = fen[ip]
                      w.append(v)
                      if len(w) < a.fenetre:
                          continue
                      taux = sum(w) / len(w)
                      prec = applique.get(ip, 0.0)
                      if abs(taux - prec) < a.pas - 1e-9 and not (taux == 0 and prec > 0) and not (taux == 1 and prec < 1):
                          continue
                      ns = ns_de.get(ip)
                      if ns is None:
                          continue
                      dev = dev_de.get(ns) or interface(ns)
                      dev_de[ns] = dev
                      if dev is None:
                          continue
                      if taux == 0:
                          cmd = ["ip", "netns", "exec", ns, "tc", "qdisc", "del", "dev", dev, "root"]
                          plafond = a.base_kbit
                      else:
                          plafond = max(a.plancher_kbit, int((1 - taux) * a.base_kbit))
                          cmd = ["ip", "netns", "exec", ns, "tc", "qdisc", "replace", "dev", dev, "root", "tbf",
                                 "rate", f"{plafond}kbit", "burst", "16kbit", "latency", "100ms"]
                      rc = subprocess.run(cmd, capture_output=True).returncode
                      log.write(f"RATIO t_us={int(time.time() * 1e6)} ip={ip} taux={taux:.3f} plafond_kbit={plafond} rc={rc}\n")
                      log.flush()
                      applique[ip] = taux


          if __name__ == "__main__":
              main()
          ALLOC_EOF
          chmod +x "$WORK/py/"*.sh
          mkdir -p "$WORK/bundle" && cp -r "$WORK/xml5g.patch" "$WORK/py" "$FX/rc_release" "$FX/xapp_xml5g" "$WORK/bundle/"
