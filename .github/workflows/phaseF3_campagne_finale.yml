          #!/usr/bin/env python3
          """
          xML5G - phase 3 : horodate chaque ligne lue sur l'entrée standard (remarque M4).

          La xApp KPM de FlexRIC (xapp_kpm_moni) n'imprime aucune heure absolue : seulement la
          latence de chaque rapport. Sans heure, les rapports KPM ne peuvent pas être alignés sur
          les paquets du plan usager ni sur la fenêtre d'attaque. Ce filtre préfixe chaque ligne
          par l'heure de réception (secondes depuis l'époque, même horloge que le détecteur) :
              xapp_kpm_moni ... | python3 -u horodater.py > 67_kpm_<essai>.log
          """
          import sys
          import time


          def main():
              lire = sys.stdin.buffer.readline
              out = sys.stdout
              for ligne in iter(lire, b""):
                  out.write(f"{time.time():.6f} " + ligne.decode("utf-8", "replace"))
                  out.flush()


          if __name__ == "__main__":
              main()
