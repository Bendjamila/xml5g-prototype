# xML5G — CAMPAGNE FINALE DE PHASE 3 : réponses à la partie B du rapport d'expertise, en un seul lancement.
#
# Construit à partir de phaseF3_Corrigé.yml (commit 15f1874, exécution flash du 25/10/2026) : même plateforme
# (OAI + FlexRIC figés, cœur OAI, goulot de 20 Mbit/s, profil radio), même détecteur (XGBoost, étiquette « au moins
# un paquet d'attaque », seuil sous 0,5 % de fausses alarmes), même xApp et même déroulé d'essai. Changements :
#   1. le détecteur est entraîné UNE fois (job detecteur) puis figé et utilisé par tous les essais (remarque B2) ;
#   2. les essais sont répartis en tranches qui tournent en parallèle (job essais, matrice), chacune avec un
#      artefact de nom unique ; le job analyse les réunit dans UNE archive complète (plus d'écrasement) ;
#   3. six expériences (partie F du rapport), toutes avec le MÊME détecteur :
#        E1  trafic bénin seul, applications variées, au moins 30 heures-UE : 7 et 8 sur 10 hors échantillon ;
#        E2  udp, syn et foule bénigne × six politiques, 20 essais valides par case : none, xml5g (7 sur 10), xml5g8
#            (8 sur 10), unan1s (unanimité sur fenêtre de 1 s, adaptée de Tsourdinis et al.), unan30 (unanimité sur
#            les 30 derniers verdicts, condition d'origine de Tsourdinis et al.), throttle (graduée) ;
#        E3  cœur dédié au détecteur, 10 essais par case : la panne de l'unanimité vient-elle de l'unanimité ou des
#            fenêtres temporelles sous charge ?
#        E4  actions et granularité, 10 essais par case : limitation seule, schéma d'action complet de Tsourdinis et al.
#            (ratio30 : plafond proportionnel au taux d'anomalie, libération à 100 %), libération au 1er verdict,
#            libération de toute la cellule ;
#        E8  évasion : inondation active pendant 50, 60, 70 ou 80 % de chaque période de 2 s, sans action (rejeu) ;
#        E9  après la libération : attaque de 80 s, xml5g contre xml5g_persist (abonnement retiré du cœur) ;
#   4. les réanalyses de la partie B (analyse_partie_b.py) tournent sur la campagne réunie.
# Les critères de validité et l'analyse principale sont fixés d'avance dans 63_plan.json (job plan).

name: xML5G campagne finale phase 3 (partie B)

on:
  workflow_dispatch:
    inputs:
      experiences:
        description: "Expériences à lancer (E1 E2 E3 E4 E8 E9)"
        default: "E1 E2 E3 E4 E8 E9"
      scenarios_e2:
        description: "E2 : scénarios (udp syn flash)"
        default: "udp syn flash"
      essais_e2:
        description: "E2 : essais valides visés par (scénario, politique)"
        default: "20"
      heures_e1:
        description: "E1 : heures-UE de trafic bénin visées"
        default: "30"
      essais_e3:
        description: "E3, E4, E8, E9 : essais valides visés par (scénario, politique)"
        default: "10"
      mode_test:
        description: "oui = essai rapide de toute la chaîne (environ 1 h 30), non = campagne"
        default: "non"
      detecteur_run_id:
        description: "Réutiliser le détecteur figé d'une exécution précédente (numéro d'exécution), vide = l'entraîner"
        default: ""
      tranches:
        description: "Ne lancer que ces tranches (ex. E2-udp-2 E1-3), vide = toutes"
        default: ""
      runs_a_fusionner:
        description: "Numéros d'exécutions précédentes dont les tranches sont ajoutées à l'analyse (relances)"
        default: ""
      runner_e3:
        description: "Machine des essais E3 (ubuntu-24.04, ou une machine plus puissante si votre compte en a)"
        default: "ubuntu-24.04"

permissions:
  contents: read
  actions: read

env:
  OAI_COMMIT: 1c2f4d3c2e68181cdef9f426d161163147ad4b77
  FLEXRIC_COMMIT: d7a71285f3720fbc1487e9a86309eec5fb61a408
  WORK: /home/runner/xml5g
  LOGS: /home/runner/xml5g-journaux
  DUREE_E1: "600"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.p.outputs.matrice }}
      detecteur_run: ${{ steps.p.outputs.detecteur_run }}
    steps:
      - name: Plan de la campagne (fixé avant le premier essai)
        id: p
        env:
          EXPERIENCES: ${{ inputs.experiences }}
          SCENARIOS_E2: ${{ inputs.scenarios_e2 }}
          ESSAIS_E2: ${{ inputs.essais_e2 }}
          HEURES_E1: ${{ inputs.heures_e1 }}
          ESSAIS_E3: ${{ inputs.essais_e3 }}
          MODE_TEST: ${{ inputs.mode_test }}
          TRANCHES: ${{ inputs.tranches }}
          RUNNER_E3: ${{ inputs.runner_e3 }}
          DETECTEUR_RUN_ID: ${{ inputs.detecteur_run_id }}
        run: |
          mkdir -p plan
          python3 - <<'PLAN_EOF'
          import json, math, os, zlib, datetime
          E = os.environ
          exps = (E.get("EXPERIENCES") or "E1 E2 E3 E4 E8 E9").split()
          test = (E.get("MODE_TEST") or "non") == "oui"
          sc_e2 = (E.get("SCENARIOS_E2") or "udp syn flash").split()
          n_e2 = int(E.get("ESSAIS_E2") or 20); h_e1 = float(E.get("HEURES_E1") or 30); n_x = int(E.get("ESSAIS_E3") or 10)
          duree_e1 = int(E.get("DUREE_E1") or 600)
          r3 = E.get("RUNNER_E3") or "ubuntu-24.04"
          POL_E2 = "none xml5g xml5g8 unan1s unan30 throttle"
          POL_E3 = "none xml5g unan1s unan30"
          POL_E4 = "limite ratio30 immediate slice"
          M = []
          def add(i, **kw):
              d = dict(id=i, offset=100 * (len(M) + 1), runner="ubuntu-24.04", charge="standard", kpm="", pcap="",
                       duree_e1=duree_e1, attaque=40, budget=270, graine=zlib.crc32(i.encode()) % 100000 + 1)
              d.update(kw); M.append(d)
          T = dict(budget=45, essais=1)
          if "E2" in exps:
              for sc in sc_e2:
                  if test:
                      add(f"E2-{sc}-1", exp="E2", scenarios=sc, politiques="none xml5g unan30", kpm="none", pcap="none xml5g", **T)
                      continue
                  nt = max(1, math.ceil(n_e2 / 10))           # au plus 10 essais valides par politique et par tranche
                  for i in range(1, nt + 1):
                      add(f"E2-{sc}-{i}", exp="E2", scenarios=sc, politiques=POL_E2, essais=math.ceil(n_e2 / nt),
                          kpm="none", pcap="none xml5g")
          if "E3" in exps:
              for sc in ("flash", "udp"):
                  add(f"E3-{sc}-1", exp="E3", scenarios=sc, politiques="none unan1s" if test else POL_E3, charge="isole", runner=r3,
                      **(T if test else dict(essais=n_x)))
          if "E4" in exps:
              for sc in ("udp", "flash"):
                  # attaque de 80 s pour TOUTES les politiques de E4 : ratio30 (Tsourdinis) a besoin d'environ 30 verdicts
                  # (~25 s sous charge) avant de réduire ; même fenêtre pour toutes, pour une comparaison équitable
                  add(f"E4-{sc}-1", exp="E4", scenarios=sc, politiques="ratio30 slice" if test else POL_E4, attaque=80,
                      **(T if test else dict(essais=n_x)))
          if "E8" in exps:
              add("E8-1", exp="E8", scenarios="pulse60" if test else "pulse50 pulse60 pulse70 pulse80", politiques="none",
                  **(T if test else dict(essais=n_x)))
          if "E9" in exps:
              add("E9-1", exp="E9", scenarios="udp", politiques="xml5g_persist" if test else "xml5g xml5g_persist", attaque=80,
                  **(T if test else dict(essais=n_x)))
          if "E1" in exps:
              if test:
                  add("E1-1", exp="E1", scenarios="benin", politiques="none", duree_e1=120, **T)
              else:
                  par = max(1, int(255 / ((duree_e1 + 150) / 60)))   # essais par tranche (durée + redémarrages)
                  nt = max(1, math.ceil(h_e1 / (par * 2 * duree_e1 / 3600)))
                  for i in range(1, nt + 1):
                      add(f"E1-{i}", exp="E1", scenarios="benin", politiques="none", essais=par)
          choisies = (E.get("TRANCHES") or "").split()
          if choisies:
              M = [d for d in M if d["id"] in choisies]
          if not M:
              raise SystemExit("aucune tranche à lancer")
          plan = dict(
              cree_utc=datetime.datetime.utcnow().isoformat() + "Z", commit=E.get("GITHUB_SHA"), execution=E.get("GITHUB_RUN_ID"),
              entrees={k: E.get(k) for k in ("EXPERIENCES", "SCENARIOS_E2", "ESSAIS_E2", "HEURES_E1", "ESSAIS_E3", "MODE_TEST",
                                             "TRANCHES", "RUNNER_E3", "DETECTEUR_RUN_ID")},
              detecteur="entraîné une fois (job detecteur), figé pour tous les essais" if not E.get("DETECTEUR_RUN_ID")
                        else f"réutilisé de l'exécution {E.get('DETECTEUR_RUN_ID')}",
              politiques=dict(none="aucune action (la xApp journalise quand 7 sur 10 aurait libéré)",
                              xml5g="libération par E2SM-RC quand 7 des 10 derniers verdicts de l'UE sont des attaques (règle déployée)",
                              xml5g8="libération quand 8 des 10 derniers verdicts sont des attaques (recommandation a posteriori, validée sur E1)",
                              unan1s="unanimité sur fenêtre temporelle de 1 s : notre adaptation de la condition de Tsourdinis et al.",
                              unan30="unanimité sur les 30 derniers verdicts : la condition d'origine de Tsourdinis et al. (comptage)",
                              ratio30="schéma d'action de Tsourdinis et al. : plafond de débit montant (1 - taux) x 20 Mbit/s, taux sur les 30 "
                                      "derniers verdicts, réduction émulée par tc sur oaitun ; libération à 100 % par E2SM-RC",
                              throttle="graduée : plafond de 512 kbit/s (tc sur oaitun) à la 1re règle 7 sur 10, libération si elle se redéclenche 5 s plus tard",
                              limite="plafond de 512 kbit/s à la 1re règle 7 sur 10, jamais de libération",
                              immediate="libération au premier verdict « attaque »",
                              slice="au premier verdict « attaque », libération de tous les UE de la cellule",
                              xml5g_persist="xml5g, puis retrait de l'abonnement de l'UE libéré dans la base du cœur (restauré après l'essai)"),
              validite=["les UE du scénario ont une adresse et joignent le réseau de données",
                        "le détecteur s'est connecté à la xApp et lui a envoyé des verdicts",
                        "udp/syn : l'attaque a été lancée ; flash/benin : le trafic bénin a tourné",
                        "benin (E1) : des verdicts couvrent au moins 80 % de la durée de l'essai",
                        "un essai invalide est remplacé ; tous les essais lancés restent dans les journaux"],
              analyse_principale=dict(unite="l'essai", critere="fausse libération : libération d'un UE qui n'attaque pas, y compris "
                                      "l'attaquant libéré avant que son premier paquet d'attaque n'atteigne le N3",
                                      sensibilite="sans la libération avant l'attaque",
                                      tests="Fisher exact bilatéral par scénario ; test exact stratifié sur les scénarios (unilatéral, "
                                            "H1 : la politique libère à tort plus souvent que xML5G 7/10)",
                                      regle_validee_hors_echantillon="8 sur 10 (et 7 sur 10) sur E1, jamais utilisé pour choisir une règle"),
              ordre="politiques tirées au hasard à chaque tour (graine de la tranche), journalisé dans 63_ordre.txt",
              tranches=M)
          json.dump(plan, open("plan/63_plan.json", "w"), indent=1, ensure_ascii=False)
          with open(E["GITHUB_OUTPUT"], "a") as f:
              f.write("matrice=" + json.dumps({"include": M}) + "\n")
              f.write("detecteur_run=" + (E.get("DETECTEUR_RUN_ID") or E["GITHUB_RUN_ID"]) + "\n")
          print(json.dumps(plan, indent=1, ensure_ascii=False))
          s = ["### Plan de la campagne", "", "| Tranche | Expérience | Scénarios | Charge | Politiques | Essais valides par (scénario, politique) | Attaque (s) |", "|---|---|---|---|---|---|---|"]
          s += [f"| {d['id']} | {d['exp']} | {d['scenarios']} | {d['charge']} | {d['politiques']} | {d['essais']} | {d['attaque']} |" for d in M]
          open(E["GITHUB_STEP_SUMMARY"], "a").write("\n".join(s) + "\n")
          PLAN_EOF
      - name: Plan (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-p3f-plan
          path: plan
          retention-days: 90

  detecteur:
    needs: plan
    if: ${{ inputs.detecteur_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:

      - name: 1. Libérer de l'espace disque
        run: |

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -a -f > /dev/null 2>&1 || true
          mkdir -p "$WORK" "$LOGS"
          df -h / | tee "$LOGS/00_disque.txt"
      - name: 2. Préparer la machine
        run: |

          sudo modprobe sctp || { sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe sctp; }
          sudo apt-get install -y -q hping3 iperf3 python3-sklearn python3-pandas python3-joblib python3-scipy tcpdump sysstat > "$LOGS/01_apt.log" 2>&1 || \
            { sudo apt-get update -q && sudo apt-get install -y -q hping3 iperf3 python3-sklearn python3-pandas python3-joblib python3-scipy tcpdump sysstat >> "$LOGS/01_apt.log" 2>&1; }
          sudo sysctl -w net.ipv4.ip_forward=1
          python3 -c "import sklearn, pandas, joblib; print('sklearn', sklearn.__version__)" | tee "$LOGS/01_python.txt"
          # XGBoost : le modèle retenu par l'étude sur les jeux publics (E1). Sans ses dépendances
          # facultatives (GPU), pour ne pas toucher au numpy/scipy du système.
          sudo pip3 install --break-system-packages --no-deps -q xgboost >> "$LOGS/01_apt.log" 2>&1 || echo "::warning::xgboost non installé : repli Random Forest"
          { sudo python3 -c "import xgboost; print('xgboost', xgboost.__version__)" 2>&1 || echo "xgboost absent : repli Random Forest"; } | tee -a "$LOGS/01_python.txt"
          { nproc; free -h; } > "$LOGS/01_machine.txt"
      - name: 3. Récupérer OAI et FlexRIC (versions figées)
        run: |

          cd "$WORK"
          git init -q oai && cd oai
          git remote add origin https://github.com/duranta-project/openairinterface5g.git
          git fetch -q --depth 1 origin "$OAI_COMMIT" && git checkout -q FETCH_HEAD
          cd openair2/E2AP && rm -rf flexric && git init -q flexric && cd flexric
          git remote add origin https://github.com/duranta-project/flexric.git
          git fetch -q --depth 1 origin "$FLEXRIC_COMMIT" && git checkout -q FETCH_HEAD
          { echo "OAI     $(git -C "$WORK/oai" rev-parse HEAD)"; echo "FlexRIC $(git rev-parse HEAD)"; } | tee "$LOGS/02_versions.txt"
      - name: 4. Écrire le correctif, les xApps et les scripts (dont plateforme.sh, campagne.sh, analyse_partie_b.py)
        run: |
          cd "$WORK/oai"
          cat > "$WORK/xml5g.patch" <<'XML5G_PATCH_EOF'
          diff --git a/openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c b/openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c
          index fa8b409..b64460e 100644
          --- a/openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c
          +++ b/openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c
          @@ -15,9 +15,11 @@
           #include "openair2/RRC/NR/rrc_gNB_du.h"
           #include "openair2/RRC/NR/rrc_gNB_mobility.h"
           #include "openair2/RRC/NR/nr_rrc_proto.h"
          +#include "openair2/RRC/NR/rrc_gNB_NGAP.h"

           #include <stdio.h>
           #include <unistd.h>
          +#include <time.h>
           #include "common/ran_context.h"

           static pthread_once_t once_rc_mutex = PTHREAD_ONCE_INIT;
          @@ -448,12 +450,18 @@ static void fill_rc_radio_bearer_ctrl(seq_ctrl_style_t* ctrl_style)
             ctrl_style->ran_param_ctrl_out = NULL;
           }

          -/* RIC Control Style Types, 7.6. Only the two below are implemented. */
          +/* RIC Control Style Types, 7.6. Only the three below are implemented. */
           typedef enum {
             RC_CTRL_STYLE_RADIO_BEARER = 1,
             RC_CTRL_STYLE_CONN_MODE_MOBILITY = 3,
          +  RC_CTRL_STYLE_RADIO_ACCESS = 4,
           } rc_ctrl_style_type_e;

          +/* xML5G: Radio Access Control (E2SM-RC v01.03, 7.6.5), control action
          + * "RRC Connection Release". The same value is used by the xML5G xApp; both
          + * sides also check the action advertised at E2 Setup. */
          +#define XML5G_RRC_CONNECTION_RELEASE_7_6_5 3
          +
           /** @brief Add a leaf RAN parameter (no nested definition) to a LIST/STRUCTURE item */
           static void fill_ran_param_leaf(ran_param_lst_struct_t* dst, uint32_t id, const char* name)
           {
          @@ -553,16 +561,62 @@ static void fill_rc_conn_mode_mobility_ctrl(seq_ctrl_style_t* ctrl_style)
             ctrl_style->ran_param_ctrl_out = NULL;
           }

          +/** @brief Advertise CONTROL Style 4 "Radio access control", 7.6.5 (xML5G)
          + *
          + * Only the RRC Connection Release action is offered. It targets the UE named
          + * in the Control Header and carries no RAN parameter: the gNB asks the AMF to
          + * release the UE context (NGAP UE Context Release Request), which removes the
          + * UE's user-plane resources and leads to an RRC Release. */
          +static void fill_rc_radio_access_ctrl(seq_ctrl_style_t* ctrl_style)
          +{
          +  // RIC Control Style Type. Mandatory. 9.3.3, 6.2.2.2
          +  ctrl_style->style_type = RC_CTRL_STYLE_RADIO_ACCESS;
          +
          +  // RIC Control Style Name. Mandatory. 9.3.4. [1-150]
          +  ctrl_style->name = cp_str_to_ba("Radio access control");
          +
          +  // RIC Control Header/Message/Outcome Format Type. Mandatory. 9.3.5
          +  ctrl_style->hdr = FORMAT_1_E2SM_RC_CTRL_HDR;
          +  ctrl_style->msg = FORMAT_1_E2SM_RC_CTRL_MSG;
          +  ctrl_style->out_frmt = FORMAT_1_E2SM_RC_CTRL_OUT;
          +
          +  // RIC Call Process ID Format Type. Optional
          +  ctrl_style->call_proc_id_type = NULL;
          +
          +  // Sequence of Control Actions. [0-65535]
          +  ctrl_style->sz_seq_ctrl_act = 1;
          +  ctrl_style->seq_ctrl_act = calloc(ctrl_style->sz_seq_ctrl_act, sizeof(seq_ctrl_act_2_t));
          +  AssertFatal(ctrl_style->seq_ctrl_act != NULL, "Memory exhausted");
          +
          +  seq_ctrl_act_2_t* ctrl_act = &ctrl_style->seq_ctrl_act[0];
          +
          +  // Control Action ID. Mandatory. 9.3.6. [1-65535]
          +  ctrl_act->id = XML5G_RRC_CONNECTION_RELEASE_7_6_5;
          +
          +  // Control Action Name. Mandatory. 9.3.7. [1-150]
          +  ctrl_act->name = cp_str_to_ba("RRC Connection Release");
          +
          +  // Sequence of Associated RAN Parameters. [0-65535]: none, the UE is named
          +  // in the Control Header
          +  ctrl_act->sz_seq_assoc_ran_param = 0;
          +  ctrl_act->assoc_ran_param = NULL;
          +
          +  // Sequence of Associated RAN Parameters for Control Outcome. [0-255]
          +  ctrl_style->sz_ran_param_ctrl_out = 0;
          +  ctrl_style->ran_param_ctrl_out = NULL;
          +}
          +
           static void fill_rc_control(ran_func_def_ctrl_t* ctrl)
           {
             // Sequence of CONTROL styles
             // [1 - 63]
          -  ctrl->sz_seq_ctrl_style = 2;
          +  ctrl->sz_seq_ctrl_style = 3;
             ctrl->seq_ctrl_style = calloc(ctrl->sz_seq_ctrl_style, sizeof(seq_ctrl_style_t));
             assert(ctrl->seq_ctrl_style != NULL && "Memory exhausted");

             fill_rc_radio_bearer_ctrl(&ctrl->seq_ctrl_style[0]);
             fill_rc_conn_mode_mobility_ctrl(&ctrl->seq_ctrl_style[1]);
          +  fill_rc_radio_access_ctrl(&ctrl->seq_ctrl_style[2]);
           }

           static ran_function_name_t fill_rc_ran_func_name(void)
          @@ -1365,6 +1419,50 @@ static void write_ctrl_conn_mode_mobility(rc_ctrl_req_data_t const* ctrl)
             printf("[E2 AGENT] RC Control: N2 Handover Control for UE %u to neighbour NR Cell Identity %lu\n", rrc_ue_id, target_cell_id);
             nr_rrc_trigger_n2_ho(RC.nrrrc[0], ue, neighbour);
           }
          +
          +static int64_t xml5g_now_us(void)
          +{
          +  struct timespec ts;
          +  clock_gettime(CLOCK_REALTIME, &ts);
          +  return (int64_t)ts.tv_sec * 1000000 + ts.tv_nsec / 1000;
          +}
          +
          +/* xML5G - Radio access control, 7.6.5: release the UE named in the Control
          + * Header. The release goes through the AMF (gNB-initiated NGAP UE Context
          + * Release Request, TS 38.413 8.3.2), as for any network-initiated release, so
          + * the UE's PDU sessions are also torn down at the UPF. */
          +static void write_ctrl_radio_access(rc_ctrl_req_data_t const* ctrl)
          +{
          +  const int64_t t_rx = xml5g_now_us();
          +
          +  if (ctrl->hdr.frmt_1.ctrl_act_id != XML5G_RRC_CONNECTION_RELEASE_7_6_5) {
          +    printf("[E2 AGENT] RC Control: Style 4 Action %d not supported, only RRC Connection Release\n", ctrl->hdr.frmt_1.ctrl_act_id);
          +    return;
          +  }
          +  if (ctrl->hdr.frmt_1.ue_id.type != GNB_UE_ID_E2SM || ctrl->hdr.frmt_1.ue_id.gnb.ran_ue_id == NULL) {
          +    printf("[E2 AGENT] RC Control: RRC Connection Release needs a gNB UE ID with RAN UE ID\n");
          +    return;
          +  }
          +
          +  const uint32_t rrc_ue_id = *ctrl->hdr.frmt_1.ue_id.gnb.ran_ue_id;
          +  rrc_gNB_ue_context_t *ue_context_p = rrc_gNB_get_ue_context(RC.nrrrc[0], rrc_ue_id);
          +  if (ue_context_p == NULL) {
          +    printf("[E2 AGENT] RC Control: UE with rrc_ue_id %u not found. No release.\n", rrc_ue_id);
          +    return;
          +  }
          +
          +  const ngap_cause_t cause = {
          +      .type = NGAP_CAUSE_RADIO_NETWORK,
          +      .value = NGAP_CAUSE_RADIO_NETWORK_RELEASE_DUE_TO_NGRAN_GENERATED_REASON,
          +  };
          +  rrc_gNB_send_NGAP_UE_CONTEXT_RELEASE_REQ(0, ue_context_p, cause);
          +
          +  /* Greppable line for the measurement campaign: reception of the CONTROL
          +   * and hand-over of the release to NGAP, both in CLOCK_REALTIME us. */
          +  printf("[XML5G] E2SM-RC RRC Connection Release rrc_ue_id=%u t_ctrl_rx_us=%ld t_release_req_us=%ld\n",
          +         rrc_ue_id, (long)t_rx, (long)xml5g_now_us());
          +  fflush(stdout);
          +}
           #endif

           sm_ag_if_ans_t write_ctrl_rc_sm(void const* data)
          @@ -1391,6 +1489,14 @@ sm_ag_if_ans_t write_ctrl_rc_sm(void const* data)
            #endif
                 break;

          +    case RC_CTRL_STYLE_RADIO_ACCESS:
          + #ifdef NGRAN_GNB_CUCP
          +      write_ctrl_radio_access(ctrl);
          + #else
          +      printf("[E2 AGENT] \"Radio Access Control\" not supported by %d.\n", get_e2_node_type());
          + #endif
          +      break;
          +
               default:
                 printf("[E2 AGENT] RC Control Style %d not supported\n", ctrl->hdr.frmt_1.ric_style_type);
                 break;
          XML5G_PATCH_EOF
          git apply --check "$WORK/xml5g.patch" && git apply "$WORK/xml5g.patch"
          grep -c XML5G openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c | tee "$LOGS/03_correctif.txt"
          FX="$WORK/oai/openair2/E2AP/flexric/examples/xApp/c"
          mkdir -p "$FX/rc_release" "$FX/xapp_xml5g"
          cat > "$FX/rc_release/xapp_rc_release.c" <<'RC_C_EOF'
          /*
           * xML5G - UE release xApp (phase 1 of the prototype rebuild).
           *
           * 1. Asks the gNB, through an E2SM-RC REPORT Style 5 "On Demand Report", for
           *    the list of connected UEs and their RAN UE ID.
           * 2. Releases one UE through an E2SM-RC CONTROL, Style 4 "Radio access
           *    control", action "RRC Connection Release" (E2SM-RC v01.03, 7.6.5).
           *
           * Target UE: environment variable XML5G_TARGET_RAN_UE_ID, otherwise the UE
           * with the smallest RAN UE ID. Every step prints a greppable [XML5G] line with
           * CLOCK_REALTIME timestamps in microseconds.
           *
           * Built inside FlexRIC (examples/xApp/c/rc_release), from the rc_handover
           * example of the FlexRIC project.
           */

          #include "../../../../src/xApp/e42_xapp_api.h"
          #include "../../../../src/sm/rc_sm/ie/rc_data_ie.h"
          #include "../../../../src/sm/rc_sm/rc_sm_id.h"
          #include "../../../../src/util/alg_ds/alg/defer.h"

          #include <assert.h>
          #include <errno.h>
          #include <inttypes.h>
          #include <semaphore.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>

          // E2SM-RC 7.6.5: Radio access control. Same values as the OAI agent patch.
          static const uint32_t RC_CTRL_STYLE_RADIO_ACCESS = 4;
          static const uint16_t XML5G_RRC_CONNECTION_RELEASE_7_6_5 = 3;

          // E2SM-RC 7.4.6: On Demand Report.
          static const uint32_t RC_REPORT_STYLE_ON_DEMAND = 5;

          #define MAX_UES 64

          typedef struct {
            size_t n;
            ue_id_e2sm_t ue_id[MAX_UES];
          } ue_list_t;

          static ue_list_t ues = {0};
          static sem_t rc_ind_sem;

          static int64_t now_us(void)
          {
            struct timespec ts;
            clock_gettime(CLOCK_REALTIME, &ts);
            return (int64_t)ts.tv_sec * 1000000 + ts.tv_nsec / 1000;
          }

          static size_t find_ran_func_idx(const sm_ran_function_t* rf, size_t sz, int id)
          {
            for (size_t i = 0; i < sz; i++)
              if (rf[i].id == id)
                return i;
            return sz;
          }

          /* Whether the E2 node advertised Radio access control / RRC Connection Release. */
          static bool supports_release_ctrl(const ran_func_def_ctrl_t* ctrl)
          {
            if (ctrl == NULL)
              return false;
            for (size_t i = 0; i < ctrl->sz_seq_ctrl_style; i++) {
              const seq_ctrl_style_t* style = &ctrl->seq_ctrl_style[i];
              if (style->style_type != RC_CTRL_STYLE_RADIO_ACCESS)
                continue;
              for (size_t j = 0; j < style->sz_seq_ctrl_act; j++)
                if (style->seq_ctrl_act[j].id == XML5G_RRC_CONNECTION_RELEASE_7_6_5)
                  return true;
            }
            return false;
          }

          /* Whether the E2 node advertised REPORT Style 5 with UE Context Information. */
          static bool supports_on_demand_ue_ctx(const ran_func_def_report_t* report)
          {
            if (report == NULL)
              return false;
            for (size_t i = 0; i < report->sz_seq_report_sty; i++) {
              const seq_report_sty_t* style = &report->seq_report_sty[i];
              if (style->report_type != RC_REPORT_STYLE_ON_DEMAND)
                continue;
              for (size_t j = 0; j < style->sz_seq_ran_param; j++)
                if (style->ran_param[j].id == E2SM_RC_RS5_UE_CONTEXT_INFORMATION)
                  return true;
            }
            return false;
          }

          /* REPORT Style 5 (On Demand), Event Trigger Format 5, UE Context Information only. */
          static rc_sub_data_t gen_rc_sub_on_demand(void)
          {
            rc_sub_data_t rc_sub = {0};

            rc_sub.et.format = FORMAT_5_E2SM_RC_EV_TRIGGER_FORMAT;
            rc_sub.et.frmt_5.on_demand = TRUE_ON_DEMAND_FRMT_5;
            rc_sub.et.frmt_5.assoc_ue_info = NULL;
            rc_sub.et.frmt_5.assoc_cell_info = NULL;

            rc_sub.sz_ad = 1;
            rc_sub.ad = calloc(rc_sub.sz_ad, sizeof(e2sm_rc_action_def_t));
            assert(rc_sub.ad != NULL && "Memory exhausted");
            rc_sub.ad[0].ric_style_type = RC_REPORT_STYLE_ON_DEMAND;
            rc_sub.ad[0].format = FORMAT_1_E2SM_RC_ACT_DEF;
            rc_sub.ad[0].frmt_1.sz_param_report_def = 1;
            rc_sub.ad[0].frmt_1.param_report_def = calloc(1, sizeof(param_report_def_t));
            assert(rc_sub.ad[0].frmt_1.param_report_def != NULL && "Memory exhausted");
            rc_sub.ad[0].frmt_1.param_report_def[0].ran_param_id = E2SM_RC_RS5_UE_CONTEXT_INFORMATION;
            rc_sub.ad[0].frmt_1.param_report_def[0].ran_param_def = NULL;

            return rc_sub;
          }

          /* One On Demand Report indication: keep every connected UE. */
          static void sm_cb_rc(sm_ag_if_rd_t const* rd)
          {
            assert(rd != NULL);
            assert(rd->type == INDICATION_MSG_AGENT_IF_ANS_V0);

            if (rd->ind.rc.ind.msg.format == FORMAT_4_E2SM_RC_IND_MSG) {
              const e2sm_rc_ind_msg_frmt_4_t* msg = &rd->ind.rc.ind.msg.frmt_4;
              for (size_t i = 0; i < msg->sz_seq_ue_info && ues.n < MAX_UES; i++)
                ues.ue_id[ues.n++] = cp_ue_id_e2sm(&msg->seq_ue_info[i].ue_id);
            }
            sem_post(&rc_ind_sem);
          }

          static bool has_ran_ue_id(const ue_id_e2sm_t* id)
          {
            return id->type == GNB_UE_ID_E2SM && id->gnb.ran_ue_id != NULL;
          }

          /* CONTROL: Style 4, action RRC Connection Release, no RAN parameter. */
          static rc_ctrl_req_data_t gen_release_ctrl(const ue_id_e2sm_t* target)
          {
            rc_ctrl_req_data_t dst = {0};

            dst.hdr.format = FORMAT_1_E2SM_RC_CTRL_HDR;
            dst.hdr.frmt_1.ric_style_type = RC_CTRL_STYLE_RADIO_ACCESS;
            dst.hdr.frmt_1.ctrl_act_id = XML5G_RRC_CONNECTION_RELEASE_7_6_5;
            dst.hdr.frmt_1.ue_id = cp_ue_id_e2sm(target);

            dst.msg.format = FORMAT_1_E2SM_RC_CTRL_MSG;
            dst.msg.frmt_1.sz_ran_param = 0;
            dst.msg.frmt_1.ran_param = NULL;

            return dst;
          }

          int main(int argc, char* argv[])
          {
            fr_args_t args = init_fr_args(argc, argv);
            init_xapp_api(&args);
            sleep(1);

            e2_node_arr_xapp_t nodes = e2_nodes_xapp_api();
            defer({ free_e2_node_arr_xapp(&nodes); });

            if (nodes.len == 0) {
              fprintf(stderr, "[XML5G] no E2 node connected\n");
              return EXIT_FAILURE;
            }

            sem_init(&rc_ind_sem, 0, 0);
            defer({ sem_destroy(&rc_ind_sem); });

            const char* env_target = getenv("XML5G_TARGET_RAN_UE_ID");
            int exit_code = EXIT_FAILURE;

            for (int i = 0; i < nodes.len; i++) {
              e2_node_connected_xapp_t* n = &nodes.n[i];
              if (n->id.type != ngran_gNB && n->id.type != ngran_gNB_CU && n->id.type != ngran_gNB_CUCP)
                continue;

              const size_t idx = find_ran_func_idx(n->rf, n->len_rf, SM_RC_ID);
              if (idx == n->len_rf) {
                printf("[XML5G] E2 node %d: no E2SM-RC\n", n->id.nb_id.nb_id);
                continue;
              }
              const bool ctrl_ok = supports_release_ctrl(n->rf[idx].defn.rc.ctrl);
              const bool report_ok = supports_on_demand_ue_ctx(n->rf[idx].defn.rc.report);
              printf("[XML5G] E2 node %d: RRC Connection Release advertised=%s, On Demand UE context advertised=%s\n",
                     n->id.nb_id.nb_id, ctrl_ok ? "yes" : "no", report_ok ? "yes" : "no");
              if (!ctrl_ok || !report_ok)
                continue;

              // 1. List the connected UEs
              rc_sub_data_t rc_sub = gen_rc_sub_on_demand();
              const sm_ans_xapp_t sub_ans = report_sm_xapp_api(&n->id, SM_RC_ID, &rc_sub, sm_cb_rc);
              free_rc_sub_data(&rc_sub);
              if (sub_ans.success) {
                struct timespec deadline;
                clock_gettime(CLOCK_REALTIME, &deadline);
                deadline.tv_sec += 5;
                while (sem_timedwait(&rc_ind_sem, &deadline) == -1 && errno == EINTR)
                  ;
                rm_report_sm_xapp_api(sub_ans.u.handle);
              } else {
                printf("[XML5G] On Demand subscription rejected\n");
                continue;
              }

              printf("[XML5G] connected UEs: %zu\n", ues.n);
              const ue_id_e2sm_t* target = NULL;
              for (size_t k = 0; k < ues.n; k++) {
                const ue_id_e2sm_t* u = &ues.ue_id[k];
                if (!has_ran_ue_id(u))
                  continue;
                printf("[XML5G] UE ran_ue_id=%" PRIu64 " amf_ue_ngap_id=%" PRIu64 "\n",
                       *u->gnb.ran_ue_id, (uint64_t)u->gnb.amf_ue_ngap_id);
                if (env_target != NULL) {
                  if (*u->gnb.ran_ue_id == strtoull(env_target, NULL, 10))
                    target = u;
                } else if (target == NULL || *u->gnb.ran_ue_id < *target->gnb.ran_ue_id) {
                  target = u;
                }
              }
              if (target == NULL) {
                printf("[XML5G] no target UE found\n");
                continue;
              }

              // 2. Release it through E2SM-RC
              rc_ctrl_req_data_t ctrl = gen_release_ctrl(target);
              const int64_t t_send = now_us();
              printf("[XML5G] CONTROL RRC Connection Release ran_ue_id=%" PRIu64 " t_ctrl_send_us=%" PRId64 "\n",
                     *target->gnb.ran_ue_id, t_send);
              fflush(stdout);
              const sm_ans_xapp_t ans = control_sm_xapp_api(&n->id, SM_RC_ID, &ctrl);
              const int64_t t_ack = now_us();
              free_rc_ctrl_req_data(&ctrl);
              printf("[XML5G] CONTROL result=%s t_ctrl_ack_us=%" PRId64 " rtt_us=%" PRId64 "\n",
                     ans.success ? "ACK" : "FAILURE", t_ack, t_ack - t_send);
              fflush(stdout);
              if (ans.success)
                exit_code = EXIT_SUCCESS;
            }

            for (size_t k = 0; k < ues.n; k++)
              free_ue_id_e2sm(&ues.ue_id[k]);

            while (try_stop_xapp_api() == false)
              usleep(1000);

            return exit_code;
          }
          RC_C_EOF
          cat > "$FX/rc_release/CMakeLists.txt" <<'RC_CM_EOF'
          # xML5G - UE release xApp (built inside FlexRIC, like the rc_handover example)
          add_executable(xapp_rc_release
            xapp_rc_release.c
            ../../../../src/util/alg_ds/alg/defer.c
            )

          target_link_libraries(xapp_rc_release
                                PUBLIC
                                e42_xapp
                                -pthread
                                -lsctp
                                -ldl
                                )
          RC_CM_EOF
          cat > "$FX/xapp_xml5g/xapp_xml5g.c" <<'X2_C_EOF'
          /*
           * xML5G - decision xApp (phase 2 of the prototype rebuild).
           *
           * - Learns the mapping GTP-U tunnel -> RAN UE ID from the gNB, through the GTP
           *   service model (periodic indications). The detector sees UPLINK packets
           *   (gNB -> UPF), whose TEID is the UPF one (teidupf), not the gNB one (teidgnb):
           *   both are mapped. FlexRIC carries teidupf on 8 bits only (uint8_t), so the
           *   uplink match is done on the low 8 bits of the TEID seen by the detector.
           * - Receives one verdict per UE and per time bin from the user-plane detector,
           *   over TCP (line "V <t_us> <teid> <ip> <verdict> <proba>").
           * - Applies a release policy per UE:
           *     none      : never acts (logs when the xml5g rule would have fired)
           *     immediate : releases on the first malicious verdict
           *     xml5g     : releases when at least ceil(theta*W) of the last W verdicts
           *                 of the UE are malicious
           *     slice     : on the first malicious verdict, releases every UE of the cell
           *   Phase 3 (expert report, remarks M7 and M9):
           *     tsourdinis    : rule of Tsourdinis et al. ported to this loop: verdicts are grouped
           *                     into reports of XML5G_REPORT_S seconds; a UE is released when every
           *                     verdict of a report is malicious (anomaly ratio of 100 %)
           *     throttle      : graduated action: the first time the xml5g rule fires, the UE is
           *                     rate-limited (command XML5G_THROTTLE_CMD, "%s" = UE address); it is
           *                     released only if the rule fires again at least XML5G_GRACE_S seconds later
           *     xml5g_persist : xml5g, then XML5G_ON_RELEASE_CMD ("%s" = UE address) after the
           *                     release, to keep the UE out (persistent blocking in the core)
           * - Releases through E2SM-RC CONTROL, Style 4 "Radio access control", action
           *   "RRC Connection Release" (same as phase 1).
           * Every step prints a greppable [XML5G] line with CLOCK_REALTIME timestamps (us).
           *
           * Environment: XML5G_POLICY, XML5G_W, XML5G_THETA, XML5G_DURATION, XML5G_PORT.
           */

          #include "../../../../src/xApp/e42_xapp_api.h"
          #include "../../../../src/sm/rc_sm/ie/rc_data_ie.h"
          #include "../../../../src/sm/rc_sm/rc_sm_id.h"
          #include "../../../../src/util/alg_ds/alg/defer.h"

          #include <arpa/inet.h>
          #include <assert.h>
          #include <errno.h>
          #include <inttypes.h>
          #include <math.h>
          #include <netinet/in.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/socket.h>
          #include <time.h>
          #include <unistd.h>

          static const uint32_t RC_CTRL_STYLE_RADIO_ACCESS = 4;
          static const uint16_t XML5G_RRC_CONNECTION_RELEASE_7_6_5 = 3;
          static const uint32_t RC_REPORT_STYLE_ON_DEMAND = 5;
          static const int SM_GTP = 148;

          #define MAX_UES 64
          #define MAX_W 64

          typedef enum { POL_NONE, POL_IMMEDIATE, POL_XML5G, POL_SLICE, POL_TSOURDINIS, POL_THROTTLE, POL_PERSIST } policy_e;

          typedef struct {
            uint32_t ue;           // RAN UE ID (rrc_ue_id)
            bool used;
            uint8_t ring[MAX_W];
            int n, idx, count;     // verdicts seen, ring index, malicious in ring
            long verdicts, alarms;
            bool released, pending, would_logged;
            int64_t t_first_alarm_rx, t_decision;
            char ip[64];                       // UE address, from the detector line (for the hooks)
            int64_t rep_start;                 // tsourdinis: start of the current report
            int rep_n, rep_alarms;
            bool throttled, pending_throttle;  // throttle: graduated action
            int64_t t_throttle;
          } ue_state_t;

          typedef struct { uint32_t teid, ue; bool used, low8; } teid_map_t;   // low8: 8-bit uplink TEID

          static policy_e policy = POL_XML5G;
          static const char* policy_name = "xml5g";
          static int W = 10;
          static double THETA = 0.7;
          static int K = 7;                         // ceil(THETA*W)
          static int64_t REPORT_US = 1000000;       // tsourdinis: report length
          static int64_t GRACE_US = 5000000;        // throttle: minimum delay between throttling and release
          static const char* THROTTLE_CMD = NULL;   // throttle hook, "%s" = UE address
          static const char* ON_RELEASE_CMD = NULL; // xml5g_persist hook, "%s" = UE address

          static pthread_mutex_t mtx = PTHREAD_MUTEX_INITIALIZER;
          static ue_state_t st[MAX_UES];
          static teid_map_t tmap[MAX_UES];
          static ue_id_e2sm_t cache_id[MAX_UES];    // full UE ID (from RC On Demand report), by slot
          static uint32_t cache_ue[MAX_UES];
          static int cache_n = 0;
          static volatile bool need_refresh = true;
          static long unmapped = 0;
          static sem_t work_sem, rc_ind_sem;
          static volatile bool done = false;

          static int64_t now_us(void)
          {
            struct timespec ts;
            clock_gettime(CLOCK_REALTIME, &ts);
            return (int64_t)ts.tv_sec * 1000000 + ts.tv_nsec / 1000;
          }

          static ue_state_t* state_of(uint32_t ue)
          {
            for (int i = 0; i < MAX_UES; i++)
              if (st[i].used && st[i].ue == ue)
                return &st[i];
            for (int i = 0; i < MAX_UES; i++)
              if (!st[i].used) {
                memset(&st[i], 0, sizeof(st[i]));
                st[i].used = true;
                st[i].ue = ue;
                return &st[i];
              }
            return NULL;
          }

          static bool ue_of_teid(uint32_t teid, uint32_t* ue)
          {
            for (int i = 0; i < MAX_UES; i++)          // exact match first (downlink TEID)
              if (tmap[i].used && !tmap[i].low8 && tmap[i].teid == teid) {
                *ue = tmap[i].ue;
                return true;
              }
            for (int i = 0; i < MAX_UES; i++)          // then uplink TEID, 8 bits
              if (tmap[i].used && tmap[i].low8 && tmap[i].teid == (teid & 0xFFu)) {
                *ue = tmap[i].ue;
                return true;
              }
            return false;
          }

          static void add_map(uint32_t teid, uint32_t ue, bool low8)
          {
            if (teid == 0)                             // UE without an established tunnel yet
              return;
            for (int j = 0; j < MAX_UES; j++)
              if (tmap[j].used && tmap[j].low8 == low8 && tmap[j].teid == teid)
                return;
            for (int j = 0; j < MAX_UES; j++)
              if (!tmap[j].used) {
                tmap[j] = (teid_map_t){.teid = teid, .ue = ue, .used = true, .low8 = low8};
                printf("[XML5G] MAP teid=%u ran_ue_id=%u kind=%s t_us=%" PRId64 "\n", teid, ue, low8 ? "ul" : "dl", now_us());
                return;
              }
          }

          static bool cached(uint32_t ue)
          {
            for (int i = 0; i < cache_n; i++)
              if (cache_ue[i] == ue)
                return true;
            return false;
          }

          /* GTP service model: one entry per UE with its tunnel identifiers. */
          static void sm_cb_gtp(sm_ag_if_rd_t const* rd)
          {
            assert(rd != NULL && rd->type == INDICATION_MSG_AGENT_IF_ANS_V0);
            const gtp_ind_msg_t* m = &rd->ind.gtp.msg;
            pthread_mutex_lock(&mtx);
            for (uint32_t i = 0; i < m->len; i++) {
              const uint32_t ue = m->ngut[i].rnti;
              add_map((uint32_t)m->ngut[i].teidupf, ue, true);    // uplink, seen by the detector
              add_map(m->ngut[i].teidgnb, ue, false);             // downlink
              if (!cached(ue))
                need_refresh = true;
            }
            pthread_mutex_unlock(&mtx);
            if (need_refresh)
              sem_post(&work_sem);
          }

          /* ---------- RC helpers (as in phase 1) ---------- */

          static size_t find_ran_func_idx(const sm_ran_function_t* rf, size_t sz, int id)
          {
            for (size_t i = 0; i < sz; i++)
              if (rf[i].id == id)
                return i;
            return sz;
          }

          static bool supports_release_ctrl(const ran_func_def_ctrl_t* ctrl)
          {
            if (ctrl == NULL)
              return false;
            for (size_t i = 0; i < ctrl->sz_seq_ctrl_style; i++)
              if (ctrl->seq_ctrl_style[i].style_type == RC_CTRL_STYLE_RADIO_ACCESS)
                for (size_t j = 0; j < ctrl->seq_ctrl_style[i].sz_seq_ctrl_act; j++)
                  if (ctrl->seq_ctrl_style[i].seq_ctrl_act[j].id == XML5G_RRC_CONNECTION_RELEASE_7_6_5)
                    return true;
            return false;
          }

          static ue_id_e2sm_t tmp_ids[MAX_UES];
          static size_t tmp_n = 0;

          static void sm_cb_rc(sm_ag_if_rd_t const* rd)
          {
            assert(rd != NULL && rd->type == INDICATION_MSG_AGENT_IF_ANS_V0);
            if (rd->ind.rc.ind.msg.format == FORMAT_4_E2SM_RC_IND_MSG) {
              const e2sm_rc_ind_msg_frmt_4_t* msg = &rd->ind.rc.ind.msg.frmt_4;
              for (size_t i = 0; i < msg->sz_seq_ue_info && tmp_n < MAX_UES; i++)
                tmp_ids[tmp_n++] = cp_ue_id_e2sm(&msg->seq_ue_info[i].ue_id);
            }
            sem_post(&rc_ind_sem);
          }

          static rc_sub_data_t gen_rc_sub_on_demand(void)
          {
            rc_sub_data_t rc_sub = {0};
            rc_sub.et.format = FORMAT_5_E2SM_RC_EV_TRIGGER_FORMAT;
            rc_sub.et.frmt_5.on_demand = TRUE_ON_DEMAND_FRMT_5;
            rc_sub.sz_ad = 1;
            rc_sub.ad = calloc(1, sizeof(e2sm_rc_action_def_t));
            assert(rc_sub.ad != NULL);
            rc_sub.ad[0].ric_style_type = RC_REPORT_STYLE_ON_DEMAND;
            rc_sub.ad[0].format = FORMAT_1_E2SM_RC_ACT_DEF;
            rc_sub.ad[0].frmt_1.sz_param_report_def = 1;
            rc_sub.ad[0].frmt_1.param_report_def = calloc(1, sizeof(param_report_def_t));
            assert(rc_sub.ad[0].frmt_1.param_report_def != NULL);
            rc_sub.ad[0].frmt_1.param_report_def[0].ran_param_id = E2SM_RC_RS5_UE_CONTEXT_INFORMATION;
            return rc_sub;
          }

          /* Refresh the cache of full UE IDs through an On Demand report. */
          static void refresh_ue_cache(global_e2_node_id_t* node)
          {
            tmp_n = 0;
            rc_sub_data_t sub = gen_rc_sub_on_demand();
            const sm_ans_xapp_t a = report_sm_xapp_api(node, SM_RC_ID, &sub, sm_cb_rc);
            free_rc_sub_data(&sub);
            if (!a.success)
              return;
            struct timespec dl;
            clock_gettime(CLOCK_REALTIME, &dl);
            dl.tv_sec += 3;
            while (sem_timedwait(&rc_ind_sem, &dl) == -1 && errno == EINTR)
              ;
            rm_report_sm_xapp_api(a.u.handle);

            pthread_mutex_lock(&mtx);
            for (int i = 0; i < cache_n; i++)
              free_ue_id_e2sm(&cache_id[i]);
            cache_n = 0;
            for (size_t i = 0; i < tmp_n; i++) {
              if (tmp_ids[i].type == GNB_UE_ID_E2SM && tmp_ids[i].gnb.ran_ue_id != NULL && cache_n < MAX_UES) {
                cache_ue[cache_n] = (uint32_t)*tmp_ids[i].gnb.ran_ue_id;
                cache_id[cache_n++] = tmp_ids[i];
                printf("[XML5G] UE ran_ue_id=%" PRIu64 " amf_ue_ngap_id=%" PRIu64 "\n",
                       *tmp_ids[i].gnb.ran_ue_id, (uint64_t)tmp_ids[i].gnb.amf_ue_ngap_id);
              } else {
                free_ue_id_e2sm(&tmp_ids[i]);
              }
            }
            need_refresh = false;
            pthread_mutex_unlock(&mtx);
          }

          /* Run a hook command with the UE address. The address comes from the detector line:
             only digits and dots are accepted, so it cannot inject anything into the shell. */
          static int run_hook(const char* fmt, const char* ip)
          {
            if (fmt == NULL || ip[0] == '\0')
              return -1;
            for (const char* c = ip; *c; c++)
              if (!((*c >= '0' && *c <= '9') || *c == '.'))
                return -2;
            char cmd[512];
            snprintf(cmd, sizeof(cmd), fmt, ip);
            return system(cmd);
          }

          static void throttle_ue(ue_state_t* s)
          {
            char ip[64];
            pthread_mutex_lock(&mtx);
            snprintf(ip, sizeof(ip), "%s", s->ip);
            const int64_t t_dec = s->t_throttle;
            pthread_mutex_unlock(&mtx);
            const int rc = run_hook(THROTTLE_CMD, ip);
            const int64_t t_done = now_us();
            pthread_mutex_lock(&mtx);
            s->pending_throttle = false;
            s->throttled = true;
            pthread_mutex_unlock(&mtx);
            printf("[XML5G] THROTTLE ran_ue_id=%u ip=%s t_decision_us=%" PRId64 " t_done_us=%" PRId64 " result=%d\n",
                   s->ue, ip, t_dec, t_done, rc);
            fflush(stdout);
          }

          static void release_ue(global_e2_node_id_t* node, ue_state_t* s)
          {
            ue_id_e2sm_t id = {0};
            bool found = false;
            pthread_mutex_lock(&mtx);
            for (int i = 0; i < cache_n; i++)
              if (cache_ue[i] == s->ue) {
                id = cp_ue_id_e2sm(&cache_id[i]);
                found = true;
                break;
              }
            pthread_mutex_unlock(&mtx);
            if (!found) {
              printf("[XML5G] ran_ue_id=%u absent du cache : rafraîchissement\n", s->ue);
              need_refresh = true;
              return;                                   // retried at the next wake-up
            }

            rc_ctrl_req_data_t ctrl = {0};
            ctrl.hdr.format = FORMAT_1_E2SM_RC_CTRL_HDR;
            ctrl.hdr.frmt_1.ric_style_type = RC_CTRL_STYLE_RADIO_ACCESS;
            ctrl.hdr.frmt_1.ctrl_act_id = XML5G_RRC_CONNECTION_RELEASE_7_6_5;
            ctrl.hdr.frmt_1.ue_id = id;                 // ownership moves to ctrl
            ctrl.msg.format = FORMAT_1_E2SM_RC_CTRL_MSG;
            ctrl.msg.frmt_1.sz_ran_param = 0;
            ctrl.msg.frmt_1.ran_param = NULL;

            const int64_t t_send = now_us();
            const sm_ans_xapp_t ans = control_sm_xapp_api(node, SM_RC_ID, &ctrl);
            const int64_t t_ack = now_us();
            free_rc_ctrl_req_data(&ctrl);

            pthread_mutex_lock(&mtx);
            s->pending = false;
            s->released = ans.success;
            pthread_mutex_unlock(&mtx);
            printf("[XML5G] RELEASE ran_ue_id=%u policy=%s t_first_alarm_rx_us=%" PRId64 " t_decision_us=%" PRId64
                   " t_ctrl_send_us=%" PRId64 " t_ctrl_ack_us=%" PRId64 " result=%s\n",
                   s->ue, policy_name, s->t_first_alarm_rx, s->t_decision, t_send, t_ack, ans.success ? "ACK" : "FAILURE");
            fflush(stdout);
            if (ans.success && policy == POL_PERSIST) {
              char ip[64];
              pthread_mutex_lock(&mtx);
              snprintf(ip, sizeof(ip), "%s", s->ip);
              pthread_mutex_unlock(&mtx);
              const int rc = run_hook(ON_RELEASE_CMD, ip);
              printf("[XML5G] PERSIST ran_ue_id=%u ip=%s t_us=%" PRId64 " result=%d\n", s->ue, ip, now_us(), rc);
              fflush(stdout);
            }
          }

          /* ---------- verdicts from the detector ---------- */

          static void mark_pending(ue_state_t* s, int64_t t)
          {
            if (!s->released && !s->pending) {
              s->pending = true;
              s->t_decision = t;
            }
          }

          static void on_verdict(uint32_t teid, int v, int64_t t_rx, const char* ip)
          {
            uint32_t ue;
            pthread_mutex_lock(&mtx);
            if (!ue_of_teid(teid, &ue)) {
              unmapped++;
              pthread_mutex_unlock(&mtx);
              return;
            }
            ue_state_t* s = state_of(ue);
            if (s == NULL || s->released || s->pending) {
              pthread_mutex_unlock(&mtx);
              return;
            }
            s->verdicts++;
            snprintf(s->ip, sizeof(s->ip), "%s", ip);
            if (v) {
              s->alarms++;
              if (s->t_first_alarm_rx == 0)
                s->t_first_alarm_rx = t_rx;
            }
            if (s->n >= W)
              s->count -= s->ring[s->idx];
            s->ring[s->idx] = (uint8_t)v;
            s->count += v;
            s->idx = (s->idx + 1) % W;
            if (s->n < W)
              s->n++;

            const bool rule = (s->n >= W && s->count >= K);
            bool wake = false;
            switch (policy) {
              case POL_NONE:
                if (rule && !s->would_logged) {
                  s->would_logged = true;
                  printf("[XML5G] WOULD_RELEASE ran_ue_id=%u t_us=%" PRId64 "\n", ue, t_rx);
                }
                break;
              case POL_IMMEDIATE:
                if (v) { mark_pending(s, t_rx); wake = true; }
                break;
              case POL_XML5G:
              case POL_PERSIST:
                if (rule) { mark_pending(s, t_rx); wake = true; }
                break;
              case POL_TSOURDINIS:
                /* the verdict that opens a new report closes the previous one */
                if (s->rep_start == 0)
                  s->rep_start = t_rx;
                if (t_rx - s->rep_start >= REPORT_US) {
                  if (s->rep_n > 0 && s->rep_alarms == s->rep_n) {
                    printf("[XML5G] REPORT_FULL ran_ue_id=%u n=%d t_us=%" PRId64 "\n", ue, s->rep_n, t_rx);
                    mark_pending(s, t_rx);
                    wake = true;
                  }
                  s->rep_start = t_rx;
                  s->rep_n = 0;
                  s->rep_alarms = 0;
                }
                s->rep_n++;
                s->rep_alarms += v;
                break;
              case POL_THROTTLE:
                if (rule && !s->throttled && !s->pending_throttle) {
                  s->pending_throttle = true;
                  s->t_throttle = t_rx;
                  s->n = 0; s->idx = 0; s->count = 0;     // the rule must fire again on new verdicts
                  memset(s->ring, 0, sizeof(s->ring));
                  wake = true;
                } else if (rule && s->throttled && t_rx - s->t_throttle >= GRACE_US) {
                  mark_pending(s, t_rx);
                  wake = true;
                }
                break;
              case POL_SLICE:
                if (v) {
                  for (int i = 0; i < cache_n; i++) {
                    ue_state_t* o = state_of(cache_ue[i]);
                    if (o != NULL)
                      mark_pending(o, t_rx);
                  }
                  wake = true;
                }
                break;
            }
            printf("[XML5G] V t_rx_us=%" PRId64 " teid=%u ran_ue_id=%u v=%d window=%d/%d\n", t_rx, teid, ue, v, s->count, s->n);
            pthread_mutex_unlock(&mtx);
            if (wake)
              sem_post(&work_sem);
          }

          static void* tcp_thread(void* arg)
          {
            const int port = *(int*)arg;
            int srv = socket(AF_INET, SOCK_STREAM, 0);
            int one = 1;
            setsockopt(srv, SOL_SOCKET, SO_REUSEADDR, &one, sizeof(one));
            struct sockaddr_in a = {.sin_family = AF_INET, .sin_port = htons(port)};
            a.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
            if (bind(srv, (struct sockaddr*)&a, sizeof(a)) != 0 || listen(srv, 1) != 0) {
              perror("[XML5G] tcp");
              return NULL;
            }
            printf("[XML5G] en attente du détecteur sur le port %d\n", port);
            fflush(stdout);
            while (!done) {
              int c = accept(srv, NULL, NULL);
              if (c < 0)
                continue;
              printf("[XML5G] détecteur connecté\n");
              FILE* f = fdopen(c, "r");
              char line[256];
              while (!done && fgets(line, sizeof(line), f) != NULL) {
                long long t_us;
                unsigned teid;
                char ip[64];
                int v;
                double p;
                if (sscanf(line, "V %lld %u %63s %d %lf", &t_us, &teid, ip, &v, &p) == 5)
                  on_verdict(teid, v, now_us(), ip);
              }
              fclose(f);
            }
            close(srv);
            return NULL;
          }

          int main(int argc, char* argv[])
          {
            const char* e;
            if ((e = getenv("XML5G_POLICY")) != NULL) {
              policy_name = e;
              policy = !strcmp(e, "none") ? POL_NONE : !strcmp(e, "immediate") ? POL_IMMEDIATE : !strcmp(e, "slice") ? POL_SLICE
                     : !strcmp(e, "tsourdinis") ? POL_TSOURDINIS : !strcmp(e, "throttle") ? POL_THROTTLE
                     : !strcmp(e, "xml5g_persist") ? POL_PERSIST : POL_XML5G;
            }
            if ((e = getenv("XML5G_W")) != NULL)
              W = atoi(e) > 0 && atoi(e) <= MAX_W ? atoi(e) : W;
            if ((e = getenv("XML5G_THETA")) != NULL)
              THETA = atof(e);
            K = (int)ceil(THETA * W - 1e-9);
            if ((e = getenv("XML5G_REPORT_S")) != NULL && atof(e) > 0)
              REPORT_US = (int64_t)(atof(e) * 1e6);
            if ((e = getenv("XML5G_GRACE_S")) != NULL && atof(e) >= 0)
              GRACE_US = (int64_t)(atof(e) * 1e6);
            THROTTLE_CMD = getenv("XML5G_THROTTLE_CMD");
            ON_RELEASE_CMD = getenv("XML5G_ON_RELEASE_CMD");
            const int duration = getenv("XML5G_DURATION") ? atoi(getenv("XML5G_DURATION")) : 120;
            int port = getenv("XML5G_PORT") ? atoi(getenv("XML5G_PORT")) : 9999;
            printf("[XML5G] policy=%s W=%d theta=%.2f K=%d duration=%d s report=%.2f s grace=%.2f s\n", policy_name, W, THETA, K,
                   duration, REPORT_US / 1e6, GRACE_US / 1e6);

            fr_args_t args = init_fr_args(argc, argv);
            init_xapp_api(&args);
            sleep(1);
            e2_node_arr_xapp_t nodes = e2_nodes_xapp_api();
            defer({ free_e2_node_arr_xapp(&nodes); });

            global_e2_node_id_t* node = NULL;
            for (int i = 0; i < nodes.len; i++) {
              e2_node_connected_xapp_t* n = &nodes.n[i];
              const size_t idx = find_ran_func_idx(n->rf, n->len_rf, SM_RC_ID);
              if (idx < n->len_rf && supports_release_ctrl(n->rf[idx].defn.rc.ctrl)) {
                node = &n->id;
                break;
              }
            }
            if (node == NULL) {
              fprintf(stderr, "[XML5G] aucun gNB n'annonce la libération E2SM-RC\n");
              return EXIT_FAILURE;
            }

            sem_init(&work_sem, 0, 0);
            sem_init(&rc_ind_sem, 0, 0);
            const sm_ans_xapp_t gtp_h = report_sm_xapp_api(node, SM_GTP, (void*)"10_ms", sm_cb_gtp);
            printf("[XML5G] abonnement GTP %s\n", gtp_h.success ? "accepté" : "refusé");

            pthread_t th;
            pthread_create(&th, NULL, tcp_thread, &port);

            const int64_t t_end = now_us() + (int64_t)duration * 1000000;
            while (now_us() < t_end) {
              struct timespec dl;
              clock_gettime(CLOCK_REALTIME, &dl);
              dl.tv_nsec += 50 * 1000000;
              if (dl.tv_nsec >= 1000000000) { dl.tv_sec++; dl.tv_nsec -= 1000000000; }
              sem_timedwait(&work_sem, &dl);
              if (need_refresh)
                refresh_ue_cache(node);
              for (int i = 0; i < MAX_UES; i++)
                if (st[i].used && st[i].pending_throttle)
                  throttle_ue(&st[i]);
              for (int i = 0; i < MAX_UES; i++)
                if (st[i].used && st[i].pending && !st[i].released)
                  release_ue(node, &st[i]);
            }
            done = true;

            printf("[XML5G] SUMMARY policy=%s unmapped_verdicts=%ld\n", policy_name, unmapped);
            for (int i = 0; i < MAX_UES; i++)
              if (st[i].used)
                printf("[XML5G] SUMMARY ran_ue_id=%u ip=%s verdicts=%ld alarms=%ld released=%d throttled=%d t_first_alarm_rx_us=%" PRId64 "\n",
                       st[i].ue, st[i].ip, st[i].verdicts, st[i].alarms, st[i].released, st[i].throttled, st[i].t_first_alarm_rx);
            fflush(stdout);

            if (gtp_h.success)
              rm_report_sm_xapp_api(gtp_h.u.handle);
            while (try_stop_xapp_api() == false)
              usleep(1000);
            _exit(0);   // the TCP thread may still be blocked in accept()
          }
          X2_C_EOF
          cat > "$FX/xapp_xml5g/CMakeLists.txt" <<'X2_CM_EOF'
          # xML5G - decision xApp (built inside FlexRIC)
          add_executable(xapp_xml5g
            xapp_xml5g.c
            ../../../../src/util/alg_ds/alg/defer.c
            )

          target_link_libraries(xapp_xml5g
                                PUBLIC
                                e42_xapp
                                -pthread
                                -lsctp
                                -ldl
                                -lm
                                )
          X2_CM_EOF
          printf "add_subdirectory(rc_release)\nadd_subdirectory(xapp_xml5g)\n" >> "$FX/CMakeLists.txt"
          mkdir -p "$WORK/py"
          cat > "$WORK/py/ids_xml5g.py" <<'IDS_EOF'
          #!/usr/bin/env python3
          """
          xML5G - détecteur du plan usager (phase 2).

          Capture le trafic GTP-U montant (gNB -> UPF, interface N3) sur le pont du cœur
          5G, regroupe les paquets par tunnel (TEID, un par UE) et par intervalle de
          BIN secondes, calcule 15 variables par (tunnel, intervalle) et :
            - mode "collect" : écrit ces variables dans un CSV (entraînement) ;
            - mode "detect"  : applique le modèle (avec son seuil) et envoie chaque décision
                               à l'xApp par TCP (une ligne par tunnel et par intervalle).
          Le même code calcule les variables à l'entraînement et en fonctionnement.

          Phase 3 (rapport d'expertise) :
            - --min-pkts N : aucun verdict pour un intervalle de moins de N paquets (exp. 5) ;
            - vérité terrain : on compte par intervalle les paquets du générateur d'attaque, reconnus
              par leur protocole et leur port de destination (--verite, par défaut ceux du scénario
              existant : UDP 5555 et TCP 80), sans rien changer au générateur (colonne n_marques en
              collecte, 8e champ de la ligne de verdict). Ces ports ne sont PAS des variables du
              modèle : ils ne servent qu'à l'étiquetage et à l'évaluation (remarque M6) ;
            - --pktlog F.csv.gz : journal compressé de chaque paquet (re-binning hors ligne, exp. 12, et
              comparaison des deux plans, M4 : les 15 variables se recalculent à l'identique) ;
            - le résumé compte les intervalles sautés après une pause (remarque M11).
          Campagne finale (partie B du rapport) : le modèle et ses variables sont INCHANGÉS ; on journalise en plus
            - l'heure de réception par le noyau (SO_TIMESTAMPNS) de chaque paquet, colonne tk du journal de paquets :
              l'écart avec l'heure de lecture mesure l'attente dans la file sous charge ;
            - pour chaque verdict, la durée de l'inférence (µs) et son retard sur la fin de l'intervalle (µs),
              9e et 10e champs de la ligne V (la xApp ne lit que les 5 premiers) ;
            - une ligne « S <t_us> <n> » à chaque pause de la boucle (n intervalles sautés), dans le journal seulement.
          """
          import argparse, gzip, json, math, os, signal, socket, struct, sys, time

          FEATURES = ["n_pkts", "n_bytes", "mean_len", "std_len", "max_len",
                      "frac_tcp", "frac_udp", "frac_icmp", "frac_syn",
                      "n_dst_ports", "n_src_ports", "n_dst_ips",
                      "mean_iat", "std_iat", "frac_small"]

          ETH_P_ALL = 0x0003


          def parse(frame, upf_ip):
              """Paquet GTP-U montant -> (teid, ip_src, ip_dst, proto, lg, flags, sport, dport, tos) ou None."""
              if len(frame) < 14 + 20 + 8 + 8 or frame[12:14] != b"\x08\x00":
                  return None
              o = 14
              ihl = (frame[o] & 0x0F) * 4
              if frame[o + 9] != 17 or frame[o + 16:o + 20] != upf_ip:   # UDP vers l'UPF
                  return None
              u = o + ihl
              if struct.unpack_from("!H", frame, u + 2)[0] != 2152:       # port GTP-U
                  return None
              g = u + 8
              flags, mtype = frame[g], frame[g + 1]
              if mtype != 0xFF:                                           # G-PDU (données) seulement
                  return None
              teid = struct.unpack_from("!I", frame, g + 4)[0]
              p = g + 8
              if flags & 0x07:                                            # champs optionnels
                  nxt = frame[p + 3]
                  p += 4
                  while nxt:                                              # en-têtes d'extension
                      ln = frame[p] * 4
                      if ln == 0:
                          return None
                      nxt = frame[p + ln - 1]
                      p += ln
              if p + 20 > len(frame) or frame[p] >> 4 != 4:
                  return None
              ihl2 = (frame[p] & 0x0F) * 4
              lg = struct.unpack_from("!H", frame, p + 2)[0]
              tos = frame[p + 1]
              proto = frame[p + 9]
              src, dst = frame[p + 12:p + 16], frame[p + 16:p + 20]
              t = p + ihl2
              sport = dport = 0
              fl = 0
              if proto in (6, 17) and t + 4 <= len(frame):
                  sport, dport = struct.unpack_from("!HH", frame, t)
                  if proto == 6 and t + 14 <= len(frame):
                      fl = frame[t + 13]
              return teid, socket.inet_ntoa(src), socket.inet_ntoa(dst), proto, lg, fl, sport, dport, tos


          def features(pkts):
              """pkts : liste de (t, proto, lg, flags, sport, dport, dst, tos) ; le TOS n'est pas utilisé"""
              n = len(pkts)
              lens = [q[2] for q in pkts]
              m = sum(lens) / n
              sd = math.sqrt(sum((x - m) ** 2 for x in lens) / n)
              ts = sorted(q[0] for q in pkts)
              iat = [b - a for a, b in zip(ts, ts[1:])] or [0.0]
              mi = sum(iat) / len(iat)
              si = math.sqrt(sum((x - mi) ** 2 for x in iat) / len(iat))
              tcp = sum(1 for q in pkts if q[1] == 6)
              syn = sum(1 for q in pkts if q[1] == 6 and (q[3] & 0x02) and not (q[3] & 0x10))
              return [n, sum(lens), m, sd, max(lens),
                      tcp / n, sum(1 for q in pkts if q[1] == 17) / n, sum(1 for q in pkts if q[1] == 1) / n, syn / n,
                      len({q[5] for q in pkts}), len({q[4] for q in pkts}), len({q[6] for q in pkts}),
                      mi, si, sum(1 for x in lens if x < 100) / n]


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--mode", choices=["collect", "detect"], required=True)
              ap.add_argument("--iface", default="oai-cn5g")
              ap.add_argument("--upf", default="192.168.70.134")
              ap.add_argument("--bin", type=float, default=0.2)
              ap.add_argument("--duration", type=float, default=120)
              ap.add_argument("--out", required=True, help="CSV (collect) ou journal (detect)")
              ap.add_argument("--rcvbuf", type=int, default=1 << 20, help="taille de la file de réception (octets)")
              ap.add_argument("--model", default="")
              ap.add_argument("--xapp", default="127.0.0.1:9999")
              ap.add_argument("--summary", default="")
              ap.add_argument("--min-pkts", type=int, default=1, help="aucun verdict pour un intervalle de moins de N paquets")
              ap.add_argument("--verite", default="udp:5555,tcp:80",
                              help="paquets de vérité terrain « attaque » : protocole:port_destination, séparés par des virgules")
              ap.add_argument("--pktlog", default="", help="journal compressé des paquets (.csv.gz)")
              ap.add_argument("--attente-xapp", type=float, default=20.0,
                              help="secondes d'attente maximale de la xApp (mode detect)")
              a = ap.parse_args()

              PROTO = {"udp": 17, "tcp": 6}
              verite = {(PROTO[x.split(":")[0]], int(x.split(":")[1])) for x in a.verite.split(",") if ":" in x}
              model, conn, seuil = None, None, 0.5
              if a.mode == "detect":
                  import joblib
                  charge = joblib.load(a.model)
                  if isinstance(charge, dict):          # modèle + seuil réglé sous budget de fausses alarmes
                      model, seuil = charge["modele"], float(charge["seuil"])
                  else:
                      model, seuil = charge, 0.5
                  print(f"modèle : {charge.get('algorithme', type(model).__name__) if isinstance(charge, dict) else type(model).__name__}, "
                        f"seuil {seuil:.4f}", flush=True)
                  # Le modèle est chargé AVANT que la plateforme ne soit chargée (le workflow lance le détecteur
                  # avant le gNB) : sous charge, l'import de XGBoost prenait jusqu'à 2 min. Le détecteur attend
                  # ensuite la xApp jusqu'à --attente-xapp secondes.
                  h, p = a.xapp.split(":")
                  fin_attente = time.time() + a.attente_xapp
                  while time.time() < fin_attente:
                      try:
                          conn = socket.create_connection((h, int(p)), timeout=2)
                          break
                      except OSError:
                          time.sleep(0.5)
                  if conn is None:
                      print("xApp injoignable", file=sys.stderr)
              # La capture commence APRÈS le chargement du modèle et la connexion à la xApp : sinon la file du
              # noyau se remplirait de paquets anciens pendant l'attente.
              upf = socket.inet_aton(a.upf)
              s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(ETH_P_ALL))
              s.bind((a.iface, 0))
              # File d'attente BORNÉE : sous un flood de milliers de paquets/s, une grande file (32 Mo
              # auparavant) accumule des secondes de retard, et les verdicts portent alors sur du trafic
              # ancien. Une file de 1 Mo borne ce retard ; en cas de surcharge, le noyau écarte des
              # paquets (échantillonnage), ce qui ne change pas l'empreinte d'un flood.
              s.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, a.rcvbuf)
              # Filtre noyau (BPF) : seuls les paquets GTP-U (UDP 2152) destinés à l'UPF sont remontés
              # au programme (équivalent de « udp and dst host <upf> and dst port 2152 », tcpdump -dd).
              ip_upf = struct.unpack("!I", upf)[0]
              bpf = [(0x28, 0, 0, 0x0000000c), (0x15, 0, 10, 0x00000800), (0x30, 0, 0, 0x00000017),
                     (0x15, 0, 8, 0x00000011), (0x20, 0, 0, 0x0000001e), (0x15, 0, 6, ip_upf),
                     (0x28, 0, 0, 0x00000014), (0x45, 4, 0, 0x00001fff), (0xb1, 0, 0, 0x0000000e),
                     (0x48, 0, 0, 0x00000010), (0x15, 0, 1, 0x00000868), (0x06, 0, 0, 0x00040000),
                     (0x06, 0, 0, 0x00000000)]
              import ctypes
              prog = b"".join(struct.pack("HBBI", *ins) for ins in bpf)
              cbuf = ctypes.create_string_buffer(prog)
              fprog = struct.pack("HL", len(bpf), ctypes.addressof(cbuf))
              s.setsockopt(socket.SOL_SOCKET, 26, fprog)          # 26 = SO_ATTACH_FILTER
              s.settimeout(0.05)
              try:
                  s.setsockopt(socket.SOL_SOCKET, 35, 1)          # 35 = SO_TIMESTAMPNS : heure de réception par le noyau
              except OSError:
                  pass
              out = open(a.out, "w")
              if a.mode == "collect":
                  out.write("t,teid,ip," + ",".join(FEATURES) + ",n_marques\n")
              plog = gzip.open(a.pktlog, "wt", compresslevel=3) if a.pktlog else None
              if plog:
                  plog.write("t,teid,proto,len,flags,sport,dport,tos,dst,tk\n")
              n_small = 0                    # intervalles écartés par --min-pkts
              n_rattrapage, n_sautes = 0, 0  # pauses de la boucle et intervalles perdus

              stop = [False]
              signal.signal(signal.SIGTERM, lambda *_: stop.__setitem__(0, True))
              signal.signal(signal.SIGINT, lambda *_: stop.__setitem__(0, True))

              buf, ip_of = {}, {}
              first_alarm, last_pkt, n_seen, n_alarm = {}, {}, {}, {}
              t0 = time.time()
              t_bin = t0 + a.bin
              while not stop[0] and time.time() - t0 < a.duration:
                  try:
                      frame, anc, _, _ = s.recvmsg(65535, 64)
                      now = time.time()
                      tk = 0.0
                      for lv, ty, cd in anc:
                          if lv == socket.SOL_SOCKET and ty == 35 and len(cd) >= 16:
                              sec, nsec = struct.unpack("qq", cd[:16])
                              tk = sec + nsec * 1e-9
                      r = parse(frame, upf)
                      if r:
                          teid, src, dst, proto, lg, fl, sp, dp, tos = r
                          buf.setdefault(teid, []).append((now, proto, lg, fl, sp, dp, dst, tos))
                          if plog:
                              plog.write(f"{now:.6f},{teid},{proto},{lg},{fl},{sp},{dp},{tos},{dst},{tk:.6f}\n")
                          ip_of[teid] = src
                          last_pkt[teid] = now
                  except socket.timeout:
