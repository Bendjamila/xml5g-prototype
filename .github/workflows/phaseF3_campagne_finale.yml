          # =============================================================================== principal

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("dossiers", nargs="+")
              ap.add_argument("--out", required=True)
              ap.add_argument("--m4", default="", help="dossier contenant 70_m4_predictions.csv.gz")
              ap.add_argument("--detecteur", default="", help="50_train_metrics.json du détecteur figé")
              ap.add_argument("--sans-paquets", action="store_true", help="ne pas lire les journaux de paquets 68_pkt (plus rapide)")
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              D = dossiers(a.dossiers)
              essais = []
              for d in D:
                  essais += charger(d, avec_paquets=not a.sans_paquets)
              if not essais:
                  print("aucun essai trouvé", file=sys.stderr)
                  sys.exit(1)
              # taux inter-sessions du détecteur figé (CUSUM, SPRT) : moyenne A→B et B→A
              met = a.detecteur or next((os.path.join(d, "50_train_metrics.json") for d in D if os.path.exists(os.path.join(d, "50_train_metrics.json"))), "")
              det = {}
              p0 = p1 = None
              if met and os.path.exists(met):
                  m = json.load(open(met))
                  ab, ba = m.get("A_vers_B", {}), m.get("B_vers_A", {})
                  if isinstance(ab, dict) and isinstance(ba, dict) and ab.get("fpr") is not None and ba.get("fpr") is not None:
                      p0 = max((ab["fpr"] + ba["fpr"]) / 2, 1e-4)
                      p1 = min((ab["detection"] + ba["detection"]) / 2, 1 - 1e-4)
                      det = dict(seuil=m.get("modele_final", {}).get("seuil"), ab_det=ab["detection"], ab_fpr=ab["fpr"],
                                 ba_det=ba["detection"], ba_fpr=ba["fpr"], p0=round(p0, 5), p1=round(p1, 4))
              ben, atk = sequences(essais)
              rows = tableau_boucle(essais)
              tests, strat = tests_boucle(rows)
              b2 = [x for b in ben if b["e"]["experience"] == "E2" for x in b["seq"]]
              a2 = [x for a in atk if a["e"]["experience"] == "E2" for x in a["seq"] if x[4]]
              q0 = max(sum(x[1] for x in b2) / len(b2), 1e-4) if b2 else None
              q1 = min(sum(x[1] for x in a2) / len(a2), 1 - 1e-4) if a2 else None
              if det is not None:
                  det.update(q0_boucle=q0 and round(q0, 5), q1_boucle=q1 and round(q1, 4))
              rj, feux, noms = rejeux(ben, atk, p0, p1, q0, q1)
              mk = analyse_markov(ben, None)
              # E1 : contrôle hors échantillon du modèle de Markov ajusté sans E1
              e1c = []
              hors = mk.get("E2 (tous)")
              e1 = [b for b in ben if b["groupe"] == "E1 (bénin seul)"]
              if hors and e1:
                  nv = sum(len(b["seq"]) for b in e1)
                  for k in (7, 8):
                      arl = hors["arl_verdicts"].get(k)
                      obs = sum(1 for i, b in enumerate(ben) if b["groupe"] == "E1 (bénin seul)" and feux[(f"{k} sur 10", "b", i)] is not None)
                      if arl:
                          att = nv / arl
                          p = float(min(1.0, 2 * min(stats.poisson.cdf(obs, att), stats.poisson.sf(obs - 1, att))))
                          e1c.append(dict(K=k, attendues=att, observees=obs, p=p))
              delais = defaultdict(lambda: defaultdict(list))
              for e in essais:
                  if e["valide"] and "issue" in e:
                      for ip, d in e["issue"]["delais"].items():
                          for c, v in d.items():
                              if v is not None:
                                  delais[f"{e['scenario']} / {e['charge']} / {NOMS_POL.get(e['politique'], e['politique'])}"][c].append(v)
              delais = {k: {c: med_iqr(d.get(c, [])) for c in ("ev_n3", "n3_1re_alarme", "alarme_decision", "decision_ack_ms", "n3_ack", "n3_limitation")}
                        for k, d in sorted(delais.items())}
              deb = debit_et_sauts(essais, ben)
              ec = Counter(f"{e['experience']} {e['scenario']} {e['politique']} : {e['raison'] or 'invalide'}" for e in essais if not e["valide"])
              R = dict(dossiers=D, lances=len(essais), valides=sum(e["valide"] for e in essais), detecteur=det,
                       boucle=rows, tests=tests, stratifie=strat, rejeux=rj, noms_regles=noms, loro=loro_k(ben, atk, feux), markov=mk, e1_controle=e1c,
                       fpr=fpr_groupes(ben), etiquettes=deux_etiquettes(atk), delais=delais, debits=deb,
                       declencheurs=unanimite_declencheurs(essais), ressources=ressources(essais), e2=tailles_e2(essais),
                       qos=qos_benin(essais), plans=plans(a.m4), ecartes=dict(ec),
                       statique=seuil_statique(essais), slice=slice_rejouee(essais), fenetres=balayage_fenetres(ben, atk),
                       accord=accord_rejeu_xapp(essais), trous=trous_verdicts(ben, atk), reprises=reprises(essais),
                       limitation=effet_limitation(essais), evasion=evasion(atk), boucle_plans=boucle_par_plan(a.m4),
                       identite=dict(Counter(x for e in essais if e.get("issue") for x in e["issue"].get("identite", []))),
                       alias_teid=sum(e["issue"].get("alias_teid", 0) for e in essais if e.get("issue")))
              json.dump(R, open(os.path.join(a.out, "B_resultats.json"), "w"), indent=1, ensure_ascii=False, default=str)
              with open(os.path.join(a.out, "B_essais.csv"), "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(["dossier", "essai", "experience", "scenario", "charge", "politique", "valide", "raison", "W", "K",
                              "attaquant_libere", "liberation_avant_attaque", "benins_liberes", "attaquant_limite", "delai_n3_ack_s",
                              "decision_ack_ms", "verdicts", "alarmes", "intervalles_sautes"])
                  for e in essais:
                      o = e.get("issue", {})
                      d = next(iter(o.get("delais", {}).values()), {}) if o else {}
                      w.writerow([e["dossier"], e["essai"], e["experience"], e["scenario"], e["charge"], e["politique"], int(e["valide"]),
                                  e["raison"], e.get("W"), e.get("K"), o.get("att_libere"), o.get("avant_attaque"), o.get("benins_liberes"),
                                  o.get("att_limite"), d.get("n3_ack"), d.get("decision_ack_ms"),
                                  sum(len(v) for v in e.get("ver", {}).values()), sum(x[1] for v in e.get("ver", {}).values() for x in v),
                                  e.get("resume", {}).get("intervalles_sautes")])
              with open(os.path.join(a.out, "B_rejeux.csv"), "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(["regle", "groupe", "sequences", "ue_heures", "verdicts", "fausses", "par_ue_heure", "par_million", "liberes", "avant_attaque", "delai_mediane_s"])
                  for r in rj:
                      w.writerow([r["regle"], r["groupe"], r["sequences"], r.get("ue_heures"), r.get("verdicts"), r.get("fausses"),
                                  r.get("par_ue_heure"), r.get("par_million"), r.get("liberes"), r.get("avant_attaque"),
                                  (r.get("delai") or {}).get("mediane")])
              with open(os.path.join(a.out, "B_fenetres.csv"), "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(["w", "K", "fausses_E2", "sequences_E2", "fausses_E1", "sequences_E1", "attaquants", "liberes", "delai_mediane_s"])
                  for r in R["fenetres"]:
                      w.writerow([r["w"], r["K"], r["fausses_E2"], r["sequences_E2"], r["fausses_E1"], r["sequences_E1"], r["attaquants"],
                                  r["liberes"], (r["delai"] or {}).get("mediane")])
              with open(os.path.join(a.out, "B_rafales.csv"), "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
