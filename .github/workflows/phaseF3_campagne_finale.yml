          def qos_benin(essais):
              par = defaultdict(lambda: dict(rtt_avant=[], rtt_pendant=[], pps_avant=[], pps_pendant=[]))
              for e in essais:
                  if not e["valide"] or "issue" not in e or e["scenario"] in ("flash", "benin"):
                      continue
                  t0s = [t for t in e["t0"].values() if t]
                  if not t0s:
                      continue
                  t0 = min(t0s)
                  k = (e["scenario"], e["charge"], e["politique"])
                  for ip, (role, ns) in e["roles"].items():
                      if role != "benin":
                          continue
                      rt = lire_rtt(os.path.join(e["dossier"], f"62_ev_{e['essai']}_rtt_{ns}.txt"))
                      av = [r for t, r in rt if t0 - 9 <= t < t0]
                      pe = [r for t, r in rt if t0 <= t < t0 + 40]
                      if av:
                          par[k]["rtt_avant"].append(float(np.median(av)))
                      if pe:
                          par[k]["rtt_pendant"].append(float(np.median(pe)))
                      if e.get("pk"):
                          teids = [t for t, x in e["tip"].items() if x == ip]
                          c = Counter()
                          for t in teids:
                              c.update(e["pk"].get(t, [None, None, 0, 0, Counter(), Counter(), [], Counter()])[4])
                          av = sum(n for b, n in c.items() if t0 - 9 <= b * BIN < t0) / 9
                          pe = sum(n for b, n in c.items() if t0 <= b * BIN < t0 + 40) / 40
                          par[k]["pps_avant"].append(av)
                          par[k]["pps_pendant"].append(pe)
              return {" / ".join(k): {m: med_iqr(v) for m, v in d.items()} for k, d in par.items()}


          def plans(m4):
              """Comparaison des deux plans à partir des prédictions hors pli de m4_deux_plans.py (70_m4_predictions.csv.gz)."""
              p = os.path.join(m4, "70_m4_predictions.csv.gz") if m4 else None
              if not p or not os.path.exists(p):
                  return None
              rows = list(csv.DictReader(gzip.open(p, "rt")))
              if not rows:
                  return None
              out = {}
              par_modele = defaultdict(list)
              for r in rows:
                  par_modele[r["modele"]].append(r)
              det_essai = {}
              for mod, L in par_modele.items():
                  y = np.array([int(r["label"]) for r in L])
                  pr = np.array([float(r["prob"]) for r in L])
                  yp = np.array([int(r["pred"]) for r in L])
                  g = [(r["dossier"], r["essai"]) for r in L]
                  pos = defaultdict(lambda: [0, 0])
                  neg = defaultdict(lambda: [0, 0])
                  for gi, a, b in zip(g, y, yp):
                      if a:
                          pos[gi][0] += int(b)
                          pos[gi][1] += 1
                      else:
                          neg[gi][0] += int(b)
                          neg[gi][1] += 1
                  try:
                      from sklearn.metrics import average_precision_score, roc_auc_score
                      prauc = float(average_precision_score(y, pr)) if 0 < y.sum() < len(y) else None
                      auc = float(roc_auc_score(y, pr)) if 0 < y.sum() < len(y) else None
                  except Exception:
                      prauc = auc = None
                  d = dict(fenetres=len(L), attaque=int(y.sum()), pr_auc=prauc, auc=auc,
                           exactitude_equilibree=float((yp[y == 1].mean() + 1 - yp[y == 0].mean()) / 2) if 0 < y.sum() < len(y) else None,
                           detection=float(yp[y == 1].mean()) if y.sum() else None,
                           ic_bootstrap_essais=boot_ratio(list(pos.values())), fpr=float(yp[y == 0].mean()) if (y == 0).any() else None,
                           ic_fpr_bootstrap=boot_ratio(list(neg.values())))
                  for cible in (0.005, 0.01):
                      neg_s = np.sort(pr[y == 0])[::-1]
                      if len(neg_s) and y.sum():
                          kmax = int(math.floor(cible * len(neg_s)))
                          seuil = neg_s[kmax] if kmax < len(neg_s) else 0.0
                          d[f"detection_a_fpr_{cible}"] = float((pr[y == 1] > seuil).mean())
                  det_essai[mod] = {gi: a / n for gi, (a, n) in pos.items() if n}
                  out[mod] = d
              mods = list(det_essai)
              usager = next((m for m in mods if "usager" in m), None)
              ran = next((m for m in mods if "RAN" in m), None)
              if usager and ran:
                  com = sorted(set(det_essai[usager]) & set(det_essai[ran]))
                  a = [det_essai[usager][c] for c in com]
                  b = [det_essai[ran][c] for c in com]
                  if len(com) >= 2 and any(x != y for x, y in zip(a, b)):
                      out["wilcoxon_par_essai"] = dict(essais=len(com), p=float(stats.wilcoxon(a, b).pvalue),
                                                       mediane_usager=float(np.median(a)), mediane_ran=float(np.median(b)))
              return out



          def seuil_statique(essais):
              """Seuil fixe sur le débit montant de chaque UE au N3 (paquets par seconde), rejoué sur les essais sans action
              d'E2 : 99e centile du trafic bénin, bande des seuils qui signalent chaque attaquant et aucun UE bénin, délais."""
              ess = [e for e in essais if e["valide"] and e.get("pk") and e["politique"] == "none" and e["experience"] == "E2"]
              if not ess:
                  return None
              benins, pic_ben, pic_att, att = [], [], [], []
              for e in ess:
                  for ip, (role, ns) in e["roles"].items():
                      c = Counter()
                      for t, x in e["tip"].items():
                          if x == ip and e["pk"].get(t):
                              c.update(par_seconde(e["pk"][t]))
                      if not c:
                          continue
                      t0 = e["t0"].get(ip)
                      if role == "benin" or t0 is None:
                          benins += list(c.values())
                          pic_ben.append((max(c.values()), e["scenario"]))
                      else:
                          avant = [n for s_, n in c.items() if s_ < t0]
                          benins += avant
                          pend = {s_: n for s_, n in c.items() if t0 <= s_ <= (e["t_fin_att"].get(ip) or t0 + 60)}
                          if pend:
                              pic_att.append(max(pend.values()))
                              att.append((t0, pend))
                          if avant:
                              pic_ben.append((max(avant), e["scenario"]))
              if not benins or not att:
                  return dict(essais=len(ess), probleme="pas assez de données")
              t99 = float(np.percentile(benins, 99))
              bas, haut = max(p for p, _ in pic_ben), min(pic_att)
              def delais(tau):
                  d = [next((s_ + 1 - t0 for s_ in sorted(pend) if pend[s_] > tau), None) for t0, pend in att]
                  return med_iqr([x for x in d if x is not None]), sum(x is not None for x in d)
              out = dict(essais=len(ess), centile99=t99,
                         benins_signales_a_99=sum(1 for p_, _ in pic_ben if p_ > t99), sequences_benignes=len(pic_ben),
                         attaquants=len(att), pic_benin_max=bas, pic_benin_max_par_scenario={sc: max(p_ for p_, s2 in pic_ben if s2 == sc)
                                                                                            for sc in {s2 for _, s2 in pic_ben}},
                         pic_attaquant_min=haut, bande=[bas, haut] if bas < haut else None)
              d99, n99 = delais(t99)
              out.update(delai_a_99=d99, attaquants_signales_a_99=n99)
              if bas < haut:
                  dm, nm = delais((bas + haut) / 2)
                  out.update(seuil_milieu_bande=(bas + haut) / 2, delai_milieu_bande=dm, attaquants_signales_milieu=nm)
              return out


          def slice_rejouee(essais):
              """Libération de toute la cellule au premier verdict « attaque » d'un UE, rejouée sur les essais sans action d'E2."""
              out = defaultdict(lambda: dict(n=0, benin_libere=0, avant_attaque=0, delais=[]))
              for e in essais:
                  if not (e["valide"] and e["politique"] == "none" and e["experience"] == "E2" and "ver" in e):
                      continue
                  al = sorted(x[0] for v in e["ver"].values() for x in v if x[1])
                  d = out[e["scenario"]]
                  d["n"] += 1
                  if al:
                      d["benin_libere"] += 1                      # tous les UE sont libérés, donc l'UE bénin aussi
                      t0s = [t for t in e["t0"].values() if t]
                      if t0s:
                          if al[0] < min(t0s):
                              d["avant_attaque"] += 1
                          else:
                              d["delais"].append(al[0] - min(t0s))
              return {sc: dict(essais=d["n"], benin_libere=d["benin_libere"], ic=cp(d["benin_libere"], d["n"]),
                               avant_attaque=d["avant_attaque"], delai=med_iqr(d["delais"])) for sc, d in out.items()}


          def balayage_fenetres(ben, atk):
              """Front délai-sûreté : règles K sur w pour w ∈ {5, 10, 15, 20, 30} et K/w ∈ {0,5 ; … ; 1}."""
              rows = []
              vus = set()
              e2 = [b for b in ben if b["e"]["experience"] == "E2"]
              e1 = [b for b in ben if b["e"]["experience"] == "E1"]
              at = [a for a in atk if a["e"]["experience"] == "E2"]
              for w in (5, 10, 15, 20, 30):
                  for fr in (0.5, 0.6, 0.7, 0.8, 0.9, 1.0):
                      k = max(1, math.ceil(fr * w - 1e-9))
                      if (w, k) in vus:
                          continue
                      vus.add((w, k))
                      f = r_mofn(w, k)
                      fx = lambda L: sum(1 for b in L if f([(x[0], x[1]) for x in b["seq"]]) is not None)
                      lib, dl = 0, []
                      for a in at:
                          sq = [(x[0], x[1]) for x in a["seq"]]
                          j = f(sq)
                          if j is not None and sq[j][0] >= a["t0"] and (a["t1"] is None or sq[j][0] <= a["t1"] + 2):
                              lib += 1
                              dl.append(sq[j][0] - a["t0"])
                      rows.append(dict(w=w, K=k, fausses_E2=fx(e2), sequences_E2=len(e2), fausses_E1=fx(e1), sequences_E1=len(e1),
                                       verdicts_E2=sum(len(b["seq"]) for b in e2), attaquants=len(at), liberes=lib, delai=med_iqr(dl)))
              return rows


          def accord_rejeu_xapp(essais):
              """La règle 7 sur 10 rejouée sur les verdicts du détecteur retrouve-t-elle les instants WOULD_RELEASE de la xApp ?"""
              ecarts, ecarts_xapp, seul_rejeu, seul_xapp, n = [], [], 0, 0, 0
              f = r_mofn(10, 7)
              for e in essais:
                  if not (e["valide"] and e["politique"] == "none" and "xa" in e):
                      continue
                  would = {ran: t for ran, t in e["xa"]["would"]}
                  for ran, ip in e["ran_ip"].items():
                      vs = e["ver"].get(ip)
                      if not vs:
                          continue
                      n += 1
                      j = f([(x[0], x[1]) for x in vs])
                      jx = f(e["xa"]["xv"].get(ran, []))
                      if ran in would and j is not None:
                          ecarts.append(abs(vs[j][0] - would[ran]))
                      elif ran in would:
                          seul_xapp += 1
                      elif j is not None:
                          seul_rejeu += 1
                      if ran in would and jx is not None:
                          ecarts_xapp.append(abs(e["xa"]["xv"][ran][jx][0] - would[ran]))
              return dict(ue=n, accords=len(ecarts), ecart_s=med_iqr(ecarts), ecart_max_s=max(ecarts) if ecarts else None,
                          ecart_rejeu_cote_xapp_max_s=max(ecarts_xapp) if ecarts_xapp else None,
                          declenche_seulement_xapp=seul_xapp, declenche_seulement_rejeu=seul_rejeu)


          def trous_verdicts(ben, atk):
              """Verdicts manquants : plus long silence par séquence, et part du temps sans verdict pendant plus d'1 s
              (la boucle échoue alors « ouverte » pour l'attaquant : aucune libération possible)."""
              out = {}
              par = defaultdict(list)
              for b in ben:
                  par[b["groupe"]].append([x[0] for x in b["seq"]])
              for a in atk:
                  par["attaquant pendant l'attaque (sans action)"].append([x[0] for x in a["seq"] if x[0] >= a["t0"] and (a["t1"] is None or x[0] <= a["t1"])])
              for g, L in par.items():
                  mx, part = [], []
                  for ts in L:
                      if len(ts) < 2:
                          continue
                      gaps = np.diff(ts)
                      mx.append(float(gaps.max()))
                      part.append(float(gaps[gaps > 1.0].sum() / (ts[-1] - ts[0])) if ts[-1] > ts[0] else 0.0)
                  out[g] = dict(plus_long_silence_s=med_iqr(mx), part_du_temps_sans_verdict_1s=med_iqr(part))
              return out


          def reprises(essais):
              par = defaultdict(lambda: dict(liberes=0, repris=0, delais=[], cycles=[], secondes=[]))
              for e in essais:
                  if not e["valide"] or "issue" not in e:
                      continue
                  for ip, r in e["issue"].get("reprise", {}).items():
                      d = par[f"{e['experience']} / {e['scenario']} / {NOMS_POL.get(e['politique'], e['politique'])}"]
                      d["liberes"] += 1
                      d["cycles"].append(r["liberations"])
                      d["secondes"].append(r["secondes_inondation_apres"])
                      if r["reprise_s"] is not None:
                          d["repris"] += 1
                          d["delais"].append(r["reprise_s"])
              for e in essais:
                  if not e["valide"] or "issue" not in e:
                      continue
                  for x in e["issue"].get("reconnexion", []):
                      d = par[f"{e['experience']} / {e['scenario']} / {NOMS_POL.get(e['politique'], e['politique'])}"]
                      d.setdefault("coupes", 0)
                      d.setdefault("reco", [])
                      d["coupes"] += int(x["coupe"])
                      if x["reconnexion_s"] is not None:
                          d["reco"].append(x["reconnexion_s"])
              return {k: dict(attaquants_liberes=d["liberes"], attaque_reprise=d["repris"], ic=cp(d["repris"], d["liberes"]),
                              ue_coupes=d.get("coupes", 0), ue_reconnectes=len(d.get("reco", [])), delai_reconnexion_s=med_iqr(d.get("reco", [])),
                              delai_reprise_s=med_iqr(d["delais"]), liberations_par_essai=med_iqr(d["cycles"]),
                              secondes_inondation_apres=med_iqr(d["secondes"])) for k, d in sorted(par.items())}


          def effet_limitation(essais):
              """Débit d'attaque au N3 avant et après la 1re limitation (graduée, limitation seule, ratio30)."""
              par = defaultdict(lambda: dict(avant=[], apres=[], benins_limites=0, essais=0))
              for e in essais:
                  if not (e["valide"] and e.get("pk") and e["politique"] in ("throttle", "limite", "ratio30")):
                      continue
                  d = par[f"{e['experience']} / {e['scenario']} / {NOMS_POL.get(e['politique'], e['politique'])}"]
                  d["essais"] += 1
                  d["benins_limites"] += e["issue"]["benin_limite"]
                  fl = Counter()
                  for r in e["pk"].values():
                      fl.update(r[7])
                  for ip, dl in e["issue"]["delais"].items():
                      t0 = e["t0"].get(ip)
                      if dl.get("n3_limitation") is None or t0 is None:
                          continue
                      ta = t0 + dl["n3_limitation"]
                      av = [fl.get(int(ta) - k, 0) for k in range(1, 6)]
                      ap = [fl.get(int(ta) + k, 0) for k in range(2, 7)]
                      d["avant"].append(float(np.mean(av)))
                      d["apres"].append(float(np.mean(ap)))
              return {k: dict(essais=d["essais"], ue_benins_limites=d["benins_limites"], paquets_attaque_par_s_avant=med_iqr(d["avant"]),
                              paquets_attaque_par_s_apres=med_iqr(d["apres"])) for k, d in sorted(par.items())}


          def evasion(atk):
              """E8 : inondation intermittente (NN % de chaque période de 2 s) ; part réelle des verdicts qui contiennent du
              trafic d'attaque, et libération de l'attaquant par chaque règle (rejeu sur les essais sans action)."""
              regs = [(f"{k} sur 10", r_mofn(10, k)) for k in range(5, 11)] + [("unanimité, fenêtre 1 s", r_temps(1.0, 1.0)),
                                                                               ("30 sur 30", r_mofn(30, 30))]
              par = defaultdict(list)
              for a in atk:
                  if a["e"]["scenario"].startswith("pulse") or a["e"]["scenario"] in ("udp", "syn"):
                      par[a["e"]["scenario"]].append(a)
              out = {}
              for sc, L in sorted(par.items()):
                  pend = [x for a in L for x in a["seq"] if x[0] >= a["t0"] and (a["t1"] is None or x[0] <= a["t1"])]
                  d = dict(attaquants=len(L), part_verdicts_avec_attaque=(sum(1 for x in pend if x[4]) / len(pend)) if pend else None,
                           part_alarmes=(sum(x[1] for x in pend) / len(pend)) if pend else None, regles={})
                  for nom, f in regs:
                      lib, dl = 0, []
                      for a in L:
                          sq = [(x[0], x[1]) for x in a["seq"]]
                          j = f(sq)
                          if j is not None and sq[j][0] >= a["t0"] and (a["t1"] is None or sq[j][0] <= a["t1"] + 2):
                              lib += 1
                              dl.append(sq[j][0] - a["t0"])
                      d["regles"][nom] = dict(liberes=lib, ic=cp(lib, len(L)), delai=med_iqr(dl))
                  out[sc] = d
              return out


          def boucle_par_plan(m4):
              """Boucle fermée pilotée par chaque plan de télémétrie, sur les MÊMES fenêtres (prédictions hors pli de m4) :
              règle K sur W fenêtres de ~1 s, attaquants libérés, UE non attaquants libérés, délais. Plus une règle à seuil sur
              les KPM, dans l'esprit de ZTRAN (seuil = 99e centile des fenêtres bénignes des AUTRES essais)."""
              pp = os.path.join(m4, "70_m4_predictions.csv.gz") if m4 else None
              dd = os.path.join(m4, "70_m4_donnees.csv.gz") if m4 else None
              if not pp or not os.path.exists(pp):
                  return None
              rows = list(csv.DictReader(gzip.open(pp, "rt")))
              if not rows or "t_fin" not in rows[0]:
                  return None
              flux = defaultdict(list)                          # (modèle, dossier, essai, ip) -> [(t_fin, pred, label, role, debut)]
              for r in rows:
                  flux[(r["modele"], r["dossier"], r["essai"], r["ip"])].append((float(r["t_fin"]), int(r["pred"]), int(r["label"]), r["role"],
                                                                                r["debut"]))
              # règle à seuil sur les KPM (ZTRAN) : DRB.UEThpUl ou RRU.PrbTotUl au-dessus du 99e centile bénin des autres essais
              if dd and os.path.exists(dd):
                  don = [r for r in csv.DictReader(gzip.open(dd, "rt")) if not r.get("exclu")]
                  cles = [c for c in ("ran_DRB.UEThpUl", "ran_RRU.PrbTotUl") if don and c in don[0]]
                  if cles:
                      par_essai = defaultdict(list)
                      for r in don:
                          par_essai[(r["dossier"], r["essai"])].append(r)
                      for (dos, ess), L in par_essai.items():
                          autres = [r for k, v in par_essai.items() if k != (dos, ess) for r in v if r["label"] == "0"]
                          seuils = {c: float(np.nanpercentile([float(r[c]) for r in autres], 99)) for c in cles} if autres else {}
                          for r in L:
                              try:
                                  pr = int(any(float(r[c]) > seuils[c] for c in cles)) if seuils else 0
                              except ValueError:
                                  pr = 0
                              flux[("seuil KPM (type ZTRAN)", dos, ess, r["ip"])].append((float(r["t_fin"]), pr, int(r["label"]), r["role"],
                                                                                          r["debut_attaque"]))
              out = {}
              for (W, K) in ((5, 3), (10, 7)):
                  par = defaultdict(lambda: dict(att=0, att_lib=0, ben=0, ben_lib=0, delais=[], pos=0, vp=0, neg=0, fp=0))
                  for (mod, dos, ess, ip), L in flux.items():
                      L.sort()
                      d = par[mod]
                      for t, pr, lab, role, deb in L:
                          if lab:
                              d["pos"] += 1; d["vp"] += pr
                          else:
                              d["neg"] += 1; d["fp"] += pr
                      j = r_mofn(W, K)([(t, pr) for t, pr, *_ in L])
                      t_att = [t for t, pr, lab, *_ in L if lab]
                      if L[0][3] == "attaquant" and t_att:
                          deb = t_att[0]                          # fin de la 1re fenêtre qui contient du trafic d'attaque au N3
                          d["att"] += 1
                          if j is not None and L[j][0] >= deb:
                              d["att_lib"] += 1
                              d["delais"].append(L[j][0] - deb)
                          elif j is not None:
                              d["ben_lib"] += 1                   # libéré avant son attaque
                      else:
                          d["ben"] += 1
                          d["ben_lib"] += int(j is not None)
                  out[f"{K} sur {W} fenêtres"] = {m: dict(attaquants=d["att"], liberes=d["att_lib"], ic=cp(d["att_lib"], d["att"]),
                                                          non_attaquants=d["ben"], liberes_a_tort=d["ben_lib"], delai=med_iqr(d["delais"]),
                                                          detection_fenetre=d["vp"] / d["pos"] if d["pos"] else None,
                                                          fpr_fenetre=d["fp"] / d["neg"] if d["neg"] else None)
                                                  for m, d in sorted(par.items())}
              return out

          # =============================================================================== figures

          def figures(out_dir, mk, debits):
              try:
                  import matplotlib
                  matplotlib.use("Agg")
                  import matplotlib.pyplot as plt
              except Exception:
                  return []
              faits = []
              g = mk.get("E2 (tous)") or next(iter(mk.values()), None)
              if g and g["rafales"]:
                  L = sorted(g["rafales"])
                  lmax = max(L + [7])
                  x = list(range(1, lmax + 1))
                  obs = [g["rafales"].get(l, 0) for l in x]
                  nb = sum(g["rafales"].values())
                  attn = [nb * (1 - g["p11"]) * g["p11"] ** (l - 1) for l in x]
                  fig, ax = plt.subplots(figsize=(3.5, 2.4))
                  ax.bar(x, obs, color="#4a6fa5", label="observé")
                  ax.plot(x, attn, "o-", color="#c0504d", ms=3, label="géométrique (p11 ajusté)")
                  ax.set_yscale("log")
                  ax.set_xlabel("Longueur de rafale (verdicts)")
                  ax.set_ylabel("Rafales")
                  ax.legend(fontsize=7, frameon=False)
                  fig.tight_layout()
                  f = os.path.join(out_dir, "B_fig_rafales.png")
                  fig.savefig(f, dpi=200)
                  plt.close(fig)
                  faits.append(f)
              if debits:
                  fig, ax = plt.subplots(figsize=(3.5, 2.4))
                  for k, d in sorted(debits.items()):
                      p = d["rapports_1s"]["parts"]
                      if p:
                          xs = sorted(p)
                          ax.plot(xs, [p[x] for x in xs], "o-", ms=3, label=k)
                  ax.set_xlabel("Verdicts par rapport de 1 s (comme la xApp)")
                  ax.set_ylabel("Part des rapports")
                  ax.legend(fontsize=5, frameon=False)
                  fig.tight_layout()
                  f = os.path.join(out_dir, "B_fig_rapports.png")
                  fig.savefig(f, dpi=200)
                  plt.close(fig)
                  faits.append(f)
              return faits


          # =============================================================================== rapport

          def rapport(R, out_dir):
              L = ["# xML5G — campagne finale de phase 3 : réponses à la partie B du rapport", ""]
              L.append(f"Dossiers analysés : {len(R['dossiers'])}. Essais lancés : {R['lances']} ; valides : {R['valides']}.")
              if R.get("detecteur"):
                  d = R["detecteur"]
                  L.append(f"Détecteur figé (un seul modèle pour tous les essais) : seuil {d.get('seuil')}, "
                           f"A→B détection {f_pct(d.get('ab_det'))}, FPR {f_pct(d.get('ab_fpr'), 2)} ; "
                           f"B→A détection {f_pct(d.get('ba_det'))}, FPR {f_pct(d.get('ba_fpr'), 2)} ; p0 = {d.get('p0')}, p1 = {d.get('p1')} "
                           f"(inter-sessions) ; taux de la boucle (E2) : p0 = {d.get('q0_boucle')}, p1 = {d.get('q1_boucle')}.")
              L += ["", "Analyse principale pré-enregistrée (63_plan.json) : unité = l'essai ; une libération de l'attaquant avant que son "
                    "premier paquet d'attaque n'atteigne le N3 compte comme fausse libération ; sensibilité = sans ce cas.", ""]

              L += ["## B8 — Boucle fermée : effectifs et intervalles (Clopper-Pearson 95 %)", "",
                    "| Exp. | Scénario | Charge | Politique | Valides/lancés | Attaquant libéré | Fausses libérations | dont avant l'attaque | Sensibilité | Délai N3 → ACK (s) | Décision → ACK (ms) |",
                    "|---|---|---|---|---|---|---|---|---|---|---|"]
              for r in R["boucle"]:
                  a = "—" if r["att_libere"] is None else f"{r['att_libere']}/{r['valides']}{f_ic(r['ic_att'], 0)}"
                  if r["politique"] == "throttle" and r["att_limite"] is not None:
                      a += f" (limité : {r['att_limite']})"
                  L.append(f"| {r['experience']} | {r['scenario']} | {r['charge']} | {NOMS_POL.get(r['politique'], r['politique'])} | "
                           f"{r['valides']}/{r['lances']} | {a} | {r['fausses']}/{r['valides']}{f_ic(r['ic_fausses'], 0)} | "
                           f"{r['avant_attaque']} | {r['fausses_sensib']}/{r['valides']} | {f_mi(r['delai_n3_ack'])} | {f_mi(r['decision_ack_ms'], 0)} |")
              L += ["", "## B5 — Tests (xML5G 7/10 contre chaque politique)", "", "Par scénario (Fisher exact bilatéral, unité = l'essai) :", "",
