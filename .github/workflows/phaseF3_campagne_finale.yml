          CAMP_EOF
          cat > "$WORK/py/analyse_partie_b.py" <<'ANAB_EOF'
          #!/usr/bin/env python3
          """
          xML5G - campagne finale de phase 3 : analyses demandées par la partie B du rapport d'expertise.

          Lit les journaux d'un ou de plusieurs lancements (« tranches ») et calcule, à partir des données brutes :
            B1/B2  règle 7 sur 10 testée, 8 sur 10 évaluée hors échantillon (E1) et choix de K en leave-one-run-out ;
            B3     taux de fausses libérations par 10^6 verdicts bénins (sans hypothèse de débit), heures à débit
                   observé et à 5 verdicts/s ;
            B4     rafales de fausses alarmes : p01, p11, ordre 2, histogramme contre la loi géométrique, bootstrap ;
            B5     tests par scénario, test exact stratifié, analyse de sensibilité (libération avant l'attaque) ;
            B6     unanimité temporelle (rapports de 1 s) et unanimité par comptage (10/10 et 30/30) rejouées ;
            B8     effectifs et intervalles de Clopper-Pearson par (scénario, politique) ;
            et, pour les points « Major » et « Moderate » : intervalles par bootstrap en grappes (essais), taux de
            fausses alarmes par groupe, délais depuis le premier paquet d'inondation au N3, latence du détecteur
            sur le prototype, intervalles sautés et débit de verdicts, taille des messages E2, deux vérités terrain,
            ressources (médiane et IQR), qualité de service de l'UE bénin, comparaison des deux plans (si m4).

          Usage : analyse_partie_b.py --out RESULTATS DOSSIER [DOSSIER ...]
            Un DOSSIER est un dossier de journaux (il contient 63_validite.txt) ou un dossier qui en contient
            (recherche récursive). Les essais de dossiers différents ne sont jamais confondus.
          Sorties : B_rapport.md, B_resultats.json, B_essais.csv, B_rejeux.csv, B_rafales.csv, B_fig_*.png
          Aucun chiffre n'est écrit en dur : tout est recalculé ; les seuls paramètres sont ceux des règles.
          """
          import argparse, bisect, csv, glob, gzip, json, math, os, re, struct, sys
          from collections import Counter, defaultdict

          import numpy as np
          from scipy import stats

          VERITE = {(17, 5555), (6, 80)}          # paquets d'attaque de scenario.py (UDP 5555, TCP 80) : étiquetage seul
          NOMINAL_VPS = 5.0                        # débit nominal de verdicts (intervalles de 0,2 s)
          BIN = 0.2
          RE_RUN = re.compile(r"^(?P<pol>[A-Za-z0-9]+(?:_persist)?)_(?P<sc>udp|syn|multi|flash|benin|pulse\d+)_r(?P<n>\d+)$")
          NOMS_POL = {"none": "No action", "xml5g": "xML5G 7/10", "xml5g8": "xML5G 8/10",
                      "unan1s": "Unanimité, fenêtre de 1 s (adaptée de Tsourdinis)", "tsourdinis": "Unanimité, fenêtre de 1 s (adaptée de Tsourdinis)",
                      "unan30": "Unanimité, 30 derniers verdicts (condition de Tsourdinis)", "compte30": "Unanimité, 30 derniers verdicts (condition de Tsourdinis)",
                      "ratio30": "Schéma de Tsourdinis (plafond ∝ taux, libération à 100 %)", "throttle": "Graduée (xML5G)",
                      "limite": "Limitation seule", "immediate": "Libération au 1er verdict", "slice": "Libération de toute la cellule",
                      "xml5g_persist": "xML5G + blocage dans le cœur"}
          ORDRE_POL = ["xml5g", "xml5g8", "unan1s", "tsourdinis", "unan30", "compte30", "ratio30", "throttle", "limite", "immediate", "slice",
                       "xml5g_persist", "none"]
          POL_UNAN_TEMPS = ("unan1s", "tsourdinis")
          B_BOOT = 2000
          RNG = np.random.default_rng(20261107)


          # =============================================================================== utilitaires statistiques

          def cp(k, n):
              """Intervalle exact de Clopper-Pearson à 95 %."""
              if n == 0:
                  return (None, None)
              lo = 0.0 if k == 0 else float(stats.beta.ppf(0.025, k, n - k + 1))
              hi = 1.0 if k == n else float(stats.beta.ppf(0.975, k + 1, n - k))
              return (lo, hi)


          def poisson_ic(k, expo):
              """IC exact de Poisson à 95 % pour un taux k / expo."""
              if expo <= 0:
                  return (None, None)
              lo = 0.0 if k == 0 else stats.chi2.ppf(0.025, 2 * k) / 2 / expo
              hi = stats.chi2.ppf(0.975, 2 * k + 2) / 2 / expo
              return (float(lo), float(hi))


          def fisher(a, n1, b, n2):
              """Fisher exact bilatéral : a/n1 contre b/n2."""
              if n1 == 0 or n2 == 0:
                  return None
              return float(stats.fisher_exact([[a, n1 - a], [b, n2 - b]])[1])


          def exact_stratifie(strates):
              """Test exact conditionnel stratifié (Mantel-Haenszel exact) pour 2x2 par strate.
              strates : [(a, n1, b, n2)] ; a/n1 = groupe testé, b/n2 = référence. H1 unilatérale : le groupe testé a plus
              d'événements. Renvoie (p unilatéral, p bilatéral, s observé)."""
              dist = np.array([1.0])
              offset, s_obs = 0, 0
              for a, n1, b, n2 in strates:
                  if n1 == 0 or n2 == 0:
                      continue
                  m = a + b
                  lo, hi = max(0, m - n2), min(m, n1)
                  pmf = stats.hypergeom(n1 + n2, m, n1).pmf(np.arange(lo, hi + 1))
                  dist = np.convolve(dist, pmf)
                  offset += lo
                  s_obs += a
              if dist.size == 1 and offset == 0 and s_obs == 0 and not strates:
                  return None, None, 0
              i = s_obs - offset
              if i < 0 or i >= dist.size:
                  return None, None, s_obs
              p1 = float(dist[i:].sum())
              p2 = float(dist[dist <= dist[i] * (1 + 1e-7)].sum())
              return min(p1, 1.0), min(p2, 1.0), s_obs


          def med_iqr(v):
              v = [x for x in v if x is not None and not (isinstance(x, float) and math.isnan(x))]
              if not v:
                  return None
              a = np.array(v, dtype=float)
              return dict(n=len(v), mediane=float(np.median(a)), q1=float(np.percentile(a, 25)), q3=float(np.percentile(a, 75)),
                          min=float(a.min()), max=float(a.max()))


          def boot_ratio(groupes, B=B_BOOT):
              """Bootstrap en grappes d'un rapport Σnum/Σden ; groupes = [(num, den)] (une grappe par essai ou séquence)."""
              g = np.array([(a, b) for a, b in groupes if b > 0], dtype=float)
              if len(g) < 2:
                  return (None, None)
              idx = RNG.integers(0, len(g), size=(B, len(g)))
              num, den = g[idx, 0].sum(1), g[idx, 1].sum(1)
              r = num / np.where(den > 0, den, np.nan)
              return (float(np.nanpercentile(r, 2.5)), float(np.nanpercentile(r, 97.5)))


          def f_pct(x, d=1):
              return "—" if x is None else f"{100 * x:.{d}f} %"


          def f_ic(ic, d=1, pct=True):
              if ic is None or ic[0] is None:
                  return ""
              if pct:
                  return f" [{100 * ic[0]:.{d}f} ; {100 * ic[1]:.{d}f}]"
              return f" [{ic[0]:.{d}g} ; {ic[1]:.{d}g}]"


          def f_mi(m, d=1, u=""):
              if not m:
                  return "—"
              return f"{m['mediane']:.{d}f}{u} [IQR {m['q1']:.{d}f}–{m['q3']:.{d}f}] ({m['min']:.{d}f}–{m['max']:.{d}f}, n = {m['n']})"


          def f_p(p):
              return "—" if p is None else (f"{p:.3f}" if p >= 0.001 else f"{p:.1e}")


          # =============================================================================== lecture des journaux

          def lire(p):
              return open(p, encoding="utf-8", errors="replace") if os.path.exists(p) else None


          def lire_validite(d):
              res = {}
              f = lire(os.path.join(d, "63_validite.txt"))
              if f:
                  for l in f:
                      p = l.split()
                      if len(p) >= 2:
                          res[p[0]] = (p[1] == "valide", " ".join(p[2:]))
              return res


          def lire_roles(d):
              """RUN -> {ip: (rôle, ns)}"""
              roles = defaultdict(dict)
              f = lire(os.path.join(d, "63_ues_par_politique.txt"))
              if f:
                  for l in f:
                      m = re.match(r"^(\S+) : attaquants=(\S*) b\S*nins=(\S*)", l.strip())
                      if not m:
                          continue
                      for grp, role in ((m.group(2), "attaquant"), (m.group(3), "benin")):
                          for x in grp.split(","):
                              if ":" in x:
                                  ns, ip = x.split(":", 1)
                                  roles[m.group(1)][ip] = (role, ns)
              return roles


          def lire_meta(d):
              res = {}
              p = os.path.join(d, "63_essais.csv")
              if os.path.exists(p):
                  for r in csv.DictReader(open(p, encoding="utf-8")):
                      res[r["essai"]] = r
              return res


          def lire_ev(p):
              """attaques {ip: (début, fin, type)} ; événements bénins [(ip, type, début, fin)]"""
              att, ben = {}, []
              f = lire(p)
              if not f:
                  return att, ben
              txt = f.read().strip()
              evs = []
              try:
                  x = json.loads(txt)
                  evs = x if isinstance(x, list) else [x]
              except ValueError:
                  for l in txt.splitlines():
                      try:
                          evs.append(json.loads(l))
                      except ValueError:
                          pass
              for e in evs:
                  if not isinstance(e, dict) or "start" not in e:
                      continue
                  if e.get("benign"):
                      ben.append((e.get("ip", ""), e.get("type", ""), float(e["start"]), float(e.get("end", e["start"]))))
                  elif e.get("ip"):
                      a = att.get(e["ip"])
                      st, en = float(e["start"]), float(e.get("end", e["start"]))
                      att[e["ip"]] = (min(st, a[0]) if a else st, max(en, a[1]) if a else en, e.get("type", ""))
              return att, ben


          def lire_ids(p):
              """verdicts {ip: [(t, v, pr, npk, nfl, dt_inf_us, lag_us)]}, teid -> ip, sauts [(t, n)]"""
              ver, tip, sauts = defaultdict(list), {}, []
              f = lire(p)
              if not f:
                  return ver, tip, sauts
              for l in f:
                  q = l.split()
                  if not q:
                      continue
                  if q[0] == "V" and len(q) >= 6:
                      try:
                          t = int(q[1]) / 1e6
                          teid, ip, v = int(q[2]), q[3], int(q[4])
                          pr = float(q[5])
                          npk = int(q[6]) if len(q) > 6 else None
                          nfl = int(q[7]) if len(q) > 7 else None
                          dti = int(q[8]) if len(q) > 8 else None
                          lag = int(q[9]) if len(q) > 9 else None
                      except ValueError:
                          continue
                      tip[teid] = ip
                      ver[ip].append((t, v, pr, npk, nfl, dti, lag))
                  elif q[0] == "S" and len(q) >= 3:
                      try:
                          sauts.append((int(q[1]) / 1e6, int(q[2])))
                      except ValueError:
                          pass
              for ip in ver:
                  ver[ip].sort()
              return ver, tip, sauts


          RE_HDR = re.compile(r"\[XML5G\] policy=(\S+) W=(\d+) theta=([\d.]+) K=(\d+)")
          RE_MAP = re.compile(r"\[XML5G\] MAP teid=(\d+) ran_ue_id=(\d+) kind=(ul|dl)")
          RE_REL = re.compile(r"\[XML5G\] RELEASE ran_ue_id=(\d+) policy=\S+ t_first_alarm_rx_us=(-?\d+) t_decision_us=(\d+) "
                              r"t_ctrl_send_us=(\d+) t_ctrl_ack_us=(\d+) result=(\S+)")
          RE_THR = re.compile(r"\[XML5G\] THROTTLE ran_ue_id=(\d+) ip=(\S*) t_decision_us=(\d+) t_done_us=(\d+) result=(-?\d+)")
          RE_FULL = re.compile(r"\[XML5G\] REPORT_FULL ran_ue_id=(\d+) n=(\d+) t_us=(\d+)")
          RE_WOULD = re.compile(r"\[XML5G\] WOULD_RELEASE ran_ue_id=(\d+) t_us=(\d+)")
          RE_SUMIP = re.compile(r"\[XML5G\] SUMMARY ran_ue_id=(\d+) ip=(\S+)")
          RE_XV = re.compile(r"\[XML5G\] V t_rx_us=(\d+) teid=(\d+) ran_ue_id=(\d+) v=(\d)")


          def lire_xapp(p):
              x = dict(hdr=None, ul=defaultdict(set), rel=[], thr=[], full=[], would=[], sumip={}, xv=defaultdict(list), unmapped=None)
              f = lire(p)
              if not f:
                  return x
              for l in f:
                  if "[XML5G]" not in l:
                      continue
                  m = RE_XV.search(l)
                  if m:
                      x["xv"][int(m.group(3))].append((int(m.group(1)) / 1e6, int(m.group(4))))
                      continue
                  m = RE_MAP.search(l)
                  if m:
                      if m.group(3) == "ul":
                          x["ul"][int(m.group(2))].add(int(m.group(1)) & 0xFF)
                      continue
                  m = RE_REL.search(l)
                  if m:
                      x["rel"].append(dict(ran=int(m.group(1)), t_first=int(m.group(2)) / 1e6, t_dec=int(m.group(3)) / 1e6,
                                           t_send=int(m.group(4)) / 1e6, t_ack=int(m.group(5)) / 1e6, ok=m.group(6) == "ACK"))
                      continue
                  m = RE_THR.search(l)
                  if m:
                      x["thr"].append(dict(ran=int(m.group(1)), ip=m.group(2), t_dec=int(m.group(3)) / 1e6,
                                           t_done=int(m.group(4)) / 1e6, rc=int(m.group(5))))
                      continue
                  m = RE_FULL.search(l)
                  if m:
                      x["full"].append((int(m.group(1)), int(m.group(2)), int(m.group(3)) / 1e6))
                      continue
                  m = RE_WOULD.search(l)
                  if m:
                      x["would"].append((int(m.group(1)), int(m.group(2)) / 1e6))
                      continue
                  m = RE_SUMIP.search(l)
                  if m:
                      x["sumip"][int(m.group(1))] = m.group(2)
                      continue
                  m = RE_HDR.search(l)
                  if m:
                      x["hdr"] = dict(policy=m.group(1), W=int(m.group(2)), theta=float(m.group(3)), K=int(m.group(4)))
                      continue
                  m = re.search(r"SUMMARY policy=\S+ unmapped_verdicts=(\d+)", l)
                  if m:
                      x["unmapped"] = int(m.group(1))
              return x


          def lire_paquets(p):
              """par teid : [premier paquet d'attaque, dernier paquet d'attaque, nb attaque, nb total, compte par case de 0,2 s
              (heure de lecture), compte par case de 0,2 s (heure du noyau, colonne tk si présente), attentes dans la file (s),
              paquets d'attaque par seconde]"""
              res = {}
              if not os.path.exists(p):
                  return None
              try:
                  with gzip.open(p, "rt", errors="replace") as f:
                      tete = (next(f, "") or "").strip().split(",")
                      i_tk = tete.index("tk") if "tk" in tete else None
                      for l in f:
                          q = l.split(",")
                          if len(q) < 7:
                              continue
                          try:
                              t, teid, proto, dport = float(q[0]), int(q[1]), int(q[2]), int(q[6])
                              tk = float(q[i_tk]) if i_tk is not None and len(q) > i_tk and q[i_tk].strip() else None
                          except ValueError:
                              continue
                          r = res.get(teid)
                          if r is None:
                              r = res[teid] = [None, None, 0, 0, Counter(), Counter(), [], Counter()]
                          r[3] += 1
                          r[4][int(t // BIN)] += 1
                          if tk is not None and tk > 0:
                              r[5][int(tk // BIN)] += 1
                              if r[3] % 5 == 0:                 # attente noyau -> détecteur, un paquet sur cinq
                                  r[6].append(t - tk)
                          if (proto, dport) in VERITE:
                              r[7][int(t)] += 1
                              r[2] += 1
                              if r[0] is None or t < r[0]:
                                  r[0] = t
                              if r[1] is None or t > r[1]:
                                  r[1] = t
              except (OSError, EOFError):
                  pass                                  # archive tronquée (arrêt brutal) : on garde ce qui a été lu
              return res


          RE_RATIO = re.compile(r"RATIO t_us=(\d+) ip=(\S+) taux=([\d.]+) plafond_kbit=(\d+) rc=(-?\d+)")


          def lire_ratio(p):
              out = []
              f = lire(p)
              if f:
                  for l in f:
                      m = RE_RATIO.search(l)
                      if m:
                          out.append(dict(t=int(m.group(1)) / 1e6, ip=m.group(2), taux=float(m.group(3)), plafond=int(m.group(4)), rc=int(m.group(5))))
              return out


          def par_seconde(r):
              """paquets par seconde d'un tunnel (heure du noyau si disponible) à partir des cases de 0,2 s"""
              c = Counter()
              for b, n in (r[5] if r[5] else r[4]).items():
                  c[int(b * BIN + 1e-9)] += n
              return c


          def lire_resume(p):
              try:
                  return json.load(open(p)).get("_boucle", {})
              except Exception:
                  return {}


          def lire_pidstat(p):
              """moyenne du %CPU et RSS max (Mo) par commande (somme des processus de même nom à chaque relevé)"""
              f = lire(p)
              if not f:
                  return {}
              par_t = defaultdict(lambda: defaultdict(lambda: [0.0, 0.0]))
              i_cpu = i_rss = i_cmd = None
              for l in f:
                  q = l.split()
                  if not q:
                      continue
                  if q[0] == "#":
                      h = q[1:]
                      if "%CPU" in h and "RSS" in h:
                          i_cpu, i_rss, i_cmd = h.index("%CPU"), h.index("RSS"), len(h) - 1
                      continue
                  if i_cpu is None or len(q) <= i_cmd:
                      continue
                  try:
                      t, cpu, rss, cmd = q[0], float(q[i_cpu]), float(q[i_rss]), q[i_cmd]
                  except ValueError:
                      continue
                  a = par_t[t][cmd]
                  a[0] += cpu
                  a[1] += rss
              res = defaultdict(lambda: [[], []])
              for t, d in par_t.items():
                  for cmd, (cpu, rss) in d.items():
                      res[cmd][0].append(cpu)
                      res[cmd][1].append(rss)
              return {c: dict(cpu=float(np.mean(v[0])), rss_mo=float(np.max(v[1])) / 1024) for c, v in res.items() if v[0]}


          def lire_rtt(p):
              out = []
              f = lire(p)
              if f:
                  for l in f:
                      m = re.match(r"\[(\d+\.\d+)\].*time=([\d.]+) ms", l)
                      if m:
                          out.append((float(m.group(1)), float(m.group(2))))
              return out


          def lire_pcap(p):
              """Taille des échanges SCTP (E2 : port 36421, E42 : port 36422) : octets IP, paquets, 1er bloc DATA."""
              if not os.path.exists(p):
                  return None
              op = gzip.open if p.endswith(".gz") else open
              try:
                  data = op(p, "rb").read()
              except (OSError, EOFError):
                  return None
              if len(data) < 24:
                  return None
              magic = struct.unpack("<I", data[:4])[0]
              end = "<" if magic in (0xA1B2C3D4, 0xA1B23C4D) else ">"
              link = struct.unpack(end + "I", data[20:24])[0]
              off, res, t0, t1 = 24, defaultdict(lambda: dict(octets=0, paquets=0, data=[])), None, None
              while off + 16 <= len(data):
                  ts, tu, incl, orig = struct.unpack(end + "IIII", data[off:off + 16])
                  pkt = data[off + 16:off + 16 + incl]
                  off += 16 + incl
                  t = ts + tu / 1e6
                  t0 = t if t0 is None else t0
                  t1 = t
                  o = 14 if link == 1 else (16 if link == 113 else (4 if link == 0 else 0))
                  if len(pkt) < o + 20 or pkt[o] >> 4 != 4:
                      continue
                  ihl = (pkt[o] & 0x0F) * 4
                  if pkt[o + 9] != 132:
                      continue
                  lg = struct.unpack("!H", pkt[o + 2:o + 4])[0]
                  s = o + ihl
                  if len(pkt) < s + 12:
                      continue
                  sp, dp = struct.unpack("!HH", pkt[s:s + 4])
                  cle = "E2 gNB->RIC" if dp == 36421 else "E2 RIC->gNB" if sp == 36421 else \
                        "E42 xApp->RIC" if dp == 36422 else "E42 RIC->xApp" if sp == 36422 else f"sctp {sp}->{dp}"
                  r = res[cle]
                  r["octets"] += lg
                  r["paquets"] += 1
                  c = s + 12
                  if len(pkt) >= c + 4 and pkt[c] == 0:               # 1er bloc : DATA
                      r["data"].append(struct.unpack("!H", pkt[c + 2:c + 4])[0] - 16)
              dur = (t1 - t0) if t0 is not None and t1 is not None and t1 > t0 else None
              out = {}
              for k, r in res.items():
                  out[k] = dict(octets=r["octets"], paquets=r["paquets"], duree_s=dur,
                                octets_par_s=r["octets"] / dur if dur else None,
                                charge_data=med_iqr(r["data"]))
              return out


          # =============================================================================== règles de décision (rejeu)

          def r_mofn(w, k):
              def f(seq):
                  win, s = [], 0
                  for i, (t, v) in enumerate(seq):
                      win.append(v)
                      s += v
                      if len(win) > w:
                          s -= win.pop(0)
                      if len(win) == w and s >= k:
                          return i
                  return None
              return f


          def r_consec(k):
              def f(seq):
                  c = 0
                  for i, (t, v) in enumerate(seq):
                      c = c + 1 if v else 0
                      if c >= k:
                          return i
                  return None
              return f


          def r_cusum(p0, p1, h):
              a1, a0 = math.log(p1 / p0), math.log((1 - p1) / (1 - p0))

              def f(seq):
                  s = 0.0
                  for i, (t, v) in enumerate(seq):
                      s = max(0.0, s + (a1 if v else a0))
                      if s >= h:
                          return i
                  return None
              return f


          def r_sprt(p0, p1, alpha, beta=0.01):
              a1, a0 = math.log(p1 / p0), math.log((1 - p1) / (1 - p0))
              A, B = math.log((1 - beta) / alpha), math.log(beta / (1 - alpha))

              def f(seq):
                  s = 0.0
                  for i, (t, v) in enumerate(seq):
                      s += a1 if v else a0
                      if s >= A:
                          return i
                      if s <= B:
                          s = 0.0
                  return None
              return f


          def r_temps(rapport_s, frac):
              """Règle sur fenêtre TEMPORELLE, comme la xApp (politique tsourdinis) : le verdict qui ouvre un nouveau rapport
              ferme le précédent ; libération si la part d'alarmes du rapport fermé atteint frac (frac = 1 : unanimité)."""
              def f(seq):
                  st, n, a = None, 0, 0
                  for i, (t, v) in enumerate(seq):
                      if st is None:
                          st = t
                      if t - st >= rapport_s:
                          if n > 0 and a >= frac * n - 1e-9:
                              return i
                          st, n, a = t, 0, 0
                      n += 1
                      a += v
                  return None
              return f


          def regles(p0, p1, q0=None, q1=None):
              R = [("1re alarme", r_consec(1)), ("3 consécutives", r_consec(3))]
              R += [(f"{k} sur 10", r_mofn(10, k)) for k in range(5, 11)]
              R += [("9 sur 15", r_mofn(15, 9)), ("4 sur 5", r_mofn(5, 4)), ("14 sur 20", r_mofn(20, 14)), ("16 sur 20", r_mofn(20, 16)),
                    ("30 sur 30 (unanimité, comptage)", r_mofn(30, 30)),
                    ("unanimité, fenêtre 1 s", r_temps(1.0, 1.0)), ("≥ 70 % d'une fenêtre de 2 s", r_temps(2.0, 0.7))]
              if p0 and p1 and 0 < p0 < p1 < 1:
                  R += [("CUSUM h = 50", r_cusum(p0, p1, 50)), ("SPRT α = 1e-2", r_sprt(p0, p1, 1e-2)),
                        ("SPRT α = 1e-20", r_sprt(p0, p1, 1e-20))]
              if q0 and q1 and 0 < q0 < q1 < 1:              # taux mesurés dans la boucle (E2) : choix dans l'échantillon, validé sur E1
                  R += [(f"CUSUM, taux de la boucle, h = {h}", r_cusum(q0, q1, h)) for h in (10, 20, 40)]
                  R += [("SPRT, taux de la boucle, α = 1e-6", r_sprt(q0, q1, 1e-6))]
              return R


          # =============================================================================== modèle de Markov (rafales)

          def transitions(seqs):
              c = Counter()
              c2 = Counter()
              for s in seqs:
                  for a, b in zip(s, s[1:]):
                      c[(a, b)] += 1
                  for a, b, d in zip(s, s[1:], s[2:]):
                      c2[(a, b, d)] += 1
              p01 = c[(0, 1)] / (c[(0, 0)] + c[(0, 1)]) if c[(0, 0)] + c[(0, 1)] else None
              p11 = c[(1, 1)] / (c[(1, 0)] + c[(1, 1)]) if c[(1, 0)] + c[(1, 1)] else None
              o2 = {}
              for a in (0, 1):
                  for b in (0, 1):
                      n = c2[(a, b, 0)] + c2[(a, b, 1)]
                      o2[f"P(1|{a}{b})"] = (c2[(a, b, 1)] / n if n else None, n)
              return p01, p11, o2, dict((f"{a}{b}", v) for (a, b), v in c.items())


          def rafales(seqs):
              out = []
              for s in seqs:
                  r = 0
                  for v in list(s) + [0]:
                      if v:
                          r += 1
                      elif r:
                          out.append(r)
                          r = 0
              return out


          def arl_markov(w, k, p01, p11):
              """Nombre moyen de verdicts avant la première libération par une règle k sur w (fenêtre pleine exigée),
              verdicts suivant une chaîne de Markov à deux états, départ stationnaire."""
              if p01 is None or p11 is None or w > 14:
                  return None
              n = 1 << w
              pop = np.array([bin(s).count("1") for s in range(n)])
              pi1 = p01 / (1 - p11 + p01) if (1 - p11 + p01) > 0 else 0.0
              # distribution de la fenêtre après w verdicts depuis l'état stationnaire (bit 0 = le plus récent)
              dist = np.zeros(n)
              dist[1] = pi1
              dist[0] = 1 - pi1
              mask = n - 1
              for _ in range(w - 1):
                  nd = np.zeros(n)
                  last = (np.arange(n) & 1).astype(bool)
                  p1 = np.where(last, p11, p01)
                  s = np.arange(n)
                  np.add.at(nd, ((s << 1) & mask) | 1, dist * p1)
                  np.add.at(nd, ((s << 1) & mask), dist * (1 - p1))
                  dist = nd
              trans = np.where(pop < k)[0]
              idx = -np.ones(n, int)
              idx[trans] = np.arange(len(trans))
              m = len(trans)
              Q = np.zeros((m, m))
              for r, s in enumerate(trans):
                  p1 = p11 if s & 1 else p01
                  for b, pb in ((1, p1), (0, 1 - p1)):
                      s2 = ((s << 1) & mask) | b
                      if idx[s2] >= 0:
                          Q[r, idx[s2]] += pb
              try:
                  tt = np.linalg.solve(np.eye(m) - Q, np.ones(m))
              except np.linalg.LinAlgError:
                  return None
              arl = float(w + (dist[trans] * tt).sum())         # fenêtres déjà pleines (≥ k) : libération au w-ième verdict
              if not math.isfinite(arl) or arl <= 0 or arl > 1e13 or (tt < 0).any():
                  return None                                     # hors de la précision numérique : non rapporté
              return arl


          # =============================================================================== construction des essais

          def dossiers(racines):
              out = []
              for r in racines:
                  for p in sorted(glob.glob(os.path.join(r, "**", "63_validite.txt"), recursive=True)):
                      out.append(os.path.dirname(p))
              return sorted(set(out))


          def charger(d, avec_paquets=True):
              nom_tranche = os.path.relpath(d, os.path.dirname(os.path.dirname(d))) if d else d
              val, roles, meta = lire_validite(d), lire_roles(d), lire_meta(d)
              essais = []
              for run, (ok, raison) in val.items():
                  m = RE_RUN.match(run)
                  pol, sc = (m.group("pol"), m.group("sc")) if m else (run.rsplit("_r", 1)[0], "?")
                  md = meta.get(run, {})
                  e = dict(dossier=d, tranche=os.path.basename(d.rstrip("/")) or nom_tranche, essai=run, politique=md.get("politique", pol),
                           scenario=md.get("scenario", sc), experience=md.get("experience", "E1" if sc == "benin" else "E2"),
                           charge=md.get("charge", "standard"), valide=ok, raison=raison, meta=md)
                  essais.append(e)
                  if not ok:
                      continue
                  ver, tip, sauts = lire_ids(os.path.join(d, f"61_ids_{run}.log"))
                  xa = lire_xapp(os.path.join(d, f"60_xapp_{run}.log"))
                  att, ben_ev = lire_ev(os.path.join(d, f"62_ev_{run}.jsonl"))
                  _, ben_ev2 = lire_ev(os.path.join(d, f"69_benin_{run}.jsonl"))
                  pk = lire_paquets(os.path.join(d, f"68_pkt_{run}.csv.gz")) if avec_paquets else None
                  rl = roles.get(run, {})
                  e.update(ver=ver, tip=tip, sauts=sauts, xa=xa, att=att, ben_ev=ben_ev + ben_ev2, pk=pk, roles=rl,
                           ratio=lire_ratio(os.path.join(d, f"72_ratio_{run}.log")),
                           resume=lire_resume(os.path.join(d, f"61_ids_{run}_summary.json")),
                           pid=lire_pidstat(os.path.join(d, f"65_pidstat_{run}.txt")),
                           pcap=lire_pcap(os.path.join(d, f"71_e2_{run}.pcap.gz")) or lire_pcap(os.path.join(d, f"71_e2_{run}.pcap")))
                  e["W"] = xa["hdr"]["W"] if xa["hdr"] else None
                  e["K"] = xa["hdr"]["K"] if xa["hdr"] else None
                  # correspondance RAN UE ID -> adresse : tunnel montant (8 bits) de la xApp, adresse du détecteur
                  ran_ip = {}
                  for ran, low in xa["ul"].items():
                      ips = {ip for teid, ip in tip.items() if (teid & 0xFF) in low}
                      if len(ips) == 1:
                          ran_ip[ran] = ips.pop()
                  for ran, ip in xa["sumip"].items():
                      ran_ip.setdefault(ran, ip)
                  e["ran_ip"] = ran_ip
                  # instant de référence de chaque attaquant : premier paquet d'attaque reçu au N3
                  e["t0"], e["t_fin_att"] = {}, {}
                  for ip, (st, en, typ) in att.items():
                      teids = [t for t, x in tip.items() if x == ip]
                      t0 = t1 = None
                      if pk:
                          for t in teids:
                              r = pk.get(t)
                              if r and r[0] is not None:
                                  t0 = r[0] if t0 is None else min(t0, r[0])
                                  t1 = r[1] if t1 is None else max(t1, r[1])
                      if t0 is None:                            # repli : premier verdict contenant un paquet d'attaque
                          v1 = [t for t, v, pr, npk, nfl, *_ in ver.get(ip, []) if nfl]
                          t0 = v1[0] if v1 else None
                          t1 = v1[-1] if v1 else None
                      e["t0"][ip] = t0
                      e["t_fin_att"][ip] = t1
                      e.setdefault("t_ev", {})[ip] = st
                  issue(e)
              return essais


          def issue(e):
              """Résultat d'un essai en boucle : qui a été libéré, quand, et les délais."""
              att_ips = [ip for ip, (r, ns) in e["roles"].items() if r == "attaquant"]
              ben_ips = [ip for ip, (r, ns) in e["roles"].items() if r == "benin"]
              lib = defaultdict(list)
              for r in e["xa"]["rel"]:
                  if r["ok"]:
                      lib[e["ran_ip"].get(r["ran"], f"ran{r['ran']}")].append(r)
              thr = defaultdict(list)
              for r in e["xa"]["thr"]:
                  ip = r["ip"] or e["ran_ip"].get(r["ran"], "")
                  thr[ip].append(r)
              o = dict(n_att=len(att_ips), att_libere=False, avant_attaque=False, benins_liberes=0, att_limite=False,
                       benin_limite=0, delais={}, non_associes=[ip for ip in lib if ip not in e["roles"]])
              for ip in ben_ips:
                  if lib.get(ip):
                      o["benins_liberes"] += 1
                  if thr.get(ip):
                      o["benin_limite"] += 1
              for ip in att_ips:
                  t0 = e["t0"].get(ip)
                  rs = sorted(lib.get(ip, []), key=lambda r: r["t_dec"])
                  if rs:
                      r = rs[0]
                      if t0 is not None and r["t_dec"] < t0:
                          o["avant_attaque"] = True
                      else:
                          o["att_libere"] = True
                          al = [t for t, v, *_ in e["ver"].get(ip, []) if v and (t0 is None or t >= t0)]
                          d = dict(n3_ack=r["t_ack"] - t0 if t0 else None,
                                   ev_n3=(t0 - e["t_ev"][ip]) if t0 and ip in e.get("t_ev", {}) else None,
                                   n3_1re_alarme=(al[0] - t0) if al and t0 else None,
                                   alarme_decision=(r["t_dec"] - al[0]) if al else None,
                                   decision_ack_ms=(r["t_ack"] - r["t_dec"]) * 1000,
                                   ev_ack=(r["t_ack"] - e["t_ev"][ip]) if ip in e.get("t_ev", {}) else None)
                          o["delais"][ip] = d
                  if thr.get(ip):
                      o["att_limite"] = True
                      t = thr[ip][0]
                      o["delais"].setdefault(ip, {})["n3_limitation"] = (t["t_dec"] - t0) if t0 else None
              for ip in ben_ips:                                                        # ratio30 : plafond posé sur un UE bénin
                  if any(x["ip"] == ip and x["taux"] > 0 for x in e.get("ratio", [])):
                      o["benin_limite"] += 1
              for ip in att_ips:
                  rx = [x for x in e.get("ratio", []) if x["ip"] == ip and x["taux"] > 0]
                  if rx:
                      o["att_limite"] = True
                      t0 = e["t0"].get(ip)
                      o["delais"].setdefault(ip, {})["n3_limitation"] = (rx[0]["t"] - t0) if t0 else None
              # reprise de l'attaque au N3 après la 1re libération de l'attaquant (réattachement), et nombre de libérations
              o["reprise"] = {}
              if e.get("pk"):
                  fl = Counter()
                  for r in e["pk"].values():
                      fl.update(r[7])
                  for ip in att_ips:
                      rs = sorted(lib.get(ip, []), key=lambda r: r["t_ack"])
                      if not rs:
                          continue
                      ta = rs[0]["t_ack"]
                      apres = sorted(s_ for s_, n in fl.items() if s_ >= ta + 2 and n > 0)
                      o["reprise"][ip] = dict(liberations=len(rs), reprise_s=(apres[0] - ta) if apres else None,
                                              secondes_inondation_apres=len(apres))
              # identité : la libération a-t-elle coupé l'UE visé (silence d'au moins 2 s au N3 qui commence dans les 3 s suivant
              # l'ACK) et lui seul ? Puis reconnexion de l'UE (premier paquet après ce silence : la session PDU reste ouverte
              # dans le cœur après un RRC Release, l'UE revient par une demande de service)
              o["identite"], o["reconnexion"] = [], []
              if e.get("pk"):
                  def cases(ips):
                      c = set()
                      for t, x in e["tip"].items():
                          if x in ips and e["pk"].get(t):
                              c |= set(e["pk"][t][4])
                      return sorted(c)
                  for r in e["xa"]["rel"]:
                      if not r["ok"]:
                          continue
                      ip = e["ran_ip"].get(r["ran"])
                      if not ip:
                          o["identite"].append("indéterminée (RAN UE ID sans adresse)")
                          continue
                      ta = r["t_ack"]
                      ts = [c * BIN for c in cases({ip})]
                      apres = [t for t in ts if t > ta - 0.5]
                      coupe, retour = False, None
                      prec = ta - 0.5
                      for t in apres:
                          if t - prec >= 2.0 and prec <= ta + 3.0:
                              coupe, retour = True, t
                              break
                          prec = t
                      if not apres or (not coupe and prec <= ta + 3.0):
                          coupe = True                                  # plus aucun paquet après l'ACK : coupé jusqu'à la fin
                      autres = {x for x, (ro, ns) in e["roles"].items() if x != ip and not lib.get(x)}
                      vivants = (not autres) or any(c * BIN > ta + 3.0 for c in cases(autres))
                      o["identite"].append("cohérente" if coupe and vivants else ("cible non coupée" if not coupe else "autre UE coupé"))
                      o["reconnexion"].append(dict(ip=ip, role=e["roles"].get(ip, ("?", ""))[0], coupe=coupe,
                                                   reconnexion_s=(retour - ta) if retour else None))
              # tunnels dont les 8 bits bas coïncident (risque d'alias du modèle de service GTP)
              bas = Counter(t & 0xFF for t in e["tip"])
              o["alias_teid"] = sum(1 for v in bas.values() if v > 1)
              o["fausse_lib"] = o["benins_liberes"] > 0 or o["avant_attaque"]          # analyse principale (pré-enregistrée)
              o["fausse_lib_sensib"] = o["benins_liberes"] > 0                         # sensibilité : sans l'avant-attaque
              e["issue"] = o


          def sequences(essais):
              """Séquences de verdicts bénins (une par UE et par essai) et séquences d'attaque (attaquant, essais none)."""
              ben, atk = [], []
              for e in essais:
                  if not e["valide"] or "ver" not in e:
                      continue
                  for ip, (role, ns) in e["roles"].items():
                      vs = e["ver"].get(ip, [])
                      if not vs:
                          continue
                      if role == "benin":
                          g = "E1 (bénin seul)" if e["scenario"] == "benin" else ("foule (flash)" if e["scenario"] == "flash" else
                                                                                 "UE bénin des essais d'attaque")
                          if e["experience"] == "E3":
                              g = "E3 (charge isolée)"
                          elif e["experience"] not in ("E1", "E2"):
                              g = f"{e['experience']} (UE non attaquants)"
                          seq = vs
                      else:
                          t0 = e["t0"].get(ip)
                          seq = [x for x in vs if (t0 is None or x[0] < t0) and not x[4]]
                          g = ("E3 (charge isolée)" if e["experience"] == "E3" else "attaquant avant l'attaque" if e["experience"] == "E2"
                               else f"{e['experience']} (UE non attaquants)")
                          if e["politique"] == "none" and t0 is not None:
                              atk.append(dict(e=e, ip=ip, seq=vs, t0=t0, t1=e["t_fin_att"].get(ip)))
                      if len(seq) >= 2:
                          ben.append(dict(e=e, ip=ip, ns=ns, groupe=g, seq=seq, duree=seq[-1][0] - seq[0][0]))
              return ben, atk


          # =============================================================================== analyses

          def tableau_boucle(essais):
              """Par (expérience, scénario, charge, politique) : effectifs, libérations, fausses libérations, délais."""
              cell = defaultdict(list)
              lances = Counter()
              for e in essais:
                  k = (e["experience"], e["scenario"], e["charge"], e["politique"])
                  lances[k] += 1
                  if e["valide"] and "issue" in e:
                      cell[k].append(e)
              rows = []
              for k in sorted(lances, key=lambda k: (k[0], k[1], k[2], ORDRE_POL.index(k[3]) if k[3] in ORDRE_POL else 99)):
                  es = cell.get(k, [])
                  n = len(es)
                  attaque = k[1] not in ("flash", "benin")
                  a = sum(e["issue"]["att_libere"] for e in es) if attaque else None
                  fl = sum(e["issue"]["fausse_lib"] for e in es)
                  fs = sum(e["issue"]["fausse_lib_sensib"] for e in es)
                  av = sum(e["issue"]["avant_attaque"] for e in es)
                  lim = sum(e["issue"]["att_limite"] for e in es) if attaque else None
                  dl = [d.get("n3_ack") for e in es for d in e["issue"]["delais"].values() if d.get("n3_ack") is not None]
                  dack = [d.get("decision_ack_ms") for e in es for d in e["issue"]["delais"].values() if d.get("decision_ack_ms") is not None]
                  rows.append(dict(experience=k[0], scenario=k[1], charge=k[2], politique=k[3], lances=lances[k], valides=n,
                                   att_libere=a, ic_att=cp(a, n) if attaque and n else None, fausses=fl, ic_fausses=cp(fl, n),
                                   fausses_sensib=fs, avant_attaque=av, att_limite=lim,
                                   delai_n3_ack=med_iqr(dl), decision_ack_ms=med_iqr(dack)))
              return rows


          def tests_boucle(rows):
              """Fisher par scénario (xML5G 7/10 contre chaque politique) et test exact stratifié sur les scénarios."""
              by = {(r["experience"], r["scenario"], r["charge"], r["politique"]): r for r in rows}
              out = []
              groupes = defaultdict(list)
              for (ex, sc, ch, pol), r in by.items():
                  if pol == "xml5g":
                      continue
                  ref = by.get((ex, sc, ch, "xml5g"))
                  if not ref or not ref["valides"] or not r["valides"]:
                      continue
                  d = dict(experience=ex, scenario=sc, charge=ch, politique=pol,
                           fausses=f"{r['fausses']}/{r['valides']} contre {ref['fausses']}/{ref['valides']}",
                           p_fausses=fisher(r["fausses"], r["valides"], ref["fausses"], ref["valides"]),
                           p_fausses_sensib=fisher(r["fausses_sensib"], r["valides"], ref["fausses_sensib"], ref["valides"]))
                  if r["att_libere"] is not None:
                      d["attaquant"] = f"{r['att_libere']}/{r['valides']} contre {ref['att_libere']}/{ref['valides']}"
                      d["p_attaquant"] = fisher(r["att_libere"], r["valides"], ref["att_libere"], ref["valides"])
                  out.append(d)
                  groupes[(ex, ch, pol)].append(((r["fausses"], r["valides"], ref["fausses"], ref["valides"]),
                                                 (r["fausses_sensib"], r["valides"], ref["fausses_sensib"], ref["valides"]), sc))
              strat = []
              for (ex, ch, pol), L in sorted(groupes.items()):
                  p1, p2, s = exact_stratifie([x[0] for x in L])
                  q1, q2, _ = exact_stratifie([x[1] for x in L])
                  strat.append(dict(experience=ex, charge=ch, politique=pol, strates=[x[2] for x in L],
                                    p_unilateral=p1, p_bilateral=p2, p_unilateral_sensib=q1, p_bilateral_sensib=q2,
                                    poole=fisher(sum(x[0][0] for x in L), sum(x[0][1] for x in L),
                                                 sum(x[0][2] for x in L), sum(x[0][3] for x in L))))
              return out, strat


          def rejeux(ben, atk, p0, p1, q0=None, q1=None):
              """Chaque règle rejouée sur toutes les séquences : fausses libérations (par groupe) et attaquants libérés."""
              R = regles(p0, p1, q0, q1)
              res = []
              feux = {}                                                  # (règle, id séquence) -> indice ou None
              for nom, f in R:
                  par_g = defaultdict(lambda: dict(seq=0, feux=0, verdicts=0, duree=0.0))
                  for i, b in enumerate(ben):
                      s = [(x[0], x[1]) for x in b["seq"]]
                      j = f(s)
                      feux[(nom, "b", i)] = j
                      for g in (b["groupe"], "E2 (tous)" if b["e"]["experience"] == "E2" else None):
                          if g is None:
                              continue
                          d = par_g[g]
                          d["seq"] += 1
                          d["verdicts"] += len(s)
                          d["duree"] += b["duree"]
                          d["feux"] += int(j is not None)
                  att = defaultdict(lambda: dict(n=0, liberes=0, delais=[], avant=0))
                  for i, a in enumerate(atk):
                      s = [(x[0], x[1]) for x in a["seq"]]
                      j = f(s)
                      feux[(nom, "a", i)] = j
                      d = att[f"{a['e']['scenario']}, {a['e']['charge']}"]
                      d["n"] += 1
                      if j is not None:
                          tj = s[j][0]
                          if tj < a["t0"]:
                              d["avant"] += 1
                          elif a["t1"] is None or tj <= a["t1"] + 2.0:
                              d["liberes"] += 1
                              d["delais"].append(tj - a["t0"])
                  for g, d in par_g.items():
                      uh = d["duree"] / 3600
                      res.append(dict(regle=nom, groupe=g, sequences=d["seq"], verdicts=d["verdicts"], ue_heures=uh,
                                      fausses=d["feux"], par_ue_heure=d["feux"] / uh if uh else None,
                                      ic_ue_heure=poisson_ic(d["feux"], uh), par_million=d["feux"] / d["verdicts"] * 1e6 if d["verdicts"] else None,
                                      ic_million=tuple(x * 1e6 if x is not None else None for x in poisson_ic(d["feux"], d["verdicts"]))))
                  for sc, d in att.items():
                      res.append(dict(regle=nom, groupe=f"attaquant ({sc}, essais sans action)", sequences=d["n"],
                                      liberes=d["liberes"], avant_attaque=d["avant"], delai=med_iqr(d["delais"])))
              return res, feux, [n for n, _ in R]


          def loro_k(ben, atk, feux):
              """Choix de K (règle K sur 10) en leave-one-run-out : sur les autres essais, K sans fausse libération qui libère le
              plus d'attaquants (à égalité, le plus grand) ; évaluation sur l'essai laissé de côté. E1 exclu (corpus de validation)."""
              Ks = list(range(5, 11))
              cle = lambda e: (e["dossier"], e["essai"])
              ess = sorted({cle(b["e"]) for b in ben if b["e"]["experience"] == "E2"} | {cle(a["e"]) for a in atk if a["e"]["experience"] == "E2"})
              if len(ess) < 3:
                  return None
              fb = {k: [(cle(b["e"]), feux[(f"{k} sur 10", "b", i)] is not None) for i, b in enumerate(ben)
                        if b["e"]["experience"] == "E2"] for k in Ks}
              fa = {}
              for k in Ks:
                  L = []
                  for i, a in enumerate(atk):
                      if a["e"]["experience"] != "E2":
                          continue
                      j = feux[(f"{k} sur 10", "a", i)]
                      ok = j is not None and a["seq"][j][0] >= a["t0"] and (a["t1"] is None or a["seq"][j][0] <= a["t1"] + 2)
                      L.append((cle(a["e"]), ok))
                  fa[k] = L
              choix, fausses, rates = Counter(), 0, 0
              for r in ess:
                  # parmi les K sans fausse libération sur les autres essais, celui qui libère le plus d'attaquants ;
                  # à égalité, le plus grand (le plus prudent pour les UE bénins)
                  sur = [k for k in Ks if not any(f for c, f in fb[k] if c != r)] or [Ks[-1]]
                  bon = max(sur, key=lambda k: (sum(o for c, o in fa[k] if c != r), k))
                  choix[bon] += 1
                  fausses += int(any(f for c, f in fb[bon] if c == r))
                  rates += sum(1 for c, o in fa[bon] if c == r and not o)
              return dict(essais=len(ess), choix=dict(sorted(choix.items())), fausses_hors_echantillon=fausses,
                          attaquants_manques=rates, attaquants=sum(1 for a in atk if a["e"]["experience"] == "E2"))


          def analyse_markov(ben, vps_obs):
              out = {}
              groupes = defaultdict(list)
              for b in ben:
                  groupes[b["groupe"]].append(b)
                  if b["e"]["experience"] == "E2":
                      groupes["E2 (tous)"].append(b)
              for g, L in groupes.items():
                  seqs = [[x[1] for x in b["seq"]] for b in L]
                  p01, p11, o2, cnt = transitions(seqs)
                  rf = rafales(seqs)
                  h = Counter(rf)
                  nb = len(rf)
                  exp = {}
                  if p11 is not None and nb:
                      for l in range(1, 8):
                          exp[l] = nb * (1 - p11) * p11 ** (l - 1) if l < 7 else nb * p11 ** 6
                  verd = sum(len(s) for s in seqs)
                  dur = sum(b["duree"] for b in L)
                  vps = verd / dur if dur else None
                  ajustable = nb >= 10 and p11 is not None and p11 > 0
                  arl = {k: (arl_markov(10, k, p01, p11) if ajustable else None) for k in (6, 7, 8, 9)}
                  d = dict(ajustable=ajustable, sequences=len(L), verdicts=verd, alarmes=int(sum(sum(s) for s in seqs)), p01=p01, p11=p11, ordre2=o2,
                           rafales=dict(sorted(h.items())), rafale_max=max(rf) if rf else 0, rafales_attendues_geom=exp,
                           p_geom_ge_max=(p11 ** (max(rf) - 1) if rf and p11 is not None else None),
                           debit_verdicts=vps, arl_verdicts=arl,
                           heures_debit_observe={k: (a / vps / 3600 if a and vps else None) for k, a in arl.items()},
                           heures_5_par_s={k: (a / NOMINAL_VPS / 3600 if a else None) for k, a in arl.items()})
                  if ajustable and len(L) >= 5 and g in ("E2 (tous)", "E3 (charge isolée)", "E1 (bénin seul)"):
                      bh = {7: [], 8: []}
                      Bm = 300
                      for _ in range(Bm):
                          idx = RNG.integers(0, len(seqs), len(seqs))
                          q01, q11, *_ = transitions([seqs[i] for i in idx])
                          for k in (7, 8):
                              a = arl_markov(10, k, q01, q11)
                              if a and vps:
                                  bh[k].append(a / vps / 3600)
                      d["ic_bootstrap_heures"] = {k: (float(np.percentile(v, 2.5)), float(np.percentile(v, 97.5))) if len(v) > 20 else None
                                                  for k, v in bh.items()}
                  out[g] = d
              return out


          def fpr_groupes(ben):
              out = {}
              par = defaultdict(list)
              for b in ben:
                  par[b["groupe"]].append(b)
                  if b["e"]["experience"] == "E2":
                      par["E2 (tous)"].append(b)
              for g, L in par.items():
                  a = sum(sum(x[1] for x in b["seq"]) for b in L)
                  n = sum(len(b["seq"]) for b in L)
                  par_essai = defaultdict(lambda: [0, 0])
                  for b in L:
                      k = (b["e"]["dossier"], b["e"]["essai"])
                      par_essai[k][0] += sum(x[1] for x in b["seq"])
                      par_essai[k][1] += len(b["seq"])
                  out[g] = dict(alarmes=a, verdicts=n, fpr=a / n if n else None, ic_naif=cp(a, n),
                                ic_bootstrap_essais=boot_ratio(list(par_essai.values())),
                                ic_bootstrap_sequences=boot_ratio([(sum(x[1] for x in b["seq"]), len(b["seq"])) for b in L]),
                                sequences=len(L), essais=len(par_essai), minutes_ue=sum(b["duree"] for b in L) / 60,
                                un_paquet=(sum(1 for b in L for x in b["seq"] if x[3] == 1),
                                           sum(1 for b in L for x in b["seq"] if x[3] == 1 and x[1])),
                                cinquante_paquets=(sum(1 for b in L for x in b["seq"] if (x[3] or 0) >= 50),
                                                   sum(1 for b in L for x in b["seq"] if (x[3] or 0) >= 50 and x[1])))
              return out


          def deux_etiquettes(atk):
              """Détection par verdict de l'attaquant (essais sans action), avec les deux vérités terrain."""
              out = {}
              par = defaultdict(list)
              for a in atk:
                  par[a["e"]["scenario"]].append(a)
              for sc, L in par.items():
                  d = {}
                  for nom, f in (("au moins un paquet d'attaque", lambda npk, nfl: nfl >= 1),
                                 ("majorité de paquets d'attaque", lambda npk, nfl: npk and nfl >= 0.5 * npk)):
                      pos = [(x[1]) for a in L for x in a["seq"] if x[4] is not None and x[3] and f(x[3], x[4])]
                      neg = [(x[1]) for a in L for x in a["seq"] if x[4] is not None and x[3] and x[0] >= a["t0"] and not f(x[3], x[4])]
                      grp = [(sum(x[1] for x in a["seq"] if x[4] is not None and x[3] and f(x[3], x[4])),
                              sum(1 for x in a["seq"] if x[4] is not None and x[3] and f(x[3], x[4]))) for a in L]
                      d[nom] = dict(positifs=len(pos), detection=(sum(pos) / len(pos)) if pos else None,
                                    ic_bootstrap=boot_ratio(grp), par_essai=med_iqr([a_ / n_ for a_, n_ in grp if n_]),
                                    negatifs_pendant_attaque=len(neg), alarmes_sur_negatifs=sum(neg))
                  out[sc] = d
              return out


          def debit_et_sauts(essais, ben):
              """Débit de verdicts, occupation des cases de 0,2 s par les paquets, intervalles sautés, latence du détecteur."""
              par = defaultdict(lambda: dict(vps=[], occ=[], occk=[], attente=[], sauts_min=[], rattr_min=[], dti=[], lag=[],
                                             rap1s=Counter(), horloge=Counter(), sauts_lourds=[0, 0]))
              for b in ben:
                  e = b["e"]
                  k = (e["experience"], e["scenario"], e["charge"])
                  d = par[k]
                  if b["duree"] > 5:
                      d["vps"].append(len(b["seq"]) / b["duree"])
                      if e.get("pk"):
                          teids = [t for t, x in e["tip"].items() if x == b["ip"]]
                          a, z = int(b["seq"][0][0] // BIN), int(b["seq"][-1][0] // BIN)
                          occ, occk = set(), set()
                          for t in teids:
                              r_ = e["pk"].get(t, [None, None, 0, 0, Counter(), Counter(), [], Counter()])
                              occ |= {c for c in r_[4] if a <= c <= z}
                              occk |= {c for c in r_[5] if a <= c <= z}
                              d["attente"] += r_[6]
                          d["occ"].append(len(occ) * BIN / b["duree"] * NOMINAL_VPS if z > a else None)
                          if occk:
                              d["occk"].append(len(occk) * BIN / b["duree"] * NOMINAL_VPS if z > a else None)
                  ts = [x[0] for x in b["seq"]]
                  st, n = None, 0
                  for t in ts:                                      # rapports comme la xApp (fenêtre ouverte au 1er verdict)
                      if st is None:
                          st = t
                      if t - st >= 1.0:
                          d["rap1s"][n] += 1
                          st, n = t, 0
                      n += 1
                  for c in Counter(int(t) for t in ts).values():    # secondes d'horloge
                      d["horloge"][c] += 1
                  d["dti"] += [x[5] for x in b["seq"] if x[5] is not None]
                  d["lag"] += [x[6] for x in b["seq"] if x[6] is not None]
              for e in essais:
                  if not e["valide"] or "resume" not in e:
                      continue
                  k = (e["experience"], e["scenario"], e["charge"])
                  r = e["resume"]
                  dur = None
                  tt = [x[0] for v in e["ver"].values() for x in v]
                  if tt:
                      dur = max(tt) - min(tt)
                  if dur and dur > 5:
                      par[k]["sauts_min"].append(r.get("intervalles_sautes", 0) / dur * 60)
                      par[k]["rattr_min"].append(r.get("rattrapages", 0) / dur * 60)
                  # sauts juste après un intervalle lourd (≥ 50 paquets) ?
                  lourds = sorted(x[0] for v in e["ver"].values() for x in v if (x[3] or 0) >= 50)
                  for ts_, n_ in e["sauts"]:
                      i = bisect.bisect_right(lourds, ts_)
                      par[k]["sauts_lourds"][0] += 1
                      par[k]["sauts_lourds"][1] += int(i > 0 and ts_ - lourds[i - 1] <= 1.0)
              out = {}
              for k, d in par.items():
                  tot1 = sum(d["rap1s"].values())
                  toth = sum(d["horloge"].values())
                  out[" / ".join(k)] = dict(
                      verdicts_par_s=med_iqr(d["vps"]), plafond_par_occupation=med_iqr([x for x in d["occ"] if x is not None]),
                      plafond_occupation_noyau=med_iqr([x for x in d["occk"] if x is not None]),
                      attente_file_ms=med_iqr([1000 * x for x in d["attente"]]),
                      p95_attente_file_ms=float(np.percentile(d["attente"], 95)) * 1000 if d["attente"] else None,
                      intervalles_sautes_par_min=med_iqr(d["sauts_min"]), rattrapages_par_min=med_iqr(d["rattr_min"]),
                      rapports_1s=dict(n=tot1, parts={n: c / tot1 for n, c in sorted(d["rap1s"].items())} if tot1 else {}),
                      secondes_horloge=dict(n=toth, parts={n: c / toth for n, c in sorted(d["horloge"].items())} if toth else {}),
                      inference_us=med_iqr(d["dti"]), p95_inference_us=float(np.percentile(d["dti"], 95)) if d["dti"] else None,
                      retard_verdict_us=med_iqr(d["lag"]), p95_retard_us=float(np.percentile(d["lag"], 95)) if d["lag"] else None,
                      sauts_apres_intervalle_lourd=d["sauts_lourds"])
              return out


          def unanimite_declencheurs(essais):
              """Taille du rapport qui a déclenché chaque libération de la règle d'unanimité (lignes REPORT_FULL)."""
              out = defaultdict(Counter)
              for e in essais:
                  if e["valide"] and e["politique"] in POL_UNAN_TEMPS and "xa" in e:
                      for ran, n, t in e["xa"]["full"]:
                          ip = e["ran_ip"].get(ran, "")
                          role = e["roles"].get(ip, ("?", ""))[0]
                          t0 = e["t0"].get(ip)
                          lab = "UE bénin" if role == "benin" else ("attaquant avant l'attaque" if t0 and t < t0 else "attaquant")
                          out[f"{e['scenario']} / {e['charge']} / {lab}"][n] += 1
              return {k: dict(sorted(v.items())) for k, v in out.items()}


          def ressources(essais):
