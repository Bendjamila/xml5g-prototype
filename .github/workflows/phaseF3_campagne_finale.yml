          #!/usr/bin/env python3
          """
          xML5G - phase 3 : comparaison des deux plans de détection (remarque M4 du rapport).

          Question : sur le MÊME trafic, un détecteur qui ne voit que la télémétrie RAN (rapports
          E2SM-KPM par UE, ce qu'une xApp « classique » reçoit) fait-il aussi bien qu'un détecteur
          du plan usager (paquets GTP-U au N3, notre choix) ?

          Comparaison à information égale :
            - mêmes essais (ceux où la xApp KPM a tourné, par défaut la politique « none », où
              l'attaquant reste attaché toute la durée de l'essai) ;
            - même granularité : la fenêtre de chaque rapport KPM (~1 s, imposée par la période KPM) ;
              les 15 variables du plan usager sont recalculées sur EXACTEMENT la même fenêtre, à
              partir du journal de paquets 68_pkt (même fonction que le détecteur déployé) ;
            - mêmes étiquettes : vérité terrain par ports d'attaque (UDP 5555, TCP 80), une fenêtre
              est « attaque » si elle contient du trafic d'attaque (règle du détecteur déployé) ;
            - même découpage : validation croisée par essai (un essai entier sort à chaque pli),
              même modèle (XGBoost, hyperparamètres de l'étude E1) et même règle de seuil que le
              détecteur déployé (F1 max sous 0,5 % de fausses alarmes, sur une validation tirée de
              l'entraînement).
          Trois modèles : plan usager seul, plan RAN seul, deux plans réunis ; plus, en référence,
          le détecteur réellement déployé (verdicts à 0,2 s, vote majoritaire sur la fenêtre).

          Entrées, par essai <RUN> d'un dossier de journaux :
            67_kpm_<RUN>.log      sortie horodatée de xapp_kpm_moni (horodater.py) ;
            60_xapp_<RUN>.log     lignes « MAP teid=.. ran_ue_id=.. kind=ul » (UE RAN -> tunnel) ;
            61_ids_<RUN>.log      verdicts « V t teid ip v score n [n_marques] » (tunnel -> adresse) ;
            68_pkt_<RUN>.csv.gz   chaque paquet montant vu au N3 ;
            62_ev_<RUN>.jsonl     début de l'attaque ; 63_ues_par_politique.txt : rôle de chaque adresse.
          Usage : m4_deux_plans.py [--out DOSSIER] DOSSIER [DOSSIER ...]
            (plusieurs dossiers = plusieurs lancements fusionnés, p. ex. les 4 artefacts udp/syn/multi/flash)
          Sorties : 70_m4_donnees.csv.gz, 70_m4_deux_plans.json, 70_m4_deux_plans.md
          """
          import argparse, bisect, csv, glob, gzip, json, math, os, re, sys
          from collections import defaultdict

          UP_FEATURES = ["n_pkts", "n_bytes", "mean_len", "std_len", "max_len",
                         "frac_tcp", "frac_udp", "frac_icmp", "frac_syn",
                         "n_dst_ports", "n_src_ports", "n_dst_ips",
                         "mean_iat", "std_iat", "frac_small"]
          RAN_MESURES = ["DRB.UEThpUl", "DRB.UEThpDl", "RRU.PrbTotUl", "RRU.PrbTotDl",
                         "DRB.PdcpSduVolumeUL", "DRB.PdcpSduVolumeDL", "DRB.RlcSduDelayDl"]
          # bornes physiques : au-delà, valeur faussée (compteurs OAI indexés par position de l'UE)
          BORNES = {"DRB.UEThpUl": (0, 1e6), "DRB.UEThpDl": (0, 1e6), "RRU.PrbTotUl": (0, 100),
                    "RRU.PrbTotDl": (0, 100), "DRB.PdcpSduVolumeUL": (0, 1e4), "DRB.PdcpSduVolumeDL": (0, 1e4),
                    "DRB.RlcSduDelayDl": (0, 1e8)}
          BUDGET_FPR = 0.005           # identique au détecteur déployé (train_xml5g.py)
          XGB_PARAMS = dict(n_estimators=250, max_depth=8, learning_rate=0.1, subsample=0.8,
                            colsample_bytree=0.8, random_state=42, eval_metric="logloss",
                            tree_method="hist", n_jobs=-1)
          SCEN = ("udp", "syn", "multi", "flash", "benin", "pulse50", "pulse60", "pulse70", "pulse80")


          def features(pkts):
              """Copie conforme de ids_xml5g.features (vérifiée par le test) ; pkts : (t, proto, lg, flags, sport, dport, dst, tos)."""
              n = len(pkts)
              lens = [q[2] for q in pkts]
              m = sum(lens) / n
              sd = math.sqrt(sum((x - m) ** 2 for x in lens) / n)
              ts = sorted(q[0] for q in pkts)
              iat = [b - a for a, b in zip(ts, ts[1:])] or [0.0]
              mi = sum(iat) / len(iat)
              si = math.sqrt(sum((x - mi) ** 2 for x in iat) / len(iat))
              tcp = sum(1 for q in pkts if q[1] == 6)
              syn = sum(1 for q in pkts if q[1] == 6 and (q[3] & 0x02) and not (q[3] & 0x10))
              return [n, sum(lens), m, sd, max(lens),
                      tcp / n, sum(1 for q in pkts if q[1] == 17) / n, sum(1 for q in pkts if q[1] == 1) / n, syn / n,
                      len({q[5] for q in pkts}), len({q[4] for q in pkts}), len({q[6] for q in pkts}),
                      mi, si, sum(1 for x in lens if x < 100) / n]


          # ---------------------------------------------------------------- lecture des journaux

          RE_ENTETE = re.compile(r"^\s*(\d+) KPM ind_msg latency = (-?\d+) \[")
          RE_UE = re.compile(r"^UE ID type = ([^,]+), \w+ = (\d+)")
          RE_RAN = re.compile(r"^ran_ue_id = ([0-9a-fA-F]+)\s*$")
          RE_MES = re.compile(r"^([A-Za-z0-9_.\-]+) = (-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?|-?nan|-?inf)(?: (.*))?$")
          NON_FIABLE = "Measurement Record not reliable"


          def lire_kpm(chemin):
              """Rapports KPM horodatés -> liste de dict(t_rx, t_gen, ues=[dict(ran, amf, mes, fiable)]).
              Ne garde que les rapports par UE (style 4) ; les rapports de niveau nœud (style 1) sont ignorés."""
              rapports, cour, ue = [], None, None
              with open(chemin, encoding="utf-8", errors="replace") as f:
                  for brut in f:
                      brut = brut.rstrip("\n")
                      tete, _, reste = brut.partition(" ")
                      try:
                          t = float(tete)
                      except ValueError:
                          continue                                   # ligne non horodatée (journal ancien)
                      m = RE_ENTETE.match(reste)
                      if m:
                          lat = int(m.group(2))
                          tg = t - lat / 1e6 if 0 <= lat < 5_000_000 else t
                          cour = dict(t_rx=t, t_gen=tg, ues=[])
                          rapports.append(cour)
                          ue = None
                          continue
                      if cour is None:
                          continue
                      fiable = True
                      while reste.startswith(NON_FIABLE):          # printf sans retour à la ligne dans la xApp
                          reste = reste[len(NON_FIABLE):]
                          fiable = False
                          if ue is not None:
                              ue["fiable"] = False
                      m = RE_UE.match(reste)
                      if m:
                          ue = dict(ran=None, amf=int(m.group(2)) if "gNB" == m.group(1).strip() else None,
                                    mes={}, fiable=True)
                          cour["ues"].append(ue)
                          continue
                      m = RE_RAN.match(reste)
                      if m and ue is not None:
                          ue["ran"] = int(m.group(1), 16)            # imprimé en hexadécimal par xapp_kpm_moni
                          continue
                      m = RE_MES.match(reste)
                      if m and ue is not None:
                          try:
                              ue["mes"][m.group(1)] = float(m.group(2))
                          except ValueError:
                              pass
                          if not fiable:
                              ue["fiable"] = False
              return [r for r in rapports if r["ues"]]


          def lire_map(chemin):
              """60_xapp : ran_ue_id -> TEID montants (8 bits de poids faible), amf_ue_ngap_id."""
              ul, amf = defaultdict(set), {}
              if not os.path.exists(chemin):
                  return ul, amf
              for l in open(chemin, encoding="utf-8", errors="replace"):
                  m = re.search(r"MAP teid=(\d+) ran_ue_id=(\d+) kind=ul", l)
                  if m:
                      ul[int(m.group(2))].add(int(m.group(1)) & 0xFF)
                  m = re.search(r"\] UE ran_ue_id=(\d+) amf_ue_ngap_id=(\d+)", l)
                  if m:
                      amf[int(m.group(1))] = int(m.group(2))
              return ul, amf


          def lire_verdicts(chemin):
              """61_ids : teid -> adresse, et verdicts (t_s, v) par teid."""
              ip, ver = {}, defaultdict(list)
              if not os.path.exists(chemin):
                  return ip, ver
              for l in open(chemin, encoding="utf-8", errors="replace"):
                  p = l.split()
                  if len(p) >= 6 and p[0] == "V":
                      try:
                          teid = int(p[2])
                          ip[teid] = p[3]
                          ver[teid].append((int(p[1]) / 1e6, int(p[4])))
                      except ValueError:
                          pass
              for k in ver:
                  ver[k].sort()
              return ip, ver


          def lire_paquets(chemin):
              """68_pkt : teid -> (temps triés, paquets) ; paquet = (t, proto, lg, flags, sport, dport, dst, tos)."""
              par = defaultdict(list)
              if not os.path.exists(chemin):
                  return {}
              with gzip.open(chemin, "rt") as f:
                  r = csv.reader(f)
                  tete = next(r, None)
                  if not tete:
                      return {}
                  a_dst = "dst" in tete
                  for p in r:
                      try:
                          q = (float(p[0]), int(p[2]), int(p[3]), int(p[4]), int(p[5]), int(p[6]),
                               p[8] if a_dst and len(p) > 8 else "?", int(p[7]))
                          par[int(p[1])].append(q)
                      except (ValueError, IndexError):
                          pass                                       # dernière ligne tronquée (arrêt brutal)
              res = {}
              for teid, l in par.items():
                  l.sort()
                  res[teid] = ([q[0] for q in l], l)
              return res


          def lire_roles(dossier):
              """63_ues_par_politique.txt : RUN -> {adresse: 'attaquant'|'benin'}."""
              roles = defaultdict(dict)
              f = os.path.join(dossier, "63_ues_par_politique.txt")
              if not os.path.exists(f):
                  return roles
              for l in open(f, encoding="utf-8", errors="replace"):
                  m = re.match(r"^(\S+) : attaquants=(\S*) b\S*nins=(\S*)", l.strip())
                  if not m:
                      continue
                  for grp, role in ((m.group(2), "attaquant"), (m.group(3), "benin")):
                      for x in grp.split(","):
                          if ":" in x:
                              roles[m.group(1)][x.split(":", 1)[1]] = role
              return roles


          def debuts_attaque(chemin):
              """62_ev : adresse -> heure de début de l'attaque."""
              d = {}
              if not os.path.exists(chemin):
                  return d
              txt = open(chemin, encoding="utf-8", errors="replace").read().strip()
              evs = []
              try:
                  x = json.loads(txt)
                  evs = x if isinstance(x, list) else [x]
              except ValueError:
                  for l in txt.splitlines():
                      try:
                          evs.append(json.loads(l))
                      except ValueError:
                          pass
              for e in evs:
                  if isinstance(e, dict) and not e.get("benign") and "start" in e and e.get("ip"):
                      d[e["ip"]] = min(float(e["start"]), d.get(e["ip"], float("inf")))
              return d


          def nom_essai(run):
              m = re.match(r"^(?P<pol>.+)_(?P<sc>" + "|".join(SCEN) + r")_r(?P<n>\d+)$", run)
              if m:
                  return m.group("pol"), m.group("sc")
              m = re.match(r"^(?P<pol>.+)_r(?P<n>\d+)$", run)
              return (m.group("pol") if m else run), ""


          # ---------------------------------------------------------------- construction du jeu de données

          def lignes_essai(dossier, run, verite, roles):
              """Une ligne par (UE, rapport KPM) : fenêtre, étiquette, 15 variables usager, 7 variables RAN."""
              diag = dict(dossier=os.path.basename(os.path.normpath(dossier)), essai=run, rapports_ue=0,
                          lignes=0, exclues=defaultdict(int), ue_sans_tunnel=[], amf_discordant=[])
              rap = lire_kpm(os.path.join(dossier, f"67_kpm_{run}.log"))
              diag["rapports_ue"] = len(rap)
              if not rap:
                  diag["probleme"] = "aucun rapport KPM par UE"
                  return [], diag
              ul, amf_x = lire_map(os.path.join(dossier, f"60_xapp_{run}.log"))
              ip_de, ver = lire_verdicts(os.path.join(dossier, f"61_ids_{run}.log"))
              pk = lire_paquets(os.path.join(dossier, f"68_pkt_{run}.csv.gz"))
              if not pk:
                  diag["probleme"] = "journal de paquets 68_pkt absent ou vide"
              deb = debuts_attaque(os.path.join(dossier, f"62_ev_{run}.jsonl"))
              pol, sc = nom_essai(run)
              teids_vus = set(pk) | set(ip_de)

              def teids(ran):
                  bas = ul.get(ran, set())
                  return sorted(t for t in teids_vus if (t & 0xFF) in bas)

              rap.sort(key=lambda r: r["t_gen"])
              pos_prec, t_prec, vus = {}, None, set()
              out = []
              for r in rap:
                  pos = {u["ran"]: i for i, u in enumerate(r["ues"])}
                  for i, u in enumerate(r["ues"]):
                      ran = u["ran"]
                      exclu = ""
                      if ran is None:
                          exclu = "ue_sans_identifiant"
                      elif ran not in vus:
                          exclu = "premier_rapport"                  # compteur OAI non initialisé
                      elif pos_prec.get(ran) != i:
                          exclu = "liste_ue_changee"                  # compteurs OAI indexés par position
                      elif t_prec is None or not 0.5 <= r["t_gen"] - t_prec <= 1.5:
                          exclu = "periode_irreguliere"
                      elif not u["fiable"]:
                          exclu = "mesure_non_fiable"
                      elif any(k in u["mes"] and not (BORNES[k][0] <= u["mes"][k] <= BORNES[k][1]) for k in BORNES):
                          exclu = "valeur_hors_bornes"
                      if ran is not None:
                          vus.add(ran)
                      a, b = (t_prec if t_prec is not None else r["t_gen"] - 1.0), r["t_gen"]
                      tl = teids(ran) if ran is not None else []
                      if ran is not None and not tl and not exclu:
                          exclu = "ue_sans_tunnel"
                          if ran not in diag["ue_sans_tunnel"]:
                              diag["ue_sans_tunnel"].append(ran)
                      if ran is not None and u["amf"] is not None and ran in amf_x and amf_x[ran] != u["amf"]:
                          if ran not in diag["amf_discordant"]:
                              diag["amf_discordant"].append(ran)
                          exclu = exclu or "amf_discordant"
                      paquets = []
                      for t in tl:
                          if t in pk:
                              ts, l = pk[t]
                              paquets += l[bisect.bisect_left(ts, a):bisect.bisect_left(ts, b)]
                      n = len(paquets)
                      nm = sum(1 for q in paquets if (q[1], q[5]) in verite)
                      fu = features(paquets) if n else [0.0] * len(UP_FEATURES)
                      vv = [v for t in tl for (tv, v) in ver.get(t, []) if a <= tv < b]
                      ip = next((ip_de[t] for t in tl if t in ip_de), "")
                      role = roles.get(run, {}).get(ip, "")
                      ligne = dict(dossier=diag["dossier"], essai=run, scenario=sc, politique=pol, ran_ue_id=ran,
                                   teids=" ".join(map(str, tl)), ip=ip, role=role, t_debut=round(a, 6), t_fin=round(b, 6),
                                   debut_attaque=deb.get(ip, ""), n_marques=nm,
                                   label=int(nm >= 1),
                                   up_deploye=int(len(vv) > 0 and sum(vv) * 2 >= len(vv)), n_verdicts_deploye=len(vv),
                                   exclu=exclu)
                      for k, x in zip(UP_FEATURES, fu):
                          ligne["up_" + k] = x
                      for k in RAN_MESURES:
                          ligne["ran_" + k] = u["mes"].get(k, float("nan"))
                      out.append(ligne)
                      if exclu:
                          diag["exclues"][exclu] += 1
                  pos_prec, t_prec = pos, r["t_gen"]
              diag["lignes"] = sum(1 for l in out if not l["exclu"])
              diag["exclues"] = dict(diag["exclues"])
              return out, diag


          # ---------------------------------------------------------------- apprentissage et mesures

          def modele():
              try:
                  from xgboost import XGBClassifier
                  return XGBClassifier(**XGB_PARAMS), "XGBoost"
              except ImportError:
                  from sklearn.ensemble import RandomForestClassifier
                  return RandomForestClassifier(n_estimators=250, max_depth=20, min_samples_leaf=2, n_jobs=-1,
                                                random_state=42), "RandomForest (repli : xgboost indisponible)"


          def seuil_sous_budget(y, p, budget=BUDGET_FPR):
              """Même règle que train_xml5g.py : F1 max parmi les seuils qui tiennent le budget de fausses alarmes."""
              import numpy as np
              from sklearn.metrics import roc_curve
              fv, tv, th = roc_curve(y, p, drop_intermediate=False)
              P = int(y.sum()); N = len(y) - P
              tp, fp = tv * P, fv * N
              f1 = np.divide(2 * tp, tp + fp + P, out=np.zeros_like(tp), where=(tp + fp + P) > 0)
              ok = np.where(fv <= budget)[0]
              if len(ok) == 0:
                  return float(th[np.argmax(tv - fv)])
              return float(min(th[ok[np.argmax(f1[ok])]], 1.0))


          def entrainer(X, y):
              import numpy as np
              from sklearn.model_selection import train_test_split
              if len(set(y)) < 2:
                  return None, None
              strat = y if min(np.bincount(y)) >= 2 else None
              i_fit, i_val = train_test_split(np.arange(len(y)), test_size=0.15, stratify=strat, random_state=42)
              if len(set(y[i_fit])) < 2 or len(set(y[i_val])) < 2:
                  i_fit = i_val = np.arange(len(y))
              m, _ = modele()
              m.fit(X[i_fit], y[i_fit])
              s = seuil_sous_budget(y[i_val], m.predict_proba(X[i_val])[:, 1])
              m, _ = modele()
              m.fit(X, y)
              return m, s


          def ic_exact(k, n):
              if not n:
                  return None
              try:
                  from scipy.stats import binomtest
                  c = binomtest(int(k), int(n)).proportion_ci(0.95)
                  return [round(c.low, 4), round(c.high, 4)]
              except Exception:
                  return None


          def mesures(y, yp, prob=None):
              tp = sum(1 for a, b in zip(y, yp) if a and b); fn = sum(1 for a, b in zip(y, yp) if a and not b)
              fp = sum(1 for a, b in zip(y, yp) if not a and b); tn = sum(1 for a, b in zip(y, yp) if not a and not b)
              d = dict(tp=tp, fp=fp, fn=fn, tn=tn,
                       detection=round(tp / (tp + fn), 4) if tp + fn else None, ic_detection=ic_exact(tp, tp + fn),
                       fpr=round(fp / (fp + tn), 4) if fp + tn else None, ic_fpr=ic_exact(fp, fp + tn),
                       precision=round(tp / (tp + fp), 4) if tp + fp else None,
                       f1=round(2 * tp / (2 * tp + fp + fn), 4) if tp + fp + fn else None)
              if prob is not None and 0 < sum(y) < len(y):
                  from sklearn.metrics import roc_auc_score
                  d["auc"] = round(float(roc_auc_score(y, prob)), 4)
              return d


          def delais(lignes, pred):
              """Délai début d'attaque -> fin de la première fenêtre détectée, par (essai, attaquant)."""
              par = defaultdict(list)
              for l, p in zip(lignes, pred):
                  if l["debut_attaque"] != "" and l["role"] != "benin":
                      par[(l["dossier"], l["essai"], l["ip"])].append((l["t_fin"], p, float(l["debut_attaque"])))
              res = []
              for k, v in par.items():
                  v.sort()
                  d0 = v[0][2]
                  t = next((tf for tf, p, _ in v if p and tf > d0), None)
                  res.append(None if t is None else round(t - d0, 2))
              ok = sorted(x for x in res if x is not None)
              return dict(attaquants=len(res), detectes=len(ok),
                          mediane_s=ok[len(ok) // 2] if ok else None, min_s=ok[0] if ok else None, max_s=ok[-1] if ok else None)


          def evaluer(lignes):
              import numpy as np
              ran_cols = [c for c in ["ran_" + k for k in RAN_MESURES] if all(not math.isnan(l[c]) for l in lignes)]
              plans = {"plan usager (N3, 15 variables)": ["up_" + k for k in UP_FEATURES],
                       f"plan RAN (KPM, {len(ran_cols)} mesures)": ran_cols,
                       "deux plans réunis": ["up_" + k for k in UP_FEATURES] + ran_cols}
              y = np.array([l["label"] for l in lignes], dtype=int)
              grp = [(l["dossier"], l["essai"]) for l in lignes]
              essais = sorted(set(grp))
              res = dict(essais=len(essais), lignes=len(lignes), lignes_attaque=int(y.sum()),
                         mesures_ran=[c[4:] for c in ran_cols], plis=None, modeles={}, reference={})
              _, algo = modele()
              res["algorithme"] = algo
              # référence : le détecteur déployé, sans réentraînement
              yd = [l["up_deploye"] for l in lignes]
              res.setdefault("_predictions", []).extend(
                  dict(modele="détecteur déployé", dossier=l["dossier"], essai=l["essai"], scenario=l["scenario"], label=int(a_),
                       prob=float(b_), pred=int(b_), ip=l["ip"], role=l["role"], t_fin=l["t_fin"], debut=l["debut_attaque"])
                  for l, a_, b_ in zip(lignes, y.tolist(), yd))
              res["reference"]["détecteur déployé (0,2 s, vote majoritaire sur la fenêtre)"] = dict(
                  global_=mesures(y, yd), par_scenario=par_scenario(lignes, y, yd), delai=delais(lignes, yd))
              pos_par_essai = defaultdict(int)
              for g, v in zip(grp, y):
                  pos_par_essai[g] += int(v)
              if len(essais) < 2 or sum(1 for g in essais if pos_par_essai[g]) < 2 or not 0 < y.sum() < len(y):
                  res["probleme"] = ("pas assez d'essais pour une validation croisée par essai (il faut au moins deux "
                                     "essais avec attaque) : la chaîne est vérifiée, la comparaison demande la campagne")
                  return res
              if len(essais) <= 25:
                  plis = [[i for i, g in enumerate(grp) if g == e] for e in essais]
                  res["plis"] = "un essai sorti par pli (leave-one-run-out)"
              else:
                  from sklearn.model_selection import GroupKFold
                  gid = [essais.index(g) for g in grp]
                  plis = [list(te) for _, te in GroupKFold(n_splits=10).split(np.zeros(len(y)), y, gid)]
                  res["plis"] = "10 plis par groupes d'essais (GroupKFold)"
              for nom, cols in plans.items():
                  if not cols:
                      res["modeles"][nom] = dict(probleme="aucune mesure disponible")
                      continue
                  X = np.array([[float(l[c]) for c in cols] for l in lignes])
                  prob = np.full(len(y), np.nan); pred = np.zeros(len(y), dtype=int); sautes = 0
                  for te in plis:
                      tr = np.setdiff1d(np.arange(len(y)), te)
                      m, s = entrainer(X[tr], y[tr])
                      if m is None:
                          sautes += 1
                          continue
                      p = m.predict_proba(X[te])[:, 1]
                      prob[te] = p; pred[te] = (p >= s).astype(int)
                  ok = ~np.isnan(prob)
                  ll = [l for l, o in zip(lignes, ok) if o]
                  # prédictions hors pli, pour les intervalles par bootstrap en grappes et le test apparié (analyse_partie_b.py)
                  res.setdefault("_predictions", []).extend(
                      dict(modele=nom, dossier=l["dossier"], essai=l["essai"], scenario=l["scenario"], label=int(a_),
                           prob=round(float(pp), 6), pred=int(b_), ip=l["ip"], role=l["role"], t_fin=l["t_fin"], debut=l["debut_attaque"])
                      for l, a_, pp, b_ in zip(ll, y[ok].tolist(), prob[ok].tolist(), pred[ok].tolist()))
                  r = dict(global_=mesures(y[ok].tolist(), pred[ok].tolist(), prob[ok]),
                           par_scenario=par_scenario(ll, y[ok].tolist(), pred[ok].tolist()),
                           delai=delais(ll, pred[ok].tolist()), plis_sautes=sautes,
                           detection_par_essai=det_par_essai(ll, y[ok].tolist(), pred[ok].tolist()))
                  m, _ = entrainer(X, y)
                  if m is not None and hasattr(m, "feature_importances_"):
                      imp = sorted(zip(cols, m.feature_importances_), key=lambda x: -x[1])[:5]
                      r["variables_principales"] = [[c.split("_", 1)[1], round(float(v), 3)] for c, v in imp]
                  res["modeles"][nom] = r
              return res


          def par_scenario(lignes, y, yp):
              d = defaultdict(lambda: ([], []))
              for l, a, b in zip(lignes, y, yp):
                  d[l["scenario"] or "?"][0].append(a); d[l["scenario"] or "?"][1].append(b)
              return {k: mesures(a, b) for k, (a, b) in sorted(d.items())}


          def det_par_essai(lignes, y, yp):
              d = defaultdict(lambda: [0, 0])
              for l, a, b in zip(lignes, y, yp):
                  if a:
                      d[(l["dossier"], l["essai"])][0] += 1; d[(l["dossier"], l["essai"])][1] += int(b)
              v = [b / a for a, b in d.values() if a]
              return dict(min=round(min(v), 3), max=round(max(v), 3), essais=len(v)) if v else None


          # ---------------------------------------------------------------- rapport

          def pct(x):
              return "—" if x is None else f"{100 * x:.1f} %"


          def ic(c):
              return "" if not c else f" [{100 * c[0]:.1f}; {100 * c[1]:.1f}]"


          def rapport_md(res, diags):
              L = ["## M4 — détection sur le plan usager contre le plan RAN (même trafic)", ""]
              n_ok = sum(d["lignes"] for d in diags)
              L.append(f"Essais avec rapports KPM : {sum(1 for d in diags if d['rapports_ue'])} sur {len(diags)} ; "
                       f"fenêtres UE utilisables : {n_ok} (dont {res.get('lignes_attaque', 0)} « attaque »).")
              exc = defaultdict(int)
              for d in diags:
                  for k, v in d["exclues"].items():
                      exc[k] += v
              if exc:
                  L.append("Fenêtres écartées : " + ", ".join(f"{k} {v}" for k, v in sorted(exc.items())) + ".")
              pb = [f"{d['essai']} : {d['probleme']}" for d in diags if d.get("probleme")]
              if pb:
                  L.append("Essais sans données exploitables : " + " ; ".join(pb) + ".")
              if res.get("mesures_ran"):
                  L.append("Mesures KPM utilisées : " + ", ".join(res["mesures_ran"]) + ".")
              L.append("")
              if res.get("probleme"):
                  L += [f"**Comparaison non calculée :** {res['probleme']}.", ""]
              if res.get("plis"):
                  L.append(f"Validation : {res['plis']} ; {res.get('algorithme', '')}, seuil réglé comme le détecteur "
                           f"déployé (F1 max sous {BUDGET_FPR:.1%} de fausses alarmes). Granularité commune : la fenêtre "
                           "de chaque rapport KPM (~1 s). IC exacts à 95 % ; les fenêtres d'un même essai ne sont pas "
                           "indépendantes, ces IC sont donc optimistes.")
                  L.append("")
              lignes = list(res.get("modeles", {}).items()) + list(res.get("reference", {}).items())
              if lignes:
                  L += ["| Détecteur | Détection [IC 95 %] | Fausses alarmes [IC 95 %] | F1 | AUC | Délai médian (attaquants détectés) |",
                        "|---|---|---|---|---|---|"]
                  for nom, r in lignes:
                      if "global_" not in r:
                          L.append(f"| {nom} | — | — | — | — | {r.get('probleme', '')} |"); continue
                      g, dl = r["global_"], r["delai"]
                      f1txt = "—" if g["f1"] is None else f"{g['f1']:.3f}"
                      dtxt = "—" if dl["mediane_s"] is None else f"{dl['mediane_s']:.1f} s ({dl['detectes']}/{dl['attaquants']})"
                      L.append(f"| {nom} | {pct(g['detection'])}{ic(g['ic_detection'])} | {pct(g['fpr'])}{ic(g['ic_fpr'])} | "
                               f"{f1txt} | {g.get('auc', '—')} | {dtxt} |")
                  L.append("")
                  scen = sorted({s for _, r in lignes if "par_scenario" in r for s in r["par_scenario"]})
                  if len(scen) > 1 or (scen and scen[0] == "flash"):
                      L += ["Par scénario (détection / fausses alarmes) :", "",
                            "| Détecteur | " + " | ".join(scen) + " |", "|---|" + "---|" * len(scen)]
                      for nom, r in lignes:
                          if "par_scenario" not in r:
                              continue
                          c = [f"{pct(r['par_scenario'][s]['detection'])} / {pct(r['par_scenario'][s]['fpr'])}"
                               if s in r["par_scenario"] else "—" for s in scen]
                          L.append(f"| {nom} | " + " | ".join(c) + " |")
                      L.append("")
                  for nom, r in res.get("modeles", {}).items():
                      if r.get("variables_principales"):
                          L.append(f"- {nom}, variables principales : " +
                                   ", ".join(f"{c} ({v})" for c, v in r["variables_principales"]))
                  L.append("")
              return "\n".join(L)


          def main():
              ap = argparse.ArgumentParser(description=__doc__.split("\n")[1])
              ap.add_argument("dossiers", nargs="*")
              ap.add_argument("--out", default="")
              ap.add_argument("--verite", default="udp:5555,tcp:80")
              a = ap.parse_args()
              dossiers = a.dossiers or [os.environ.get("LOGS", ".")]
              out = a.out or dossiers[0]
              PROTO = {"udp": 17, "tcp": 6}
              verite = {(PROTO[x.split(":")[0]], int(x.split(":")[1])) for x in a.verite.split(",") if ":" in x}
              lignes, diags = [], []
              for d in dossiers:
                  roles = lire_roles(d)
                  invalides = set()
                  if os.path.exists(os.path.join(d, "63_validite.txt")):
                      invalides = {l.split()[0] for l in open(os.path.join(d, "63_validite.txt"), errors="replace")
                                   if len(l.split()) >= 2 and l.split()[1] != "valide"}
                  for f in sorted(glob.glob(os.path.join(d, "67_kpm_*.log"))):
                      run = os.path.basename(f)[len("67_kpm_"):-len(".log")]
                      if run in invalides:
                          continue
                      l, dg = lignes_essai(d, run, verite, roles)
                      lignes += l; diags.append(dg)
              utiles = [l for l in lignes if not l["exclu"]]
              if not diags:
                  res = dict(probleme="aucun journal 67_kpm_*.log : la xApp KPM n'a tourné dans aucun essai")
              else:
                  res = evaluer(utiles) if utiles else dict(probleme="aucune fenêtre KPM appariée à un tunnel du plan usager")
              res["diagnostic"] = [dict(d, exclues=d["exclues"]) for d in diags]
              os.makedirs(out, exist_ok=True)
              preds = res.pop("_predictions", None)
              if preds:
                  with gzip.open(os.path.join(out, "70_m4_predictions.csv.gz"), "wt", newline="") as f:
                      w = csv.DictWriter(f, fieldnames=list(preds[0].keys()))
