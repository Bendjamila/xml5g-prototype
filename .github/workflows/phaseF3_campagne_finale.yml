          attendu=$(awk '{print $1; exit}' /home/runner/detecteur/model.sha256)
          obtenu=$(sha256sum "$WORK/model.joblib" | awk '{print $1}')
          echo "modèle figé : empreinte attendue $attendu, obtenue $obtenu" | tee "$LOGS/03_modele_verifie.txt"
          [ -n "$attendu" ] && [ "$attendu" = "$obtenu" ] || { echo "::error::modèle figé absent ou différent de celui du job detecteur"; exit 1; }
          cp /home/runner/detecteur/50_train_metrics.json "$LOGS/50_train_metrics.json"
          echo '${{ toJSON(matrix) }}' > "$LOGS/63_tranche.json"
      - name: 5. Compiler OAI — environ 8 min
        run: |

          cd "$WORK/oai/cmake_targets"
          ./build_oai -I > "$LOGS/04_oai_dep.log" 2>&1 || { tail -40 "$LOGS/04_oai_dep.log"; exit 1; }
          ./build_oai -w SIMU --gNB --nrUE --build-e2 --cmake-opt -DE2AP_VERSION=E2AP_V3 --cmake-opt -DKPM_VERSION=KPM_V3_00 --ninja > "$LOGS/05_oai.log" 2>&1 || { tail -60 "$LOGS/05_oai.log"; exit 1; }
          ls ran_build/build/nr-softmodem ran_build/build/nr-uesoftmodem
          echo "oai_compile=ok" >> "$LOGS/09_etapes.txt"
      - name: 6. Compiler FlexRIC, le RIC et les deux xApps
        run: |

          sudo apt-get install -y -q libpcre2-dev libsctp-dev > /dev/null
          cd "$WORK/oai/openair2/E2AP/flexric" && mkdir -p build && cd build
          cmake -GNinja -DE2AP_VERSION=E2AP_V3 -DKPM_VERSION=KPM_V3_00 -DCMAKE_BUILD_TYPE=Release .. > "$LOGS/06_fr_cmake.log" 2>&1
          ninja -j"$(nproc)" > "$LOGS/07_fr.log" 2>&1 || { tail -50 "$LOGS/07_fr.log"; exit 1; }
          sudo ninja install > /dev/null 2>&1
          SM_DIR="$(dirname "$(find /usr/local -name librc_sm.so | head -1)")"; echo "SM_DIR=$SM_DIR" >> "$GITHUB_ENV"
          FR_CONF="$(find /usr/local/etc -name flexric.conf | head -1)"; echo "FR_CONF=${FR_CONF:-$WORK/oai/openair2/E2AP/flexric/flexric.conf}" >> "$GITHUB_ENV"
          ls examples/ric/nearRT-RIC examples/xApp/c/rc_release/xapp_rc_release examples/xApp/c/xapp_xml5g/xapp_xml5g examples/xApp/c/monitor/xapp_kpm_moni
          echo "flexric_compile=ok" >> "$LOGS/09_etapes.txt"
      - name: 7. Démarrer le cœur 5G, le RIC et le gNB (profil radio du détecteur)
        continue-on-error: true
        env:
          SANS_UES: "oui"
        run: bash "$WORK/py/plateforme.sh"
      - name: 8. Essais de la tranche
        continue-on-error: true
        run: bash "$WORK/py/campagne.sh"
      - name: 9. Bilan de la tranche
        if: always()
        run: |
          ( set +e +o pipefail; . "$WORK/py/coeur.sh"; etat_coeur fin ) || true
          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g" 2>/dev/null && for c in oai-amf oai-smf oai-nrf; do docker logs "$c" > "$LOGS/40_$c.log" 2>&1 || true; done
          # L'UPF journalise chaque paquet montant (« Upstream IP is ... ») : on garde un résumé
          # en paquets par seconde et par UE (preuve de la coupure), et le journal sans ces lignes.
          { cat "$LOGS"/41_oai-upf_avant_*.log 2>/dev/null || true; docker logs oai-upf 2>&1; } | grep -F "Upstream IP is" | awk '{t=substr($2,1,8); c[$1" "t" "$NF]++} END{for(k in c) print k, c[k]}' | tr -d '[]' | sort > "$LOGS/40_upf_pps.txt" || true
          docker logs oai-upf 2>&1 | grep -vF " IP is " > "$LOGS/40_oai-upf.log" || true
          for f in "$LOGS"/41_oai-upf_avant_*.log; do [ -f "$f" ] || continue; grep -vF " IP is " "$f" > "$f.tmp" || true; mv "$f.tmp" "$f"; done
          sudo chmod -R a+r "$LOGS" || true
          # M4 : plan usager contre plan RAN, sur les essais où les KPM ont été enregistrés
          python3 "$WORK/py/analyse_partie_b.py" --out "$LOGS/bilan_tranche" "$LOGS" --detecteur "$LOGS/50_train_metrics.json" > "$LOGS/bilan_tranche.log" 2>&1 || echo "::warning::bilan de la tranche : voir bilan_tranche.log"
          if [ -s "$LOGS/bilan_tranche/B_rapport.md" ]; then sed -n "1,40p" "$LOGS/bilan_tranche/B_rapport.md" >> "$GITHUB_STEP_SUMMARY"; fi
          sudo chmod -R a+r "$LOGS" || true
      - name: 10. Journaux de la tranche (artefact au nom unique)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-p3f-${{ matrix.id }}
          path: /home/runner/xml5g-journaux
          retention-days: 90

  analyse:
    needs: [plan, essais]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: 1. Dépendances
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q python3-scipy python3-sklearn python3-pandas python3-joblib python3-matplotlib > /dev/null
      - name: 2. Tranches de cette exécution
        uses: actions/download-artifact@v4
        with:
          pattern: xml5g-p3f-*
          path: campagne
      - name: 3. Détecteur figé (s'il vient d'une autre exécution) et tranches à fusionner
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs_a_fusionner }}
          DET_RUN: ${{ needs.plan.outputs.detecteur_run }}
        run: |
          if [ ! -d campagne/xml5g-p3f-detecteur ]; then
            gh run download "$DET_RUN" -R "$GITHUB_REPOSITORY" -n xml5g-p3f-detecteur -D campagne/xml5g-p3f-detecteur
          fi
          for r in $RUNS; do
            gh run download "$r" -R "$GITHUB_REPOSITORY" -p 'xml5g-p3f-E*' -D "campagne/execution_$r" || echo "::warning::exécution $r : tranches non récupérées"
          done
          find campagne -maxdepth 3 -name 63_validite.txt | sort
      - name: 4. Analyses de la partie B et comparaison des deux plans
        run: |
          D=campagne/xml5g-p3f-detecteur
          mkdir -p outils resultats && tar xzf "$D/xml5g-sources.tgz" -C outils
          v=$(awk '$1=="xgboost"{print $2}' "$D/01_python.txt" 2>/dev/null | tail -1 || true)
          sudo pip3 install --break-system-packages --no-deps -q "xgboost${v:+==$v}" || true
          KPM_DIRS=$(find campagne -name '67_kpm_*.log' -printf '%h\n' | sort -u)
          if [ -n "$KPM_DIRS" ]; then
            python3 outils/py/m4_deux_plans.py --out resultats/m4 $KPM_DIRS > resultats/m4.log 2>&1 || echo "::warning::m4 : voir m4.log"
          fi
          code=0
          python3 outils/py/analyse_partie_b.py --out resultats --m4 resultats/m4 --detecteur "$D/50_train_metrics.json" campagne > resultats/analyse.log 2>&1 || code=$?
          cp campagne/xml5g-p3f-plan/63_plan.json resultats/ 2>/dev/null || true
          { echo "## Résultats de la campagne (partie B)"; echo; cat resultats/B_rapport.md; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -s resultats/m4/70_m4_deux_plans.md ]; then cat resultats/m4/70_m4_deux_plans.md >> "$GITHUB_STEP_SUMMARY"; fi
          tail -20 resultats/analyse.log || true
          exit $code
      - name: 5. Archive complète (journaux de toutes les tranches et résultats)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-campagne-finale-complete-${{ github.run_id }}
          path: |
            campagne
            resultats
          retention-days: 90
