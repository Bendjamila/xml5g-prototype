          #!/usr/bin/env python3
          # xML5G phase 3 — bilan statistique par SCÉNARIO et par POLITIQUE (réponse au rapport d'expertise).
          # Reprend bilan3 et ajoute : les politiques tsourdinis, throttle, xml5g_persist et xml5g_filtre ;
          # la détection par verdict mesurée sur la VÉRITÉ TERRAIN (champ n_marques) ; le réattachement après
          # libération ; les intervalles sautés par le détecteur (charge). Les rapports KPM (remarque M4) sont
          # exploités à part, par m4_deux_plans.py.
          # Remarque 1 (IC 95 %, tests), remarque 2 (alternatives + qualité de service de l'UE bénin),
          # remarques 4 et 18 (CPU et mémoire de l'xApp et du détecteur).
          # Toute vérification exige que la boucle ait réellement fonctionné ; aucune réussite par défaut.
          import os, re, json, csv, math, glob, statistics as st

          L = os.environ.get("LOGS", "logs")
          POLS = os.environ.get("XML5G_POLS", "xml5g xml5g_filtre tsourdinis throttle xml5g_persist immediate slice none").split()
          NOMS = {"xml5g": "xML5G", "xml5g_filtre": "xML5G + filtre", "tsourdinis": "Tsourdinis", "throttle": "xML5G throttle",
                  "xml5g_persist": "xML5G persist", "immediate": "Immediate", "slice": "Slice-wide", "none": "No action"}
          # scénarios d'attaque : lus dans le nom de l'essai si présent (ex. xml5g_udp_r1), sinon « udp »
          import collections

          def lire(n):
              p = os.path.join(L, n)
              return open(p, errors="replace").read() if os.path.exists(p) else ""
          def js(n):
              try: return json.load(open(os.path.join(L, n)))
              except Exception: return {}
          def moy_ic(v):
              """moyenne, écart-type, demi-largeur IC 95 % (Student) ; None si vide."""
              v = [x for x in v if x is not None and not (isinstance(x, float) and math.isnan(x))]
              if not v: return None, None, None, 0
              m = st.mean(v)
              if len(v) < 2: return m, None, None, 1
              s = st.stdev(v)
              try:
                  from scipy.stats import t
                  h = t.ppf(0.975, len(v) - 1) * s / math.sqrt(len(v))
              except Exception:
                  h = None
              return m, s, h, len(v)
          def fmt(m, s=None, h=None, u="", d=2):
              if m is None: return "—"
              r = f"{m:.{d}f}"
              if s is not None: r += f" ± {s:.{d}f}"
              if h is not None: r += f" [IC95 ±{h:.{d}f}]"
              return r + u

          etat = {}
          for l in lire("09_etapes.txt").splitlines():
              if "=" in l:
                  k, v = l.split("=", 1); etat[k.strip()] = v.strip()
          train = js("50_train_metrics.json")

          # ---------- paquets par seconde à l'UPF (journal agrégé), heure du conteneur -> UTC ----------
          UPF = {}
          tz = etat.get("upf_tz", "+0000")
          try:
              off = (1 if tz[0] == "+" else -1) * (int(tz[1:3]) * 3600 + int(tz[3:5]) * 60)
          except Exception:
              off = 0
          if os.path.exists(os.path.join(L, "40_upf_pps.txt")):
              import datetime as dt
              for l in open(os.path.join(L, "40_upf_pps.txt")):
                  f = l.split()
                  if len(f) != 4: continue
                  try:
                      ts = dt.datetime.strptime(f"{f[0]} {f[1]}", "%Y-%m-%d %H:%M:%S").replace(tzinfo=dt.timezone.utc).timestamp() - off
                      ip = ".".join(map(str, int(f[2], 16).to_bytes(4, "little")))
                      UPF.setdefault(ip, {})[int(ts)] = UPF.setdefault(ip, {}).get(int(ts), 0) + int(f[3])
                  except Exception:
                      pass

          # validité des essais : écrite par le workflow (attaquant et UE bénin en service, attaque lancée)
          VALIDITE = {}
          for l in lire("63_validite.txt").splitlines():
              f = l.split()
              if len(f) >= 2: VALIDITE[f[0]] = (f[1] == "valide", " ".join(f[2:]))
          # UE de chaque essai. Deux formats : « RUN : ue1:ip,ue2:ip » (__9_) et, en phase 3,
          # « RUN : attaquants=ue1:ip bénins=ue2:ip,ue3:ip ». BENINS_RUN garde l'ordre des UE bénins : le premier est
          # l'UE bénin de référence, celui dont scenario.py mesure le débit et le RTT.
          UES_RUN, BENINS_RUN = {}, {}
          for l in lire("63_ues_par_politique.txt").splitlines():
              run, _, v = l.partition(" : ")
              UES_RUN[run.strip()] = dict(re.findall(r"(ue\d+):(\d+(?:\.\d+){3})", v))
              mb = re.search(r"b\S*nins=(\S*)", v)
              if mb:
                  BENINS_RUN[run.strip()] = re.findall(r"(ue\d+):", mb.group(1))
          def upf_pps(ip, t0, a, b):
              """paquets montants par seconde de l'UE à l'UPF, en moyenne sur [t0+a, t0+b) (secondes sans paquet = 0)."""
              ser = UPF.get(ip, {})
              if not ser or b <= a: return None
              ks = range(int(t0 + a), int(t0 + b))
              return st.mean(ser.get(k, 0) for k in ks) if len(ks) else None

          RE_REL = re.compile(r"RELEASE ran_ue_id=(\d+) policy=\S+ t_first_alarm_rx_us=(\d+) t_decision_us=(\d+) "
                              r"t_ctrl_send_us=(\d+) t_ctrl_ack_us=(\d+) result=(\w+)")
          RE_SUM = re.compile(r"SUMMARY ran_ue_id=(\d+) verdicts=(\d+) alarms=(\d+) released=(\d)")
          RE_MAP = re.compile(r"MAP teid=(\d+) ran_ue_id=(\d+) kind=ul")

          def rtt(fichier, t0, a, b):
              """médiane du RTT (ms) et part de sondes répondues dans [t0+a, t0+b)."""
              rep, seqs = [], []
              for l in lire(fichier).splitlines():
                  m = re.match(r"\[(\d+\.\d+)\].*icmp_seq=(\d+).*time=([\d.]+) ms", l)
                  if m:
                      t = float(m.group(1)) - t0
                      if a <= t < b:
                          rep.append(float(m.group(3)))
              n_att = max(int((b - a) / 0.2), 1)
              return (st.median(rep) if rep else None), min(len(rep) / n_att, 1.0)

          def iperf(fichier, t0, a, b):
              """débit reçu (Mbit/s) et pertes (%) de l'UE, côté serveur, dans [t0+a, t0+b)."""
              txt = lire(fichier); dec = json.JSONDecoder(); i = 0; bps, perte = [], []
              while i < len(txt):
                  j = txt.find("{", i)
                  if j < 0: break
                  try:
                      o, i = dec.raw_decode(txt, j)
                  except Exception:
                      i = j + 1; continue
                  ts = o.get("start", {}).get("timestamp", {}).get("timesecs")
                  if ts is None: continue
                  for iv in o.get("intervals", []):
                      s_ = iv.get("sum", {}); tc = ts + s_.get("start", 0) - t0
                      if a <= tc < b:
                          bps.append(s_.get("bits_per_second", 0) / 1e6)
                          if "lost_percent" in s_: perte.append(s_["lost_percent"])
              return (st.mean(bps) if bps else None), (st.mean(perte) if perte else None)

          def pidstat(fichier):
              """%CPU moyen et RSS max (Mo) par commande."""
              res, hdr = {}, None
              for l in lire(fichier).splitlines():
                  if l.startswith("#"):
                      hdr = l[1:].split(); continue
                  f = l.split()
                  if not hdr or len(f) != len(hdr): continue
                  d = dict(zip(hdr, f)); c = d.get("Command", "?")
                  try:
                      r = res.setdefault(c, {"cpu": [], "rss": []})
                      r["cpu"].append(float(d["%CPU"])); r["rss"].append(float(d["RSS"]) / 1024)
                  except Exception:
                      pass
              return {c: (st.mean(v["cpu"]), max(v["rss"])) for c, v in res.items() if v["cpu"]}

          def run(pol, r, scen=""):
              R = f"{pol}_{scen}_r{r}" if scen else f"{pol}_r{r}"
              x = lire(f"60_xapp_{R}.log")
              if not x: return None
              s = js(f"61_ids_{R}_summary.json")
              ev = []
              for l in lire(f"62_ev_{R}.jsonl").splitlines():
                  try:
                      j = json.loads(l)
                  except ValueError:
                      continue
                  ev += [d for d in (j if isinstance(j, list) else [j]) if isinstance(d, dict) and not d.get("benign")]
              e = ev[0] if ev else None          # premier attaquant : référence des délais
              ul = {int(t): u for t, u in RE_MAP.findall(x)}

              def ue_de(ip):
                  for teid, d in (s or {}).items():
                      if teid != "_boucle" and isinstance(d, dict) and d.get("ip") == ip and (int(teid) & 0xFF) in ul:
                          return ul[int(teid) & 0xFF]
                  return None
              atk_ue = ue_de(e["ip"]) if e else None
              atk_tous = {u for u in (ue_de(d["ip"]) for d in ev) if u is not None}   # scénario multi : tous les attaquants
              summ = {u: dict(v=int(v), a=int(al)) for u, v, al, _ in RE_SUM.findall(x)}
              o_throttle = [m for m in re.findall(r"THROTTLE ran_ue_id=(\d+) ip=(\S+) .* result=(-?\d+)", x)]
              o_persist = [m for m in re.findall(r"PERSIST ran_ue_id=(\d+) ip=(\S+) .* result=(-?\d+)", x)]
              mm = re.search(r"unmapped_verdicts=(\d+)", x)
              o = dict(politique=pol, scenario=scen or "udp", rep=r, verdicts=sum(v["v"] for v in summ.values()),
                       non_associes=int(mm.group(1)) if mm else None, attaquant_libere=0, benins_liberes=0,
                       n_attaquants=len(ev), attaquants_liberes=0, liberations_avant_attaque=0,
                       alarme_vers_commande_ms=None, decision_vers_ack_ms=None, debut_vers_liberation_s=None,
                       debut_vers_1re_alarme_s=None, debut_vers_flood_upf_s=None,
                       regle_sur_attaquant=0, regle_sur_benins=0,
                       det_par_verdict=None, fp_par_verdict=None, n_verdicts_benins=0,
                       rtt_benin_avant_ms=None, rtt_benin_attaque_ms=None, rtt_benin_apres_ms=None, rep_benin_attaque=None,
                       pps_benin_avant=None, pps_benin_attaque=None, pps_benin_apres=None, ratio_pps_benin=None,
                       debit_benin_avant=None, debit_benin_attaque=None, debit_benin_apres=None, perte_benin_attaque=None)
              if not e:   # scénario sans attaque (flash crowd bénin) : toute libération est une fausse libération
                  o["benins_liberes"] = sum(1 for *_, res in RE_REL.findall(x) if res == "ACK")
                  o["regle_sur_benins"] = len(re.findall(r"WOULD_RELEASE ran_ue_id=(\d+)", x))
                  o["n_throttle"] = len(o_throttle)
                  return o
              t0 = e["start"]; fin = e["end"] - t0
              debut_ue = {}
              for d in ev:
                  u_ = ue_de(d["ip"])
                  if u_ is not None:
                      debut_ue[u_] = min(float(d["start"]), debut_ue.get(u_, float("inf")))
              alarme_avant = None        # 1re alarme de la xApp antérieure au début de l'attaque (fausse alarme)
              se_att = None
              for u, al, dec, se, ak, res in RE_REL.findall(x):
                  if res != "ACK": continue
                  if u in atk_tous and int(ak) / 1e6 < debut_ue.get(u, t0):
                      # coupé AVANT le début de son attaque : l'UE était encore bénin, c'est une fausse coupure
                      o["liberations_avant_attaque"] += 1
                      o["benins_liberes"] += 1
                      continue
                  if u in atk_tous:
                      o["attaquants_liberes"] += 1
                  if atk_ue is not None and u == atk_ue:
                      o["attaquant_libere"] = 1
                      se_att = int(se)
                      if int(al) and int(al) / 1e6 < t0:
                          alarme_avant = int(al)       # remplacée plus bas par la 1re alarme pendant l'attaque
                      o["alarme_vers_commande_ms"] = round((int(se) - int(al)) / 1e3, 1) if int(al) else None
                      o["decision_vers_ack_ms"] = round((int(ak) - int(dec)) / 1e3, 2)
                      o["debut_vers_liberation_s"] = round(int(ak) / 1e6 - t0, 2)
                      o["debut_vers_1re_alarme_s"] = round(int(al) / 1e6 - t0, 2) if int(al) else None
                  elif u not in atk_tous:
                      o["benins_liberes"] += 1
              for u in re.findall(r"WOULD_RELEASE ran_ue_id=(\d+)", x):
                  if atk_ue is not None and u == atk_ue: o["regle_sur_attaquant"] = 1
                  elif u not in atk_tous: o["regle_sur_benins"] += 1
              # verdicts du détecteur : attaquant dans la fenêtre d'attaque, UE bénin partout
              a_n = a_p = b_n = b_p = 0; t_al = None
              for l in lire(f"61_ids_{R}.log").splitlines():
                  f = l.split()
                  if len(f) < 6 or f[0] != "V": continue
                  t, ip, v = int(f[1]) / 1e6 - t0, f[3], int(f[4])
                  gt = len(f) >= 8                               # 8e champ n_marques = vérité terrain présente
                  nm = int(f[7]) if gt else 0; npk = int(f[6]) if len(f) >= 7 else 0
                  if gt:                                         # étiquetage par vérité terrain (M6, non circulaire)
                      if nm >= 1:                                # l'intervalle contient du trafic d'attaque
                          a_n += 1; a_p += v
                          if v and t >= 0 and t_al is None: t_al = t
                      else:
                          b_n += 1; b_p += v
                  else:                                          # anciens journaux : fenêtre d'attaque
                      if ip == e["ip"]:
                          if 0 <= t <= fin: a_n += 1; a_p += v
                          if v and t >= 0 and t_al is None: t_al = t
                      else:
                          b_n += 1; b_p += v
              o["det_par_verdict"] = a_p / a_n if a_n else None  # sur la vérité terrain si n_marques présent
              o["fp_par_verdict"] = b_p / b_n if b_n else None
              o["n_verdicts_benins"] = b_n
              o["n_throttle"] = len(o_throttle); o["throttle_ok"] = sum(1 for *_, r in o_throttle if r == "0")
              o["n_persist"] = len(o_persist); o["persist_ok"] = sum(1 for *_, r in o_persist if r == "0")
              # réattachement de l'attaquant après libération : il réapparaît à l'UPF (journal pps) après la coupure
              if o.get("debut_vers_liberation_s") is not None:
                  ser = UPF.get(e["ip"], {}); tl = int(t0 + o["debut_vers_liberation_s"])
                  reatt = next((k - tl for k in sorted(ser) if k > tl + 1 and ser[k] > 0), None)
                  o["reattachement_s"] = reatt
              # intervalles sautés par le détecteur (charge machine, remarque M11)
              boucle = (s or {}).get("_boucle", {})
              o["intervalles_sautes"] = boucle.get("intervalles_sautes")
              o["min_pkts"] = boucle.get("min_pkts")
              if o["debut_vers_1re_alarme_s"] is None and t_al is not None:
                  o["debut_vers_1re_alarme_s"] = round(t_al, 2)
              if alarme_avant is not None:
                  # la 1re alarme de la xApp précédait l'attaque : on mesure à partir de la 1re alarme PENDANT l'attaque
                  o["alarmes_avant_attaque"] = 1
                  o["debut_vers_1re_alarme_s"] = round(t_al, 2) if t_al is not None else None
                  o["alarme_vers_commande_ms"] = round((se_att / 1e6 - (t0 + t_al)) * 1e3, 1) if t_al is not None else None
              # arrivée du flood à l'UPF : première seconde >= 5 fois le débit médian d'avant l'attaque
              ser = UPF.get(e["ip"], {})
              if ser:
                  base = [ser.get(int(t0) + k, 0) for k in range(-8, 0)]
                  seuil = max(5 * (st.median(base) if base else 0), 500)
                  for k in range(0, 60):
                      if ser.get(int(t0) + k, 0) >= seuil:
                          o["debut_vers_flood_upf_s"] = k; break
              # qualité de service de l'UE bénin (l'autre UE)
              ben = BENINS_RUN.get(R)
              ns_b = ben[0] if ben else ("ue2" if e.get("ns") == "ue1" else "ue1")
              port_b = 5200 + int(ns_b[2:])
              # Qualité de service de l'UE bénin : MÊMES fenêtres pour toutes les politiques (sinon la comparaison
              # est biaisée) : avant [-9, 0), pendant toute l'attaque [0, 40), seconde moitié de l'attaque [20, 40),
              # qui montre si le service s'est rétabli après la coupure de l'attaquant.
              FA = float(os.environ.get("FENETRE_ATTAQUE", "40"))
              fr = f"62_ev_{R}_rtt_{ns_b}.txt"
              o["rtt_benin_avant_ms"], rep_av = rtt(fr, t0, -9, 0)
              o["rtt_benin_attaque_ms"], o["rep_benin_attaque"] = rtt(fr, t0, 0, FA)
              o["rtt_benin_fin_attaque_ms"], _ = rtt(fr, t0, FA / 2, FA)
              o["rtt_benin_apres_ms"] = o["rtt_benin_fin_attaque_ms"]
              o["continuite_benin"] = (o["rep_benin_attaque"] / rep_av) if rep_av else None   # sondes répondues pendant/avant
              ip_b = UES_RUN.get(R, {}).get(ns_b)
              if ip_b:
                  o["pps_benin_avant"] = upf_pps(ip_b, t0, -9, 0)
                  o["pps_benin_attaque"] = upf_pps(ip_b, t0, 0, FA)
                  o["pps_benin_apres"] = upf_pps(ip_b, t0, FA / 2, FA)
                  if o["pps_benin_avant"]:
                      o["ratio_pps_benin"] = (o["pps_benin_attaque"] or 0) / o["pps_benin_avant"]
              o["debit_benin_avant"], _ = iperf(f"64_iperf_{R}_p{port_b}.json", t0, -9, 0)
              o["debit_benin_attaque"], o["perte_benin_attaque"] = iperf(f"64_iperf_{R}_p{port_b}.json", t0, 0, FA)
              o["debit_benin_apres"], _ = iperf(f"64_iperf_{R}_p{port_b}.json", t0, FA / 2, FA)
              # CPU / mémoire
              for c, (cpu, rss) in pidstat(f"65_pidstat_{R}.txt").items():
                  k = {"python3": "detecteur", "xapp_xml5g": "xapp", "nr-softmodem": "gnb", "nr-uesoftmodem": "ue"}.get(c)
                  if k:
                      o[f"cpu_{k}_pct"] = round(cpu, 1); o[f"rss_{k}_mo"] = round(rss, 1)
              return o

          RUNS = []
          # noms d'essai : 60_xapp_<politique>[_<scenario>]_r<rep>.log
          trouves = []
          if os.path.isdir(L):
              for f in os.listdir(L):
                  m = re.fullmatch(r"60_xapp_(.+?)_r(\d+)\.log", f)
                  if not m: continue
                  reste, rr = m.group(1), int(m.group(2))
                  pol = next((p for p in POLS if reste == p or reste.startswith(p + "_")), None)
                  if pol is None: continue
                  scen = reste[len(pol) + 1:] if reste != pol else ""
                  trouves.append((pol, scen, rr))
          TOUS = []
          for p, scen, r in sorted(set(trouves)):
              o = run(p, r, scen)
              if o:
                      R_ = f"{p}_{scen}_r{r}" if scen else f"{p}_r{r}"
                      if VALIDITE:
                          o["valide"] = VALIDITE.get(R_, (False, "absent"))[0]
                      else:      # anciennes campagnes : valide si l'attaquant et l'UE bénin étaient en service
                          o["valide"] = all(k in UES_RUN.get(R_, {}) for k in ("ue1", "ue2"))
                      TOUS.append(o)
          RUNS = [o for o in TOUS if o["valide"]]
          if TOUS:
              cles = sorted({k for o in TOUS for k in o}, key=lambda k: (k not in TOUS[0], k))
              with open(os.path.join(L, "99_runs.csv"), "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=cles + (["valide"] if "valide" not in cles else []))
                  w.writeheader(); [w.writerow(o) for o in TOUS]

          def col(p, k, scen=None):
              return [o.get(k) for o in RUNS if o["politique"] == p and (scen is None or o.get("scenario") == scen)]
          SCENS = sorted({o.get("scenario", "udp") for o in RUNS})

          md = ["## xML5G — phase 3 (réponse au rapport d'expertise) : bilan", "",
                "### Plateforme", "", "- " + ", ".join(f"{k} = {v}" for k, v in etat.items()), ""]
          md += ["### Détecteur (entraîné sur le trafic de la plateforme)", ""]
          if train:
              md.append(f"Modèle : {train.get('algorithme')} ; seuil {train.get('modele_final', {}).get('seuil')} "
                        f"({train.get('modele_final', {}).get('regle_seuil')}).")
              for k in ("A_vers_B", "B_vers_A"):
                  m = train.get(k)
                  if isinstance(m, dict) and m.get("detection") is not None:
                      md.append(f"- {k.replace('_', ' ')} : détection {m['detection']*100:.1f} %, FPR {(m['fpr'] or 0)*100:.2f} %, F1 {m['f1']:.3f}")
          md.append("")

          # ---------- essais et validité ----------
          md += ["### Essais et validité", "",
                 "Un essai est **valide** si l'UE attaquant et l'UE bénin étaient en service et si l'attaque a été lancée ;",
                 "seuls les essais valides entrent dans les statistiques.", "",
                 "| Politique | Essais | Valides | Écartés (raison) |", "|---|---|---|---|"]
          for p in POLS:
              if VALIDITE:     # campagne avec fichier de validité : y figurent aussi les essais sans journaux
                  es = [(k, v) for k, v in VALIDITE.items() if k.rsplit("_r", 1)[0] == p]
              else:
                  es = [(f"{p}_r{o['rep']}", (o["valide"], "UE attaquant ou bénin absent")) for o in TOUS if o["politique"] == p]
              if not es: continue
              raisons = {}
              for _, (ok, rs) in es:
                  if not ok: raisons[rs or "?"] = raisons.get(rs or "?", 0) + 1
              md.append(f"| {NOMS[p]} | {len(es)} | {sum(ok for _, (ok, _) in es)} | "
                        + (", ".join(f"{k} : {v}" for k, v in raisons.items()) or "—") + " |")
          md.append("")

          # ---------- tableau par politique, moyennes et IC 95 % ----------
          STATS = []
          md += ["### Boucle fermée, essais valides (moyenne ± écart-type [IC 95 %])", "",
                 "| Politique | Attaquant coupé | Fausses coupures (dont attaquant coupé avant son attaque) | 1re alarme → commande (ms) | Décision → ACK E2 (ms) | Début → coupure (s) | Début → flood à l'UPF (s) | Début → 1re alarme (s) |",
                 "|---|---|---|---|---|---|---|---|"]
          for p in POLS:
              n = len(col(p, "rep"))
              if not n: continue
              k = sum(col(p, "attaquant_libere")); b = sum(col(p, "benins_liberes"))
              try:
                  from scipy.stats import binomtest
                  ci = binomtest(k, n).proportion_ci(0.95); ic = f" [{ci.low:.2f}; {ci.high:.2f}]"
              except Exception:
                  ic = ""
              ag = {c: moy_ic(col(p, c)) for c in ["alarme_vers_commande_ms", "decision_vers_ack_ms", "debut_vers_liberation_s",
                                                     "debut_vers_flood_upf_s", "debut_vers_1re_alarme_s", "debit_benin_attaque",
                                                     "rtt_benin_attaque_ms", "cpu_detecteur_pct", "cpu_xapp_pct", "rss_xapp_mo",
                                                     "rss_detecteur_mo", "cpu_gnb_pct", "cpu_ue_pct"]}
              STATS.append(dict(politique=p, n=n, attaquant_libere=k, benins_liberes=b,
                                **{f"{c}_{s}": v for c, (m, sd, h, nn) in ag.items() for s, v in (("moy", m), ("et", sd), ("ic95", h))}))
              pre = sum(col(p, "liberations_avant_attaque"))
              md.append(f"| {NOMS[p]} | {k}/{n}{ic} | {b}{f' ({pre})' if pre else ''} | {fmt(*ag['alarme_vers_commande_ms'][:3], d=1)} | "
                        f"{fmt(*ag['decision_vers_ack_ms'][:3], d=2)} | {fmt(*ag['debut_vers_liberation_s'][:3])} | "
                        f"{fmt(*ag['debut_vers_flood_upf_s'][:3], d=1)} | {fmt(*ag['debut_vers_1re_alarme_s'][:3])} |")
          md.append("")
          if STATS:
              with open(os.path.join(L, "99_politiques_stats.csv"), "w", newline="") as f:
