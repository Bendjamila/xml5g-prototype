          #!/usr/bin/env python3
          # xML5G phase 2 : bilan de la boucle complète (détection -> décision -> action)
          import os, re, glob, json

          L = os.environ.get("LOGS", "logs")
          def lire(n):
              p = os.path.join(L, n)
              return open(p, errors="replace").read() if os.path.exists(p) else ""

          etat = {}
          for l in lire("09_etapes.txt").splitlines():
              if "=" in l: k, v = l.split("=", 1); etat[k.strip()] = v.strip()

          def js(n):
              p = os.path.join(L, n)
              try: return json.load(open(p))
              except Exception: return {}

          train = js("50_train_metrics.json")
          md = ["## xML5G — phase 2 : bilan", ""]

          # 1) détecteur entraîné sur la plateforme
          md += ["### Détecteur (entraîné sur le trafic de la plateforme)", ""]
          if train:
              iv = train.get("intervalles", {})
              md.append(f"Intervalles étiquetés : session A {iv.get('A')}, session B {iv.get('B')}.")
              for sens in ("A_vers_B", "B_vers_A"):
                  m = train.get(sens)
                  if isinstance(m, dict):
                      md.append(f"- {sens.replace('_', ' ')} : détection {m['detection']*100:.1f} %, "
                                f"FPR {m['fpr']*100:.2f} %, F1 {m['f1']:.3f}")
                  elif m:
                      md.append(f"- {sens.replace('_', ' ')} : {m}")
              if train.get("importances"):
                  top = list(train["importances"].items())[:5]
                  md.append("- variables les plus utiles : " + ", ".join(f"{k} ({v})" for k, v in top))
          else:
              md.append("_métriques d'entraînement absentes_")
          md.append("")

          # 2) la boucle, par politique
          md += ["### Boucle fermée, par politique", "",
                 "| Politique | UE libéré | Réaction détection→action | UE bénins touchés |", "|---|---|---|---|"]
          def one(pol):
              x = lire(f"60_xapp_{pol}.log")
              s = js(f"61_ids_{pol}_summary.json")
              ev = [json.loads(l) for l in lire(f"62_ev_{pol}.jsonl").splitlines() if l.strip()]
              atk_ip = ev[0]["ip"] if ev else None
              # UE libéré et délai première alarme -> commande
              rel = re.search(r"RELEASE ran_ue_id=(\d+).*?t_first_alarm_rx_us=(\d+) t_decision_us=(\d+) "
                              r"t_ctrl_send_us=(\d+) t_ctrl_ack_us=(\d+) result=(\w+)", x)
              libere = react = touches = "—"
              if rel:
                  ue, t_al, t_dec, t_send, t_ack, r = rel.groups()
                  libere = f"UE {ue} ({r})"
                  if int(t_al) > 0:
                      react = f"{(int(t_send)-int(t_al))/1000:.0f} ms"
              elif pol == "none":
                  libere = "aucun (attendu)"
              # dernier paquet d'attaque vu à l'UPF, après la commande
              for teid, d in (s or {}).items():
                  if atk_ip and d.get("ip") == atk_ip and rel:
                      if d.get("last_pkt_us") and int(d["last_pkt_us"]) < int(rel.group(4)) + 3_000_000:
                          react += ""   # attaque stoppée dans les 3 s
              # UE bénins : une alarme forcée à tort ?
              faux = 0
              for m in re.finditer(r"SUMMARY ran_ue_id=(\d+) verdicts=\d+ alarms=(\d+) released=(\d)", x):
                  ue, al, r = m.groups()
                  if r == "1" and rel and ue != rel.group(1):
                      faux += 1
              touches = "aucun" if faux == 0 else f"{faux}"
              return f"| {pol} | {libere} | {react} | {touches} |"
          for pol in ("none", "immediate", "slice", "xml5g"):
              if os.path.exists(os.path.join(L, f"60_xapp_{pol}.log")):
                  md.append(one(pol))
          md.append("")

          # 3) correspondance tunnel -> UE automatique
          anyx = lire("60_xapp_xml5g.log") or lire("60_xapp_immediate.log")
          nmap = len(re.findall(r"\[XML5G\] MAP teid=", anyx))
          md.append(f"Correspondance tunnel→UE apprise automatiquement : {nmap} tunnel(s).")
          md.append("")

          checks = [
           ("Détecteur entraîné et évalué en croisé", bool(train.get("A_vers_B") or train.get("B_vers_A"))),
           ("Correspondance tunnel→UE automatique", nmap > 0),
           ("Politique xml5g : l'attaquant est libéré", bool(re.search(r"RELEASE ran_ue_id=\d+.*result=ACK", lire("60_xapp_xml5g.log")))),
           ("Politique xml5g : aucun UE bénin libéré", "| xml5g |" in "".join(md) and "| aucun |" in one("xml5g") if os.path.exists(os.path.join(L,"60_xapp_xml5g.log")) else False),
           ("Politique none : la règle se déclenche sans agir", "WOULD_RELEASE" in lire("60_xapp_none.log")),
           ("Comparaison des politiques disponible", sum(os.path.exists(os.path.join(L, f"60_xapp_{p}.log")) for p in ("none","immediate","slice","xml5g")) >= 3),
          ]
          md += ["### Vérifications", "", "| Vérification | Résultat |", "|---|---|"]
          for n, ok in checks:
              md.append(f"| {n} | {'✅' if ok else '❌'} |")
          md += ["", f"**{sum(ok for _, ok in checks)} vérifications réussies sur {len(checks)}.**"]

          texte = "\n".join(md)
          print(texte)
          open(os.path.join(L, "99_bilan.md"), "w").write(texte + "\n")
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s: open(s, "a").write(texte + "\n")
