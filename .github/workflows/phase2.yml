              sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
              sudo ip netns exec ue$k ip route | sed "s/^/ue$k route: /" >> "$LOGS/09_routes.txt"
              if sudo ip netns exec ue$k ping -c 3 -W 3 192.168.70.135 > "$LOGS/09_ping_ue$k.txt" 2>&1; then
                echo "ue${k}_ping=ok" >> "$LOGS/09_etapes.txt"
              else
                echo "ue${k}_ping=echec" >> "$LOGS/09_etapes.txt"; echo "::error::UE$k ne joint pas le réseau de données (voir 09_ping_ue$k.txt)"
              fi
            fi
            [ -n "$ip_ue" ] && UES="${UES:+$UES,}ue$k:$ip_ue"
            sleep 20
          done
          echo "UES=$UES" >> "$GITHUB_ENV"
          echo "les deux UEs : $UES"
          n_ue=$(echo "$UES" | tr ',' '\n' | grep -c . )
          echo "nb_ue=$n_ue" >> "$LOGS/09_etapes.txt"
          [ "$n_ue" -eq 2 ] || echo "::error::seulement $n_ue UE(s) connecté(s) sur 2 : la suite ne peut pas fonctionner"
      - name: 8. Collecte du trafic d'entraînement (2 sessions)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -n "$UES" ] || echo "::error::variable UES vide : aucun UE n'a d'adresse (voir l'étape 7)"

          cd "$WORK/py"
          for S in A B; do
            [ "$S" = A ] && ATT=ue1 || ATT=ue2
            sudo setsid nohup stdbuf -oL python3 ids_xml5g.py --mode collect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 130 --out "$LOGS/50_train_$S.csv" > "$LOGS/50_collect_$S.log" 2>&1 < /dev/null &
            IDS_PID=$!
            sleep 3
            sudo python3 scenario.py --ues "$UES" --attacker $ATT --attack $([ "$S" = A ] && echo syn || echo udp) --warmup 10 --attack-start 20 --attack-dur 60 --total 120 --events "$LOGS/50_ev_$S.jsonl" 2>&1 | tee "$LOGS/50_scenario_$S.log"
            wait $IDS_PID 2>/dev/null || true
            n_l=$(wc -l < "$LOGS/50_train_$S.csv")
            echo "session $S : $n_l lignes"
            [ "$n_l" -gt 1 ] || echo "::error::session $S : aucun relevé collecté (voir 50_collect_$S.log et 50_scenario_$S.log)"
          done
      - name: 9. Entraîner le détecteur (évaluation croisée)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail

          cd "$WORK/py"
          python3 train_xml5g.py --a "$LOGS/50_train_A.csv" "$LOGS/50_ev_A.jsonl" --b "$LOGS/50_train_B.csv" "$LOGS/50_ev_B.jsonl" --bin 0.2 --model "$WORK/model.joblib" --metrics "$LOGS/50_train_metrics.json" 2>&1 | tee "$LOGS/50_train.log"
          [ -f "$WORK/model.joblib" ] || echo "::error::détecteur non entraîné : voir 50_train.log"
      - name: 10. Boucle complète, pour chaque politique
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -f "$WORK/model.joblib" ] || echo "::error::pas de modèle : la boucle tournera sans détecteur (voir l'étape 9)"

          cd "$WORK/py"
          B="$WORK/oai/cmake_targets/ran_build/build"
          ATT=ue1
          for POL in none immediate slice xml5g; do
            echo "=== politique $POL ==="
            XML5G_POLICY=$POL XML5G_W=10 XML5G_THETA=0.7 XML5G_DURATION=80 XML5G_PORT=9999 \
              sudo -E setsid nohup stdbuf -oL "$WORK/oai/openair2/E2AP/flexric/build/examples/xApp/c/xapp_xml5g/xapp_xml5g" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/60_xapp_$POL.log" 2>&1 < /dev/null &
            XPID=$!
            sleep 8   # laisser l'xApp apprendre la correspondance tunnel->UE
            sudo -E setsid nohup stdbuf -oL python3 ids_xml5g.py --mode detect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 70 --model "$WORK/model.joblib" --xapp 127.0.0.1:9999 --out "$LOGS/61_ids_$POL.log" --summary "$LOGS/61_ids_${POL}_summary.json" > "$LOGS/61_ids_${POL}_run.log" 2>&1 < /dev/null &
            IDSPID=$!
            sleep 5
            sudo python3 scenario.py --ues "$UES" --attacker $ATT --attack syn --warmup 5 --attack-start 10 --attack-dur 40 --total 55 --events "$LOGS/62_ev_$POL.jsonl" 2>&1 | tee "$LOGS/62_scenario_$POL.log"
            wait $IDSPID 2>/dev/null || true
            sleep 3; sudo kill $XPID 2>/dev/null || true; sleep 2
            # l'UE libéré ne se reconnecte pas seul : on le relance pour la politique suivante
            for k in 1 2; do
              pgrep -f "ue$k.conf" > /dev/null && continue
              sudo setsid nohup stdbuf -oL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" -r 106 --numerology 1 --band 78 -C 3619200000 --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
            done
            sleep 20
          done
      - name: 11. Bilan
        if: always()
        run: |
          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g" 2>/dev/null && for c in oai-amf oai-smf oai-upf; do docker logs "$c" > "$LOGS/40_$c.log" 2>&1 || true; done
          sudo chmod -R a+r "$LOGS" || true
          LOGS="$LOGS" python3 "$WORK/py/bilan2.py"

      - name: 12. Journaux à télécharger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-phase2-journaux
          path: /home/runner/xml5g-journaux
          if-no-files-found: warn
