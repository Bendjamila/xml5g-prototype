            ip_ue=""
            for essai in 1 2 3; do
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              sleep 5
              for i in $(seq 1 40); do
                ip_ue=$(sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | grep oaitun | awk '{print $4}' | cut -d/ -f1)
                [ -n "$ip_ue" ] && break
                pgrep -f "ue$k.conf" > /dev/null || break
                sleep 3
              done
              [ -n "$ip_ue" ] && break
              sudo pkill -f "ue$k.conf" || true; sleep 15
            done
            echo "UE$k adresse ${ip_ue:-aucune}"; echo "ue${k}_ip=${ip_ue:-aucune}" >> "$LOGS/09_etapes.txt"
            if [ -n "$ip_ue" ]; then
              # sans cette route, le trafic de l'UE vers le réseau de données n'a aucun chemin
              # (« Network is unreachable ») : ni trafic bénin, ni attaque, rien dans le tunnel GTP-U
              tun=$(sudo ip netns exec ue$k ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
              sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
              sudo ip netns exec ue$k ip route | sed "s/^/ue$k route: /" >> "$LOGS/09_routes.txt"
              if sudo ip netns exec ue$k ping -c 3 -W 3 192.168.70.135 > "$LOGS/09_ping_ue$k.txt" 2>&1; then
                echo "ue${k}_ping=ok" >> "$LOGS/09_etapes.txt"
              else
                echo "ue${k}_ping=echec" >> "$LOGS/09_etapes.txt"; echo "::error::UE$k ne joint pas le réseau de données (voir 09_ping_ue$k.txt)"
              fi
            fi
            [ -n "$ip_ue" ] && UES="${UES:+$UES,}ue$k:$ip_ue"
            sleep 20
          done
          echo "UES=$UES" >> "$GITHUB_ENV"
          echo "les deux UEs : $UES"
          n_ue=$(echo "$UES" | tr ',' '\n' | grep -c . )
          echo "nb_ue=$n_ue" >> "$LOGS/09_etapes.txt"
          [ "$n_ue" -eq 2 ] || echo "::error::seulement $n_ue UE(s) connecté(s) sur 2 : la suite ne peut pas fonctionner"
      - name: 8. Collecte du trafic d'entraînement (2 sessions)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : on gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -n "$UES" ] || echo "::error::variable UES vide : aucun UE n'a d'adresse (voir l'étape 7)"
          cd "$WORK/py"
          # Chaque session contient les DEUX attaques (SYN puis UDP), lancées par des UEs
          # différents ; les rôles sont inversés entre A et B. L'évaluation croisée A->B
          # mesure donc le passage à une autre session et à un autre attaquant, et non
          # à une famille d'attaque jamais vue (cas où tout détecteur échoue).
          for S in A B; do
            if [ "$S" = A ]; then ATKS="ue1:syn:20:30,ue2:udp:70:30"; else ATKS="ue2:syn:20:30,ue1:udp:70:30"; fi
            docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
            for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done
            sudo setsid nohup nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode collect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 135 --out "$LOGS/50_train_$S.csv" > "$LOGS/50_collect_$S.log" 2>&1 < /dev/null &
            IDS_PID=$!
            sleep 3
            sudo python3 scenario.py --ues "$UES" --attacks "$ATKS" --total 125 --events "$LOGS/50_ev_$S.jsonl" 2>&1 | tee "$LOGS/50_scenario_$S.log"
            wait $IDS_PID 2>/dev/null
            sleep 8   # laisser le collecteur finir sa durée
            n_l=$(wc -l < "$LOGS/50_train_$S.csv")
            echo "session $S : $n_l lignes"
            [ "$n_l" -gt 1 ] || echo "::error::session $S : aucun relevé collecté (voir 50_collect_$S.log et 50_scenario_$S.log)"
          done
      - name: 9. Entraîner le détecteur (évaluation croisée)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail

          cd "$WORK/py"
          python3 train_xml5g.py --a "$LOGS/50_train_A.csv" "$LOGS/50_ev_A.jsonl" --b "$LOGS/50_train_B.csv" "$LOGS/50_ev_B.jsonl" --bin 0.2 --model "$WORK/model.joblib" --metrics "$LOGS/50_train_metrics.json" 2>&1 | tee "$LOGS/50_train.log"
          [ -f "$WORK/model.joblib" ] || echo "::error::détecteur non entraîné : voir 50_train.log"
      - name: 10. Campagne phase 3 (scenarios x politiques)
        continue-on-error: true
        run: |
          # xML5G phase 3 — boucle : pour chaque (scénario d'attaque, politique), N essais valides.
          # Ce bloc remplace l'étape 10 de phaseF2.yml. Extrait ici pour « bash -n » ; dans le YAML il
          # tourne avec $WORK, $B, $FR, $GNB_CONF, $UE_RF, $SM_DIR, $FR_CONF, $LOGS déjà définis.
          set +e +o pipefail
          [ -f "$WORK/model.joblib" ] || echo "::error::pas de modèle : la boucle tournera sans détecteur"
          cd "$WORK/py"
          B="$WORK/oai/cmake_targets/ran_build/build"
          FR="$WORK/oai/openair2/E2AP/flexric/build"
          CONF="$GNB_CONF"

          # Entrées (workflow_dispatch), avec valeurs par défaut tenables sur un runner GitHub (4 cœurs).
          NVALIDE="${ESSAIS:-5}"                       # essais valides visés par (scénario, politique)
          MAX_ESSAIS="${MAX_ESSAIS:-8}"
          NB_BENINS="${NB_BENINS:-2}"                  # UE bénins en plus du ou des attaquants
          SCENARIOS="${SCENARIOS:-udp syn multi flash}"
          POLITIQUES="${POLITIQUES:-xml5g xml5g_filtre tsourdinis throttle xml5g_persist immediate slice none}"
          DUREE_ATTAQUE="${DUREE_ATTAQUE:-40}"
          LIMITE_THROTTLE="${LIMITE_THROTTLE:-512kbit}"
          KPM_POLITIQUES="${KPM_POLITIQUES:-none}"     # politiques pendant lesquelles les KPM sont enregistrés (M4)
          if [ "${MODE_TEST:-non}" = oui ]; then       # essai rapide de la chaîne (un cas), pas une campagne
            NVALIDE=1; MAX_ESSAIS=2; NB_BENINS=1; SCENARIOS="udp"; POLITIQUES="xml5g none"; DUREE_ATTAQUE=12
          fi
          echo "campagne : scénarios=[$SCENARIOS] politiques=[$POLITIQUES] bénins=$NB_BENINS essais=$NVALIDE KPM=[$KPM_POLITIQUES]"

          # La carte adresse -> espace de noms sert aux crochets throttle et persist (via l'adresse de l'UE).
          MAP="/tmp/xml5g_ues_map.txt"; export XML5G_UES_MAP="$MAP"
          export XML5G_LIMITE="$LIMITE_THROTTLE"

          arreter_ran() {
            sudo pkill -f nr-uesoftmodem; sudo pkill -f nr-softmodem
            sudo pkill -f nearRT-RIC; sudo pkill -f xapp_kpm_moni
            sleep 5
          }
          demarrer_ran() {   # $1 = étiquette de journal ; $2 = nombre d'UE à lancer
            local tag=$1 nue=$2
            sudo setsid nohup stdbuf -oL -eL "$FR/examples/ric/nearRT-RIC" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/10_ric_$tag.log" 2>&1 < /dev/null &
            sleep 3
            sudo setsid nohup stdbuf -oL -eL "$B/nr-softmodem" -O "$CONF" '--gNBs.[0].min_rxtxtime' 6 --rfsim --e2_agent.sm_dir "$SM_DIR/" > "$LOGS/11_gnb_$tag.log" 2>&1 < /dev/null &
            for i in $(seq 1 90); do
              grep -q "Received NGSetupResponse from AMF" "$LOGS/11_gnb_$tag.log" && grep -q "E2 SETUP RESPONSE rx" "$LOGS/11_gnb_$tag.log" && break
              sleep 2
            done
            for k in $(seq 1 "$nue"); do
              [ -e "/var/run/netns/ue$k" ] || sudo bash "$WORK/oai/tools/scripts/multi-ue.sh" -c$k
              printf 'uicc0 = {\nimsi = "00101000000000%s";\nkey = "fec86ba6eb707ed08905757b1bb44b8f";\nopc= "C42449363BBAD02B66D16BC975D77CC1";\npdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });\n}\n' "$k" > "$WORK/ue$k.conf"
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
            done
          }
          ue_pret() {   # $1 = k ; renvoie l'adresse de l'UE (vide si échec), garantit route + ping
            local k=$1 ip_ tun
            for essai in 1 2 3; do
              ip_=$(sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | awk '/oaitun/{split($4,a,"/"); print a[1]; exit}')
              if [ -n "$ip_" ]; then
                tun=$(sudo ip netns exec ue$k ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
                sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
                if sudo ip netns exec ue$k ping -c 2 -W 2 192.168.70.135 > /dev/null 2>&1; then echo "$ip_"; return; fi
              fi
              sudo pkill -f "ue$k.conf"; sleep 5
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              for i in $(seq 1 40); do sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | grep -q oaitun && break; sleep 3; done
              sleep 5
            done
            echo ""
          }
          # un verdict "attaque" est posé par l'IDS ; XML5G_POLICY + options par politique
          options_politique() {   # $1 = politique ; écrit POL_ENV (variables) et IDS_MIN (min-pkts)
            POL_ENV="XML5G_POLICY=xml5g"; IDS_MIN=1
            case "$1" in
              xml5g)         POL_ENV="XML5G_POLICY=xml5g" ;;
              xml5g_filtre)  POL_ENV="XML5G_POLICY=xml5g"; IDS_MIN=6 ;;
              tsourdinis)    POL_ENV="XML5G_POLICY=tsourdinis XML5G_REPORT_S=1" ;;
              throttle)      POL_ENV="XML5G_POLICY=throttle XML5G_GRACE_S=5 XML5G_THROTTLE_CMD=\"bash $WORK/py/limiter_ue.sh %s\"" ;;
              xml5g_persist) POL_ENV="XML5G_POLICY=xml5g_persist XML5G_ON_RELEASE_CMD=\"bash $WORK/py/bloquer_abonne.sh %s\"" ;;
              immediate|slice|none) POL_ENV="XML5G_POLICY=$1" ;;
            esac
          }
          # attaquants et scénario d'attaque de scenario.py (ports 5555/80 reconnus par l'IDS comme vérité terrain)
          attaques_du_scenario() {   # $1 = scénario ; écrit ATKS (ou vide pour flash) et NB_ATT
            case "$1" in
              udp)   ATKS="ue1:udp:10:$DUREE_ATTAQUE"; NB_ATT=1 ;;
              syn)   ATKS="ue1:syn:10:$DUREE_ATTAQUE"; NB_ATT=1 ;;
              multi) ATKS="ue1:udp:10:$DUREE_ATTAQUE,ue2:syn:10:$DUREE_ATTAQUE"; NB_ATT=2 ;;
              flash) ATKS=""; NB_ATT=1 ;;   # pas d'attaque : flash crowd bénin seul (le pire cas pour la règle)
            esac
          }

          # abonnés supplémentaires si plus de 4 UE
          . "$WORK/goulot.sh"
          DEBUT=$(date +%s); BUDGET_S=$(( ${BUDGET_MIN:-200} * 60 ))   # compilation (~40 min) + boucle + bilan < 300 min
          : > "$LOGS/63_validite.txt"; : > "$LOGS/63_ues_par_politique.txt"
          declare -A NV NE
          for SC in $SCENARIOS; do for POL in $POLITIQUES; do NV[${SC}_${POL}]=0; NE[${SC}_${POL}]=0; done; done

          for TOUR in $(seq 1 "$MAX_ESSAIS"); do
          for SC in $SCENARIOS; do
            attaques_du_scenario "$SC"
            NUE=$(( NB_ATT + NB_BENINS ))
            [ "$NUE" -gt 9 ] && NUE=9
            bash "$WORK/py/provisionner_abonnes.sh" "$NUE" >> "$LOGS/13_abonnes.txt" 2>&1
            for POL in $POLITIQUES; do
              CLE="${SC}_${POL}"
              [ "${NV[$CLE]}" -ge "$NVALIDE" ] && continue
              if [ $(( $(date +%s) - DEBUT )) -gt $BUDGET_S ]; then echo "::warning::budget de temps atteint"; break 3; fi
              NE[$CLE]=$(( ${NE[$CLE]} + 1 )); RUN="${POL}_${SC}_r${NE[$CLE]}"
              echo "=== $RUN (valides ${NV[$CLE]}/$NVALIDE) ==="
              options_politique "$POL"

              declare -a IPS; IPS=(); ok=1
              for tentative in 1 2 3; do
                arreter_ran; demarrer_ran "$RUN" "$NUE"; poser_goulot
                ok=1; IPS=()
                for k in $(seq 1 "$NUE"); do ip_=$(ue_pret "$k"); IPS[$k]="$ip_"; [ -z "$ip_" ] && ok=0; done
                [ "$ok" = 1 ] && break
              done
              if [ "$ok" != 1 ]; then echo "$RUN invalide UE_non_connecte" >> "$LOGS/63_validite.txt"; continue; fi
              : > "$MAP"; for k in $(seq 1 "$NUE"); do echo "${IPS[$k]} ue$k" >> "$MAP"; done
              restaurer_persist() { bash "$WORK/py/restaurer_abonnes.sh" >/dev/null 2>&1; }

              # serveurs iperf3 : un par UE (trafic 5200+k, flash 5300+k)
              docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
              for k in $(seq 1 "$NUE"); do
                docker exec -d oai-ext-dn iperf3 -s -p $((5200 + k)) -J --logfile /tmp/iperf_$((5200 + k)).json > /dev/null 2>&1
                docker exec -d oai-ext-dn iperf3 -s -p $((5300 + k)) > /dev/null 2>&1
              done
              UESP=""; for k in $(seq 1 "$NB_ATT"); do UESP="${UESP:+$UESP,}ue$k:${IPS[$k]}"; done
              BEN=""; for k in $(seq $(( NB_ATT + 1 )) "$NUE"); do BEN="${BEN:+$BEN,}ue$k:${IPS[$k]}"; done
              echo "$RUN : attaquants=$UESP bénins=$BEN" | tee -a "$LOGS/63_ues_par_politique.txt"

              # xApp de décision
              eval "$POL_ENV XML5G_W=10 XML5G_THETA=0.7 XML5G_DURATION=80 XML5G_PORT=9999 \
                sudo -E setsid nohup nice -n -10 stdbuf -oL \"$FR/examples/xApp/c/xapp_xml5g/xapp_xml5g\" -c \"$FR_CONF\" -p \"$SM_DIR/\" > \"$LOGS/60_xapp_$RUN.log\" 2>&1 < /dev/null &"
              XPID=$!
              # xApp KPM (remarque M4) : rapports E2SM-KPM par UE (débit, PRB, volume PDCP, délai RLC ; style 4,
              # période 1 s), seulement pendant les essais des politiques KPM_POLITIQUES (défaut « none » : l'attaquant
              # reste attaché tout l'essai). Elle ne tourne pas pendant les essais de mitigation, pour ne pas y ajouter
              # de charge au gNB. xapp_kpm_moni n'imprime aucune heure absolue : horodater.py préfixe chaque ligne par
              # l'heure de réception (même horloge que le journal de paquets), sans quoi les rapports ne pourraient pas
              # être alignés sur le trafic. XAPP_DURATION borne sa durée si l'arrêt ci-dessous échouait.
              case " $KPM_POLITIQUES " in
                *" $POL "*|*" tout "*)
                  sudo -E setsid nohup bash -c "XAPP_DURATION=100 stdbuf -oL '$FR/examples/xApp/c/monitor/xapp_kpm_moni' -c '$FR_CONF' -p '$SM_DIR/' 2>&1 | python3 -u '$WORK/py/horodater.py'" > "$LOGS/67_kpm_$RUN.log" 2>&1 < /dev/null & ;;
              esac
              sleep 8
              # détecteur (avec vérité terrain par ports, journal de paquets, filtre éventuel)
              sudo -E setsid nohup nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode detect --iface oai-cn5g --upf 192.168.70.134 \
                --bin 0.2 --duration 70 --min-pkts "$IDS_MIN" --model "$WORK/model.joblib" --xapp 127.0.0.1:9999 \
                --out "$LOGS/61_ids_$RUN.log" --summary "$LOGS/61_ids_${RUN}_summary.json" --pktlog "$LOGS/68_pkt_$RUN.csv.gz" \
                > "$LOGS/61_ids_${RUN}_run.log" 2>&1 < /dev/null &
              IDSPID=$!
              sleep 2
              PIDS=$(pgrep -d, -f "ids_xml5g.py --mode detect|xapp_xml5g -c|xapp_kpm_moni -c|nr-softmodem|nr-uesoftmodem")
              [ -n "$PIDS" ] && { pidstat -h -u -r -p "$PIDS" 1 > "$LOGS/65_pidstat_$RUN.txt" 2>&1 & echo $! > /tmp/pidstat.pid; }
              ( while true; do echo "$(date +%s) $(docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' oai-upf 2>/dev/null)"; sleep 2; done ) > "$LOGS/66_docker_$RUN.txt" 2>&1 &
              DSPID=$!
              sleep 3

              # trafic bénin varié sur les UE bénins (+ flash crowd pour le scénario flash)
              if [ -n "$BEN" ]; then
                FLASH=""; [ "$SC" = flash ] && FLASH="--flash ue$(( NB_ATT + 1 )):12:15:12M"
                sudo setsid nohup python3 trafic_benin.py --ues "$BEN" --total 55 $FLASH --events "$LOGS/69_benin_$RUN.jsonl" > "$LOGS/69_benin_${RUN}.log" 2>&1 < /dev/null &
              fi
              # attaque (ou rien pour flash) ; scenario.py écrit aussi la QoS de l'UE bénin ue(NB_ATT+1)
              if [ -n "$ATKS" ]; then
                sudo python3 scenario.py --ues "$UESP${BEN:+,$BEN}" --attacks "$ATKS" --total 55 --events "$LOGS/62_ev_$RUN.jsonl" 2>&1 | tee "$LOGS/62_scenario_$RUN.log"
              else
                printf '[]\n' > "$LOGS/62_ev_$RUN.jsonl"; sleep "$DUREE_ATTAQUE"   # flash : pas d'attaque
              fi
              wait $IDSPID 2>/dev/null
              sleep 12
              sudo kill $XPID 2>/dev/null
              sudo pkill -TERM -f "xapp_kpm_moni -c" 2>/dev/null   # arrêt propre : la xApp se désabonne, horodater.py se termine
              [ -f /tmp/pidstat.pid ] && { kill "$(cat /tmp/pidstat.pid)" 2>/dev/null; rm -f /tmp/pidstat.pid; }
              kill $DSPID 2>/dev/null; sleep 2
              sudo rm -f /tmp/xapp_db_* 2>/dev/null   # bases SQLite des xApps (une par xApp et par essai), inutilisées
              for k in $(seq 1 "$NUE"); do docker exec oai-ext-dn cat /tmp/iperf_$((5200 + k)).json > "$LOGS/64_iperf_${RUN}_p$((5200 + k)).json" 2>/dev/null; done
              restaurer_persist   # remet les abonnés retirés par la politique persist

              # validité : le détecteur doit avoir joint la xApp (sinon l'essai ne teste rien, cf. Immediate r2
              # de __9_) ; pour flash, le trafic bénin doit avoir tourné ; sinon, l'attaque doit avoir été lancée
              valide=1; raison=""
              if grep -q "injoignable" "$LOGS/61_ids_${RUN}_run.log" 2>/dev/null; then valide=0; raison="xapp_injoignable"
              elif [ "$SC" = flash ]; then [ -s "$LOGS/69_benin_$RUN.jsonl" ] || { valide=0; raison="trafic_benin_absent"; }
              else grep -q '"start"' "$LOGS/62_ev_$RUN.jsonl" 2>/dev/null || { valide=0; raison="attaque_non_lancee"; }
              fi
              if [ "$valide" = 1 ]; then
                echo "$RUN valide" >> "$LOGS/63_validite.txt"; NV[$CLE]=$(( ${NV[$CLE]} + 1 ))
              else
                echo "$RUN invalide $raison" >> "$LOGS/63_validite.txt"
              fi
              sleep 1
            done
          done
          done
          for SC in $SCENARIOS; do for POL in $POLITIQUES; do
            echo "$SC/$POL : ${NV[${SC}_${POL}]} valides sur ${NE[${SC}_${POL}]}" | tee -a "$LOGS/09_etapes.txt"
          done; done
          arreter_ran
      - name: 11. Bilan
        if: always()
        run: |
          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g" 2>/dev/null && for c in oai-amf oai-smf; do docker logs "$c" > "$LOGS/40_$c.log" 2>&1 || true; done
          # L'UPF journalise chaque paquet montant (« Upstream IP is ... ») : on garde un résumé
          # en paquets par seconde et par UE (preuve de la coupure), et le journal sans ces lignes.
          docker logs oai-upf 2>&1 | grep -F "Upstream IP is" | awk '{t=substr($2,1,8); c[$1" "t" "$NF]++} END{for(k in c) print k, c[k]}' | tr -d '[]' | sort > "$LOGS/40_upf_pps.txt" || true
          docker logs oai-upf 2>&1 | grep -vF " IP is " > "$LOGS/40_oai-upf.log" || true
          sudo chmod -R a+r "$LOGS" || true
          LOGS="$LOGS" python3 "$WORK/py/bilan4.py" || ECHEC_BILAN=1
          # M4 : plan usager contre plan RAN, sur les essais où les KPM ont été enregistrés
          python3 "$WORK/py/m4_deux_plans.py" "$LOGS" > "$LOGS/70_m4_run.log" 2>&1 || echo "m4 : échec, voir 70_m4_run.log"
          if [ -s "$LOGS/70_m4_deux_plans.md" ]; then cat "$LOGS/70_m4_deux_plans.md" >> "$GITHUB_STEP_SUMMARY"; fi
          [ -z "${ECHEC_BILAN:-}" ]

      - name: 12. Journaux à télécharger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-phase3-journaux
          path: /home/runner/xml5g-journaux
          if-no-files-found: warn
