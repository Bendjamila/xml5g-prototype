          #!/usr/bin/env python3
          """
          xML5G - phase 3 : trafic BÉNIN des UE supplémentaires (remarque M3 du rapport d'expertise).

          Lancé en parallèle de scenario.py (inchangé, qui gère ue1 et ue2), il fait tourner sur
          les UE supplémentaires (ue3, ue4, ...) des trafics bénins de natures différentes, une
          sonde de RTT horodatée par UE et, en option, un « flash crowd » : un UE bénin qui
          passe brusquement à un débit élevé, sans aucune attaque (le cas le plus dur pour la
          règle de libération). Chaque trafic est écrit dans le fichier d'événements avec
          "benign": true, pour que le bilan le compte comme bénin.

          Types : tcp (iperf3 TCP 2 Mbit/s), video (UDP 1,5 Mbit/s, paquets de 1 200 o),
          voip (UDP 32 kbit/s, petits paquets de 40 o), iot (ping de 32 o toutes les 2 s),
          burst (rafales UDP de 2 s toutes les 6 s).
            --ues "ue3:10.0.0.4,ue4:10.0.0.5" --types "ue3:voip,ue4:tcp" --flash "ue3:15:15:10M"
          Serveurs iperf3 attendus dans le réseau de données : port 5200+k (trafic) et 5300+k (flash).
          """
          import argparse, json, subprocess, threading, time


          def sh(ns, cmd, out=None):
              f = open(out, "w") if out else subprocess.DEVNULL
              return subprocess.Popen(["sudo", "ip", "netns", "exec", ns, "bash", "-lc", cmd],
                                      stdout=f, stderr=subprocess.STDOUT if out else subprocess.DEVNULL)


          def commande(typ, dn, port, total):
              T = int(total)
              if typ == "tcp":
                  return f"iperf3 -c {dn} -p {port} -t {T} -b 2M"
              if typ == "video":
                  return f"iperf3 -c {dn} -p {port} -t {T} -u -b 1500k -l 1200"
              if typ == "voip":
                  return f"iperf3 -c {dn} -p {port} -t {T} -u -b 32k -l 40"
              if typ == "iot":
                  return f"ping -q -i 2 -s 32 -w {T} {dn}"
              if typ == "burst":
                  return (f"fin=$((SECONDS+{T})); while [ $SECONDS -lt $fin ]; do "
                          f"iperf3 -c {dn} -p {port} -t 2 -u -b 3M > /dev/null 2>&1; sleep 4; done")
              raise ValueError(f"type de trafic bénin inconnu : {typ}")


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--dn", default="192.168.70.135")
              ap.add_argument("--ues", required=True, help="ex. ue3:10.0.0.4,ue4:10.0.0.5")
              ap.add_argument("--types", default="", help="ex. ue3:voip,ue4:tcp (défaut : rotation des types)")
              ap.add_argument("--total", type=float, default=55)
              ap.add_argument("--flash", default="", help="ns:début s:durée s:débit, ex. ue3:15:15:10M")
              ap.add_argument("--events", required=True)
              a = ap.parse_args()
              ues = dict(u.split(":") for u in a.ues.split(",") if ":" in u)
              rotation = ["voip", "tcp", "video", "iot", "burst"]
              types = dict(t.split(":") for t in a.types.split(",") if ":" in t)
              for i, ns in enumerate(sorted(ues)):
                  types.setdefault(ns, rotation[i % len(rotation)])
              base = a.events.rsplit(".", 1)[0]
              t0 = time.time()
              procs, ev = [], []
              for ns, ip in ues.items():
                  k = int(ns[2:])
                  procs.append(sh(ns, commande(types[ns], a.dn, 5200 + k, a.total), f"{base}_benin_{ns}.err"))
                  procs.append(sh(ns, f"stdbuf -oL ping -D -i 0.2 -w {int(a.total)} {a.dn}", f"{base}_rtt_{ns}.txt"))
                  ev.append(dict(ip=ip, ns=ns, type=f"benin:{types[ns]}", start=round(t0, 3),
                                 end=round(t0 + a.total, 3), benign=True))

              def flash():
                  ns, st, du, rate = a.flash.split(":")
                  time.sleep(max(0.0, float(st) - (time.time() - t0)))
                  start = time.time()
                  p = sh(ns, f"iperf3 -c {a.dn} -p {5300 + int(ns[2:])} -t {int(float(du))} -b {rate}", f"{base}_flash_{ns}.err")
                  p.wait()
                  ev.append(dict(ip=ues.get(ns, ""), ns=ns, type="flash", rate=rate, start=round(start, 3),
                                 end=round(time.time(), 3), benign=True))

              th = None
              if a.flash:
                  th = threading.Thread(target=flash)
                  th.start()
              time.sleep(max(0.0, a.total - (time.time() - t0)))
              if th:
                  th.join(timeout=5)
              for p in procs:
                  try:
                      p.terminate()
                  except Exception:
                      pass
              open(a.events, "w").write("".join(json.dumps(e) + "\n" for e in ev))
              print(json.dumps(ev, indent=2))


          if __name__ == "__main__":
              main()
          TB_EOF
          cat > "$WORK/py/horodater.py" <<'HORO_EOF'
          #!/usr/bin/env python3
          """
          xML5G - phase 3 : horodate chaque ligne lue sur l'entrée standard (remarque M4).

          La xApp KPM de FlexRIC (xapp_kpm_moni) n'imprime aucune heure absolue : seulement la
          latence de chaque rapport. Sans heure, les rapports KPM ne peuvent pas être alignés sur
          les paquets du plan usager ni sur la fenêtre d'attaque. Ce filtre préfixe chaque ligne
          par l'heure de réception (secondes depuis l'époque, même horloge que le détecteur) :
              xapp_kpm_moni ... | python3 -u horodater.py > 67_kpm_<essai>.log
          """
          import sys
          import time


          def main():
              lire = sys.stdin.buffer.readline
              out = sys.stdout
              for ligne in iter(lire, b""):
                  out.write(f"{time.time():.6f} " + ligne.decode("utf-8", "replace"))
                  out.flush()


          if __name__ == "__main__":
              main()
          HORO_EOF
