          docker exec mysql mysql -uroot -plinux oai_db -e \
            "CREATE TABLE IF NOT EXISTS xml5g_bloques LIKE AuthenticationSubscription;
             INSERT IGNORE INTO AuthenticationSubscription SELECT * FROM xml5g_bloques;
