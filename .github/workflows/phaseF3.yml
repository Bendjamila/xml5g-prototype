          REST_EOF
          cat > "$WORK/py/provisionner_abonnes.sh" <<'PROV_EOF'
          #!/bin/bash
          # xML5G phase 3 - la base du cœur OAI ne contient que 4 abonnés (001010000000001 à ...004).
          # Pour N UE (N <= 9), on ajoute les abonnés 5..N en copiant l'abonné 1 (même clé, même opc :
          # ue$k.conf utilise la même clé pour tous les UE).
          N="${1:-4}"
          for k in $(seq 5 "$N"); do
            IMSI="00101000000000$k"
            docker exec mysql mysql -uroot -plinux oai_db -e \
              "INSERT IGNORE INTO AuthenticationSubscription (ueid, authenticationMethod, encPermanentKey, protectionParameterId,
                 sequenceNumber, authenticationManagementField, algorithmId, encOpcKey, encTopcKey, vectorGenerationInHss,
                 n5gcAuthMethod, rgAuthenticationInd, supi)
               SELECT '$IMSI', authenticationMethod, encPermanentKey, protectionParameterId, sequenceNumber,
                 authenticationManagementField, algorithmId, encOpcKey, encTopcKey, vectorGenerationInHss,
                 n5gcAuthMethod, rgAuthenticationInd, '$IMSI' FROM AuthenticationSubscription WHERE ueid='001010000000001';
               INSERT IGNORE INTO SessionManagementSubscriptionData (ueid, servingPlmnid, singleNssai, dnnConfigurations)
               SELECT '$IMSI', servingPlmnid, singleNssai,
                 REPLACE(dnnConfigurations, '\"10.0.0.2\"', '\"10.0.0.$((20 + k))\"')
               FROM SessionManagementSubscriptionData WHERE ueid='001010000000001';" 2>/dev/null \
              && echo "abonné $IMSI ajouté" || echo "::warning::abonné $IMSI non ajouté"
          done
