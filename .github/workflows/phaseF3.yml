          #!/usr/bin/env python3
          """
          xML5G - détecteur du plan usager (phase 2).

          Capture le trafic GTP-U montant (gNB -> UPF, interface N3) sur le pont du cœur
          5G, regroupe les paquets par tunnel (TEID, un par UE) et par intervalle de
          BIN secondes, calcule 15 variables par (tunnel, intervalle) et :
            - mode "collect" : écrit ces variables dans un CSV (entraînement) ;
            - mode "detect"  : applique le modèle (avec son seuil) et envoie chaque décision
                               à l'xApp par TCP (une ligne par tunnel et par intervalle).
          Le même code calcule les variables à l'entraînement et en fonctionnement.

          Phase 3 (rapport d'expertise) :
            - --min-pkts N : aucun verdict pour un intervalle de moins de N paquets (exp. 5) ;
            - vérité terrain : on compte par intervalle les paquets du générateur d'attaque, reconnus
              par leur protocole et leur port de destination (--verite, par défaut ceux du scénario
              existant : UDP 5555 et TCP 80), sans rien changer au générateur (colonne n_marques en
              collecte, 8e champ de la ligne de verdict). Ces ports ne sont PAS des variables du
              modèle : ils ne servent qu'à l'étiquetage et à l'évaluation (remarque M6) ;
            - --pktlog F.csv.gz : journal compressé de chaque paquet (re-binning hors ligne, exp. 12, et
              comparaison des deux plans, M4 : les 15 variables se recalculent à l'identique) ;
            - le résumé compte les intervalles sautés après une pause (remarque M11).
          """
          import argparse, gzip, json, math, os, signal, socket, struct, sys, time

          FEATURES = ["n_pkts", "n_bytes", "mean_len", "std_len", "max_len",
                      "frac_tcp", "frac_udp", "frac_icmp", "frac_syn",
                      "n_dst_ports", "n_src_ports", "n_dst_ips",
                      "mean_iat", "std_iat", "frac_small"]

          ETH_P_ALL = 0x0003


          def parse(frame, upf_ip):
              """Paquet GTP-U montant -> (teid, ip_src, ip_dst, proto, lg, flags, sport, dport, tos) ou None."""
              if len(frame) < 14 + 20 + 8 + 8 or frame[12:14] != b"\x08\x00":
                  return None
              o = 14
              ihl = (frame[o] & 0x0F) * 4
              if frame[o + 9] != 17 or frame[o + 16:o + 20] != upf_ip:   # UDP vers l'UPF
                  return None
              u = o + ihl
              if struct.unpack_from("!H", frame, u + 2)[0] != 2152:       # port GTP-U
                  return None
              g = u + 8
              flags, mtype = frame[g], frame[g + 1]
              if mtype != 0xFF:                                           # G-PDU (données) seulement
                  return None
              teid = struct.unpack_from("!I", frame, g + 4)[0]
              p = g + 8
              if flags & 0x07:                                            # champs optionnels
                  nxt = frame[p + 3]
                  p += 4
                  while nxt:                                              # en-têtes d'extension
                      ln = frame[p] * 4
                      if ln == 0:
                          return None
                      nxt = frame[p + ln - 1]
                      p += ln
              if p + 20 > len(frame) or frame[p] >> 4 != 4:
                  return None
              ihl2 = (frame[p] & 0x0F) * 4
              lg = struct.unpack_from("!H", frame, p + 2)[0]
              tos = frame[p + 1]
              proto = frame[p + 9]
              src, dst = frame[p + 12:p + 16], frame[p + 16:p + 20]
              t = p + ihl2
              sport = dport = 0
              fl = 0
              if proto in (6, 17) and t + 4 <= len(frame):
                  sport, dport = struct.unpack_from("!HH", frame, t)
                  if proto == 6 and t + 14 <= len(frame):
                      fl = frame[t + 13]
              return teid, socket.inet_ntoa(src), socket.inet_ntoa(dst), proto, lg, fl, sport, dport, tos


          def features(pkts):
              """pkts : liste de (t, proto, lg, flags, sport, dport, dst, tos) ; le TOS n'est pas utilisé"""
              n = len(pkts)
              lens = [q[2] for q in pkts]
              m = sum(lens) / n
              sd = math.sqrt(sum((x - m) ** 2 for x in lens) / n)
              ts = sorted(q[0] for q in pkts)
              iat = [b - a for a, b in zip(ts, ts[1:])] or [0.0]
              mi = sum(iat) / len(iat)
              si = math.sqrt(sum((x - mi) ** 2 for x in iat) / len(iat))
              tcp = sum(1 for q in pkts if q[1] == 6)
              syn = sum(1 for q in pkts if q[1] == 6 and (q[3] & 0x02) and not (q[3] & 0x10))
              return [n, sum(lens), m, sd, max(lens),
                      tcp / n, sum(1 for q in pkts if q[1] == 17) / n, sum(1 for q in pkts if q[1] == 1) / n, syn / n,
                      len({q[5] for q in pkts}), len({q[4] for q in pkts}), len({q[6] for q in pkts}),
                      mi, si, sum(1 for x in lens if x < 100) / n]


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--mode", choices=["collect", "detect"], required=True)
              ap.add_argument("--iface", default="oai-cn5g")
              ap.add_argument("--upf", default="192.168.70.134")
              ap.add_argument("--bin", type=float, default=0.2)
              ap.add_argument("--duration", type=float, default=120)
              ap.add_argument("--out", required=True, help="CSV (collect) ou journal (detect)")
              ap.add_argument("--rcvbuf", type=int, default=1 << 20, help="taille de la file de réception (octets)")
              ap.add_argument("--model", default="")
              ap.add_argument("--xapp", default="127.0.0.1:9999")
              ap.add_argument("--summary", default="")
              ap.add_argument("--min-pkts", type=int, default=1, help="aucun verdict pour un intervalle de moins de N paquets")
              ap.add_argument("--verite", default="udp:5555,tcp:80",
                              help="paquets de vérité terrain « attaque » : protocole:port_destination, séparés par des virgules")
              ap.add_argument("--pktlog", default="", help="journal compressé des paquets (.csv.gz)")
              a = ap.parse_args()

              PROTO = {"udp": 17, "tcp": 6}
              verite = {(PROTO[x.split(":")[0]], int(x.split(":")[1])) for x in a.verite.split(",") if ":" in x}
              upf = socket.inet_aton(a.upf)
              s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(ETH_P_ALL))
              s.bind((a.iface, 0))
              # File d'attente BORNÉE : sous un flood de milliers de paquets/s, une grande file (32 Mo
              # auparavant) accumule des secondes de retard, et les verdicts portent alors sur du trafic
              # ancien. Une file de 1 Mo borne ce retard ; en cas de surcharge, le noyau écarte des
              # paquets (échantillonnage), ce qui ne change pas l'empreinte d'un flood.
              s.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, a.rcvbuf)
              # Filtre noyau (BPF) : seuls les paquets GTP-U (UDP 2152) destinés à l'UPF sont remontés
              # au programme (équivalent de « udp and dst host <upf> and dst port 2152 », tcpdump -dd).
              ip_upf = struct.unpack("!I", upf)[0]
              bpf = [(0x28, 0, 0, 0x0000000c), (0x15, 0, 10, 0x00000800), (0x30, 0, 0, 0x00000017),
                     (0x15, 0, 8, 0x00000011), (0x20, 0, 0, 0x0000001e), (0x15, 0, 6, ip_upf),
                     (0x28, 0, 0, 0x00000014), (0x45, 4, 0, 0x00001fff), (0xb1, 0, 0, 0x0000000e),
                     (0x48, 0, 0, 0x00000010), (0x15, 0, 1, 0x00000868), (0x06, 0, 0, 0x00040000),
                     (0x06, 0, 0, 0x00000000)]
              import ctypes
              prog = b"".join(struct.pack("HBBI", *ins) for ins in bpf)
              cbuf = ctypes.create_string_buffer(prog)
              fprog = struct.pack("HL", len(bpf), ctypes.addressof(cbuf))
              s.setsockopt(socket.SOL_SOCKET, 26, fprog)          # 26 = SO_ATTACH_FILTER
              s.settimeout(0.05)

              model, conn, seuil = None, None, 0.5
              if a.mode == "detect":
                  import joblib
                  charge = joblib.load(a.model)
                  if isinstance(charge, dict):          # modèle + seuil réglé sous budget de fausses alarmes
                      model, seuil = charge["modele"], float(charge["seuil"])
                  else:
                      model, seuil = charge, 0.5
                  print(f"modèle : {charge.get('algorithme', type(model).__name__) if isinstance(charge, dict) else type(model).__name__}, "
                        f"seuil {seuil:.4f}", flush=True)
                  h, p = a.xapp.split(":")
                  for _ in range(100):
                      try:
                          conn = socket.create_connection((h, int(p)), timeout=2)
                          break
                      except OSError:
                          time.sleep(0.2)
                  if conn is None:
                      print("xApp injoignable", file=sys.stderr)
              out = open(a.out, "w")
              if a.mode == "collect":
                  out.write("t,teid,ip," + ",".join(FEATURES) + ",n_marques\n")
              plog = gzip.open(a.pktlog, "wt", compresslevel=3) if a.pktlog else None
              if plog:
                  plog.write("t,teid,proto,len,flags,sport,dport,tos,dst\n")
              n_small = 0                    # intervalles écartés par --min-pkts
              n_rattrapage, n_sautes = 0, 0  # pauses de la boucle et intervalles perdus

              stop = [False]
              signal.signal(signal.SIGTERM, lambda *_: stop.__setitem__(0, True))
              signal.signal(signal.SIGINT, lambda *_: stop.__setitem__(0, True))

              buf, ip_of = {}, {}
              first_alarm, last_pkt, n_seen, n_alarm = {}, {}, {}, {}
              t0 = time.time()
              t_bin = t0 + a.bin
              while not stop[0] and time.time() - t0 < a.duration:
                  try:
                      frame = s.recv(65535)
                      now = time.time()
                      r = parse(frame, upf)
                      if r:
                          teid, src, dst, proto, lg, fl, sp, dp, tos = r
                          buf.setdefault(teid, []).append((now, proto, lg, fl, sp, dp, dst, tos))
                          if plog:
                              plog.write(f"{now:.6f},{teid},{proto},{lg},{fl},{sp},{dp},{tos},{dst}\n")
                          ip_of[teid] = src
                          last_pkt[teid] = now
                  except socket.timeout:
                      now = time.time()
                  if now < t_bin:
                      continue
                  # fin d'intervalle : une ligne par tunnel actif
                  for teid, pk in buf.items():
                      f = features(pk)
                      nm = sum(1 for q in pk if (q[1], q[5]) in verite)
                      if a.mode == "collect":
                          out.write(f"{t_bin:.3f},{teid},{ip_of[teid]}," + ",".join(f"{x:.6g}" for x in f) + f",{nm}\n")
                          continue
                      if len(pk) < a.min_pkts:
                          n_small += 1
                          continue
                      pr = float(model.predict_proba([f])[0][1])
                      v = int(pr >= seuil)
                      t_us = int(time.time() * 1e6)
                      n_seen[teid] = n_seen.get(teid, 0) + 1
                      if v:
                          n_alarm[teid] = n_alarm.get(teid, 0) + 1
                          first_alarm.setdefault(teid, t_us)
                      ligne = f"V {t_us} {teid} {ip_of[teid]} {v} {pr:.3f} {len(pk)} {nm}\n"   # paquets de l'intervalle, dont marqués
                      out.write(ligne)
                      if conn:
                          try:
                              conn.sendall(ligne.encode())
                          except OSError:
                              conn = None
                  out.flush()
                  buf = {}
                  t_bin += a.bin
                  if t_bin < now:                       # rattrapage après une pause
                      n_rattrapage += 1
                      n_sautes += int((now - t_bin) / a.bin) + 1
                      t_bin = now + a.bin
              out.close()
              if plog:
                  plog.close()
              if a.summary:
                  res = {str(k): dict(ip=ip_of.get(k), first_alarm_us=first_alarm.get(k),
                                      last_pkt_us=int(last_pkt[k] * 1e6), bins=n_seen.get(k, 0),
                                      alarms=n_alarm.get(k, 0)) for k in last_pkt}
                  res["_boucle"] = dict(min_pkts=a.min_pkts, intervalles_ecartes_min_pkts=n_small,
                                        rattrapages=n_rattrapage, intervalles_sautes=n_sautes, bin_s=a.bin)
                  json.dump(res, open(a.summary, "w"), indent=2)


          if __name__ == "__main__":
              main()
          IDS_EOF
          cat > "$WORK/py/train_xml5g.py" <<'TRAIN_EOF'
          #!/usr/bin/env python3
          """
          xML5G - entraînement du détecteur de la boucle sur le trafic de la plateforme (phase 2).

          Le MODÈLE et la RÈGLE DE SEUIL sont ceux retenus par l'étude sur les jeux publics (E1) :
          XGBoost, mêmes hyperparamètres, seuil choisi sur une validation prélevée dans
          l'entraînement, qui maximise le F1 sous un budget de fausses alarmes de 0,5 %.
          Seules les données changent : le trafic de la plateforme, comme dans le PFE.

          Deux sessions (A et B) contiennent chacune les deux attaques (SYN et UDP), lancées
          par des UEs différents. Évaluation croisée A->B et B->A, puis modèle final sur A+B.
          Le modèle est enregistré avec son seuil : {"modele", "seuil", "algorithme"}.

          Phase 3 : si le CSV contient la colonne n_marques (paquets de vérité terrain comptés par
          ids_xml5g.py), un intervalle est « attaque » quand au moins la moitié de ses paquets en
          viennent ; l'ancienne règle (fenêtre + traîne sur frac_small) n'est plus qu'une
          comparaison, rapportée dans les métriques (remarque M6 : étiquetage non circulaire).
          """
          import argparse, json
          import numpy as np, pandas as pd, joblib
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import confusion_matrix, f1_score, roc_curve

          FEATURES = ["n_pkts", "n_bytes", "mean_len", "std_len", "max_len",
                      "frac_tcp", "frac_udp", "frac_icmp", "frac_syn",
                      "n_dst_ports", "n_src_ports", "n_dst_ips",
                      "mean_iat", "std_iat", "frac_small"]
          BUDGET_FPR = 0.005          # identique à l'étude E1
          XGB_PARAMS = dict(n_estimators=250, max_depth=8, learning_rate=0.1, subsample=0.8,
                            colsample_bytree=0.8, random_state=42, eval_metric="logloss",
                            tree_method="hist", n_jobs=-1)          # identiques à l'étude E1
          try:
              from xgboost import XGBClassifier
              ALGO = "XGBoost"
          except ImportError:                                        # repli signalé dans le bilan
              from sklearn.ensemble import RandomForestClassifier
              ALGO = "RandomForest (repli : xgboost indisponible)"


          def modele():
              if ALGO == "XGBoost":
                  return XGBClassifier(**XGB_PARAMS)
              return RandomForestClassifier(n_estimators=250, max_depth=20, min_samples_leaf=2,
                                            n_jobs=-1, random_state=42)


          def charger(csv, evts, bin_s):
              """Étiquetage du trafic d'attaque RÉELLEMENT observé à l'UPF.

              hping3 envoie en rafale ; l'UPF traite ces paquets avec du retard, si bien que le
              trafic d'attaque continue d'arriver bien après la fin de la fenêtre théorique. On
              marque « attaque » un intervalle de l'IP attaquante qui, dans la fenêtre ou juste
              après (jusqu'à GRACE s), présente une empreinte de flood (fraction de petits paquets
              élevée). Le trafic bénin (gros paquets iperf3) n'est jamais marqué : la règle ne
              peut donc pas transformer du bénin en attaque."""
              GRACE = 60.0        # tolérance après la fin de la fenêtre théorique (s)
              FLOOD_FRAC_SMALL = 0.8
              d = pd.read_csv(csv)
              ev = [json.loads(l) for l in open(evts) if l.strip()]
              c = d["t"].values - bin_s / 2
              small = d["frac_small"].values if "frac_small" in d.columns else np.zeros(len(d))
              y = np.zeros(len(d), dtype=int)
              for e in ev:
                  ip = (d["ip"].values == e["ip"])
                  dans = ip & (c >= e["start"]) & (c <= e["end"])                       # fenêtre théorique
                  tail = ip & (c > e["end"]) & (c <= e["end"] + GRACE) & (small >= FLOOD_FRAC_SMALL)  # rafale en retard
                  y |= (dans | tail).astype(int)
              d["label_fenetre"] = y
              if "n_marques" in d.columns:
                  d["label"] = (d["n_marques"].values >= 0.5 * d["n_pkts"].values).astype(int)
              else:
                  d["label"] = y
              return d


          def accord(d):
              """Comparaison des deux étiquetages (vérité terrain contre fenêtre + traîne)."""
              if "n_marques" not in d.columns:
                  return {"methode": "fenêtre + traîne (pas de vérité terrain)"}
              a, b = d["label"].values, d["label_fenetre"].values
              return {"methode": "vérité terrain (n_marques >= 50 % des paquets)",
                      "attaque_verite": int(a.sum()), "attaque_fenetre": int(b.sum()),
                      "fenetre_mais_pas_verite": int(((b == 1) & (a == 0)).sum()),
                      "verite_mais_pas_fenetre": int(((a == 1) & (b == 0)).sum())}


          def seuil_sous_budget(y, p, budget=BUDGET_FPR):
              """Seuil qui maximise le F1 parmi ceux qui tiennent le budget de fausses alarmes."""
              fv, tv, th = roc_curve(y, p, drop_intermediate=False)
              P = int(y.sum()); N = len(y) - P
              tp, fp = tv * P, fv * N
              f1 = np.divide(2 * tp, tp + fp + P, out=np.zeros_like(tp), where=(tp + fp + P) > 0)
              ok = np.where(fv <= budget)[0]
              if len(ok) == 0:
                  return float(th[np.argmax(tv - fv)]), "Youden (budget intenable)"
              return float(min(th[ok[np.argmax(f1[ok])]], 1.0)), f"F1 max sous FPR <= {budget:.1%}"


          def entrainer(d):
              """Validation prélevée dans l'entraînement (15 %, stratifiée) pour régler le seuil."""
              X, y = d[FEATURES].values, d.label.values
              i_fit, i_val = train_test_split(np.arange(len(y)), test_size=0.15, stratify=y, random_state=42)
              m = modele().fit(X[i_fit], y[i_fit])
