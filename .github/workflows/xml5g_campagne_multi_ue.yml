          # essai préalable du profil léger : gNB attaché à l'AMF et au RIC, puis UE1 attaché
          PROFIL=106PRB; GNB_CONF="$CONF106"; UE_RF="-r 106 --numerology 1 --band 78 -C 3619200000"
          if [ "${PROFIL_FORCE:-}" = 106PRB ]; then
