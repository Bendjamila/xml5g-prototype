          elif lancer_gnb "$LIGHT" "_essai_leger"; then
            creer_ue 1
            grep -m1 "Command line parameters for OAI UE" "$LOGS/11_gnb_essai_leger.log" | sed 's/^.*Command line/ue_leger_selon_gnb=Command line/' >> "$LOGS/09_etapes.txt"
            sudo setsid nohup stdbuf -oL -eL ip netns exec ue1 "$B/nr-uesoftmodem" -O "$WORK/ue1.conf" -r 25 --numerology 0 --band 66 -C 2152680000 --CO -400000000 --ssb 48 --rfsim '--rfsimulator.[0].serveraddr' "10.201.1.100" > "$LOGS/12_ue1_essai_leger.log" 2>&1 < /dev/null &
