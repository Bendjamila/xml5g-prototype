            cat > /dev/null <<UECONF_EOF
          uicc0 = {
          imsi = "00101000000000$k";
          key = "fec86ba6eb707ed08905757b1bb44b8f";
          opc= "C42449363BBAD02B66D16BC975D77CC1";
          pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
          }
          UECONF_EOF
            ip_ue=""
            for essai in 1 2 3; do
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              sleep 5
              for i in $(seq 1 40); do
                ip_ue=$(sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | grep oaitun | awk '{print $4}' | cut -d/ -f1)
                [ -n "$ip_ue" ] && break
                pgrep -f "ue$k.conf" > /dev/null || break
                sleep 3
              done
              [ -n "$ip_ue" ] && break
              sudo pkill -f "ue$k.conf" || true; sleep 15
            done
            echo "UE$k adresse ${ip_ue:-aucune}"; echo "ue${k}_ip=${ip_ue:-aucune}" >> "$LOGS/09_etapes.txt"
            if [ -n "$ip_ue" ]; then
              # sans cette route, le trafic de l'UE vers le réseau de données n'a aucun chemin
              # (« Network is unreachable ») : ni trafic bénin, ni attaque, rien dans le tunnel GTP-U
              tun=$(sudo ip netns exec ue$k ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
              sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
              sudo ip netns exec ue$k ip route | sed "s/^/ue$k route: /" >> "$LOGS/09_routes.txt"
              if sudo ip netns exec ue$k ping -c 3 -W 3 192.168.70.135 > "$LOGS/09_ping_ue$k.txt" 2>&1; then
                echo "ue${k}_ping=ok" >> "$LOGS/09_etapes.txt"
              else
                echo "ue${k}_ping=echec" >> "$LOGS/09_etapes.txt"; echo "::error::UE$k ne joint pas le réseau de données (voir 09_ping_ue$k.txt)"
              fi
            fi
            [ -n "$ip_ue" ] && UES="${UES:+$UES,}ue$k:$ip_ue"
            sleep 20
          done
          }
          if [ "${SANS_UES:-non}" = oui ]; then   # tranches d'essais : les UE sont connectés essai par essai (campagne.sh)
            echo "UES=" >> "$GITHUB_ENV"; echo "nb_ue=0 (connexion essai par essai)" >> "$LOGS/09_etapes.txt"
            exit 0
          fi
          connecter_ues
          if [ "$(echo "$UES" | tr ',' '\n' | grep -c .)" -lt 2 ]; then
            # seconde chance : tout le cœur (sauf la base) recréé, gNB et UE relancés
            echo "::warning::UE non connectés : recréation du cœur 5G et nouvel essai"
            etat_coeur ues_etape7_essai1
            sudo pkill -f nr-uesoftmodem; sudo pkill -f nr-softmodem; sleep 5
            reparer_coeur ues_etape7 complet
            lancer_gnb "$GNB_CONF" "" || echo "::error::le gNB ne s'attache pas à l'AMF ou au RIC"
            poser_goulot
            sed -i '/^ue[12]_\(ip\|ping\)=/d' "$LOGS/09_etapes.txt"; echo "ues_seconde_chance=oui" >> "$LOGS/09_etapes.txt"
            connecter_ues
          fi
          echo "UES=$UES" >> "$GITHUB_ENV"
          echo "les deux UEs : $UES"
          n_ue=$(echo "$UES" | tr ',' '\n' | grep -c . )
          echo "nb_ue=$n_ue" >> "$LOGS/09_etapes.txt"
          [ "$n_ue" -eq 2 ] || echo "::error::seulement $n_ue UE(s) connecté(s) sur 2 : la suite ne peut pas fonctionner"
          [ "$n_ue" -eq 2 ] || etat_coeur fin_etape7
          PLAT_F4_EOF
          cat > "$WORK/py/bilan_faisabilite.py" <<'BILAN_F4_EOF'
          #!/usr/bin/env python3
          """
          xML5G - bilan du test de faisabilité à plusieurs UE (novembre 2026).

          Lit les journaux d'UNE configuration (un dossier de journaux de campagne.sh) et écrit :
            F_bilan.json   toutes les mesures, essai par essai et résumées ;
            F_bilan.md     le résumé lisible.
          Avec --synthese D1 D2 ... : réunit les F_bilan.json de plusieurs configurations dans un tableau.

          Aucune dépendance hors de la bibliothèque standard. Les définitions suivent celles de la campagne finale :
            - un verdict est « d'attaque » si son intervalle de 0,2 s contient au moins un paquet d'inondation
              (8e champ de la ligne V du détecteur) ;
            - une libération est comptée quand la xApp journalise RELEASE ... result=ACK ;
            - le délai de libération est mesuré, comme dans l'article, du premier paquet d'inondation arrivé au N3
              (heure du noyau, colonne tk du journal de paquets 68_pkt_*.csv.gz) à l'acquittement E2 de la libération ;
              le délai depuis le LANCEMENT de l'outil d'inondation (62_ev_*.jsonl) est donné en plus.
          """
          import argparse, csv, glob, gzip, json, os, re, statistics, sys

          RE_REL = re.compile(r"\[XML5G\] RELEASE ran_ue_id=(\d+) policy=\S+ t_first_alarm_rx_us=(-?\d+) t_decision_us=(\d+) "
                              r"t_ctrl_send_us=(\d+) t_ctrl_ack_us=(\d+) result=(\S+)")
          RE_WOULD = re.compile(r"\[XML5G\] WOULD_RELEASE ran_ue_id=(\d+) t_us=(\d+)")
          RE_XV = re.compile(r"\[XML5G\] V t_rx_us=(\d+) teid=(\d+) ran_ue_id=(\d+) v=(\d)")
          RE_HDR = re.compile(r"\[XML5G\] policy=(\S+) W=(\d+) theta=([\d.]+) K=(\d+)")
          RE_PING = re.compile(r"^\[(\d+\.\d+)\].*time=([\d.]+) ms")


          def ouvrir(p):
              return open(p, encoding="utf-8", errors="replace") if os.path.exists(p) else None


          def med(v):
              v = [x for x in v if x is not None]
              return statistics.median(v) if v else None


          def arr(x, d=1):
              return None if x is None else round(x, d)


          def lire_etapes(d):
              r = {}
              f = ouvrir(os.path.join(d, "09_etapes.txt"))
              if f:
                  for l in f:
                      if "=" in l:
                          k, v = l.strip().split("=", 1)
                          r.setdefault(k, v)
              return r


          def lire_validite(d):
              r = {}
              f = ouvrir(os.path.join(d, "63_validite.txt"))
              if f:
                  for l in f:
                      p = l.split()
                      if len(p) >= 2:
                          r[p[0]] = (p[1] == "valide", " ".join(p[2:]))
              return r


          def lire_roles(d):
              r = {}
              f = ouvrir(os.path.join(d, "63_ues_par_politique.txt"))
              if f:
                  for l in f:
                      m = re.match(r"^(\S+) : attaquants=(\S*) b\S*nins=(\S*)", l.strip())
                      if not m:
                          continue
                      x = {}
                      for grp, role in ((m.group(2), "attaquant"), (m.group(3), "benin")):
                          for u in grp.split(","):
                              if ":" in u:
                                  ns, ip = u.split(":", 1)
                                  x[ip] = (role, ns)
                      r[m.group(1)] = x
              return r


          def lire_ids(p):
              ver, tip, sauts = {}, {}, 0
              f = ouvrir(p)
              if not f:
                  return ver, tip, sauts
              for l in f:
                  q = l.split()
                  if not q:
                      continue
                  if q[0] == "V" and len(q) >= 8:
                      try:
                          t = int(q[1]) / 1e6; teid = int(q[2]); ip = q[3]; v = int(q[4]); nfl = int(q[7])
                          lag = int(q[9]) / 1e6 if len(q) > 9 else None
                      except ValueError:
                          continue
                      tip[teid] = ip
                      ver.setdefault(ip, []).append((t, v, nfl, lag))
                  elif q[0] == "S" and len(q) >= 3:
                      try:
                          sauts += int(q[2])
                      except ValueError:
                          pass
              for ip in ver:
                  ver[ip].sort()
              return ver, tip, sauts


          def lire_xapp(p):
              x = dict(hdr=None, rel=[], would=[], ran_teid={}, connecte=False)
              f = ouvrir(p)
              if not f:
                  return x
              for l in f:
                  if "[XML5G]" not in l:
                      continue
                  m = RE_XV.search(l)
                  if m:
                      x["ran_teid"].setdefault(int(m.group(3)), set()).add(int(m.group(2)))
                      continue
                  m = RE_REL.search(l)
                  if m:
                      x["rel"].append(dict(ran=int(m.group(1)), t_dec=int(m.group(3)) / 1e6, t_ack=int(m.group(5)) / 1e6,
                                           ok=m.group(6) == "ACK"))
                      continue
                  m = RE_WOULD.search(l)
                  if m:
                      x["would"].append((int(m.group(1)), int(m.group(2)) / 1e6))
                      continue
                  m = RE_HDR.search(l)
                  if m:
                      x["hdr"] = dict(W=int(m.group(2)), K=int(m.group(4)))
                      continue
                  if "détecteur connecté" in l:
                      x["connecte"] = True
              return x


          def lire_ev(p):
              att = {}
              f = ouvrir(p)
              if not f:
                  return att
              for l in f.read().strip().splitlines():
                  try:
                      e = json.loads(l)
                  except ValueError:
                      continue
                  if isinstance(e, dict) and "start" in e and e.get("ip") and not e.get("benign"):
                      att[e["ip"]] = (float(e["start"]), float(e.get("end", e["start"])), e.get("type", ""))
              return att


          def lire_pidstat(p):
              """moyenne, sur les secondes de l'essai, du %CPU cumulé par commande ; %wait du détecteur"""
              f = ouvrir(p)
              if not f:
                  return {}
              par_t, attente = {}, []
              for l in f:
                  q = l.split()
                  if len(q) < 15 or q[0].startswith("#") or q[0] == "Linux":
                      continue
                  k = 2 if q[1] in ("AM", "PM") else 1
                  try:
                      wait, cpu = float(q[k + 5]), float(q[k + 6])
                  except (ValueError, IndexError):
                      continue
                  cmd = q[-1]
                  par_t.setdefault(q[0], {}).setdefault(cmd, 0.0)
                  par_t[q[0]][cmd] += cpu
                  if cmd == "python3":
                      attente.append(wait)
              r = {}
              for cmd in ("nr-softmodem", "nr-uesoftmodem", "python3", "xapp_xml5g"):
                  v = [x[cmd] for x in par_t.values() if cmd in x]
                  if v:
                      r[cmd] = sum(v) / len(v)
              if attente:
                  r["attente_detecteur"] = sum(attente) / len(attente)
              return r


          def lire_cpu(p):
              """part du temps processeur occupée (tous cœurs) entre les deux relevés de /proc/stat"""
              f = ouvrir(p)
              if not f:
                  return None
              v = {}
              for l in f:
                  q = l.split()
                  if len(q) >= 10 and q[2] == "cpu":
                      try:
                          v[q[0]] = [int(x) for x in q[3:11]]
                      except ValueError:
                          pass
              if "avant" not in v or "apres" not in v:
                  return None
              d = [b - a for a, b in zip(v["avant"], v["apres"])]
              tot = sum(d)
              return None if tot <= 0 else 100.0 * (tot - d[3] - d[4]) / tot      # hors idle et iowait


          def lire_rtt(p):
              r = []
              f = ouvrir(p)
              if f:
                  for l in f:
                      m = RE_PING.match(l)
                      if m:
                          r.append((float(m.group(1)), float(m.group(2))))
              return r


          VERITE = {(17, 5555), (6, 80)}          # paquets d'inondation du scénario : UDP 5555 et TCP 80


          def lire_paquets(p):
              """par teid : [premier paquet d'inondation au N3, dernier, nombre de paquets d'inondation, nombre total]"""
              res = {}
              if not os.path.exists(p):
                  return res
              try:
                  with gzip.open(p, "rt", errors="replace") as f:
                      tete = (next(f, "") or "").strip().split(",")
                      i_tk = tete.index("tk") if "tk" in tete else None
                      for l in f:
                          q = l.split(",")
                          if len(q) < 7:
                              continue
                          try:
                              t, teid, proto, dport = float(q[0]), int(q[1]), int(q[2]), int(q[6])
                              tk = float(q[i_tk]) if i_tk is not None and len(q) > i_tk and q[i_tk].strip() else 0.0
                          except ValueError:
                              continue
                          r = res.setdefault(teid, [None, None, 0, 0])
                          r[3] += 1
                          if (proto, dport) in VERITE:
                              h = tk if tk > 0 else t
                              r[2] += 1
                              if r[0] is None or h < r[0]:
                                  r[0] = h
                              if r[1] is None or h > r[1]:
                                  r[1] = h
              except (OSError, EOFError):
                  pass                                  # archive tronquée (arrêt brutal) : on garde ce qui a été lu
              return res


          def rejouer(seq, w, k):
              """instant où « k des w derniers verdicts » se déclenche (fenêtre pleine exigée, comme la xApp), sinon None"""
              for i in range(w, len(seq) + 1):
                  if sum(v for _, v, _, _ in seq[i - w:i]) >= k:
                      return seq[i - 1][0]
              return None


          def analyser_essai(d, meta, roles, validite):
              run = meta["essai"]
              ver, tip, sauts = lire_ids(os.path.join(d, f"61_ids_{run}.log"))
              xa = lire_xapp(os.path.join(d, f"60_xapp_{run}.log"))
              att = lire_ev(os.path.join(d, f"62_ev_{run}.jsonl"))
              pq = {}
              for teid, r in lire_paquets(os.path.join(d, f"68_pkt_{run}.csv.gz")).items():
                  if teid in tip and r[2]:
                      x = pq.setdefault(tip[teid], [r[0], r[1], 0])
                      x[0] = min(x[0], r[0]); x[1] = max(x[1], r[1]); x[2] += r[2]
              ran_ip = {}
              for ran, teids in xa["ran_teid"].items():
                  for t in teids:
                      if t in tip:
                          ran_ip[ran] = tip[t]
              rel = {}
              for r in xa["rel"]:
                  if r["ok"] and r["ran"] in ran_ip:
                      rel.setdefault(ran_ip[r["ran"]], r["t_ack"])
              rel_sans_ip = sum(1 for r in xa["rel"] if r["ok"] and r["ran"] not in ran_ip)
              duree = float(meta.get("duree_s") or 55)
              ues = []
              t_debut = min((s[0][0] for s in ver.values() if s), default=None)
              for ip, (role, ns) in sorted((roles.get(run) or {}).items(), key=lambda z: z[1][1]):
                  seq = ver.get(ip, [])
                  a = att.get(ip)
                  va = [x for x in seq if x[2] > 0]
                  vh = [x for x in seq if x[2] == 0]
                  u = dict(ns=ns, ip=ip, role=role, type=a[2] if a else "", verdicts=len(seq), alarmes=sum(x[1] for x in seq),
                           verdicts_attaque=len(va), alarmes_attaque=sum(x[1] for x in va),
                           verdicts_benins=len(vh), alarmes_benignes=sum(x[1] for x in vh),
                           libere=ip in rel, delai_liberation_s=None, delai_depuis_lancement_s=None,
                           attaque_duree_s=arr(a[1] - a[0], 1) if a else None,
                           paquets_inondation_n3=pq[ip][2] if ip in pq else 0,
                           debit_inondation_pps=arr(pq[ip][2] / max(0.2, pq[ip][1] - pq[ip][0]), 0) if ip in pq else None,
                           inondation_apres_acquittement_s=None)
                  if ip in rel and a:
                      u["delai_depuis_lancement_s"] = arr(rel[ip] - a[0], 2)
                  if ip in rel and ip in pq:
                      u["delai_liberation_s"] = arr(rel[ip] - pq[ip][0], 2)
                      u["inondation_apres_acquittement_s"] = arr(max(0.0, pq[ip][1] - rel[ip]), 2)
                  for nom, (w, k) in (("7sur10", (10, 7)), ("7sur14", (14, 7))):
                      t = rejouer(seq, w, k)
                      u[f"rejeu_{nom}"] = t is not None
                      u[f"rejeu_{nom}_delai_s"] = arr(t - pq[ip][0], 2) if (t is not None and ip in pq) else None
                  # RTT de l'UE : avant toute attaque, puis pendant (jusqu'à la première libération s'il y en a une)
                  rtt = []
                  for pref in ("62_ev", "69_benin"):
                      rtt += lire_rtt(os.path.join(d, f"{pref}_{run}_rtt_{ns}.txt"))
                  if rtt and att:
                      t0 = min(x[0] for x in att.values()); t1 = max(x[1] for x in att.values())
                      u["rtt_avant_ms"] = arr(med([m for t, m in rtt if t < t0]), 1)
                      u["rtt_pendant_ms"] = arr(med([m for t, m in rtt if t0 + 2 <= t <= t1]), 1)
                  elif rtt:
                      u["rtt_avant_ms"] = arr(med([m for _, m in rtt]), 1)
                  ues.append(u)
              ps = lire_pidstat(os.path.join(d, f"65_pidstat_{run}.txt"))
              nue = max(1, len(ues))
              retards = [x[3] for s in ver.values() for x in s if x[3] is not None]
              ok, raison = validite.get(run, (False, "non terminé"))
              return dict(essai=run, scenario=meta["scenario"], politique=meta["politique"], valide=ok, raison=raison,
                          regle=xa["hdr"], ues=ues, liberations_sans_adresse=rel_sans_ip,
                          verdicts_par_ue_s=arr(sum(len(s) for s in ver.values()) / nue / duree, 2) if ver else None,
                          intervalles_sautes=sauts, retard_median_s=arr(med(retards), 2), retard_max_s=arr(max(retards), 1) if retards else None,
                          cpu_gnb=arr(ps.get("nr-softmodem")), cpu_ues=arr(ps.get("nr-uesoftmodem")), cpu_detecteur=arr(ps.get("python3")),
                          attente_detecteur=arr(ps.get("attente_detecteur")), machine_occupee_pct=arr(lire_cpu(os.path.join(d, f"66_cpu_{run}.txt"))))


          def frac(a, b):
              return f"{a}/{b}" if b else "—"


          def pct(a, b):
              return None if not b else round(100.0 * a / b, 1)


          def resumer(d):
              et = lire_etapes(d)
              tr = {}
              p = os.path.join(d, "63_tranche.json")
              if os.path.exists(p):
                  try:
                      tr = json.load(open(p, encoding="utf-8"))
                  except ValueError:
                      tr = {}
              validite, roles = lire_validite(d), lire_roles(d)
              essais = []
              p = os.path.join(d, "63_essais.csv")
              if os.path.exists(p):
                  for m in csv.DictReader(open(p, encoding="utf-8")):
                      essais.append(analyser_essai(d, m, roles, validite))
              lances = len(validite)
              invalides = {}
              for run, (ok, raison) in validite.items():
                  if not ok:
                      invalides[raison or "?"] = invalides.get(raison or "?", 0) + 1
              val = [e for e in essais if e["valide"]]
              cases = {}
              for e in val:
                  c = cases.setdefault(f"{e['scenario']}/{e['politique']}", dict(n=0, att=0, att_lib=0, ben=0, ben_lib=0, delais=[],
                                                                                rejeu10_att=0, rejeu14_att=0, rejeu10_ben=0, rejeu14_ben=0,
                                                                                delais10=[], delais14=[]))
                  c["n"] += 1
                  for u in e["ues"]:
                      if u["role"] == "attaquant":
                          c["att"] += 1; c["att_lib"] += u["libere"]
                          if u["delai_liberation_s"] is not None:
                              c["delais"].append(u["delai_liberation_s"])
                          if u["debit_inondation_pps"] is not None:
                              c.setdefault("pps", {}).setdefault(u["type"], []).append(u["debit_inondation_pps"])
                          c["rejeu10_att"] += u["rejeu_7sur10"]; c["rejeu14_att"] += u["rejeu_7sur14"]
                          if u["rejeu_7sur10_delai_s"] is not None:
                              c["delais10"].append(u["rejeu_7sur10_delai_s"])
                          if u["rejeu_7sur14_delai_s"] is not None:
                              c["delais14"].append(u["rejeu_7sur14_delai_s"])
                      else:
                          c["ben"] += 1; c["ben_lib"] += u["libere"]
                          c["rejeu10_ben"] += u["rejeu_7sur10"]; c["rejeu14_ben"] += u["rejeu_7sur14"]
              for c in cases.values():
                  c["debit_inondation_pps"] = {k: arr(med(x), 0) for k, x in c.pop("pps", {}).items()}
                  c["delai_median_s"] = arr(med(c.pop("delais")), 1)
                  c["rejeu10_delai_median_s"] = arr(med(c.pop("delais10")), 1)
                  c["rejeu14_delai_median_s"] = arr(med(c.pop("delais14")), 1)
              # détection au niveau du verdict, par type d'inondation, sur tous les essais valides (avant libération)
              det = {}
              fa = [0, 0]
              for e in val:
                  for u in e["ues"]:
                      if u["role"] == "attaquant" and u["type"]:
                          x = det.setdefault(u["type"], [0, 0]); x[0] += u["alarmes_attaque"]; x[1] += u["verdicts_attaque"]
                      fa[0] += u["alarmes_benignes"]; fa[1] += u["verdicts_benins"]
              ben_att = [u for e in val for u in e["ues"] if u["role"] == "benin" and e["scenario"] not in ("flash", "benin")]
              return dict(
                  config=tr.get("id") or os.path.basename(os.path.normpath(d)), nue=tr.get("nue") or et.get("nue"),
                  charge=tr.get("charge"), profil_demande=tr.get("profil"), profil_obtenu=et.get("profil_radio"),
                  ue_leger_selon_gnb=et.get("ue_leger_selon_gnb"), campagne=et.get("campagne"),
                  essais_lances=lances, essais_valides=sum(1 for v in validite.values() if v[0]), invalides=invalides,
                  cases=cases,
                  detection_verdicts={k: dict(alarmes=v[0], verdicts=v[1], pct=pct(*v)) for k, v in det.items()},
                  fausses_alarmes=dict(alarmes=fa[0], verdicts=fa[1], pct=pct(*fa)),
                  verdicts_par_ue_s=arr(med([e["verdicts_par_ue_s"] for e in val]), 2),
                  intervalles_sautes_median=med([e["intervalles_sautes"] for e in val]),
                  retard_median_s=arr(med([e["retard_median_s"] for e in val]), 2),
                  cpu_gnb=arr(med([e["cpu_gnb"] for e in val])), cpu_ues=arr(med([e["cpu_ues"] for e in val])),
                  cpu_detecteur=arr(med([e["cpu_detecteur"] for e in val])), attente_detecteur=arr(med([e["attente_detecteur"] for e in val])),
                  machine_occupee_pct=arr(med([e["machine_occupee_pct"] for e in val])),
                  rtt_benin_avant_ms=arr(med([u.get("rtt_avant_ms") for u in ben_att]), 1),
                  rtt_benin_pendant_ms=arr(med([u.get("rtt_pendant_ms") for u in ben_att]), 1),
                  essais=essais)


          def v(x, suf=""):
              return "—" if x is None else f"{x}{suf}"


          def markdown(b):
              L = [f"### Configuration {b['config']} : {v(b['nue'])} UE, profil radio demandé {v(b['profil_demande'])}, obtenu {v(b['profil_obtenu'])}, charge {v(b['charge'])}", ""]
              if b.get("profil_demande") and b.get("profil_obtenu") and b["profil_demande"] != b["profil_obtenu"]:
                  L += [f"**Le profil radio demandé ({b['profil_demande']}) n'a pas fonctionné.** Les essais n'ont pas été lancés.", ""]
              L += [f"- Essais lancés : {b['essais_lances']} ; valides : {b['essais_valides']}"
                    + (" ; invalides : " + ", ".join(f"{k} × {n}" for k, n in b["invalides"].items()) if b["invalides"] else ""),
                    f"- Verdicts par UE et par seconde (médiane) : {v(b['verdicts_par_ue_s'])} ; intervalles sautés par essai : {v(b['intervalles_sautes_median'])} ; retard médian d'un verdict : {v(b['retard_median_s'], ' s')}",
                    f"- Processeur (% d'un cœur, médiane) : gNB {v(b['cpu_gnb'])}, tous les UE {v(b['cpu_ues'])}, détecteur {v(b['cpu_detecteur'])} (en attente du processeur {v(b['attente_detecteur'], ' %')}) ; machine occupée à {v(b['machine_occupee_pct'], ' %')}",
                    "- Détection au niveau du verdict : " + (", ".join(f"{k} {x['alarmes']}/{x['verdicts']} ({v(x['pct'], ' %')})" for k, x in sorted(b["detection_verdicts"].items())) or "—")
                    + f" ; fausses alarmes {b['fausses_alarmes']['alarmes']}/{b['fausses_alarmes']['verdicts']} ({v(b['fausses_alarmes']['pct'], ' %')})",
                    f"- RTT de l'UE bénin pendant l'attaque (médiane) : {v(b['rtt_benin_avant_ms'], ' ms')} avant, {v(b['rtt_benin_pendant_ms'], ' ms')} pendant", ""]
              if b["cases"]:
                  L += ["Délais : du premier paquet d'inondation au N3 à l'acquittement E2 (libération) ou au déclenchement de la règle (rejeu sur les verdicts de l'essai).", "",
                        "| Scénario / politique | Essais valides | Attaquants libérés | UE bénins libérés | Délai médian (s) | Inondation au N3 (paquets/s) | Rejeu 7 sur 10 : attaquants, bénins | Rejeu 7 sur 14 : attaquants, bénins |",
                        "|---|---|---|---|---|---|---|---|"]
                  for k in sorted(b["cases"]):
                      c = b["cases"][k]
                      pps = ", ".join(f"{t} {int(x)}" for t, x in sorted(c["debit_inondation_pps"].items()) if x is not None) or "—"
                      L.append(f"| {k} | {c['n']} | {frac(c['att_lib'], c['att'])} | {frac(c['ben_lib'], c['ben'])} | {v(c['delai_median_s'])} | {pps} | "
                               f"{frac(c['rejeu10_att'], c['att'])}, {frac(c['rejeu10_ben'], c['ben'])} ({v(c['rejeu10_delai_median_s'], ' s')}) | "
                               f"{frac(c['rejeu14_att'], c['att'])}, {frac(c['rejeu14_ben'], c['ben'])} ({v(c['rejeu14_delai_median_s'], ' s')}) |")
                  L.append("")
              return "\n".join(L)


          def synthese(dossiers, sortie):
              B = []
              for d in dossiers:
                  for p in sorted(glob.glob(os.path.join(d, "**", "F_bilan.json"), recursive=True)):
                      try:
                          B.append(json.load(open(p, encoding="utf-8")))
                      except ValueError:
                          pass
              B.sort(key=lambda b: str(b.get("config")))
              L = ["# xML5G — test de faisabilité à plusieurs UE", "",
                   "Référence (campagne finale, 2 UE, 106 PRB) : environ 1,5 verdict par UE et par seconde ; un attaquant, libéré dans 33 essais sur 33 par 7 sur 10.", "",
                   "| Configuration | UE | Profil obtenu | Essais valides / lancés | Verdicts par UE et par s | Machine occupée | multi, 7 sur 10 : attaquants libérés, bénins libérés | multi, 7 sur 14 : attaquants libérés, bénins libérés | foule bénigne : bénins libérés (7 sur 10, 7 sur 14) |",
                   "|---|---|---|---|---|---|---|---|---|"]

              def case(b, k):
                  c = b["cases"].get(k)
                  return "—" if not c else f"{frac(c['att_lib'], c['att'])}, {frac(c['ben_lib'], c['ben'])}"

              def foule(b, k):
                  c = b["cases"].get(k)
                  return "—" if not c else frac(c["ben_lib"], c["ben"])
              for b in B:
                  sc = "multi" if any(k.startswith("multi/") for k in b["cases"]) else "udp"
                  L.append(f"| {b['config']} | {v(b['nue'])} | {v(b['profil_obtenu'])} | {b['essais_valides']} / {b['essais_lances']} | {v(b['verdicts_par_ue_s'])} | "
                           f"{v(b['machine_occupee_pct'], ' %')} | {case(b, sc + '/xml5g')}{' (udp)' if sc == 'udp' else ''} | {case(b, sc + '/xml5g714')} | "
                           f"{foule(b, 'flash/xml5g')}, {foule(b, 'flash/xml5g714')} |")
              L.append("")
              for b in B:
                  L.append(markdown(b))
              os.makedirs(sortie, exist_ok=True)
              open(os.path.join(sortie, "FAISABILITE.md"), "w", encoding="utf-8").write("\n".join(L) + "\n")
              json.dump(B, open(os.path.join(sortie, "FAISABILITE.json"), "w", encoding="utf-8"), indent=1, ensure_ascii=False)
              print("\n".join(L))


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("dossiers", nargs="+")
              ap.add_argument("--synthese", default="", help="dossier de sortie de la synthèse de plusieurs configurations")
              a = ap.parse_args()
              if a.synthese:
                  synthese(a.dossiers, a.synthese)
                  return
              d = a.dossiers[0]
              b = resumer(d)
              json.dump(b, open(os.path.join(d, "F_bilan.json"), "w", encoding="utf-8"), indent=1, ensure_ascii=False)
              md = markdown(b)
              open(os.path.join(d, "F_bilan.md"), "w", encoding="utf-8").write(md + "\n")
              print(md)


          if __name__ == "__main__":
              main()
          BILAN_F4_EOF
