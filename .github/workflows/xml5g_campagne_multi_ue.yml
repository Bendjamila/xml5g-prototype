# xML5G — CAMPAGNE À PLUSIEURS UE (novembre 2026), environ 2 h 30.
#
# Suite du test de faisabilité (exécution 43457508089), qui a montré que 4 UE tiennent avec le détecteur sur un
# cœur réservé. Mêmes scripts que ce test, sans aucun changement ; même détecteur FIGÉ (exécution 42379234623).
#   M4  : 4 UE, 106 PRB, détecteur sur un cœur réservé. Scénarios : multi (ue1 inonde en UDP et ue2 en SYN, en même
#         temps, 40 s ; ue3 et ue4 bénins) et flash (aucun attaquant, foule bénigne). Politiques : none, xml5g
#         (7 sur 10), xml5g714 (7 sur 14, règle de l'algorithme de dimensionnement).
#   K14 : 2 UE, 106 PRB, cœurs partagés, comme l'expérience E2 de la campagne finale. Scénarios udp, syn, flash.
#         Politique xml5g714 : la règle 7 sur 14 exécutée dans la boucle, dans les conditions de E2.
# Le plan (tranches, essais visés, graines) est fixé avant le premier essai. Un essai invalide est remplacé.
# Le job « synthese » réunit tout dans UNE archive légère : xml5g-c5-RESULTATS.

name: xML5G campagne plusieurs UE

on:
  workflow_dispatch:
    inputs:
      essais:
        description: "Essais valides visés par (scénario, politique)"
        default: "20"
      experiences:
        description: "Expériences à lancer (M4 K14)"
        default: "M4 K14"
      tranches:
        description: "Ne lancer que ces tranches (ex. M4-2 K14-1), vide = toutes"
        default: ""
      detecteur_run_id:
        description: "Exécution qui a produit le détecteur figé (ne pas changer)"
        default: "42379234623"

permissions:
  contents: read
  actions: read

env:
  OAI_COMMIT: 1c2f4d3c2e68181cdef9f426d161163147ad4b77
  FLEXRIC_COMMIT: d7a71285f3720fbc1487e9a86309eec5fb61a408
  WORK: /home/runner/xml5g
  LOGS: /home/runner/xml5g-journaux
  DUREE_E1: "600"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrice: ${{ steps.p.outputs.matrice }}
      detecteur_run: ${{ steps.p.outputs.detecteur_run }}
    steps:
      - name: Plan du test (fixé avant le premier essai)
        id: p
        env:
          ESSAIS: ${{ inputs.essais }}
          EXPERIENCES: ${{ inputs.experiences }}
          TRANCHES: ${{ inputs.tranches }}
          DETECTEUR_RUN_ID: ${{ inputs.detecteur_run_id }}
        run: |
          mkdir -p plan
          python3 - <<'PLAN_EOF'
          import json, math, os, zlib, datetime
          E = os.environ
          n = int(E.get("ESSAIS") or 20)
          exps = (E.get("EXPERIENCES") or "M4 K14").split()
          M = []
          def add(i, **kw):
              d = dict(id=i, runner="ubuntu-24.04", offset=100 * (len(M) + 1), attaque=40, duree_e1=600, kpm="", pcap="",
                       profil="106PRB", exclues="", graine=zlib.crc32(i.encode()) % 100000 + 1)
              d.update(kw); M.append(d)
          if "M4" in exps:     # au plus 5 essais valides par case et par tranche (6 cases, environ 3,5 min par essai)
              nt = max(1, math.ceil(n / 5))
              for i in range(1, nt + 1):
                  add(f"M4-{i}", exp="M4", nue=4, charge="isole", scenarios="multi flash", politiques="none xml5g xml5g714",
                      essais=math.ceil(n / nt), budget=175)
          if "K14" in exps:    # au plus 10 essais valides par case et par tranche (3 cases)
              nt = max(1, math.ceil(n / 10))
              for i in range(1, nt + 1):
                  add(f"K14-{i}", exp="K14", nue=2, charge="standard", scenarios="udp syn flash", politiques="xml5g714",
                      essais=math.ceil(n / nt), budget=175)
          choisies = (E.get("TRANCHES") or "").split()
          if choisies:
              M = [d for d in M if d["id"] in choisies]
          if not M:
              raise SystemExit("aucune tranche à lancer")
          plan = dict(cree_utc=datetime.datetime.utcnow().isoformat() + "Z", commit=E.get("GITHUB_SHA"), execution=E.get("GITHUB_RUN_ID"),
                      detecteur=f"figé, exécution {E.get('DETECTEUR_RUN_ID') or '42379234623'}",
                      faisabilite="exécution 43457508089 (2 essais par case) : non comptée dans les résultats",
                      essais_vises_par_case=n,
                      politiques=dict(none="aucune action (les règles sont rejouées sur les verdicts)",
                                      xml5g="libération par E2SM-RC à 7 verdicts d'attaque sur les 10 derniers de l'UE",
                                      xml5g714="libération par E2SM-RC à 7 verdicts d'attaque sur les 14 derniers de l'UE"),
                      scenarios=dict(multi="ue1 inonde en UDP et ue2 en SYN, en même temps, 40 s ; les autres UE sont bénins",
                                     flash="aucun attaquant ; un UE bénin passe brusquement à 12 Mbit/s pendant 15 s",
                                     udp="ue1 inonde en UDP, ue2 bénin", syn="ue1 inonde en SYN, ue2 bénin"),
                      validite=["tous les UE ont une adresse et joignent le réseau de données",
                                "le détecteur s'est connecté à la xApp",
                                "multi/udp/syn : l'attaque a été lancée ; flash : le trafic bénin a tourné",
                                "un essai invalide est remplacé ; tous les essais lancés restent dans les journaux"],
                      analyse=dict(unite="l'essai",
                                   criteres=["tous les attaquants de l'essai sont libérés", "aucun UE bénin n'est libéré"],
                                   exclusion="essais où le générateur d'attaque n'a pas tenu (même règle que la campagne finale)",
                                   intervalles="Clopper-Pearson à 95 %"),
                      ordre="politiques tirées au hasard à chaque tour (graine de la tranche), journalisé dans 63_ordre.txt",
                      tranches=M)
          json.dump(plan, open("plan/63_plan.json", "w"), indent=1, ensure_ascii=False)
          with open(E["GITHUB_OUTPUT"], "a") as f:
              f.write("matrice=" + json.dumps({"include": M}) + "\n")
              f.write("detecteur_run=" + (E.get("DETECTEUR_RUN_ID") or "42379234623") + "\n")
          s = ["### Plan de la campagne à plusieurs UE", "",
               "| Tranche | UE | Détecteur | Scénarios | Politiques | Essais valides par case | Minutes d'essais au plus |",
               "|---|---|---|---|---|---|---|"]
          s += [f"| {d['id']} | {d['nue']} | {'cœur réservé' if d['charge'] == 'isole' else 'cœurs partagés'} | {d['scenarios']} | "
                f"{d['politiques']} | {d['essais']} | {d['budget']} |" for d in M]
          open(E["GITHUB_STEP_SUMMARY"], "a").write("\n".join(s) + "\n")
          print(json.dumps(plan, indent=1, ensure_ascii=False))
          PLAN_EOF
      - name: Plan (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-c5-plan
          path: plan
          retention-days: 90

  essais:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 230
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    env:
      EXPERIENCE: ${{ matrix.exp }}
      SCENARIOS: ${{ matrix.scenarios }}
      DUREE_ATTAQUE: ${{ matrix.attaque }}
      POLITIQUES: ${{ matrix.politiques }}
      CASES_EXCLUES: ${{ matrix.exclues }}
      ESSAIS: ${{ matrix.essais }}
      OFFSET: ${{ matrix.offset }}
      CHARGE: ${{ matrix.charge }}
      KPM_POLITIQUES: ${{ matrix.kpm }}
      PCAP_POLITIQUES: ${{ matrix.pcap }}
      BUDGET_MIN: ${{ matrix.budget }}
      TRANCHE: ${{ matrix.id }}
      GRAINE: ${{ matrix.graine }}
      DUREE_E1: ${{ matrix.duree_e1 }}
      NUE: ${{ matrix.nue }}
      PROFIL_FORCE: ${{ matrix.profil }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 0. Télécharger le détecteur figé et les sources
        uses: actions/download-artifact@v4
        with:
          name: xml5g-p3f-detecteur
          path: /home/runner/detecteur
          run-id: ${{ needs.plan.outputs.detecteur_run }}
          github-token: ${{ github.token }}
      - name: 0b. Version de XGBoost et profil radio du détecteur figé
        run: |
          v=$(awk '$1=="xgboost"{print $2}' /home/runner/detecteur/01_python.txt 2>/dev/null | tail -1 || true)
          echo "XGB_VERSION=$v" >> "$GITHUB_ENV"; echo "xgboost du détecteur : ${v:-inconnue}"
          p=$(grep -m1 '^profil_radio=' /home/runner/detecteur/09_etapes.txt 2>/dev/null | cut -d= -f2 || true)
          echo "PROFIL_DETECTEUR=${p:-106PRB}" >> "$GITHUB_ENV"
          echo "profil radio du détecteur : ${p:-inconnu} ; profil demandé pour cette configuration : $PROFIL_FORCE"
      - name: 1. Libérer de l'espace disque
        run: |

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -a -f > /dev/null 2>&1 || true
          mkdir -p "$WORK" "$LOGS"
          df -h / | tee "$LOGS/00_disque.txt"
      - name: 2. Préparer la machine
        run: |

          sudo modprobe sctp || { sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe sctp; }
          sudo apt-get install -y -q hping3 iperf3 python3-sklearn python3-pandas python3-joblib python3-scipy tcpdump sysstat > "$LOGS/01_apt.log" 2>&1 || \
            { sudo apt-get update -q && sudo apt-get install -y -q hping3 iperf3 python3-sklearn python3-pandas python3-joblib python3-scipy tcpdump sysstat >> "$LOGS/01_apt.log" 2>&1; }
          sudo sysctl -w net.ipv4.ip_forward=1
          python3 -c "import sklearn, pandas, joblib; print('sklearn', sklearn.__version__)" | tee "$LOGS/01_python.txt"
          # XGBoost : le modèle retenu par l'étude sur les jeux publics (E1). Sans ses dépendances
          # facultatives (GPU), pour ne pas toucher au numpy/scipy du système.
          sudo pip3 install --break-system-packages --no-deps -q "xgboost${XGB_VERSION:+==$XGB_VERSION}" >> "$LOGS/01_apt.log" 2>&1 || echo "::warning::xgboost non installé : repli Random Forest"
          { sudo python3 -c "import xgboost; print('xgboost', xgboost.__version__)" 2>&1 || echo "xgboost absent : repli Random Forest"; } | tee -a "$LOGS/01_python.txt"
          { nproc; free -h; } > "$LOGS/01_machine.txt"
      - name: 3. Récupérer OAI et FlexRIC (versions figées)
        run: |

          cd "$WORK"
          git init -q oai && cd oai
          git remote add origin https://github.com/duranta-project/openairinterface5g.git
          git fetch -q --depth 1 origin "$OAI_COMMIT" && git checkout -q FETCH_HEAD
          cd openair2/E2AP && rm -rf flexric && git init -q flexric && cd flexric
          git remote add origin https://github.com/duranta-project/flexric.git
          git fetch -q --depth 1 origin "$FLEXRIC_COMMIT" && git checkout -q FETCH_HEAD
          { echo "OAI     $(git -C "$WORK/oai" rev-parse HEAD)"; echo "FlexRIC $(git rev-parse HEAD)"; } | tee "$LOGS/02_versions.txt"
      - name: 4. Appliquer le correctif, les xApps et les scripts du détecteur figé
        run: |
          mkdir -p "$WORK/bundle" && tar xzf /home/runner/detecteur/xml5g-sources.tgz -C "$WORK/bundle"
          cd "$WORK/oai"
          git apply --check "$WORK/bundle/xml5g.patch" && git apply "$WORK/bundle/xml5g.patch"
          n=$(grep -c XML5G openair2/E2AP/RAN_FUNCTION/O-RAN/ran_func_rc.c || true)
          echo "${n:-0}" | tee "$LOGS/03_correctif.txt"
          [ "${n:-0}" -gt 0 ] || { echo "::error::correctif xML5G non appliqué à OAI"; exit 1; }
          FX="$WORK/oai/openair2/E2AP/flexric/examples/xApp/c"
          cp -r "$WORK/bundle/rc_release" "$WORK/bundle/xapp_xml5g" "$FX/"
          printf "add_subdirectory(rc_release)\nadd_subdirectory(xapp_xml5g)\n" >> "$FX/CMakeLists.txt"
          cp -r "$WORK/bundle/py" "$WORK/" && chmod +x "$WORK/py/"*.sh
          cp /home/runner/detecteur/model.joblib "$WORK/model.joblib"
          attendu=$(awk '{print $1; exit}' /home/runner/detecteur/model.sha256)
          obtenu=$(sha256sum "$WORK/model.joblib" | awk '{print $1}')
          echo "modèle figé : empreinte attendue $attendu, obtenue $obtenu" | tee "$LOGS/03_modele_verifie.txt"
          [ -n "$attendu" ] && [ "$attendu" = "$obtenu" ] || { echo "::error::modèle figé absent ou différent de celui du job detecteur"; exit 1; }
          cp /home/runner/detecteur/50_train_metrics.json "$LOGS/50_train_metrics.json"
          echo '${{ toJSON(matrix) }}' > "$LOGS/63_tranche.json"
      - name: 4b. Scripts des essais à plusieurs UE (scenario.py, campagne.sh, plateforme.sh) et bilan
        run: |
          # Les scripts du paquet figé sont gardés (py_fige) : 03_scripts_modifies.txt donne les différences exactes.
          cp -r "$WORK/py" "$WORK/py_fige"
          cat > "$WORK/py/scenario.py" <<'SCEN_F4_EOF'
          #!/usr/bin/env python3
          """
          xML5G - déroulé d'un scénario de phase 2 et génération des événements.
          Trafic bénin de fond (iperf3, un serveur par UE, repli ping) et sonde de RTT horodatée
          sur tous les UEs pendant toute la durée,
          puis une ou plusieurs attaques (SYN ou UDP flood via hping3), chacune lancée depuis
          l'espace de noms d'un UE sur une fenêtre de temps. Écrit les événements
          (ip, ns, type, start, end) en JSONL, avec la même horloge que le détecteur et l'xApp.
            --attacks "ue1:syn:20:30,ue2:udp:70:30"   (espace de noms : type : début s : durée s)
          Essais à plusieurs attaquants (novembre 2026) : chaque attaque tourne dans son propre fil, à partir de
          son instant de début. Deux attaques dont les fenêtres se recouvrent sont donc SIMULTANÉES
          (« ue1:udp:10:40,ue2:syn:10:40 »). Avant, la seconde attendait la fin de la première. Une seule attaque,
          ou des attaques qui se suivent, se déroulent comme avant.
          """
          import argparse, json, os, subprocess, threading, time

          def sh(ns, cmd, bg=False, err=None):
              # les erreurs sont conservées dans un fichier : sans elles, une attaque qui
              # s'arrête au bout de 2 s ne laisse aucune trace
              full = ["sudo", "ip", "netns", "exec", ns, "bash", "-lc", cmd]
              e = open(err, "w") if err else subprocess.DEVNULL
              if bg:
                  return subprocess.Popen(full, stdout=subprocess.DEVNULL, stderr=e)
              return subprocess.run(full, stdout=subprocess.DEVNULL, stderr=e)

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--dn", default="192.168.70.135")     # serveur du réseau de données
              ap.add_argument("--ues", required=True, help="ex. ue1:10.0.0.2,ue2:10.0.0.3")
              ap.add_argument("--attacks", required=True, help="ex. ue1:syn:20:30,ue2:udp:70:30")
              ap.add_argument("--total", type=float, default=60)
              # 0,5 Mbit/s : sous la capacité montante du lien radio simulé (0,7 à 3,4 Mbit/s mesurés),
              # pour que l'UE bénin ne sature pas son propre lien et que son RTT de base reste faible
              ap.add_argument("--benign-rate", default="2M")
              ap.add_argument("--flood-interval", default="u100", help="intervalle hping3 entre paquets (u100 = 100 µs)")
              ap.add_argument("--events", required=True)
              a = ap.parse_args()
              ues = dict(u.split(":") for u in a.ues.split(",") if ":" in u)
              atks = []
              for x in a.attacks.split(","):
                  ns, typ, st, du = x.split(":")
                  atks.append((ns, typ, float(st), float(du)))
              atks.sort(key=lambda z: z[2])
              base = os.path.splitext(a.events)[0]
              t0 = time.time()
              bg = []
              for ns in ues:
                  # Trafic bénin : iperf3 UDP 5 Mbit/s vers un serveur DÉDIÉ à chaque UE (port 5200 + k),
                  # pour que deux UEs ne se disputent pas un seul serveur (« server is busy »).
                  # Repli sur un ping régulier si le serveur ne répond pas.
                  port = 5200 + int(ns[2:]) if ns[2:].isdigit() else 5201
                  bg.append(sh(ns, f"iperf3 -c {a.dn} -p {port} -t {int(a.total)} -b {a.benign_rate} -u || "
                                   f"ping -q -i 0.02 -s 1200 -w {int(a.total)} {a.dn}",
                               bg=True, err=f"{base}_benin_{ns}.err"))
                  # Sonde de RTT (qualité de service) : un ping horodaté toutes les 200 ms, par UE.
                  bg.append(sh(ns, f"stdbuf -oL ping -D -i 0.2 -w {int(a.total)} {a.dn} > {base}_rtt_{ns}.txt 2>&1",
                               bg=True))
              ev = []
              verrou = threading.Lock()

              def attaque(i, ns, typ, st, du):
                  time.sleep(max(0, st - (time.time() - t0)))
                  opt = "-S -p 80" if typ == "syn" else "--udp -p 5555 -d 1400"
                  start = time.time()
                  # débit limité (~10 000 paquets/s) plutôt que --flood : --flood occupe un cœur entier, ce qui
                  # saturait la machine d'émulation ; 10 000 paquets/s restent un flood pour un seul UE
                  if typ.startswith("pulse"):
                      # campagne finale (E8) : inondation UDP intermittente, active pendant NN % de chaque période de 2 s
                      on = round(int(typ[5:]) / 100 * 2.0, 2); off = round(2.0 - on, 2)
                      cmd = (f"fin=$((SECONDS+{int(du)})); while [ $SECONDS -lt $fin ]; do "
                             f"timeout {on} hping3 -i {a.flood_interval} {opt} {a.dn}; sleep {off}; done")
                  else:
                      # inondation continue, RELANCÉE jusqu'à l'échéance : hping3 peut planter (assertion glibc),
                      # ce qui écourtait l'attaque sous une politique qui NE libère PAS (ratio30, limite) et faussait
                      # cette case. On le relance pour le temps restant ; mais si l'UE est coupé par la défense
                      # (RRC Release -> tunnel retiré), hping3 ressort aussitôt (« Network is unreachable ») :
                      # trois sorties de moins de 2 s de suite arrêtent la boucle (l'attaque est bien terminée).
                      cmd = (f"fin=$((SECONDS+{int(du)})); coupe=0; "
                             f"while [ $SECONDS -lt $fin ]; do reste=$((fin-SECONDS)); [ $reste -le 0 ] && break; "
                             f"deb=$SECONDS; timeout $reste hping3 -i {a.flood_interval} {opt} {a.dn}; rc=$?; "
                             f"[ $rc -eq 124 ] && break; "
                             f"if [ $((SECONDS-deb)) -lt 2 ]; then coupe=$((coupe+1)); else coupe=0; fi; "
                             f"[ $coupe -ge 3 ] && break; sleep 0.3; done")
                  p = sh(ns, cmd, bg=True, err=f"{base}_attaque{i}_{ns}.err")
                  p.wait()
                  end = time.time()
                  if end - start < 0.5 * du:
                      print(f"ATTENTION : l'attaque {i} ({ns}, {typ}) a duré {end - start:.1f} s au lieu de {du:.0f} s "
                            f"(voir {base}_attaque{i}_{ns}.err)")
                  with verrou:
                      ev.append(dict(ip=ues[ns], ns=ns, type=typ, start=round(start, 3), end=round(end, 3)))

              fils = []
              for i, (ns, typ, st, du) in enumerate(atks, 1):
                  if ns not in ues:
                      print(f"ATTENTION : {ns} n'a pas d'adresse (--ues), attaque {i} ignorée")
                      continue
                  th = threading.Thread(target=attaque, args=(i, ns, typ, st, du))
                  th.start(); fils.append(th)
              for th in fils:
                  th.join()
              ev.sort(key=lambda e: e["start"])
              time.sleep(max(0, a.total - (time.time() - t0)))
              for q in bg:
                  try: q.terminate()
                  except Exception: pass
              open(a.events, "w").write("".join(json.dumps(e) + "\n" for e in ev))
              print(json.dumps(ev, indent=2))

          if __name__ == "__main__":
              main()
          SCEN_F4_EOF
          cat > "$WORK/py/campagne.sh" <<'CAMP_F4_EOF'
          #!/bin/bash
          # xML5G — campagne finale de phase 3 : boucle d'essais d'UNE tranche (un job de la matrice).
          # Reprend la boucle de l'étape 10 de phaseF3_Corrigé.yml (commit 15f1874, exécution flash du 25/10/2026) avec :
          #   - un détecteur FIGÉ, entraîné une seule fois par le job « detecteur » et téléchargé ici ;
          #   - plusieurs scénarios par tranche (SCENARIOS), l'ordre des politiques tiré au hasard à chaque tour ;
          #   - des politiques supplémentaires (voir options_politique), dont les deux formes de la règle de Tsourdinis et al.
          #     et son schéma d'action complet (ratio30) ;
          #   - les scénarios « benin » (E1, trafic bénin seul, essais longs) et « pulseNN » (E8, inondation intermittente) ;
          #   - la charge « isole » (E3) : le détecteur seul sur le dernier cœur, tout le reste sur les autres ;
          #   - une capture SCTP des échanges E2 pour les politiques PCAP_POLITIQUES, et 63_essais.csv qui décrit chaque essai.
          # Variables attendues (job) : WORK LOGS GNB_CONF UE_RF SM_DIR FR_CONF ; tranche : EXPERIENCE SCENARIOS POLITIQUES ESSAIS
          # OFFSET CHARGE DUREE_E1 DUREE_ATTAQUE KPM_POLITIQUES PCAP_POLITIQUES BUDGET_MIN TRANCHE GRAINE.
          #
          # Essais à plusieurs UE (novembre 2026), sans rien changer au détecteur, à la xApp ni au déroulé d'un essai :
          #   - NUE (2 par défaut) : nombre d'UE de la cellule ; au-delà de 2, les UE sont lancés à ECART_UE secondes
          #     d'intervalle (6 par défaut) au lieu d'ensemble ;
          #   - scénarios « multi » (ue1 inonde en UDP et ue2 en SYN, EN MÊME TEMPS ; les autres UE sont bénins) et
          #     « multiudp » (ue1 et ue2 inondent tous deux en UDP) ;
          #   - politique « xml5g714 » : libération quand 7 des 14 derniers verdicts de l'UE sont des attaques
          #     (règle donnée par l'algorithme de dimensionnement de l'article) ;
          #   - CASES_EXCLUES : cases « scénario_politique » à ne pas lancer (ex. « flash_none ») ;
          #   - 66_cpu_<essai>.txt : compteurs de /proc/stat avant et après le trafic (occupation de la machine).
          set +e +o pipefail
          . "$WORK/py/coeur.sh"
          if [ ! -f "$WORK/model.joblib" ]; then
            echo "::error::détecteur figé absent ($WORK/model.joblib) : tranche annulée"
            echo "campagne=annulee_sans_detecteur" >> "$LOGS/09_etapes.txt"
            exit 0
          fi
          cd "$WORK/py" || exit 1
          B="$WORK/oai/cmake_targets/ran_build/build"
          FR="$WORK/oai/openair2/E2AP/flexric/build"
          CONF="$GNB_CONF"

          EXPERIENCE="${EXPERIENCE:-E2}"; SCENARIOS="${SCENARIOS:-${SCENARIO:-udp}}"; POLITIQUES="${POLITIQUES:-xml5g none}"
          NVALIDE="${ESSAIS:-5}"; OFFSET="${OFFSET:-0}"; CHARGE="${CHARGE:-standard}"; DUREE_E1="${DUREE_E1:-600}"
          KPM_POLITIQUES="${KPM_POLITIQUES:-}"; PCAP_POLITIQUES="${PCAP_POLITIQUES:-}"; GRAINE="${GRAINE:-1}"
          DUREE_ATTAQUE="${DUREE_ATTAQUE:-40}"; LIMITE_THROTTLE="${LIMITE_THROTTLE:-512kbit}"
          TOTAL=$(( DUREE_ATTAQUE + 15 ))       # durée du trafic d'un essai (55 s pour une attaque de 40 s, comme 15f1874)
          MAX_TOURS=$(( NVALIDE + 3 ))
          NUE="${NUE:-2}"                        # nombre d'UE de la cellule (2 dans la campagne finale)
          ECART_UE="${ECART_UE:-6}"              # au-delà de 2 UE : secondes entre deux lancements d'UE
          CASES_EXCLUES="${CASES_EXCLUES:-}"     # cases « scénario_politique » à ne pas lancer
          case "$NUE" in [2-9]) ;; *) echo "::error::NUE=$NUE : valeur attendue de 2 à 9"; exit 0 ;; esac
          echo "nue=$NUE" >> "$LOGS/09_etapes.txt"
          echo "tranche ${TRANCHE:-?} : expérience=$EXPERIENCE scénarios=[$SCENARIOS] politiques=[$POLITIQUES] essais=$NVALIDE charge=$CHARGE attaque=${DUREE_ATTAQUE}s KPM=[$KPM_POLITIQUES] PCAP=[$PCAP_POLITIQUES]" | tee -a "$LOGS/09_etapes.txt"

          MAP="/tmp/xml5g_ues_map.txt"; export XML5G_UES_MAP="$MAP"
          export XML5G_LIMITE="$LIMITE_THROTTLE"

          # ---------- charge (E3) : détecteur isolé sur le dernier cœur ----------
          TS_DET=""; TS_RAN=""; CPU_DET=""; CPU_RAN=""
          if [ "$CHARGE" = isole ]; then
            NC=$(nproc)
            if [ "$NC" -ge 3 ]; then
              CPU_DET=$(( NC - 1 )); CPU_RAN="0-$(( NC - 2 ))"
              TS_DET="taskset -c $CPU_DET"; TS_RAN="taskset -c $CPU_RAN"
              echo "charge=isole : détecteur sur le cœur $CPU_DET, RAN, cœur 5G et trafic sur $CPU_RAN" | tee -a "$LOGS/09_etapes.txt"
            else
              echo "::warning::charge isole demandée mais seulement $NC cœurs : essais en charge standard"
              CHARGE=standard
            fi
          fi
          isoler_conteneurs() {
            [ -n "$CPU_RAN" ] || return 0
            for c in $(docker ps -q); do docker update --cpuset-cpus "$CPU_RAN" "$c" > /dev/null 2>&1; done
          }

          arreter_ran() {
            sudo pkill -f nr-uesoftmodem; sudo pkill -f nr-softmodem
            sudo pkill -f nearRT-RIC; sudo pkill -f xapp_kpm_moni
            sudo pkill -f "ids_xml5g.py --mode detect"
            sudo pkill -f "allocateur_ratio.py" 2>/dev/null
            sudo pkill -f "tcpdump -i lo" 2>/dev/null
            sleep 5
          }
          duree_ids() { if [ "$SC" = benin ]; then echo $(( DUREE_E1 + 25 )); else echo $(( TOTAL + 25 )); fi; }
          duree_xapp() { echo $(( $(duree_ids) + 10 )); }
          lancer_detecteur() {   # avant le gNB : le modèle se charge sur une machine encore peu chargée
            local plog="--pktlog $LOGS/68_pkt_$RUN.csv.gz"
            [ "$SC" = benin ] && [ "${PKTLOG_E1:-non}" != oui ] && plog=""
            # shellcheck disable=SC2086
            sudo -E setsid nohup $TS_DET nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode detect --iface oai-cn5g --upf 192.168.70.134 \
              --bin 0.2 --duration "$(duree_ids)" --min-pkts 1 --model "$WORK/model.joblib" --xapp 127.0.0.1:9999 --attente-xapp 900 \
              --out "$LOGS/61_ids_$RUN.log" --summary "$LOGS/61_ids_${RUN}_summary.json" $plog \
              > "$LOGS/61_ids_${RUN}_run.log" 2>&1 < /dev/null &
            IDSPID=$!
          }
          demarrer_ran() {   # $1 = étiquette de journal ; $2 = nombre d'UE à lancer
            local tag=$1 nue=$2 k i
            # shellcheck disable=SC2086
            sudo setsid nohup $TS_RAN stdbuf -oL -eL "$FR/examples/ric/nearRT-RIC" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/10_ric_$tag.log" 2>&1 < /dev/null &
            sleep 3
            # shellcheck disable=SC2086
            sudo setsid nohup $TS_RAN stdbuf -oL -eL "$B/nr-softmodem" -O "$CONF" '--gNBs.[0].min_rxtxtime' 6 --rfsim --e2_agent.sm_dir "$SM_DIR/" > "$LOGS/11_gnb_$tag.log" 2>&1 < /dev/null &
            for i in $(seq 1 90); do
              grep -q "Received NGSetupResponse from AMF" "$LOGS/11_gnb_$tag.log" && grep -q "E2 SETUP RESPONSE rx" "$LOGS/11_gnb_$tag.log" && break
              sleep 2
            done
            for k in $(seq 1 "$nue"); do
              [ -e "/var/run/netns/ue$k" ] || sudo bash "$WORK/oai/tools/scripts/multi-ue.sh" -c"$k"
              printf 'uicc0 = {\nimsi = "00101000000000%s";\nkey = "fec86ba6eb707ed08905757b1bb44b8f";\nopc= "C42449363BBAD02B66D16BC975D77CC1";\npdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });\n}\n' "$k" > "$WORK/ue$k.conf"
              OFF[$k]=$(stat -c %s "$LOGS/12_ue$k.log" 2>/dev/null || echo 0)
              # shellcheck disable=SC2086
              sudo setsid nohup $TS_RAN stdbuf -oL -eL ip netns exec "ue$k" "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              [ "$nue" -gt 2 ] && [ "$k" -lt "$nue" ] && sleep "$ECART_UE"
            done
          }
          declare -A OFF
          refus_coeur() {
            tail -c +$(( ${OFF[$1]:-0} + 1 )) "$LOGS/12_ue$1.log" 2>/dev/null | grep -qE "Illegal_UE|Authentication Reject"
          }
          ue_pret() {   # $1 = k ; renvoie l'adresse de l'UE (vide si échec), garantit route + ping
            local k=$1 ip_ tun essai i
            for essai in 1 2; do
              for i in $(seq 1 40); do
                ip_=$(sudo ip netns exec "ue$k" ip -o -4 addr show 2>/dev/null | awk '/oaitun/{split($4,a,"/"); print a[1]; exit}')
                [ -n "$ip_" ] && break
                if refus_coeur "$k"; then echo "ue$k refusé par le cœur" >&2; echo ""; return; fi
                pgrep -f "ue$k.conf" > /dev/null || break
                sleep 3
              done
              if [ -n "$ip_" ]; then
                tun=$(sudo ip netns exec "ue$k" ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
                sudo ip netns exec "ue$k" ip route replace 192.168.70.0/24 dev "$tun"
                if sudo ip netns exec "ue$k" ping -c 2 -W 2 192.168.70.135 > /dev/null 2>&1; then echo "$ip_"; return; fi
              fi
              [ "$essai" = 2 ] && break
              sudo pkill -f "ue$k.conf"; sleep 10
              OFF[$k]=$(stat -c %s "$LOGS/12_ue$k.log" 2>/dev/null || echo 0)
              # shellcheck disable=SC2086
              sudo setsid nohup $TS_RAN stdbuf -oL -eL ip netns exec "ue$k" "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" $UE_RF --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              sleep 5
            done
            echo ""
          }
          # Politiques : variables de la xApp. W = 10 et θ = 0,7 par défaut (règle déployée) ; les politiques les remplacent.
          #   none          aucune action ; la xApp journalise l'instant où 7 sur 10 aurait libéré (WOULD_RELEASE)
          #   xml5g         libération par E2SM-RC quand 7 des 10 derniers verdicts de l'UE sont des attaques (règle déployée)
          #   xml5g8        idem avec 8 sur 10 (recommandation a posteriori, évaluée hors échantillon par E1)
          #   unan1s        unanimité sur fenêtre TEMPORELLE de 1 s : notre adaptation de la condition de Tsourdinis et al.
          #   unan30        unanimité sur les 30 derniers verdicts : la condition d'origine de Tsourdinis et al. (comptage)
          #   ratio30       schéma d'action complet de Tsourdinis et al. : plafond de débit proportionnel au taux d'anomalie des
          #                 30 derniers verdicts (allocateur_ratio.py), libération à 100 % (xApp, 30 sur 30)
          #   throttle      graduée : plafond de 512 kbit/s à la 1re règle 7 sur 10, libération si elle se redéclenche 5 s après
          #   limite        plafond de 512 kbit/s à la 1re règle 7 sur 10, sans jamais libérer (E4 : apport de la libération)
          #   immediate     libération au premier verdict « attaque »
          #   slice         au premier verdict « attaque » d'un UE, libération de tous les UE de la cellule
          #   xml5g_persist xml5g, puis retrait de l'abonnement de l'UE libéré dans la base du cœur (E9 : réattachement)
          options_politique() {
            case "$1" in
              xml5g)         POL_ENV="XML5G_POLICY=xml5g" ;;
              xml5g8)        POL_ENV="XML5G_POLICY=xml5g XML5G_THETA=0.8" ;;
              xml5g714)      POL_ENV="XML5G_POLICY=xml5g XML5G_W=14 XML5G_THETA=0.5" ;;
              unan1s)        POL_ENV="XML5G_POLICY=tsourdinis XML5G_REPORT_S=1" ;;
              unan30|ratio30) POL_ENV="XML5G_POLICY=xml5g XML5G_W=30 XML5G_THETA=1.0" ;;
              throttle)      POL_ENV="XML5G_POLICY=throttle XML5G_GRACE_S=5 XML5G_THROTTLE_CMD=\"bash $WORK/py/limiter_ue.sh %s\"" ;;
              limite)        POL_ENV="XML5G_POLICY=throttle XML5G_GRACE_S=1000000 XML5G_THROTTLE_CMD=\"bash $WORK/py/limiter_ue.sh %s\"" ;;
              xml5g_persist) POL_ENV="XML5G_POLICY=xml5g_persist XML5G_ON_RELEASE_CMD=\"bash $WORK/py/bloquer_abonne.sh %s\"" ;;
              immediate|slice|none) POL_ENV="XML5G_POLICY=$1" ;;
              *) echo "::error::politique inconnue : $1"; POL_ENV="XML5G_POLICY=none" ;;
            esac
          }
          parametres_politique() {   # W et θ effectivement appliqués (pour 63_essais.csv)
            case "$1" in xml5g8) echo "10,0.8" ;; xml5g714) echo "14,0.5" ;; unan30|ratio30) echo "30,1.0" ;; *) echo "10,0.7" ;; esac
          }
          attaques_du_scenario() {
            case "$1" in
              udp)     ATKS="ue1:udp:10:$DUREE_ATTAQUE"; NB_ATT=1 ;;
              syn)     ATKS="ue1:syn:10:$DUREE_ATTAQUE"; NB_ATT=1 ;;
              pulse*)  ATKS="ue1:$1:10:$DUREE_ATTAQUE"; NB_ATT=1 ;;
              multi)   ATKS="ue1:udp:10:$DUREE_ATTAQUE,ue2:syn:10:$DUREE_ATTAQUE"; NB_ATT=2 ;;
              multiudp) ATKS="ue1:udp:10:$DUREE_ATTAQUE,ue2:udp:10:$DUREE_ATTAQUE"; NB_ATT=2 ;;
              flash|benin) ATKS=""; NB_ATT=0 ;;
              *) echo "::error::scénario inconnu : $1"; ATKS=""; NB_ATT=0 ;;
            esac
          }
          # E1 : paires d'applications bénignes, fixées d'avance ; l'essai n° j prend la paire (j mod 8)
          PAIRES=("tcp:voip" "dash:web" "video:idleburst" "burst:iot" "web:tcp" "idleburst:dash" "voip:video" "iot:burst")
          ordre_politiques() {   # $1 = clé (tour et scénario) ; ordre aléatoire reproductible
            printf '%s\n' $POLITIQUES | shuf --random-source=<(openssl enc -aes-256-ctr -pass "pass:${GRAINE}-$1" -nosalt -pbkdf2 < /dev/zero 2> /dev/null)
          }

          . "$WORK/goulot.sh"
          DEBUT=$(date +%s); BUDGET_S=$(( ${BUDGET_MIN:-270} * 60 ))
          : > "$LOGS/63_validite.txt"; : > "$LOGS/63_ues_par_politique.txt"; : > "$LOGS/63_ordre.txt"
          echo "essai,experience,scenario,politique,W,theta,charge,cpu_detecteur,types_benins,duree_s,duree_attaque_s,tranche,tour,ordre_dans_tour,debut_utc" > "$LOGS/63_essais.csv"
          ECHECS_UE=0
          declare -A NV NE
          for SC in $SCENARIOS; do for POL in $POLITIQUES; do NV[${SC}_${POL}]=0; NE[${SC}_${POL}]=0; done; done
          bash "$WORK/py/provisionner_abonnes.sh" "$NUE" >> "$LOGS/13_abonnes.txt" 2>&1
          J=0

          for TOUR in $(seq 1 "$MAX_TOURS"); do
          for SC in $SCENARIOS; do
            attaques_du_scenario "$SC"
            ORDRE=$(ordre_politiques "$TOUR-$SC" | tr '\n' ' ')
            [ -n "$ORDRE" ] || ORDRE="$POLITIQUES"
            echo "tour $TOUR, $SC : $ORDRE" >> "$LOGS/63_ordre.txt"
            POS=0
            for POL in $ORDRE; do
              POS=$(( POS + 1 )); CLE="${SC}_${POL}"
              case " $CASES_EXCLUES " in *" $CLE "*) continue ;; esac
              if [ "$NB_ATT" -ge "$NUE" ]; then echo "::error::scénario $SC : $NB_ATT attaquants pour $NUE UE, il faut au moins un UE bénin"; continue; fi
              [ "${NV[$CLE]}" -ge "$NVALIDE" ] && continue
              if [ $(( $(date +%s) - DEBUT )) -gt "$BUDGET_S" ]; then echo "::warning::budget de temps atteint"; break 3; fi
              NE[$CLE]=$(( ${NE[$CLE]} + 1 )); RUN="${POL}_${SC}_r$(( OFFSET + NE[$CLE] ))"
              echo "=== $RUN (valides ${NV[$CLE]}/$NVALIDE) ==="
              options_politique "$POL"
              declare -a IPS; IPS=(); ok=1
              for tentative in 1 2; do
                arreter_ran
                if [ "$tentative" = 1 ]; then reparer_coeur "${RUN}_t1"; else reparer_coeur "${RUN}_t2" complet; fi
                case " $REPARES " in *" mysql "*) bash "$WORK/py/provisionner_abonnes.sh" "$NUE" >> "$LOGS/13_abonnes.txt" 2>&1 ;; esac
                isoler_conteneurs
                lancer_detecteur; sleep 20
                demarrer_ran "$RUN" "$NUE"; poser_goulot
                ok=1; IPS=()
                for k in $(seq 1 "$NUE"); do
                  ip_=$(ue_pret "$k"); IPS[$k]="$ip_"
                  [ -z "$ip_" ] && { ok=0; echo "$RUN : tentative $tentative, ue$k sans adresse"; break; }
                done
                [ "$ok" = 1 ] && break
              done
              if [ "$ok" != 1 ]; then
                echo "$RUN invalide UE_non_connecte" >> "$LOGS/63_validite.txt"; etat_coeur "${RUN}_echec"
                ECHECS_UE=$(( ECHECS_UE + 1 ))
                if [ "$ECHECS_UE" -ge 3 ]; then
                  echo "::error::3 essais de suite sans UE connecté, malgré la recréation du cœur : tranche arrêtée (voir 14_coeur_*.txt, 12_ue*.log)"
                  echo "campagne=arretee_ue_non_connectes" >> "$LOGS/09_etapes.txt"
                  break 3
                fi
                continue
              fi
              ECHECS_UE=0
              : > "$MAP"; for k in $(seq 1 "$NUE"); do echo "${IPS[$k]} ue$k" >> "$MAP"; done

              docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
              for k in $(seq 1 "$NUE"); do
                docker exec -d oai-ext-dn iperf3 -s -p $((5200 + k)) -J --logfile /tmp/iperf_$((5200 + k)).json > /dev/null 2>&1
                docker exec -d oai-ext-dn iperf3 -s -p $((5300 + k)) > /dev/null 2>&1
              done
              UESP=""; for k in $(seq 1 "$NB_ATT"); do UESP="${UESP:+$UESP,}ue$k:${IPS[$k]}"; done
              BEN=""; for k in $(seq $(( NB_ATT + 1 )) "$NUE"); do BEN="${BEN:+$BEN,}ue$k:${IPS[$k]}"; done
              BEN_REF="${BEN%%,*}"; BEN_AUTRES=""; [ "$BEN" != "$BEN_REF" ] && BEN_AUTRES="${BEN#*,}"
              echo "$RUN : attaquants=$UESP bénins=$BEN" | tee -a "$LOGS/63_ues_par_politique.txt"
              TYPES=""
              if [ "$SC" = benin ]; then
                P="${PAIRES[$(( (OFFSET / 100 + J) % ${#PAIRES[@]} ))]}"; J=$(( J + 1 ))
                TYPES="ue1:${P%%:*},ue2:${P##*:}"
              fi
              WT=$(parametres_politique "$POL")
              echo "$RUN,$EXPERIENCE,$SC,$POL,${WT%%,*},${WT##*,},$CHARGE,${CPU_DET:-},${TYPES//,/;},$( [ "$SC" = benin ] && echo "$DUREE_E1" || echo "$TOTAL" ),$( [ -n "$ATKS" ] && echo "$DUREE_ATTAQUE" || echo 0 ),${TRANCHE:-},$TOUR,$POS,$(date -u +%FT%TZ)" >> "$LOGS/63_essais.csv"

              # capture SCTP des échanges E2 (gNB <-> RIC, port 36421) et E42 (RIC <-> xApps, 36422) : en-têtes seulement
              case " $PCAP_POLITIQUES " in
                *" $POL "*|*" tout "*)
                  # shellcheck disable=SC2086
                  sudo setsid nohup $TS_RAN tcpdump -i lo -nn -s 96 -U -w "$LOGS/71_e2_$RUN.pcap" sctp > /dev/null 2>&1 < /dev/null & ;;
              esac
              # xApp de décision (θ et W par défaut, remplacés par ceux de la politique)
              eval "XML5G_W=10 XML5G_THETA=0.7 $POL_ENV XML5G_DURATION=$(duree_xapp) XML5G_PORT=9999 \
                sudo -E setsid nohup $TS_RAN nice -n -10 stdbuf -oL \"$FR/examples/xApp/c/xapp_xml5g/xapp_xml5g\" -c \"$FR_CONF\" -p \"$SM_DIR/\" > \"$LOGS/60_xapp_$RUN.log\" 2>&1 < /dev/null &"
              XPID=$!
              case " $KPM_POLITIQUES " in
                *" $POL "*|*" tout "*)
                  sudo -E setsid nohup $TS_RAN bash -c "XAPP_DURATION=$(( $(duree_xapp) + 10 )) stdbuf -oL '$FR/examples/xApp/c/monitor/xapp_kpm_moni' -c '$FR_CONF' -p '$SM_DIR/' 2>&1 | python3 -u '$WORK/py/horodater.py'" > "$LOGS/67_kpm_$RUN.log" 2>&1 < /dev/null & ;;
              esac
              for i in $(seq 1 30); do grep -q "détecteur connecté" "$LOGS/60_xapp_$RUN.log" 2>/dev/null && break; sleep 2; done
              if ! grep -q "détecteur connecté" "$LOGS/60_xapp_$RUN.log" 2>/dev/null; then
                echo "$RUN invalide detecteur_non_connecte" >> "$LOGS/63_validite.txt"
                sudo kill $XPID 2>/dev/null; sudo pkill -TERM -f "xapp_kpm_moni -c" 2>/dev/null
                sudo pkill -f "ids_xml5g.py --mode detect"; sudo pkill -f "tcpdump -i lo" 2>/dev/null; sleep 2; sudo rm -f /tmp/xapp_db_* 2>/dev/null
                continue
              fi
              # ratio30 : plafond de débit proportionnel au taux d'anomalie des 30 derniers verdicts (schéma de Tsourdinis et al.)
              if [ "$POL" = ratio30 ]; then
                # shellcheck disable=SC2086
                sudo setsid nohup $TS_RAN python3 allocateur_ratio.py --ids "$LOGS/61_ids_$RUN.log" --map "$MAP" --fenetre 30 \
                  --duree "$(duree_ids)" --log "$LOGS/72_ratio_$RUN.log" > "$LOGS/72_ratio_${RUN}_run.log" 2>&1 < /dev/null &
              fi
              sleep 7
              PIDS=$(pgrep -d, -f "ids_xml5g.py --mode detect|xapp_xml5g -c|xapp_kpm_moni -c|nr-softmodem|nr-uesoftmodem")
              [ -n "$PIDS" ] && { pidstat -h -u -r -p "$PIDS" 1 > "$LOGS/65_pidstat_$RUN.txt" 2>&1 & echo $! > /tmp/pidstat.pid; }
              ( while true; do echo "$(date +%s) $(docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' oai-upf 2>/dev/null)"; sleep 2; done ) > "$LOGS/66_docker_$RUN.txt" 2>&1 &
              DSPID=$!
              sleep 3
              { echo "avant $(date +%s.%N) $(head -1 /proc/stat)"; } > "$LOGS/66_cpu_$RUN.txt"

              if [ "$SC" = benin ]; then
                # E1 : les deux UE bénins, applications de la paire fixée d'avance, pendant DUREE_E1 secondes
                # shellcheck disable=SC2086
                sudo $TS_RAN python3 trafic_benin.py --ues "$BEN" --types "$TYPES" --total "$DUREE_E1" --events "$LOGS/69_benin_$RUN.jsonl" > "$LOGS/69_benin_${RUN}.log" 2>&1
                printf '[]\n' > "$LOGS/62_ev_$RUN.jsonl"
              else
                TB_UES="$BEN_AUTRES"; FLASH=""
                [ "$SC" = flash ] && { TB_UES="$BEN"; FLASH="--flash ue$(( NB_ATT + 1 )):12:15:12M"; }
                if [ -n "$TB_UES" ]; then
                  # shellcheck disable=SC2086
                  sudo setsid nohup $TS_RAN python3 trafic_benin.py --ues "$TB_UES" --total "$TOTAL" $FLASH --events "$LOGS/69_benin_$RUN.jsonl" > "$LOGS/69_benin_${RUN}.log" 2>&1 < /dev/null &
                fi
                if [ -n "$ATKS" ]; then
                  # shellcheck disable=SC2086
                  sudo $TS_RAN python3 scenario.py --ues "$UESP${BEN_REF:+,$BEN_REF}" --attacks "$ATKS" --total "$TOTAL" --events "$LOGS/62_ev_$RUN.jsonl" 2>&1 | tee "$LOGS/62_scenario_$RUN.log"
                else
                  printf '[]\n' > "$LOGS/62_ev_$RUN.jsonl"; sleep "$DUREE_ATTAQUE"
                fi
              fi
              { echo "apres $(date +%s.%N) $(head -1 /proc/stat)"; } >> "$LOGS/66_cpu_$RUN.txt"
              wait $IDSPID 2>/dev/null
              sleep 12
              sudo kill $XPID 2>/dev/null
              sudo pkill -TERM -f "xapp_kpm_moni -c" 2>/dev/null
              sudo pkill -f "allocateur_ratio.py" 2>/dev/null
              [ -f /tmp/pidstat.pid ] && { kill "$(cat /tmp/pidstat.pid)" 2>/dev/null; rm -f /tmp/pidstat.pid; }
              kill $DSPID 2>/dev/null
              sudo pkill -INT -f "tcpdump -i lo" 2>/dev/null; sleep 2
              [ -f "$LOGS/71_e2_$RUN.pcap" ] && sudo gzip -f "$LOGS/71_e2_$RUN.pcap"
              sudo rm -f /tmp/xapp_db_* 2>/dev/null
              for k in $(seq 1 "$NUE"); do docker exec oai-ext-dn cat /tmp/iperf_$((5200 + k)).json > "$LOGS/64_iperf_${RUN}_p$((5200 + k)).json" 2>/dev/null; done
              bash "$WORK/py/restaurer_abonnes.sh" > /dev/null 2>&1     # remet les abonnés retirés par xml5g_persist

              # validité (critères fixés d'avance, 63_plan.json) : le détecteur a joint la xApp ; le trafic bénin a tourné
              # (flash, benin) ou l'attaque a été lancée ; pour benin, au moins 80 % de la durée couverte par des verdicts
              valide=1; raison=""
              if grep -q "injoignable" "$LOGS/61_ids_${RUN}_run.log" 2>/dev/null; then valide=0; raison="xapp_injoignable"
              elif ! grep -q "détecteur connecté" "$LOGS/60_xapp_$RUN.log" 2>/dev/null; then valide=0; raison="detecteur_non_connecte"
              elif [ "$SC" = flash ] || [ "$SC" = benin ]; then
                [ -s "$LOGS/69_benin_$RUN.jsonl" ] || { valide=0; raison="trafic_benin_absent"; }
                if [ "$valide" = 1 ] && [ "$SC" = benin ]; then
                  cov=$(awk '$1=="V"{t=$2/1e6; if(!a||t<a)a=t; if(t>b)b=t} END{print (b>a)?int(b-a):0}' "$LOGS/61_ids_$RUN.log" 2>/dev/null)
                  [ "${cov:-0}" -ge $(( DUREE_E1 * 8 / 10 )) ] || { valide=0; raison="verdicts_incomplets_${cov:-0}s"; }
                fi
              else grep -q '"start"' "$LOGS/62_ev_$RUN.jsonl" 2>/dev/null || { valide=0; raison="attaque_non_lancee"; }
              fi
              if [ "$valide" = 1 ]; then
                echo "$RUN valide" >> "$LOGS/63_validite.txt"; NV[$CLE]=$(( ${NV[$CLE]} + 1 ))
              else
                echo "$RUN invalide $raison" >> "$LOGS/63_validite.txt"
              fi
              sleep 1
            done
          done
          done
          for SC in $SCENARIOS; do for POL in $POLITIQUES; do
            case " $CASES_EXCLUES " in *" ${SC}_${POL} "*) continue ;; esac
            echo "$SC/$POL : ${NV[${SC}_${POL}]} valides sur ${NE[${SC}_${POL}]}" | tee -a "$LOGS/09_etapes.txt"
          done; done
          arreter_ran
          CAMP_F4_EOF
          cat > "$WORK/py/plateforme.sh" <<'PLAT_F4_EOF'
          #!/bin/bash
          # xML5G — mise en route de la plateforme : étape 7 de phaseF3_Corrigé.yml (15f1874), sortie dans un script
          # pour être exécutée à l'identique par le job du détecteur et par chaque tranche d'essais.
          # PROFIL_FORCE=106PRB : profil radio imposé (celui du détecteur) ; SANS_UES=oui : pas de connexion d'UE ici.
          # Essais à plusieurs UE (novembre 2026) : PROFIL_FORCE=leger demande le profil léger (25 PRB, bande 66, FDD).
          # Dans la campagne finale ce profil échouait à l'accès aléatoire (« RA failed at state WAIT_Msg3 ») : la ligne de
          # commande de l'UE n'avait pas l'écart de fréquence montante de la bande 66 (--CO -400000000, donné par la
          # documentation d'OAI). Il est ajouté ici. Si le profil léger échoue encore, on retombe sur 106 PRB et
          # 09_etapes.txt le dit (profil_radio=106PRB, profil_demande_non_obtenu=leger).
          set +e +o pipefail
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.

          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g"
          S="mysql oai-nrf oai-udr oai-udm oai-ausf oai-amf oai-smf oai-upf oai-ext-dn"
          for i in 1 2 3; do docker compose pull -q $S && break; echo "::warning::docker pull : nouvel essai ($i)"; sleep 30; done
          docker compose up -d $S
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' oai-ext-dn 2>/dev/null)" = healthy ] && break; sleep 5; done
          sleep 10; docker compose ps | tee "$LOGS/13_coeur.txt"
          # deux serveurs iperf3 dans le réseau de données, un par UE (ports 5201 et 5202) :
          # avec un seul serveur, le second UE recevait « server is busy » et retombait sur un ping
          for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done
          sleep 1
          n_srv=$(docker exec oai-ext-dn pgrep -c iperf3 2>/dev/null)
          if [ "${n_srv:-0}" -ge 2 ]; then echo "iperf3_dn=ok (2 serveurs)" >> "$LOGS/09_etapes.txt"
          else echo "iperf3_dn=absent" >> "$LOGS/09_etapes.txt"; echo "::warning::serveurs iperf3 absents : trafic bénin par ping"; fi
          # fuseau horaire du conteneur UPF (son journal est horodaté à l'heure locale du conteneur)
          echo "upf_tz=$(docker exec oai-upf date +%z 2>/dev/null || echo +0000)" >> "$LOGS/09_etapes.txt"
          FR="$WORK/oai/openair2/E2AP/flexric/build"
          sudo setsid nohup stdbuf -oL -eL "$FR/examples/ric/nearRT-RIC" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/10_ric.log" 2>&1 < /dev/null &
          sleep 3
          B="$WORK/oai/cmake_targets/ran_build/build"
          CD="$WORK/oai/targets/PROJECTS/GENERIC-NR-5GC/CONF"
          CONF106="$CD/gnb.sa.band78.fr1.106PRB.usrpb210.conf"
          # PROFIL RADIO LÉGER : 25 PRB à 15 kHz (5 MHz) au lieu de 106 PRB à 30 kHz (40 MHz), soit
          # environ 8 fois moins d'échantillons radio à calculer. Avec 106 PRB, l'émulation saturait les
          # 4 cœurs avant toute attaque (gNB ~170 %, chaque UE ~100 %) et le RTT mesurait la charge de la
          # machine. Configuration rfsim d'OAI adaptée à notre cœur (PLMN 001/01, adresses, agent E2).
          LIGHT="$WORK/gnb_light.conf"
          sed -e 's/mcc = 208; mnc = 99;/mcc = 001; mnc = 01;/' \
              -e 's/192\.168\.71\.132/192.168.70.132/' \
              -e 's#192\.168\.71\.140/26#192.168.70.129/24#g' "$CD/gnb.sa.band66.u0.25prb.rfsim.conf" > "$LIGHT"
          printf '\ne2_agent = {\n  near_ric_ip_addr = "127.0.0.1";\n  sm_dir = "/usr/local/lib/flexric/"\n};\n' >> "$LIGHT"
          grep -nE "mcc|amf_ip_address|GNB_IPV4|e2_agent|near_ric" "$LIGHT" > "$LOGS/07_gnb_light_conf.txt"
          lancer_gnb() {   # $1 = configuration, $2 = suffixe du journal
            sudo setsid nohup stdbuf -oL -eL "$B/nr-softmodem" -O "$1" '--gNBs.[0].min_rxtxtime' 6 --rfsim --e2_agent.sm_dir "$SM_DIR/" > "$LOGS/11_gnb$2.log" 2>&1 < /dev/null &
            for i in $(seq 1 60); do grep -q "Received NGSetupResponse from AMF" "$LOGS/11_gnb$2.log" && grep -q "E2 SETUP RESPONSE rx" "$LOGS/11_gnb$2.log" && return 0; sleep 2; done
            return 1
          }
          creer_ue() {     # espace de noms et fichier de l'UE $1 (une seule fois)
            [ -e "/var/run/netns/ue$1" ] || sudo bash "$WORK/oai/tools/scripts/multi-ue.sh" -c$1
            printf 'uicc0 = {\nimsi = "00101000000000%s";\nkey = "fec86ba6eb707ed08905757b1bb44b8f";\nopc= "C42449363BBAD02B66D16BC975D77CC1";\npdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });\n}\n' "$1" > "$WORK/ue$1.conf"
