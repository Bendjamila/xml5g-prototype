          { for f in scenario.py campagne.sh plateforme.sh; do echo "===== $f"; diff "$WORK/py_fige/$f" "$WORK/py/$f"; done; } > "$LOGS/03_scripts_modifies.txt" 2>&1 || true
          { echo "scripts identiques au paquet figé :"; for f in "$WORK/py_fige/"*; do n=$(basename "$f"); cmp -s "$f" "$WORK/py/$n" && echo "  $n"; done; } >> "$LOGS/03_scripts_modifies.txt"
          bash -n "$WORK/py/campagne.sh" && bash -n "$WORK/py/plateforme.sh" && python3 -m py_compile "$WORK/py/scenario.py" "$WORK/py/bilan_faisabilite.py"
          echo "scripts_multi_ue=ok" >> "$LOGS/09_etapes.txt"
      - name: 5. Compiler OAI — environ 8 min
