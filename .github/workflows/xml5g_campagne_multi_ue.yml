          fi
          [ "$PROFIL" = "${PROFIL_DETECTEUR:-106PRB}" ] || echo "profil_different_du_detecteur=${PROFIL_DETECTEUR:-106PRB}" >> "$LOGS/09_etapes.txt"
          echo "GNB_CONF=$GNB_CONF" >> "$GITHUB_ENV"; echo "UE_RF=$UE_RF" >> "$GITHUB_ENV"
          # santé du cœur 5G avant de connecter les UE (coeur.sh)
          . "$WORK/py/coeur.sh"
          reparer_coeur avant_gnb
          case " $REPARES " in *" oai-ext-dn "*) for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done ;; esac
          lancer_gnb "$GNB_CONF" "" || echo "::error::le gNB ne s'attache pas à l'AMF ou au RIC"
          mkdir -p "$WORK"
          cat > "$WORK/goulot.sh" <<'GOULOT_SH'
          BW_GOULOT="${BW_GOULOT:-20mbit}"
          docker exec oai-upf sh -c "command -v tc >/dev/null 2>&1" || docker exec oai-upf sh -c "(apt-get update && apt-get install -y iproute2) >/dev/null 2>&1 || (apk add --no-cache iproute2) >/dev/null 2>&1" || echo "::warning::tc indisponible dans oai-upf"
          upf_if() { docker exec oai-upf sh -c 'ip -o link 2>/dev/null | sed -E "s/^[0-9]+: ([^:@]+).*/\1/" | grep -E "tun|gtp|ogstun" | head -1' | tr -d "\r"; }
          upf_if_fallback() { docker exec oai-upf sh -c 'ip route show default 2>/dev/null | awk "{for(i=1;i<=NF;i++) if(\$i==\"dev\") print \$(i+1)}" | head -1' | tr -d "\r"; }
          poser_goulot() {
            IF=$(upf_if); [ -z "$IF" ] && IF=$(upf_if_fallback); [ -z "$IF" ] && IF=eth0
            GOULOT_IF=""; GOULOT_DEV=""; : > /tmp/tcerr
            docker exec oai-upf tc qdisc del dev "$IF" root 2>/dev/null
            if docker exec oai-upf tc qdisc add dev "$IF" root tbf rate "$BW_GOULOT" burst 32kbit latency 50ms 2>>/tmp/tcerr; then
              GOULOT_IF="$IF"; GOULOT_DEV="$IF"; echo "goulot=$BW_GOULOT (tbf sur $IF)" | tee -a "$LOGS/09_etapes.txt"; return; fi
            docker exec oai-upf sh -c "modprobe ifb numifbs=1 2>/dev/null; ip link add ifb0 type ifb 2>/dev/null; ip link set ifb0 up 2>/dev/null" 2>/dev/null
            docker exec oai-upf tc qdisc del dev "$IF" ingress 2>/dev/null; docker exec oai-upf tc qdisc del dev ifb0 root 2>/dev/null
            if docker exec oai-upf tc qdisc add dev "$IF" handle ffff: ingress 2>>/tmp/tcerr && docker exec oai-upf tc filter add dev "$IF" parent ffff: protocol all u32 match u32 0 0 action mirred egress redirect dev ifb0 2>>/tmp/tcerr && docker exec oai-upf tc qdisc add dev ifb0 root handle 1: htb default 10 2>>/tmp/tcerr && docker exec oai-upf tc class add dev ifb0 parent 1: classid 1:10 htb rate "$BW_GOULOT" ceil "$BW_GOULOT" burst 15k quantum 1514 2>>/tmp/tcerr; then
              docker exec oai-upf tc qdisc add dev ifb0 parent 1:10 handle 10: netem limit 100 2>/dev/null || docker exec oai-upf tc qdisc add dev ifb0 parent 1:10 handle 10: bfifo limit 150000 2>/dev/null || true
              GOULOT_IF="$IF"; GOULOT_DEV="ifb0"; echo "goulot=$BW_GOULOT (ingress $IF -> ifb0)" | tee -a "$LOGS/09_etapes.txt"; return; fi
            echo "::error::goulot NON pose sur '$IF' : $(head -1 /tmp/tcerr 2>/dev/null)"; echo "goulot=ECHEC sur $IF" >> "$LOGS/09_etapes.txt"
          }
          verifier_goulot() { [ -z "$GOULOT_DEV" ] && return 1; docker exec oai-upf tc -s qdisc show dev "$GOULOT_DEV" 2>/dev/null | grep -qE "tbf|htb"; }
          GOULOT_SH
          . "$WORK/goulot.sh"
          poser_goulot
          if verifier_goulot; then
            echo "::notice::goulot actif sur $GOULOT_DEV ($BW_GOULOT)"; echo "goulot_verifie=oui" >> "$LOGS/09_etapes.txt"
          else
            echo "::warning::goulot INACTIF - verifier le nom d'interface UPF"; echo "goulot_verifie=non" >> "$LOGS/09_etapes.txt"
            docker exec oai-upf sh -c "ip -o link; echo ---QDISC---; tc qdisc show; echo ---IFB0---; tc -s qdisc show dev ifb0 2>&1; echo ---ERR---; cat /tmp/tcerr 2>/dev/null" > "$LOGS/07_upf_interfaces.txt" 2>&1 || true
