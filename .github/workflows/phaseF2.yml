          #!/usr/bin/env python3
          """
          xML5G - entraînement du détecteur de la boucle sur le trafic de la plateforme (phase 2).

          Le MODÈLE et la RÈGLE DE SEUIL sont ceux retenus par l'étude sur les jeux publics (E1) :
          XGBoost, mêmes hyperparamètres, seuil choisi sur une validation prélevée dans
          l'entraînement, qui maximise le F1 sous un budget de fausses alarmes de 0,5 %.
          Seules les données changent : le trafic de la plateforme, comme dans le PFE.

          Deux sessions (A et B) contiennent chacune les deux attaques (SYN et UDP), lancées
          par des UEs différents. Évaluation croisée A->B et B->A, puis modèle final sur A+B.
          Le modèle est enregistré avec son seuil : {"modele", "seuil", "algorithme"}.
          """
          import argparse, json
          import numpy as np, pandas as pd, joblib
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import confusion_matrix, f1_score, roc_curve

          FEATURES = ["n_pkts", "n_bytes", "mean_len", "std_len", "max_len",
                      "frac_tcp", "frac_udp", "frac_icmp", "frac_syn",
                      "n_dst_ports", "n_src_ports", "n_dst_ips",
                      "mean_iat", "std_iat", "frac_small"]
          BUDGET_FPR = 0.005          # identique à l'étude E1
          XGB_PARAMS = dict(n_estimators=250, max_depth=8, learning_rate=0.1, subsample=0.8,
                            colsample_bytree=0.8, random_state=42, eval_metric="logloss",
                            tree_method="hist", n_jobs=-1)          # identiques à l'étude E1
          try:
              from xgboost import XGBClassifier
              ALGO = "XGBoost"
          except ImportError:                                        # repli signalé dans le bilan
              from sklearn.ensemble import RandomForestClassifier
              ALGO = "RandomForest (repli : xgboost indisponible)"


          def modele():
              if ALGO == "XGBoost":
                  return XGBClassifier(**XGB_PARAMS)
              return RandomForestClassifier(n_estimators=250, max_depth=20, min_samples_leaf=2,
                                            n_jobs=-1, random_state=42)


          def charger(csv, evts, bin_s):
              """Étiquetage du trafic d'attaque RÉELLEMENT observé à l'UPF.

              hping3 envoie en rafale ; l'UPF traite ces paquets avec du retard, si bien que le
              trafic d'attaque continue d'arriver bien après la fin de la fenêtre théorique. On
              marque « attaque » un intervalle de l'IP attaquante qui, dans la fenêtre ou juste
              après (jusqu'à GRACE s), présente une empreinte de flood (fraction de petits paquets
              élevée). Le trafic bénin (gros paquets iperf3) n'est jamais marqué : la règle ne
              peut donc pas transformer du bénin en attaque."""
              GRACE = 60.0        # tolérance après la fin de la fenêtre théorique (s)
              FLOOD_FRAC_SMALL = 0.8
              d = pd.read_csv(csv)
              ev = [json.loads(l) for l in open(evts) if l.strip()]
              c = d["t"].values - bin_s / 2
              small = d["frac_small"].values if "frac_small" in d.columns else np.zeros(len(d))
              y = np.zeros(len(d), dtype=int)
              for e in ev:
                  ip = (d["ip"].values == e["ip"])
                  dans = ip & (c >= e["start"]) & (c <= e["end"])                       # fenêtre théorique
                  tail = ip & (c > e["end"]) & (c <= e["end"] + GRACE) & (small >= FLOOD_FRAC_SMALL)  # rafale en retard
                  y |= (dans | tail).astype(int)
              d["label"] = y
              return d


          def seuil_sous_budget(y, p, budget=BUDGET_FPR):
              """Seuil qui maximise le F1 parmi ceux qui tiennent le budget de fausses alarmes."""
              fv, tv, th = roc_curve(y, p, drop_intermediate=False)
              P = int(y.sum()); N = len(y) - P
              tp, fp = tv * P, fv * N
              f1 = np.divide(2 * tp, tp + fp + P, out=np.zeros_like(tp), where=(tp + fp + P) > 0)
              ok = np.where(fv <= budget)[0]
              if len(ok) == 0:
                  return float(th[np.argmax(tv - fv)]), "Youden (budget intenable)"
              return float(min(th[ok[np.argmax(f1[ok])]], 1.0)), f"F1 max sous FPR <= {budget:.1%}"


          def entrainer(d):
              """Validation prélevée dans l'entraînement (15 %, stratifiée) pour régler le seuil."""
              X, y = d[FEATURES].values, d.label.values
              i_fit, i_val = train_test_split(np.arange(len(y)), test_size=0.15, stratify=y, random_state=42)
              m = modele().fit(X[i_fit], y[i_fit])
              s, regle = seuil_sous_budget(y[i_val], m.predict_proba(X[i_val])[:, 1])
              m = modele().fit(X, y)          # modèle final sur tout l'entraînement, seuil conservé
              return m, s, regle


          def mesures(yt, yp):
              tn, fp, fn, tp = confusion_matrix(yt, yp, labels=[0, 1]).ravel()
              return dict(detection=tp / (tp + fn) if tp + fn else None, fpr=fp / (fp + tn) if fp + tn else None,
                          precision=tp / (tp + fp) if tp + fp else None, f1=f1_score(yt, yp, zero_division=0),
                          tp=int(tp), fp=int(fp), fn=int(fn), tn=int(tn))


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--a", nargs=2, required=True, metavar=("CSV", "EVENTS"))
              ap.add_argument("--b", nargs=2, required=True, metavar=("CSV", "EVENTS"))
              ap.add_argument("--bin", type=float, default=0.2)
              ap.add_argument("--model", required=True)
              ap.add_argument("--metrics", required=True)
              a = ap.parse_args()
              A, B = charger(*a.a, a.bin), charger(*a.b, a.bin)
              res = {"algorithme": ALGO, "budget_fpr": BUDGET_FPR,
                     "intervalles": {"A": [int(len(A)), int(A.label.sum())], "B": [int(len(B)), int(B.label.sum())]}}
              for nom, tr, te in (("A_vers_B", A, B), ("B_vers_A", B, A)):
                  if tr.label.nunique() < 2 or te.label.nunique() < 2 or tr.label.sum() < 10:
                      res[nom] = "une seule classe (ou trop peu d'attaques) : évaluation impossible"
                      continue
                  m, s, regle = entrainer(tr)
                  r = mesures(te.label.values, (m.predict_proba(te[FEATURES].values)[:, 1] >= s).astype(int))
                  r.update(seuil=round(s, 4), regle_seuil=regle)
                  res[nom] = r
              tout = pd.concat([A, B])
              m, s, regle = entrainer(tout)
              joblib.dump({"modele": m, "seuil": s, "algorithme": ALGO}, a.model)
              res["modele_final"] = {"seuil": round(s, 4), "regle_seuil": regle}
              res["importances"] = dict(sorted(zip(FEATURES, [round(float(v), 4) for v in m.feature_importances_]),
                                               key=lambda kv: -kv[1]))
              json.dump(res, open(a.metrics, "w"), indent=2)
              print(json.dumps(res, indent=2))


          if __name__ == "__main__":
              main()
          TRAIN_EOF
