          #!/usr/bin/env python3
          # xML5G phase 2 — CAMPAGNE FINALE : bilan statistique sur R répétitions de chaque politique.
          # Remarque 1 (IC 95 %, tests), remarque 2 (alternatives + qualité de service de l'UE bénin),
          # remarques 4 et 18 (CPU et mémoire de l'xApp et du détecteur).
          # Toute vérification exige que la boucle ait réellement fonctionné ; aucune réussite par défaut.
          import os, re, json, csv, math, glob, statistics as st

          L = os.environ.get("LOGS", "logs")
          POLS = ["xml5g", "immediate", "slice", "none"]
          NOMS = {"xml5g": "xML5G", "immediate": "Immediate", "slice": "Slice-wide", "none": "No action"}

          def lire(n):
              p = os.path.join(L, n)
              return open(p, errors="replace").read() if os.path.exists(p) else ""
          def js(n):
              try: return json.load(open(os.path.join(L, n)))
              except Exception: return {}
          def moy_ic(v):
              """moyenne, écart-type, demi-largeur IC 95 % (Student) ; None si vide."""
              v = [x for x in v if x is not None and not (isinstance(x, float) and math.isnan(x))]
              if not v: return None, None, None, 0
              m = st.mean(v)
              if len(v) < 2: return m, None, None, 1
              s = st.stdev(v)
              try:
                  from scipy.stats import t
                  h = t.ppf(0.975, len(v) - 1) * s / math.sqrt(len(v))
              except Exception:
                  h = None
              return m, s, h, len(v)
          def fmt(m, s=None, h=None, u="", d=2):
              if m is None: return "—"
              r = f"{m:.{d}f}"
              if s is not None: r += f" ± {s:.{d}f}"
              if h is not None: r += f" [IC95 ±{h:.{d}f}]"
              return r + u

          etat = {}
          for l in lire("09_etapes.txt").splitlines():
              if "=" in l:
                  k, v = l.split("=", 1); etat[k.strip()] = v.strip()
          train = js("50_train_metrics.json")

          # ---------- paquets par seconde à l'UPF (journal agrégé), heure du conteneur -> UTC ----------
          UPF = {}
          tz = etat.get("upf_tz", "+0000")
          try:
              off = (1 if tz[0] == "+" else -1) * (int(tz[1:3]) * 3600 + int(tz[3:5]) * 60)
          except Exception:
              off = 0
          if os.path.exists(os.path.join(L, "40_upf_pps.txt")):
              import datetime as dt
              for l in open(os.path.join(L, "40_upf_pps.txt")):
                  f = l.split()
                  if len(f) != 4: continue
                  try:
                      ts = dt.datetime.strptime(f"{f[0]} {f[1]}", "%Y-%m-%d %H:%M:%S").replace(tzinfo=dt.timezone.utc).timestamp() - off
                      ip = ".".join(map(str, int(f[2], 16).to_bytes(4, "little")))
                      UPF.setdefault(ip, {})[int(ts)] = UPF.setdefault(ip, {}).get(int(ts), 0) + int(f[3])
                  except Exception:
                      pass

          RE_REL = re.compile(r"RELEASE ran_ue_id=(\d+) policy=\S+ t_first_alarm_rx_us=(\d+) t_decision_us=(\d+) "
                              r"t_ctrl_send_us=(\d+) t_ctrl_ack_us=(\d+) result=(\w+)")
          RE_SUM = re.compile(r"SUMMARY ran_ue_id=(\d+) verdicts=(\d+) alarms=(\d+) released=(\d)")
          RE_MAP = re.compile(r"MAP teid=(\d+) ran_ue_id=(\d+) kind=ul")

          def rtt(fichier, t0, a, b):
              """médiane du RTT (ms) et part de sondes répondues dans [t0+a, t0+b)."""
              rep, seqs = [], []
              for l in lire(fichier).splitlines():
                  m = re.match(r"\[(\d+\.\d+)\].*icmp_seq=(\d+).*time=([\d.]+) ms", l)
                  if m:
                      t = float(m.group(1)) - t0
                      if a <= t < b:
                          rep.append(float(m.group(3)))
              n_att = max(int((b - a) / 0.2), 1)
              return (st.median(rep) if rep else None), min(len(rep) / n_att, 1.0)

          def iperf(fichier, t0, a, b):
              """débit reçu (Mbit/s) et pertes (%) de l'UE, côté serveur, dans [t0+a, t0+b)."""
              txt = lire(fichier); dec = json.JSONDecoder(); i = 0; bps, perte = [], []
              while i < len(txt):
                  j = txt.find("{", i)
                  if j < 0: break
                  try:
                      o, i = dec.raw_decode(txt, j)
                  except Exception:
                      i = j + 1; continue
                  ts = o.get("start", {}).get("timestamp", {}).get("timesecs")
                  if ts is None: continue
                  for iv in o.get("intervals", []):
                      s_ = iv.get("sum", {}); tc = ts + s_.get("start", 0) - t0
                      if a <= tc < b:
                          bps.append(s_.get("bits_per_second", 0) / 1e6)
                          if "lost_percent" in s_: perte.append(s_["lost_percent"])
              return (st.mean(bps) if bps else None), (st.mean(perte) if perte else None)

          def pidstat(fichier):
              """%CPU moyen et RSS max (Mo) par commande."""
              res, hdr = {}, None
              for l in lire(fichier).splitlines():
                  if l.startswith("#"):
                      hdr = l[1:].split(); continue
                  f = l.split()
                  if not hdr or len(f) != len(hdr): continue
                  d = dict(zip(hdr, f)); c = d.get("Command", "?")
                  try:
                      r = res.setdefault(c, {"cpu": [], "rss": []})
                      r["cpu"].append(float(d["%CPU"])); r["rss"].append(float(d["RSS"]) / 1024)
                  except Exception:
                      pass
              return {c: (st.mean(v["cpu"]), max(v["rss"])) for c, v in res.items() if v["cpu"]}

          def run(pol, r):
              R = f"{pol}_r{r}"
              x = lire(f"60_xapp_{R}.log")
              if not x: return None
              s = js(f"61_ids_{R}_summary.json")
              ev = [json.loads(l) for l in lire(f"62_ev_{R}.jsonl").splitlines() if l.strip()]
              e = ev[0] if ev else None
              ul = {int(t): u for t, u in RE_MAP.findall(x)}
              atk_ue = None
              if e:
                  for teid, d in (s or {}).items():
                      if d.get("ip") == e["ip"] and (int(teid) & 0xFF) in ul:
                          atk_ue = ul[int(teid) & 0xFF]
              summ = {u: dict(v=int(v), a=int(al)) for u, v, al, _ in RE_SUM.findall(x)}
              mm = re.search(r"unmapped_verdicts=(\d+)", x)
              o = dict(politique=pol, rep=r, verdicts=sum(v["v"] for v in summ.values()),
                       non_associes=int(mm.group(1)) if mm else None, attaquant_libere=0, benins_liberes=0,
                       alarme_vers_commande_ms=None, decision_vers_ack_ms=None, debut_vers_liberation_s=None,
                       debut_vers_1re_alarme_s=None, debut_vers_flood_upf_s=None,
                       regle_sur_attaquant=0, regle_sur_benins=0,
                       det_par_verdict=None, fp_par_verdict=None, n_verdicts_benins=0,
                       rtt_benin_avant_ms=None, rtt_benin_attaque_ms=None, rtt_benin_apres_ms=None, rep_benin_attaque=None,
                       debit_benin_avant=None, debit_benin_attaque=None, debit_benin_apres=None, perte_benin_attaque=None)
              if not e: return o
              t0 = e["start"]; fin = e["end"] - t0
              for u, al, dec, se, ak, res in RE_REL.findall(x):
                  if res != "ACK": continue
                  if atk_ue is not None and u == atk_ue:
                      o["attaquant_libere"] = 1
                      o["alarme_vers_commande_ms"] = round((int(se) - int(al)) / 1e3, 1) if int(al) else None
                      o["decision_vers_ack_ms"] = round((int(ak) - int(dec)) / 1e3, 2)
                      o["debut_vers_liberation_s"] = round(int(ak) / 1e6 - t0, 2)
                      o["debut_vers_1re_alarme_s"] = round(int(al) / 1e6 - t0, 2) if int(al) else None
                  else:
                      o["benins_liberes"] += 1
              for u in re.findall(r"WOULD_RELEASE ran_ue_id=(\d+)", x):
                  if atk_ue is not None and u == atk_ue: o["regle_sur_attaquant"] = 1
                  else: o["regle_sur_benins"] += 1
              # verdicts du détecteur : attaquant dans la fenêtre d'attaque, UE bénin partout
              a_n = a_p = b_n = b_p = 0; t_al = None
              for l in lire(f"61_ids_{R}.log").splitlines():
                  f = l.split()
                  if len(f) < 6 or f[0] != "V": continue
                  t, ip, v = int(f[1]) / 1e6 - t0, f[3], int(f[4])
                  if ip == e["ip"]:
                      if 0 <= t <= fin: a_n += 1; a_p += v
                      if v and t >= 0 and t_al is None: t_al = t
                  else:
                      b_n += 1; b_p += v
              o["det_par_verdict"] = a_p / a_n if a_n else None
              o["fp_par_verdict"] = b_p / b_n if b_n else None
              o["n_verdicts_benins"] = b_n
              if o["debut_vers_1re_alarme_s"] is None and t_al is not None:
                  o["debut_vers_1re_alarme_s"] = round(t_al, 2)
              # arrivée du flood à l'UPF : première seconde >= 5 fois le débit médian d'avant l'attaque
              ser = UPF.get(e["ip"], {})
              if ser:
                  base = [ser.get(int(t0) + k, 0) for k in range(-8, 0)]
                  seuil = max(5 * (st.median(base) if base else 0), 500)
                  for k in range(0, 60):
                      if ser.get(int(t0) + k, 0) >= seuil:
                          o["debut_vers_flood_upf_s"] = k; break
              # qualité de service de l'UE bénin (l'autre UE)
              ns_b = "ue2" if e.get("ns") == "ue1" else "ue1"
              port_b = 5200 + int(ns_b[2:])
              fin_att = o["debut_vers_liberation_s"] if o["attaquant_libere"] else fin
              o["rtt_benin_avant_ms"], _ = rtt(f"62_ev_{R}_rtt_{ns_b}.txt", t0, -9, 0)
              o["rtt_benin_attaque_ms"], o["rep_benin_attaque"] = rtt(f"62_ev_{R}_rtt_{ns_b}.txt", t0, 0, fin_att)
              o["rtt_benin_apres_ms"], _ = rtt(f"62_ev_{R}_rtt_{ns_b}.txt", t0, fin_att, fin_att + 15)
              o["debit_benin_avant"], _ = iperf(f"64_iperf_{R}_p{port_b}.json", t0, -9, 0)
              o["debit_benin_attaque"], o["perte_benin_attaque"] = iperf(f"64_iperf_{R}_p{port_b}.json", t0, 0, fin_att)
              o["debit_benin_apres"], _ = iperf(f"64_iperf_{R}_p{port_b}.json", t0, fin_att, fin_att + 15)
              # CPU / mémoire
              for c, (cpu, rss) in pidstat(f"65_pidstat_{R}.txt").items():
                  k = {"python3": "detecteur", "xapp_xml5g": "xapp", "nr-softmodem": "gnb", "nr-uesoftmodem": "ue"}.get(c)
                  if k:
                      o[f"cpu_{k}_pct"] = round(cpu, 1); o[f"rss_{k}_mo"] = round(rss, 1)
              return o

          RUNS = []
          reps = sorted({int(m) for m in re.findall(r"60_xapp_\w+?_r(\d+)\.log", " ".join(os.listdir(L)))}) if os.path.isdir(L) else []
          for r in reps:
              for p in POLS:
                  o = run(p, r)
                  if o: RUNS.append(o)
          if RUNS:
              cles = sorted({k for o in RUNS for k in o}, key=lambda k: (k not in RUNS[0], k))
              with open(os.path.join(L, "99_runs.csv"), "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=cles); w.writeheader(); [w.writerow(o) for o in RUNS]

          def col(p, k): return [o.get(k) for o in RUNS if o["politique"] == p]

          md = ["## xML5G — phase 2, campagne finale : bilan", "",
                "### Plateforme", "", "- " + ", ".join(f"{k} = {v}" for k, v in etat.items()), ""]
          md += ["### Détecteur (entraîné sur le trafic de la plateforme)", ""]
          if train:
              md.append(f"Modèle : {train.get('algorithme')} ; seuil {train.get('modele_final', {}).get('seuil')} "
                        f"({train.get('modele_final', {}).get('regle_seuil')}).")
              for k in ("A_vers_B", "B_vers_A"):
                  m = train.get(k)
                  if isinstance(m, dict) and m.get("detection") is not None:
                      md.append(f"- {k.replace('_', ' ')} : détection {m['detection']*100:.1f} %, FPR {(m['fpr'] or 0)*100:.2f} %, F1 {m['f1']:.3f}")
          md.append("")

          # ---------- tableau par politique, moyennes et IC 95 % ----------
          STATS = []
          md += [f"### Boucle fermée : {len(reps)} répétitions par politique (moyenne ± écart-type [IC 95 %])", "",
                 "| Politique | Attaquant coupé | UE bénins coupés | 1re alarme → commande (ms) | Décision → ACK E2 (ms) | Début → coupure (s) | Début → flood à l'UPF (s) | Début → 1re alarme (s) |",
                 "|---|---|---|---|---|---|---|---|"]
          for p in POLS:
              n = len(col(p, "rep"))
              if not n: continue
              k = sum(col(p, "attaquant_libere")); b = sum(col(p, "benins_liberes"))
              try:
                  from scipy.stats import binomtest
                  ci = binomtest(k, n).proportion_ci(0.95); ic = f" [{ci.low:.2f}; {ci.high:.2f}]"
              except Exception:
                  ic = ""
              ag = {c: moy_ic(col(p, c)) for c in ["alarme_vers_commande_ms", "decision_vers_ack_ms", "debut_vers_liberation_s",
                                                     "debut_vers_flood_upf_s", "debut_vers_1re_alarme_s", "debit_benin_attaque",
                                                     "rtt_benin_attaque_ms", "cpu_detecteur_pct", "cpu_xapp_pct", "rss_xapp_mo",
                                                     "rss_detecteur_mo", "cpu_gnb_pct", "cpu_ue_pct"]}
              STATS.append(dict(politique=p, n=n, attaquant_libere=k, benins_liberes=b,
                                **{f"{c}_{s}": v for c, (m, sd, h, nn) in ag.items() for s, v in (("moy", m), ("et", sd), ("ic95", h))}))
              md.append(f"| {NOMS[p]} | {k}/{n}{ic} | {b} | {fmt(*ag['alarme_vers_commande_ms'][:3], d=1)} | "
                        f"{fmt(*ag['decision_vers_ack_ms'][:3], d=2)} | {fmt(*ag['debut_vers_liberation_s'][:3])} | "
                        f"{fmt(*ag['debut_vers_flood_upf_s'][:3], d=1)} | {fmt(*ag['debut_vers_1re_alarme_s'][:3])} |")
          md.append("")
          if STATS:
              with open(os.path.join(L, "99_politiques_stats.csv"), "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=list(STATS[0].keys())); w.writeheader(); [w.writerow(o) for o in STATS]

          # ---------- qualité de service de l'UE bénin ----------
          md += ["### Qualité de service de l'UE bénin pendant l'attaque (moyenne sur les répétitions)", "",
                 "| Politique | Débit reçu avant (Mbit/s) | Débit reçu pendant | Débit reçu après | Pertes pendant (%) | RTT médian avant (ms) | RTT pendant | RTT après |",
                 "|---|---|---|---|---|---|---|---|"]
          for p in POLS:
              if not col(p, "rep"): continue
              g = lambda c, d=2: fmt(moy_ic(col(p, c))[0], d=d)
              md.append(f"| {NOMS[p]} | {g('debit_benin_avant')} | {g('debit_benin_attaque')} | {g('debit_benin_apres')} | "
                        f"{g('perte_benin_attaque', 1)} | {g('rtt_benin_avant_ms', 1)} | {g('rtt_benin_attaque_ms', 1)} | {g('rtt_benin_apres_ms', 1)} |")
          md.append("")

          # ---------- tests statistiques : xML5G contre chaque alternative ----------
          md += ["### Tests statistiques (xML5G contre chaque alternative)", "",
                 "| Comparaison | UE bénins coupés (Fisher exact) | Débit bénin pendant l'attaque (Mann-Whitney) | RTT bénin pendant l'attaque (Mann-Whitney) |",
                 "|---|---|---|---|"]
          TESTS = []
          try:
              from scipy.stats import fisher_exact, mannwhitneyu
              nx = len(col("xml5g", "rep")); bx = sum(col("xml5g", "benins_liberes"))
              for p in ["immediate", "slice", "none"]:
                  n = len(col(p, "rep"))
                  if not n or not nx: continue
                  bp = sum(col(p, "benins_liberes"))
                  pf = fisher_exact([[bx, nx - min(bx, nx)], [bp, n - min(bp, n)]])[1]
                  def mw(c):
                      a_ = [v for v in col("xml5g", c) if v is not None]; b_ = [v for v in col(p, c) if v is not None]
                      if len(a_) < 2 or len(b_) < 2: return None
                      return mannwhitneyu(a_, b_, alternative="two-sided").pvalue
                  pd_, pr_ = mw("debit_benin_attaque"), mw("rtt_benin_attaque_ms")
                  TESTS.append(dict(comparaison=f"xml5g_vs_{p}", fisher_benins=pf, mw_debit=pd_, mw_rtt=pr_))
                  md.append(f"| xML5G vs {NOMS[p]} | p = {pf:.3f} ({bx}/{nx} vs {bp}/{n}) | "
                            f"{'p = %.3f' % pd_ if pd_ is not None else '—'} | {'p = %.3f' % pr_ if pr_ is not None else '—'} |")
          except Exception as ex:
              md.append(f"| (tests impossibles : {ex}) | | | |")
          md += ["", f"Avec {len(reps)} répétitions par groupe, la plus petite p-valeur possible du test de Mann-Whitney est "
                 f"{2 / math.comb(2 * max(len(reps), 1), max(len(reps), 1)):.4f}.", ""]

          # ---------- ressources ----------
          md += ["### Ressources (moyenne des répétitions)", "",
                 "| Politique | CPU détecteur (%) | Mémoire détecteur (Mo) | CPU xApp (%) | Mémoire xApp (Mo) | CPU gNB (%) | CPU par UE simulé (%) |",
                 "|---|---|---|---|---|---|---|"]
          for p in POLS:
              if not col(p, "rep"): continue
              g = lambda c: fmt(moy_ic(col(p, c))[0], d=1)
              md.append(f"| {NOMS[p]} | {g('cpu_detecteur_pct')} | {g('rss_detecteur_mo')} | {g('cpu_xapp_pct')} | "
                        f"{g('rss_xapp_mo')} | {g('cpu_gnb_pct')} | {g('cpu_ue_pct')} |")
          md.append("")

          # ---------- prédiction (jeux publics) contre observation (politique none, toutes répétitions) ----------
          E1 = dict(tpr=10606 / 10947, fpr=3 / 2397)    # XGBoost, CICDDoS2019, jour non vu (Kaggle) ; 0 FP -> borne 3/N
          mw_ = re.search(r"W=(\d+) theta=([\d.]+) K=(\d+)", lire("60_xapp_xml5g_r1.log") or "")
          W, K = (int(mw_.group(1)), int(mw_.group(3))) if mw_ else (10, 7)
          def p_regle(p): return None if p is None else sum(math.comb(W, k) * p**k * (1 - p)**(W - k) for k in range(K, W + 1))
          det = [o["det_par_verdict"] for o in RUNS if o["politique"] == "none" and o["det_par_verdict"] is not None]
          nb = sum(o["n_verdicts_benins"] for o in RUNS if o["politique"] == "none")
          fpv = [o["fp_par_verdict"] * o["n_verdicts_benins"] for o in RUNS if o["politique"] == "none" and o["fp_par_verdict"] is not None]
          fp_obs = (sum(fpv) / nb) if nb else None
          fp_use = (3 / nb) if (nb and fp_obs == 0) else fp_obs
          md += ["### Prédiction (jeux publics) contre observation (politique none, toutes répétitions)", "",
                 f"Règle : au moins {K} verdicts « attaque » parmi les {W} derniers.", "",
                 "| | Jeux publics (E1) | Boucle observée |", "|---|---|---|",
                 f"| Détection par verdict | {E1['tpr']*100:.2f} % | {fmt(*moy_ic(det)[:3], d=3) if det else '—'} |",
                 f"| Fausses alarmes par verdict | ≤ {E1['fpr']*100:.2f} % (0 sur 2397) | "
                 f"{('0 sur %d (≤ %.2f %%)' % (nb, 300 / nb)) if (nb and fp_obs == 0) else (('%.2f %%' % (fp_obs * 100)) if fp_obs is not None else '—')} |",
                 f"| P(attaquant coupé), prédite | {p_regle(E1['tpr']):.4f} | {('%.4f' % p_regle(st.mean(det))) if det else '—'} |",
                 f"| P(UE bénin coupé, par décision), prédite | {p_regle(E1['fpr']):.1e} | {('%.1e' % p_regle(fp_use)) if fp_use is not None else '—'} |",
                 ""]

          # ---------- vérifications ----------
          iv = train.get("intervalles", {}) if train else {}
          nx = len(col("xml5g", "rep")); nn = len(col("none", "rep"))
          checks = [
           ("Trafic GTP-U capté par le détecteur (deux sessions, avec attaques)",
            all(isinstance(iv.get(k), list) and iv[k][0] > 0 and iv[k][1] > 0 for k in ("A", "B"))),
           ("Détecteur entraîné et évalué en croisé",
            any(isinstance(train.get(k), dict) and train[k].get("detection") is not None for k in ("A_vers_B", "B_vers_A"))),
           (f"Toutes les exécutions ont tourné ({len(RUNS)} sur {4 * len(reps)}) et reçu des verdicts",
            bool(RUNS) and len(RUNS) == 4 * len(reps) and all(o["verdicts"] > 0 for o in RUNS)),
           ("Verdicts toujours associés à un UE (aucun verdict orphelin)",
            bool(RUNS) and all(o["non_associes"] == 0 for o in RUNS)),
           (f"xML5G coupe l'attaquant dans au moins 80 % des répétitions ({sum(col('xml5g', 'attaquant_libere'))}/{nx})",
            nx > 0 and sum(col("xml5g", "attaquant_libere")) >= 0.8 * nx),
           (f"xML5G ne coupe aucun UE bénin sur l'ensemble des répétitions ({sum(col('xml5g', 'benins_liberes'))} coupé)",
            nx > 0 and sum(col("xml5g", "attaquant_libere")) > 0 and sum(col("xml5g", "benins_liberes")) == 0),
           ("Sans action : la règle se déclenche sur l'attaquant, jamais sur un UE bénin",
            nn > 0 and sum(col("none", "regle_sur_attaquant")) >= 0.8 * nn and sum(col("none", "regle_sur_benins")) == 0),
           ("Qualité de service de l'UE bénin mesurée (RTT) dans toutes les répétitions",
            bool(RUNS) and all(o["rtt_benin_avant_ms"] is not None for o in RUNS)),
           ("CPU et mémoire de l'xApp et du détecteur mesurés dans toutes les répétitions",
            bool(RUNS) and all(o.get("cpu_xapp_pct") is not None and o.get("cpu_detecteur_pct") is not None for o in RUNS)),
          ]
          md += ["### Vérifications", "", "| Vérification | Résultat |", "|---|---|"]
          for n_, ok in checks:
              md.append(f"| {n_} | {'✅' if ok else '❌'} |")
          md += ["", f"**{sum(ok for _, ok in checks)} vérifications réussies sur {len(checks)}.**"]
          texte = "\n".join(md)
          print(texte)
          open(os.path.join(L, "99_bilan.md"), "w").write(texte + "\n")
          s_ = os.environ.get("GITHUB_STEP_SUMMARY")
          if s_:
              open(s_, "a").write(texte + "\n")
          BILAN2_EOF
      - name: 5. Compiler OAI — environ 8 min
        run: |

          cd "$WORK/oai/cmake_targets"
          ./build_oai -I > "$LOGS/04_oai_dep.log" 2>&1 || { tail -40 "$LOGS/04_oai_dep.log"; exit 1; }
          ./build_oai -w SIMU --gNB --nrUE --build-e2 --cmake-opt -DE2AP_VERSION=E2AP_V3 --cmake-opt -DKPM_VERSION=KPM_V3_00 --ninja > "$LOGS/05_oai.log" 2>&1 || { tail -60 "$LOGS/05_oai.log"; exit 1; }
          ls ran_build/build/nr-softmodem ran_build/build/nr-uesoftmodem
          echo "oai_compile=ok" >> "$LOGS/09_etapes.txt"
      - name: 6. Compiler FlexRIC, le RIC et les deux xApps
        run: |

          sudo apt-get install -y -q libpcre2-dev libsctp-dev > /dev/null
          cd "$WORK/oai/openair2/E2AP/flexric" && mkdir -p build && cd build
          cmake -GNinja -DE2AP_VERSION=E2AP_V3 -DKPM_VERSION=KPM_V3_00 -DCMAKE_BUILD_TYPE=Release .. > "$LOGS/06_fr_cmake.log" 2>&1
          ninja -j"$(nproc)" > "$LOGS/07_fr.log" 2>&1 || { tail -50 "$LOGS/07_fr.log"; exit 1; }
          sudo ninja install > /dev/null 2>&1
          SM_DIR="$(dirname "$(find /usr/local -name librc_sm.so | head -1)")"; echo "SM_DIR=$SM_DIR" >> "$GITHUB_ENV"
          FR_CONF="$(find /usr/local/etc -name flexric.conf | head -1)"; echo "FR_CONF=${FR_CONF:-$WORK/oai/openair2/E2AP/flexric/flexric.conf}" >> "$GITHUB_ENV"
          ls examples/ric/nearRT-RIC examples/xApp/c/rc_release/xapp_rc_release examples/xApp/c/xapp_xml5g/xapp_xml5g
          echo "flexric_compile=ok" >> "$LOGS/09_etapes.txt"
      - name: 7. Démarrer le cœur 5G, le RIC, le gNB et 2 UEs
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail

          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g"
          S="mysql oai-nrf oai-udr oai-udm oai-ausf oai-amf oai-smf oai-upf oai-ext-dn"
          docker compose pull -q $S; docker compose up -d $S
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' oai-ext-dn 2>/dev/null)" = healthy ] && break; sleep 5; done
          sleep 10; docker compose ps | tee "$LOGS/13_coeur.txt"
          # deux serveurs iperf3 dans le réseau de données, un par UE (ports 5201 et 5202) :
          # avec un seul serveur, le second UE recevait « server is busy » et retombait sur un ping
          for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done
          sleep 1
          n_srv=$(docker exec oai-ext-dn pgrep -c iperf3 2>/dev/null)
          if [ "${n_srv:-0}" -ge 2 ]; then echo "iperf3_dn=ok (2 serveurs)" >> "$LOGS/09_etapes.txt"
          else echo "iperf3_dn=absent" >> "$LOGS/09_etapes.txt"; echo "::warning::serveurs iperf3 absents : trafic bénin par ping"; fi
          # fuseau horaire du conteneur UPF (son journal est horodaté à l'heure locale du conteneur)
          echo "upf_tz=$(docker exec oai-upf date +%z 2>/dev/null || echo +0000)" >> "$LOGS/09_etapes.txt"
          FR="$WORK/oai/openair2/E2AP/flexric/build"
          sudo setsid nohup stdbuf -oL -eL "$FR/examples/ric/nearRT-RIC" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/10_ric.log" 2>&1 < /dev/null &
          sleep 3
          B="$WORK/oai/cmake_targets/ran_build/build"
          CONF="$WORK/oai/targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.106PRB.usrpb210.conf"
          sudo setsid nohup stdbuf -oL -eL "$B/nr-softmodem" -O "$CONF" '--gNBs.[0].min_rxtxtime' 6 --rfsim --e2_agent.sm_dir "$SM_DIR/" > "$LOGS/11_gnb.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do grep -q "Received NGSetupResponse from AMF" "$LOGS/11_gnb.log" && grep -q "E2 SETUP RESPONSE rx" "$LOGS/11_gnb.log" && break; sleep 2; done
          UES=""
          for k in 1 2; do
            sudo bash "$WORK/oai/tools/scripts/multi-ue.sh" -c$k
            cat > "$WORK/ue$k.conf" <<UECONF_EOF
          uicc0 = {
          imsi = "00101000000000$k";
          key = "fec86ba6eb707ed08905757b1bb44b8f";
          opc= "C42449363BBAD02B66D16BC975D77CC1";
          pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
          }
          UECONF_EOF
            ip_ue=""
            for essai in 1 2 3; do
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" -r 106 --numerology 1 --band 78 -C 3619200000 --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              sleep 5
              for i in $(seq 1 40); do
                ip_ue=$(sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | grep oaitun | awk '{print $4}' | cut -d/ -f1)
                [ -n "$ip_ue" ] && break
                pgrep -f "ue$k.conf" > /dev/null || break
                sleep 3
              done
              [ -n "$ip_ue" ] && break
              sudo pkill -f "ue$k.conf" || true; sleep 15
            done
            echo "UE$k adresse ${ip_ue:-aucune}"; echo "ue${k}_ip=${ip_ue:-aucune}" >> "$LOGS/09_etapes.txt"
            if [ -n "$ip_ue" ]; then
              # sans cette route, le trafic de l'UE vers le réseau de données n'a aucun chemin
              # (« Network is unreachable ») : ni trafic bénin, ni attaque, rien dans le tunnel GTP-U
              tun=$(sudo ip netns exec ue$k ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
              sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
              sudo ip netns exec ue$k ip route | sed "s/^/ue$k route: /" >> "$LOGS/09_routes.txt"
              if sudo ip netns exec ue$k ping -c 3 -W 3 192.168.70.135 > "$LOGS/09_ping_ue$k.txt" 2>&1; then
                echo "ue${k}_ping=ok" >> "$LOGS/09_etapes.txt"
              else
                echo "ue${k}_ping=echec" >> "$LOGS/09_etapes.txt"; echo "::error::UE$k ne joint pas le réseau de données (voir 09_ping_ue$k.txt)"
              fi
            fi
            [ -n "$ip_ue" ] && UES="${UES:+$UES,}ue$k:$ip_ue"
            sleep 20
          done
          echo "UES=$UES" >> "$GITHUB_ENV"
          echo "les deux UEs : $UES"
          n_ue=$(echo "$UES" | tr ',' '\n' | grep -c . )
          echo "nb_ue=$n_ue" >> "$LOGS/09_etapes.txt"
          [ "$n_ue" -eq 2 ] || echo "::error::seulement $n_ue UE(s) connecté(s) sur 2 : la suite ne peut pas fonctionner"
      - name: 8. Collecte du trafic d'entraînement (2 sessions)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : on gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -n "$UES" ] || echo "::error::variable UES vide : aucun UE n'a d'adresse (voir l'étape 7)"
          cd "$WORK/py"
          # Chaque session contient les DEUX attaques (SYN puis UDP), lancées par des UEs
          # différents ; les rôles sont inversés entre A et B. L'évaluation croisée A->B
          # mesure donc le passage à une autre session et à un autre attaquant, et non
          # à une famille d'attaque jamais vue (cas où tout détecteur échoue).
          for S in A B; do
            if [ "$S" = A ]; then ATKS="ue1:syn:20:30,ue2:udp:70:30"; else ATKS="ue2:syn:20:30,ue1:udp:70:30"; fi
            docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
            for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P > /dev/null 2>&1; done
            sudo setsid nohup nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode collect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 135 --out "$LOGS/50_train_$S.csv" > "$LOGS/50_collect_$S.log" 2>&1 < /dev/null &
            IDS_PID=$!
            sleep 3
            sudo python3 scenario.py --ues "$UES" --attacks "$ATKS" --total 125 --events "$LOGS/50_ev_$S.jsonl" 2>&1 | tee "$LOGS/50_scenario_$S.log"
            wait $IDS_PID 2>/dev/null
            sleep 8   # laisser le collecteur finir sa durée
            n_l=$(wc -l < "$LOGS/50_train_$S.csv")
            echo "session $S : $n_l lignes"
            [ "$n_l" -gt 1 ] || echo "::error::session $S : aucun relevé collecté (voir 50_collect_$S.log et 50_scenario_$S.log)"
          done
      - name: 9. Entraîner le détecteur (évaluation croisée)
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : une recherche d'adresse encore vide
          # (grep sans résultat) arrêtait toute l'étape. On gère les erreurs nous-mêmes.
          set +e +o pipefail

          cd "$WORK/py"
          python3 train_xml5g.py --a "$LOGS/50_train_A.csv" "$LOGS/50_ev_A.jsonl" --b "$LOGS/50_train_B.csv" "$LOGS/50_ev_B.jsonl" --bin 0.2 --model "$WORK/model.joblib" --metrics "$LOGS/50_train_metrics.json" 2>&1 | tee "$LOGS/50_train.log"
          [ -f "$WORK/model.joblib" ] || echo "::error::détecteur non entraîné : voir 50_train.log"
      - name: 10. Boucle complète, pour chaque politique
        continue-on-error: true
        run: |
          # GitHub lance bash avec -e -o pipefail : on gère les erreurs nous-mêmes.
          set +e +o pipefail
          [ -f "$WORK/model.joblib" ] || echo "::error::pas de modèle : la boucle tournera sans détecteur (voir l'étape 9)"
          cd "$WORK/py"
          B="$WORK/oai/cmake_targets/ran_build/build"
          FR="$WORK/oai/openair2/E2AP/flexric/build"
          CONF="$WORK/oai/targets/PROJECTS/GENERIC-NR-5GC/CONF/gnb.sa.band78.fr1.106PRB.usrpb210.conf"

          # Couper un UE en cours de session fait planter le gNB de cette version d'OAI
          # (assertion seq_arr_end). On REDÉMARRE donc RIC + gNB + UEs entre CHAQUE
          # politique, sur une plateforme propre. Et on teste xml5g EN PREMIER : c'est le
          # résultat le plus important, on l'obtient même si une politique ultérieure casse.
          arreter_ran() {
            sudo pkill -f nr-uesoftmodem; sudo pkill -f nr-softmodem; sudo pkill -f nearRT-RIC
            sleep 5
          }
          demarrer_ran() {
            local tag=$1
            sudo setsid nohup stdbuf -oL -eL "$FR/examples/ric/nearRT-RIC" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/10_ric_$tag.log" 2>&1 < /dev/null &
            sleep 3
            sudo setsid nohup stdbuf -oL -eL "$B/nr-softmodem" -O "$CONF" '--gNBs.[0].min_rxtxtime' 6 --rfsim --e2_agent.sm_dir "$SM_DIR/" > "$LOGS/11_gnb_$tag.log" 2>&1 < /dev/null &
            for i in $(seq 1 90); do
              grep -q "Received NGSetupResponse from AMF" "$LOGS/11_gnb_$tag.log" && grep -q "E2 SETUP RESPONSE rx" "$LOGS/11_gnb_$tag.log" && break
              sleep 2
            done
            for k in 1 2; do
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" -r 106 --numerology 1 --band 78 -C 3619200000 --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
            done
          }
          # Remet l'UE k en service et garantit sa route + sa connectivité. Renvoie l'adresse (vide si échec).
          ue_pret() {
            k=$1
            for essai in 1 2 3; do
              ip_=$(sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | awk '/oaitun/{split($4,a,"/"); print a[1]; exit}')
              if [ -n "$ip_" ]; then
                tun=$(sudo ip netns exec ue$k ip -o -4 addr show | awk '/oaitun/{print $2; exit}')
                sudo ip netns exec ue$k ip route replace 192.168.70.0/24 dev "$tun"
                if sudo ip netns exec ue$k ping -c 2 -W 2 192.168.70.135 > /dev/null 2>&1; then echo "$ip_"; return; fi
              fi
              echo "UE$k pas encore prêt (essai $essai)" >&2
              sudo pkill -f "ue$k.conf"; sleep 5
              sudo setsid nohup stdbuf -oL -eL ip netns exec ue$k "$B/nr-uesoftmodem" -O "$WORK/ue$k.conf" -r 106 --numerology 1 --band 78 -C 3619200000 --rfsim '--rfsimulator.[0].serveraddr' "10.20$k.1.100" >> "$LOGS/12_ue$k.log" 2>&1 < /dev/null &
              for i in $(seq 1 40); do sudo ip netns exec ue$k ip -o -4 addr show 2>/dev/null | grep -q oaitun && break; sleep 3; done
              sleep 5
            done
            echo ""
          }

          NREP=5
          # Ordre alterné (xml5g, immediate, slice, none) à chaque répétition : une dérive lente
          # de la machine se répartit sur toutes les politiques au lieu d'en pénaliser une.
          for REP in $(seq 1 $NREP); do
          for POL in xml5g immediate slice none; do
            RUN="${POL}_r${REP}"
            echo "=== répétition $REP / $NREP, politique $POL ==="
            arreter_ran
            demarrer_ran "$RUN"
            # serveurs iperf3 remis à zéro, avec journal JSON côté serveur (débit reçu, pertes)
            docker exec oai-ext-dn pkill iperf3 > /dev/null 2>&1; sleep 1
            docker exec oai-ext-dn rm -f /tmp/iperf_5201.json /tmp/iperf_5202.json > /dev/null 2>&1
            for P in 5201 5202; do docker exec -d oai-ext-dn iperf3 -s -p $P -J --logfile /tmp/iperf_$P.json > /dev/null 2>&1; done
            ip1=$(ue_pret 1); ip2=$(ue_pret 2)
            UESP=""; [ -n "$ip1" ] && UESP="ue1:$ip1"; [ -n "$ip2" ] && UESP="${UESP:+$UESP,}ue2:$ip2"
            echo "$RUN : $UESP" | tee -a "$LOGS/63_ues_par_politique.txt"
            [ -n "$ip1" ] || echo "::error::$RUN : l'UE attaquant (ue1) n'est pas en service"
            XML5G_POLICY=$POL XML5G_W=10 XML5G_THETA=0.7 XML5G_DURATION=80 XML5G_PORT=9999 \
              sudo -E setsid nohup nice -n -10 stdbuf -oL "$WORK/oai/openair2/E2AP/flexric/build/examples/xApp/c/xapp_xml5g/xapp_xml5g" -c "$FR_CONF" -p "$SM_DIR/" > "$LOGS/60_xapp_$RUN.log" 2>&1 < /dev/null &
            XPID=$!
            sleep 8   # laisser l'xApp apprendre la correspondance tunnel->UE
            sudo -E setsid nohup nice -n -10 stdbuf -oL python3 ids_xml5g.py --mode detect --iface oai-cn5g --upf 192.168.70.134 --bin 0.2 --duration 70 --model "$WORK/model.joblib" --xapp 127.0.0.1:9999 --out "$LOGS/61_ids_$RUN.log" --summary "$LOGS/61_ids_${RUN}_summary.json" > "$LOGS/61_ids_${RUN}_run.log" 2>&1 < /dev/null &
            IDSPID=$!
            sleep 2
            # CPU et mémoire, chaque seconde : détecteur, xApp, gNB, UEs simulés ; UPF par docker stats
            PIDS=$(pgrep -d, -f "ids_xml5g.py --mode detect|xapp_xml5g -c|nr-softmodem|nr-uesoftmodem")
            [ -n "$PIDS" ] && { pidstat -h -u -r -p "$PIDS" 1 > "$LOGS/65_pidstat_$RUN.txt" 2>&1 & echo $! > /tmp/pidstat.pid; }
            ( while true; do echo "$(date +%s) $(docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' oai-upf 2>/dev/null)"; sleep 2; done ) > "$LOGS/66_docker_$RUN.txt" 2>&1 &
            DSPID=$!
            sleep 3
            sudo python3 scenario.py --ues "$UESP" --attacks "ue1:syn:10:40" --total 55 --events "$LOGS/62_ev_$RUN.jsonl" 2>&1 | tee "$LOGS/62_scenario_$RUN.log"
            wait $IDSPID 2>/dev/null
            sleep 12   # le détecteur termine ses 70 s et écrit son résumé
            sudo kill $XPID 2>/dev/null
            [ -f /tmp/pidstat.pid ] && { kill "$(cat /tmp/pidstat.pid)" 2>/dev/null; rm -f /tmp/pidstat.pid; }
            kill $DSPID 2>/dev/null
            sleep 2
            # journaux iperf3 côté serveur (le test d'un UE coupé en cours peut ne pas être écrit)
            for P in 5201 5202; do docker exec oai-ext-dn cat /tmp/iperf_$P.json > "$LOGS/64_iperf_${RUN}_p$P.json" 2>/dev/null; done
            sleep 1
          done
          done
          arreter_ran
      - name: 11. Bilan
        if: always()
        run: |
          cd "$WORK/oai/doc/tutorial_resources/oai-cn5g" 2>/dev/null && for c in oai-amf oai-smf; do docker logs "$c" > "$LOGS/40_$c.log" 2>&1 || true; done
          # L'UPF journalise chaque paquet montant (« Upstream IP is ... ») : on garde un résumé
          # en paquets par seconde et par UE (preuve de la coupure), et le journal sans ces lignes.
          docker logs oai-upf 2>&1 | grep -F "Upstream IP is" | awk '{t=substr($2,1,8); c[$1" "t" "$NF]++} END{for(k in c) print k, c[k]}' | tr -d '[]' | sort > "$LOGS/40_upf_pps.txt" || true
          docker logs oai-upf 2>&1 | grep -vF " IP is " > "$LOGS/40_oai-upf.log" || true
          sudo chmod -R a+r "$LOGS" || true
          LOGS="$LOGS" python3 "$WORK/py/bilan3.py"

      - name: 12. Journaux à télécharger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml5g-phase2-journaux
          path: /home/runner/xml5g-journaux
          if-no-files-found: warn
